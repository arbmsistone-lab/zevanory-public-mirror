# MR pipeline refresh after GitLab import verification 2026-09-05
# Passive mirror: canonical remote execution is CircleCI (docs/CI_EXECUTION_POLICY.md).
workflow:
  rules:
    - when: never

stages:
  - quality
  - security
  - integration

variables:
  NODE_VERSION: "24"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

.default_node:
  image: node:24-bookworm
  before_script:
    - node --version
    - npm --version
    - npm ci
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  interruptible: true

quality_core:
  extends: .default_node
  stage: quality
  timeout: 20m
  script:
    - npm test
    - npm run supplychain:scan
    - npm audit --omit=dev --audit-level=high
    - npm run contract:smoke
    - npm run audit:enterprise:10x
    - npm run audit:activation:20x
    - npm run audit:offer:20x
    - npm run audit:channels:20x
    - npm run audit:social-channels:20x
    - npm run audit:channel-identity:20x
    - npm run audit:distribution:10x
    - npm run audit:commercial-engine-v2:10x
    - npm run audit:pilot:10x
    - npm run audit:rules:20x
    - npm run audit:engine:20x
    - npm run audit:command:20x
    - npm run audit:worldclass:10x
    - npm run audit:composable:10x
    - npm run audit:architecture:20x
    - npm run audit:3x
    - npm run audit:obs:10x
    - npm run audit:live-plan:3x
    - npm run audit:10x
    - npm run resilience:smoke
    - npm run audit:no-single-provider
    - npm run audit:infrastructure:50x
    - npm run dr:public-artifact
    - npm run audit:dns-recovery
    - npm run dr:chaos:providers
    - npm run audit:critical-continuity
    - npm run audit:30x
    - npm run audit:sales:20x
    - npm run audit:final
    - npm run audit:lifecycle:10x
    - npm run audit:lifecycle:evidence:10x
    - npm run audit:closure:10x
    - npm run audit:final20x
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - validation/
security_node:
  extends: .default_node
  stage: security
  timeout: 12m
  script:
    - npm audit --audit-level=high
    - npm run supplychain:scan
    - npm run security:lifecycle
    - npm run audit:security:10x
    - node --test test/adaptive-rate-limit.test.mjs test/secret-lifecycle.test.mjs
    - mkdir -p security-evidence
    - npm sbom --sbom-format cyclonedx > security-evidence/sbom.cdx.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - security-evidence/

security_trivy:
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  stage: security
  timeout: 8m
  script:
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules .
integration_e2e:
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  stage: integration
  timeout: 20m
  before_script:
    - node --version
    - npm --version
    - npm ci
  script:
    - npm start > zevanory-server.log 2>&1 &
    - echo $! > zevanory-server.pid
    - for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/api/live && break; sleep 1; done
    - curl -fsS http://127.0.0.1:4173/api/live
    - ZEVANORY_BASE_URL=http://127.0.0.1:4173 npm run test:e2e
    - npm run audit:distribution:10x
    - npm run audit:commercial-engine-v2:10x
    - npm run audit:pilot:10x
    - npm run audit:lifecycle:10x
    - npm run audit:lifecycle:evidence:10x
    - npm run audit:closure:10x
    - printf 'ZEVANORY_E2E_PASS\nsha=%s\nref=%s\n' "$CI_COMMIT_SHA" "$CI_COMMIT_REF_NAME" > e2e-proof.txt
    - sha256sum e2e-proof.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - playwright-report/
      - test-results/
      - zevanory-server.log
      - e2e-proof.txt

e2e_attest:
  stage: integration
  image: node:24-bookworm
  needs:
    - job: integration_e2e
      artifacts: true
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates
    - curl -fsSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v3.0.2/cosign-linux-amd64
    - chmod +x /usr/local/bin/cosign
    - cosign version
  script:
    - test -s e2e-proof.txt
    - test -n "$SIGSTORE_ID_TOKEN"
    - if [ -n "$CI_COMMIT_TAG" ]; then REF_KIND=tags; else REF_KIND=heads; fi
    - CERT_ID="${CI_PROJECT_URL}//.gitlab-ci.yml@refs/${REF_KIND}/${CI_COMMIT_REF_NAME}"
    - cosign sign-blob e2e-proof.txt --bundle e2e-proof.sigstore.json --identity-token "$SIGSTORE_ID_TOKEN" --yes
    - cosign verify-blob e2e-proof.txt --bundle e2e-proof.sigstore.json --certificate-oidc-issuer https://gitlab.com --certificate-identity "$CERT_ID"
    - sha256sum e2e-proof.txt
  artifacts:
    expire_in: 30 days
    paths:
      - e2e-proof.txt
      - e2e-proof.sigstore.json

recovery_schema:
  stage: integration
  image: node:24-bookworm
  services:
    - name: supabase/postgres:17.6.1.166@sha256:d5424e9f4d0c21d63991c3f3dd77881f23f722c3a212452a61bc91924b79e8c8
      alias: recovery-db
  variables:
    POSTGRES_PASSWORD: "recovery-only-ephemeral"
    PGUSER: postgres
    PGDATABASE: postgres
    PGPASSWORD: "recovery-only-ephemeral"
  before_script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client
  script:
    - for i in $(seq 1 60); do pg_isready -h recovery-db -p 5432 -U postgres && break; sleep 2; done
    - pg_isready -h recovery-db -p 5432 -U postgres
    - expected=$(find db/migrations -maxdepth 1 -type f -name '*.sql' | wc -l); test "$expected" -gt 0
    - for migration in $(find db/migrations -maxdepth 1 -type f -name '*.sql' | sort); do psql -h recovery-db -p 5432 -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$migration"; done
    - applied=$(psql -h recovery-db -p 5432 -X -A -t -v ON_ERROR_STOP=1 -U postgres -d postgres -c 'select count(*) from schema_migrations'); test "$applied" -eq "$expected"
    - required=$(psql -h recovery-db -p 5432 -X -A -t -v ON_ERROR_STOP=1 -U postgres -d postgres -c "select count(*) from information_schema.tables where table_schema='public' and table_name in ('telemetry_events','financial_events','orders','schema_migrations','tenants','customer_identities','decision_experiments','journey_instances')"); test "$required" -eq 8
    - printf 'SCHEMA_RECOVERY_PASS sha=%s migrations=%s required_tables=%s\n' "$CI_COMMIT_SHA" "$applied" "$required" > schema-recovery-proof.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - schema-recovery-proof.txt

remote_attestation:
  extends: .default_node
  stage: integration
  needs: [quality_core]
  script:
    - REMOTE_ATTESTATION_OUTPUT=remote-attestation/gitlab.json node scripts/write-remote-attestation.mjs
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - remote-attestation/gitlab.json
