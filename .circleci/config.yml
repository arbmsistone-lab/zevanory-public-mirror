version: 2.1

jobs:
  core:
    docker:
      - image: cimg/node:24.19
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-{{ checksum "package-lock.json" }}
            - v1-npm-
      - run: npm ci --no-audit --no-fund
      - save_cache:
          key: v1-npm-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm test
      - run: node --test test/ui-12-assurance.test.mjs test/control-plane-vnext.test.mjs
      - run: npm run audit:content:evolution
      - run: npm run audit:content:evolution:adversarial
      - run: npm run audit:commercial-engine-v2:10x
      - run: npm run audit:3x
      - run: npm run audit:security:10x
      - run: npm run audit:final20x
      - run: npm run supplychain:scan

  deep:
    docker:
      - image: cimg/node:24.19
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-{{ checksum "package-lock.json" }}
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:10x
      - run: npm run audit:30x
      - run: npm run audit:architecture:20x
      - run: npm run audit:obs:10x
      - run: npm run audit:universal-fabric:3x

  arbm_cloud_quality:
    docker:
      - image: cimg/node:24.19
    resource_class: small
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run audit:content:evolution
      - run: npm run audit:content:evolution:adversarial
      - run: npm run supplychain:scan
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run contract:smoke
      - run: npm run audit:enterprise:10x
      - run: npm run audit:activation:20x
      - run: npm run audit:offer:20x
      - run: npm run audit:channels:20x
      - run: npm run audit:distribution:10x
      - run: npm run audit:commercial-engine-v2:10x
      - run: npm run audit:pilot:10x
      - run: npm run audit:rules:20x
      - run: npm run audit:engine:20x
      - run: npm run audit:command:20x
      - run: npm run audit:worldclass:10x
      - run: npm run audit:composable:10x
      - run: npm run audit:architecture:20x
      - run: npm run audit:3x
      - run: npm run audit:security:10x
      - run: npm run audit:obs:10x
      - run: npm run audit:live-plan:3x
      - run: npm run audit:10x
      - run: npm run resilience:smoke
      - run: npm run audit:no-single-provider
      - run: npm run audit:infrastructure:50x
      - run: npm run dr:public-artifact
      - run: npm run audit:dns-recovery
      - run: npm run dr:chaos:providers
      - run: npm run audit:critical-continuity
      - run: npm run audit:30x
      - run: npm run audit:sales:20x
      - run: npm run audit:final
      - run: npm run audit:lifecycle:10x
      - run: npm run audit:lifecycle:evidence:10x
      - run: npm run audit:closure:10x
      - run: npm run audit:final20x
      - run: mkdir -p quality-evidence && npm sbom --sbom-format cyclonedx > quality-evidence/sbom.cdx.json
      - store_artifacts:
          path: quality-evidence

  arbm_cloud_security:
    docker:
      - image: cimg/node:24.19
    resource_class: small
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run supplychain:scan
      - run: npm run security:lifecycle
      - run: node --test test/adaptive-rate-limit.test.mjs test/secret-lifecycle.test.mjs
      - run:
          name: Install Trivy 0.74.0 with verified fallback
          command: |
            set -euo pipefail
            asset=trivy_0.74.0_Linux-64bit.tar.gz
            if curl --retry 4 --retry-all-errors --retry-delay 2 -fsSLO https://github.com/aquasecurity/trivy/releases/download/v0.74.0/$asset; then
              echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  $asset" | sha256sum -c -
              tar -xzf "$asset" trivy
              sudo install -m 0755 trivy /usr/local/bin/trivy
            else
              sudo apt-get update -qq
              sudo apt-get install -y -qq wget gnupg
              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
              echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list >/dev/null
              sudo apt-get update -qq
              sudo apt-get install -y -qq trivy=0.74.0
            fi
            trivy --version
      - run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules .
      - run: mkdir -p security-evidence && npm sbom --sbom-format cyclonedx > security-evidence/sbom.cdx.json
      - store_artifacts:
          path: security-evidence

  ui12_qcp:
    docker:
      - image: cimg/node:24.19-browsers
    resource_class: medium
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run:
          name: UI-12 structural assurance
          command: node --test test/ui-12-assurance.test.mjs test/control-plane-vnext.test.mjs
      - run:
          name: Install Playwright Chromium
          command: npx playwright install chromium
      - run:
          name: UI-12 visual E2E
          command: |
            npm start > zevanory-server.log 2>&1 &
            server_pid=$!
            ready=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4173/api/live >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then cat zevanory-server.log; kill "$server_pid" || true; exit 1; fi
            ZEVANORY_BASE_URL=http://127.0.0.1:4173 npx playwright test test/e2e/control-plane-vnext.spec.mjs --project=chromium
            rc=$?
            kill "$server_pid" || true
            exit "$rc"
      - store_artifacts:
          path: test-results
      - store_artifacts:
          path: playwright-report

  arbm_cloud_qcp:
    docker:
      - image: cimg/node:24.19
    resource_class: medium
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run audit:content:evolution
      - run: npm run audit:content:evolution:adversarial
      - run: npm run supplychain:scan
      - run: npm run audit:obs:10x
      - run: npm run audit:live-plan:3x
      - run: npm run audit:security:10x
      - run: npm audit --omit=dev --audit-level=high
      - run:
          name: Install Playwright Chromium
          command: npx playwright install --with-deps chromium
      - run:
          name: Start server and run Visual and E2E gate
          command: |
            npm start > zevanory-server.log 2>&1 &
            server_pid=$!
            ready=0
            for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173/api/live >/dev/null; then ready=1; break; fi; sleep 1; done
            if [ "$ready" -ne 1 ]; then cat zevanory-server.log; kill "$server_pid" || true; exit 1; fi
            ZEVANORY_BASE_URL=http://127.0.0.1:4173 npm run test:e2e
            rc=$?
            kill "$server_pid" || true
            exit "$rc"
      - run: npm run audit:distribution:10x
      - run: npm run audit:commercial-engine-v2:10x
      - run: npm run audit:pilot:10x
      - run: npm run audit:lifecycle:10x
      - run: npm run audit:lifecycle:evidence:10x
      - run: npm run audit:closure:10x
      - run: mkdir -p quality-evidence && npm sbom --sbom-format cyclonedx > quality-evidence/sbom.cdx.json
      - store_artifacts:
          path: quality-evidence

  arbm_cloud_recovery:
    docker:
      - image: cimg/postgres:17.11
      - image: postgres:17.6-bookworm
        environment:
          POSTGRES_PASSWORD: recovery-only-ephemeral
    resource_class: small
    environment:
      PGUSER: postgres
      PGPASSWORD: recovery-only-ephemeral
      PGDATABASE: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
    steps:
      - checkout
      - run:
          name: Wait for isolated Postgres
          command: |
            for i in $(seq 1 60); do pg_isready -h 127.0.0.1 -p 5432 -U postgres && exit 0; sleep 2; done
            exit 1
      - run:
          name: Replay canonical migrations
          command: |
            expected=$(find db/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)
            test "$expected" -gt 0
            for migration in $(find db/migrations -maxdepth 1 -type f -name '*.sql' | sort); do psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$migration"; done
            applied=$(psql -X -A -t -v ON_ERROR_STOP=1 -U postgres -d postgres -c 'select count(*) from schema_migrations')
            test "$applied" -eq "$expected"
            required=$(psql -X -A -t -v ON_ERROR_STOP=1 -U postgres -d postgres -c "select count(*) from information_schema.tables where table_schema='public' and table_name in ('telemetry_events','financial_events','orders','schema_migrations','tenants','customer_identities','decision_experiments','journey_instances')")
            test "$required" -eq 8
            printf 'SCHEMA_RECOVERY_PASS sha=%s migrations=%s required_tables=%s\n' "$CIRCLE_SHA1" "$applied" "$required" > schema-recovery-proof.txt
      - store_artifacts:
          path: schema-recovery-proof.txt

  remote_attestation:
    docker:
      - image: cimg/node:24.19
    resource_class: small
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: REMOTE_ATTESTATION_OUTPUT=remote-attestation/circleci.json node scripts/write-remote-attestation.mjs
      - store_artifacts:
          path: remote-attestation/circleci.json

  production_monitor:
    docker:
      - image: cimg/node:24.19
    resource_class: small
    steps:
      - checkout
      - run: npm ci --no-audit --no-fund
      - run: npm run probe:production
      - run: npm run contract:smoke
      - run: npm run activation:check
      - run: npm run audit:offer:20x
      - run: npm run supplychain:scan
      - run: npm run security:lifecycle
      - run: npm run dast:safe

workflows:
  production-watch:
    when: false
    jobs:
      - production_monitor
  ui12:
    when:
      equal: [ chatgpt/ui12-engineering-20260919, << pipeline.git.branch >> ]
    jobs:
      - ui12_qcp
  ci:
    when: false
    jobs:
      - core
      - arbm_cloud_quality
      - arbm_cloud_security
      - arbm_cloud_qcp
      - arbm_cloud_recovery
      - remote_attestation
      - deep:
          requires:
            - core
          filters:
            branches:
              only: main
