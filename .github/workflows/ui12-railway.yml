name: ZEVANORY UI-12 Railway Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zevanory-ui12-railway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui12:
    runs-on: [self-hosted, remote-zero-spend, zevanory-ui12]
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Runtime identity
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          node --version
          npm --version
          chromium --version
      - name: Install dependencies
        run: npm ci
      - name: UI-12 structural assurance
        run: node --test test/ui-12-assurance.test.mjs test/control-plane-vnext.test.mjs
      - name: Start commit-local server
        shell: bash
        run: |
          set -euo pipefail
          npm start > zevanory-server.log 2>&1 &
          echo $! > zevanory-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/api/live >/dev/null; then exit 0; fi
            sleep 1
          done
          cat zevanory-server.log
          exit 1
      - name: UI-12 visual E2E
        run: npx playwright test test/e2e/control-plane-vnext.spec.mjs
        env:
          ZEVANORY_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      - name: Upload UI-12 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui12-railway-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            zevanory-server.log
          if-no-files-found: ignore
          retention-days: 30
