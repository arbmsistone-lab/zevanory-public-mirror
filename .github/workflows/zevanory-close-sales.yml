name: zevanory-close-sales
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zevanory-owner-sales-switch
  cancel-in-progress: false
jobs:
  emergency-close:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Close sales unconditionally, independently of preflight and deployment
        run: python3 scripts/sales_switch_workflow.py close
