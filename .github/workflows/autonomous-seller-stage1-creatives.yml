name: ZEVANORY autonomous seller stage1 creatives

on:
  push:
    branches:
      - s1-ai
    paths:
      - "scripts/autonomous_seller_stage1_creatives.py"
      - "sales-public/ia-na-pratica.html"
      - "sales-public/vendas-na-pratica.html"
      - "sales-public/lucro-e-caixa.html"
      - "sales-public/combo-ia-vendas.html"
      - "sales-public/negocio-completo.html"
      - ".github/workflows/autonomous-seller-stage1-creatives.yml"
  pull_request:
    branches: [gh-pages]
    paths:
      - "scripts/autonomous_seller_stage1_creatives.py"
      - "sales-public/ia-na-pratica.html"
      - "sales-public/vendas-na-pratica.html"
      - "sales-public/lucro-e-caixa.html"
      - "sales-public/combo-ia-vendas.html"
      - "sales-public/negocio-completo.html"
      - ".github/workflows/autonomous-seller-stage1-creatives.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUT_DIR: evidence/autonomous-seller/stage1
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deploy ephemeral Workers AI binding proxy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAW_CLOUDFLARE_API_TOKEN:-}"
          clean="$(RAW_TOKEN="$RAW_CLOUDFLARE_API_TOKEN" python3 - <<'PY'
          import os,re
          raw=os.environ["RAW_TOKEN"].replace("\r","").replace("\n","").strip()
          parts=[p for p in re.findall(r"[A-Za-z0-9._~+/-]{20,}",raw) if p.lower() not in {"authorization","bearer"}]
          if not parts: raise SystemExit("no_token_segment")
          print(max(parts,key=len))
          PY
          )"
          echo "::add-mask::$clean"
          worker_name="zv-s1-$GITHUB_RUN_ID"
          proxy_secret="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(36))
          PY
          )"
          echo "::add-mask::$proxy_secret"
          cat > /tmp/stage1-ai-worker.mjs <<'JS'
          export default {
            async fetch(request, env) {
              if (request.method !== "POST") return new Response("method_not_allowed", { status: 405 });
              if (request.headers.get("authorization") !== `Bearer ${env.PROXY_SECRET}`) {
                return new Response("unauthorized", { status: 401 });
              }
              try {
                const body = await request.json();
                const model = String(body?.model || "");
                if (!model.startsWith("@cf/")) return Response.json({ success: false, error: "model_not_allowed" }, { status: 400 });
                const result = await env.AI.run(model, body?.payload || {});
                return Response.json({ success: true, result });
              } catch (error) {
                return Response.json({ success: false, error: String(error?.message || error) }, { status: 502 });
              }
            }
          };
          JS
          cat > /tmp/wrangler-stage1.toml <<EOF
          name = "$worker_name"
          main = "/tmp/stage1-ai-worker.mjs"
          compatibility_date = "2026-10-02"
          workers_dev = true
          [ai]
          binding = "AI"
          EOF
          export CLOUDFLARE_API_TOKEN="$clean"
          export CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@4.135.0 deploy --config /tmp/wrangler-stage1.toml 2>&1 | tee /tmp/wrangler-stage1-deploy.log
          printf '%s' "$proxy_secret" | npx --yes wrangler@4.135.0 secret put PROXY_SECRET --config /tmp/wrangler-stage1.toml >/tmp/wrangler-stage1-secret.log 2>&1
          proxy_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-stage1-deploy.log | tail -n1)"
          test -n "$proxy_url"
          code="$(curl -sS -o /tmp/ai-test.json -w '%{http_code}' -X POST "$proxy_url"             -H "Authorization: Bearer $proxy_secret" -H 'Content-Type: application/json'             --data '{"model":"@cf/zai-org/glm-4.7-flash","payload":{"messages":[{"role":"user","content":"Responda apenas OK"}],"max_tokens":8}}')"
          echo "WORKERS_AI_BINDING_HTTP=$code"
          test "$code" = "200"
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/ai-test.json"))
          assert d.get("success") is True, d
          print("WORKERS_AI_BINDING=PASS")
          PY
          {
            echo 'CLOUDFLARE_API_TOKEN<<__CF__'
            printf '%s\n' "$clean"
            echo '__CF__'
            echo "WORKER_NAME=$worker_name"
            echo "WORKERS_AI_PROXY_URL=$proxy_url"
            echo 'WORKERS_AI_PROXY_SECRET<<__PROXY__'
            printf '%s\n' "$proxy_secret"
            echo '__PROXY__'
          } >> "$GITHUB_ENV"
      - name: Generate five real AI creatives
        run: python scripts/autonomous_seller_stage1_creatives.py --out "$OUT_DIR"
      - name: Verify immutable stage1 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, hashlib
          root=pathlib.Path("evidence/autonomous-seller/stage1")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("schema")=="zevanory.autonomous-seller.creatives.v1"
          rows=manifest.get("products") or []
          assert len(rows)==5, rows
          assert all(x.get("faithful") is True for x in rows), rows
          for row in rows:
              d=root/row["slug"]
              meta=json.loads((d/"post.json").read_text(encoding="utf-8"))
              raw=(d/"post.jpg").read_bytes()
              assert len(raw)>=10000
              assert hashlib.sha256(raw).hexdigest()==meta["image_sha256"]==row["image_sha256"]
              assert 4<=len(meta["hashtags"])<=8
              assert meta["verification"]["faithful"] is True
              assert meta["verification"].get("unsupported_claims")==[]
              assert meta["verification"].get("misleading_promises")==[]
          print("STAGE1_EVIDENCE=PASS")
          print("STAGE1_PRODUCTS=5/5")
          PY
      - name: Delete ephemeral Workers AI proxy
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${WORKER_NAME:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            npx --yes wrangler@4.135.0 delete --name "$WORKER_NAME" --force >/tmp/wrangler-stage1-delete.log 2>&1
            rc=$?
            echo "EPHEMERAL_WORKER_DELETE_RC=$rc"
          else
            echo "EPHEMERAL_WORKER_DELETE_RC=SKIPPED"
          fi
      - name: Upload five creatives
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-seller-stage1-creatives-${{ github.sha }}
          path: evidence/autonomous-seller/stage1
          if-no-files-found: error
          retention-days: 90
