name: ZEVANORY autonomous seller stage1 creatives

on:
  push:
    branches:
      - s1-ai
    paths:
      - "scripts/autonomous_seller_stage1_creatives.py"
      - "sales-public/ia-na-pratica.html"
      - "sales-public/vendas-na-pratica.html"
      - "sales-public/lucro-e-caixa.html"
      - "sales-public/combo-ia-vendas.html"
      - "sales-public/negocio-completo.html"
      - ".github/workflows/autonomous-seller-stage1-creatives.yml"
  pull_request:
    branches: [gh-pages]
    paths:
      - "scripts/autonomous_seller_stage1_creatives.py"
      - "sales-public/ia-na-pratica.html"
      - "sales-public/vendas-na-pratica.html"
      - "sales-public/lucro-e-caixa.html"
      - "sales-public/combo-ia-vendas.html"
      - "sales-public/negocio-completo.html"
      - ".github/workflows/autonomous-seller-stage1-creatives.yml"

permissions:
  contents: read
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUT_DIR: evidence/autonomous-seller/stage1
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/781761447388/locations/global/workloadIdentityPools/github-actions/providers/zevanory-github
          service_account: zevanory-gemini-auth@zevanory-gemini.iam.gserviceaccount.com
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Resolve Gemini authority without exposing key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud services api-keys get-key-string c572db8f-7fbf-4a80-80d8-f59c2597e6e2 --project=zevanory-gemini --format='value(keyString)' > /tmp/gemini.key
          test -s /tmp/gemini.key
          key="$(cat /tmp/gemini.key)"
          echo "::add-mask::$key"
          {
            echo 'GEMINI_API_KEY<<__GEMINI__'
            printf '%s\n' "$key"
            echo '__GEMINI__'
          } >> "$GITHUB_ENV"
          unset key
          echo "GEMINI_AUTHORITY=PASS"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check "google-genai>=2,<3"
      - name: Generate five real AI creatives
        run: python scripts/autonomous_seller_stage1_creatives.py --out "$OUT_DIR"
      - name: Verify immutable stage1 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, hashlib
          root=pathlib.Path("evidence/autonomous-seller/stage1")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("schema")=="zevanory.autonomous-seller.creatives.v1"
          rows=manifest.get("products") or []
          assert len(rows)==5, rows
          assert all(x.get("faithful") is True for x in rows), rows
          for row in rows:
              d=root/row["slug"]
              meta=json.loads((d/"post.json").read_text(encoding="utf-8"))
              raw=(d/"post.png").read_bytes()
              assert len(raw)>=10000
              assert hashlib.sha256(raw).hexdigest()==meta["image_sha256"]==row["image_sha256"]
              assert 4<=len(meta["hashtags"])<=8
              assert meta["verification"]["faithful"] is True
              assert meta["verification"].get("unsupported_claims")==[]
              assert meta["verification"].get("misleading_promises")==[]
          print("STAGE1_EVIDENCE=PASS")
          print("STAGE1_PRODUCTS=5/5")
          PY
      - name: Remove transient Gemini credential
        if: always()
        shell: bash
        run: rm -f /tmp/gemini.key
      - name: Upload five creatives
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-seller-stage1-creatives-${{ github.sha }}
          path: evidence/autonomous-seller/stage1
          if-no-files-found: error
          retention-days: 90
