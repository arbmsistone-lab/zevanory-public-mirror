name: ZEVANORY Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: zevanory-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:engine:20x
      - run: npm run audit:command:20x
      - run: npm run audit:composable:10x
      - run: npm run audit:architecture:20x
      - run: npm run audit:3x
      - run: npm run audit:security:10x
      - run: npm run audit:obs:10x
      - run: npm run audit:10x
      - run: npm run resilience:smoke
      - run: npm run audit:30x
      - run: npm run audit:sales:20x
      - run: npm run audit:final
      - run: npm run audit:final20x
