name: YouTube autonomous daily Short

# Three Shorts per local day (reach mix 80/20): 10:00 practical AI tip for one of
# the 40 business types, 15:00 the product Short, 19:00 a free-calculator tip.
# Rendering needs ffmpeg, which Workers Free cannot run, so the publisher is this
# scheduled job. Upload is PUBLIC (YouTube may keep uploads from unaudited API
# projects private until the audit passes), idempotent per day, and recorded as a
# masked post_published activity in the shared KV.
on:
  schedule:
    - cron: "0 13 * * *"   # 10:00 dica
    - cron: "0 18 * * *"   # 15:00 oferta
    - cron: "0 22 * * *"   # 19:00 calc
    # Self-healing backstop (20:30 Brasília): idempotent per day and slot — published
    # Shorts are reused and cross-posts already done are skipped, so this only
    # completes what an earlier run could not.
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = render and gate only, no upload"
        required: false
        default: "false"
      slot:
        description: "dica | oferta | calc | all"
        required: false
        default: "oferta"
      phase:
        description: "render = render+gate+candidato imutável (nunca publica) | publish = publica SÓ candidatos aprovados por humano"
        required: false
        default: "render"
      candidates:
        description: "phase=publish: sha256 dos candidatos aprovados (separados por vírgula)"
        required: false
        default: ""

concurrency:
  group: youtube-autonomous-short
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  short:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-inter && fc-match -f "%{file}\n" "Inter:style=ExtraBold"
      # P05: no fallback voice. The brand voice is the only voice; the FINAL MP4 must pass zevanory-av-gate.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: zevanory-av-gate (pinned deps + pinned models)
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet -r scripts/av_gate/requirements.txt
          echo "AV_GATE_MODELS=$RUNNER_TEMP/av-models" >> "$GITHUB_ENV"
          AV_GATE_MODELS="$RUNNER_TEMP/av-models" bash scripts/av_gate/fetch_models.sh
      - name: Unit tests (plan, idempotency, recording)
        run: node --test tests/youtube-daily-short.test.mjs tests/short-crosspost.test.mjs tests/av-gate-wiring.test.mjs
      - name: Render, gate and publish today's Short
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # Owner-recorded reference of the approved brand voice (V4 identity). Absent => gate BLOCKED => no publish.
          AV_GATE_BRAND_REFERENCE: ${{ github.workspace }}/assets/brand/voice/brand-reference.wav
          # Human approvals (reviewed in a PR): {"approvals":[{"mp4_sha256","approver","at"}]}
          AV_GATE_HUMAN_APPROVALS: ${{ github.workspace }}/evidence/p05/human-approvals.json
          PHASE: ${{ inputs.phase || 'render' }}
          CANDIDATES: ${{ inputs.candidates }}
          SCHEDULE: ${{ github.event.schedule }}
          SLOT_INPUT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          case "$SCHEDULE" in
            "0 13 * * *") SLOT=dica;; "0 18 * * *") SLOT=oferta;; "0 22 * * *") SLOT=calc;; "30 23 * * *") SLOT=all;;
            *) SLOT="${SLOT_INPUT:-oferta}";;
          esac
          # The 20:30 backstop completes ITS OWN day. GitHub delays schedules by hours: on 12/10 it
          # started at 00:44 of 13/10 and published the next day's dica/oferta at night. Anchor
          # the backstop to the Brasília day of six hours earlier (covers delays up to 02:30).
          DAY="$(TZ=America/Sao_Paulo date +%F)"
          if [ "$SCHEDULE" = "30 23 * * *" ]; then DAY="$(TZ=America/Sao_Paulo date -d '-6 hours' +%F)"; fi
          echo "SHORT_DAY=$DAY" >> "$GITHUB_ENV"
          echo "::notice title=SHORT_TARGET::slot=$SLOT day=$DAY schedule=${SCHEDULE:-dispatch}"
          # P05 two-phase: schedules only RENDER candidates; publishing is a separate dispatch with approved sha256s.
          if [ "${PHASE:-render}" = "publish" ]; then
            node scripts/channels/youtube-daily-short.mjs --phase=publish --candidates="$CANDIDATES"
          elif [ "$DRY_RUN" = "true" ]; then node scripts/channels/youtube-daily-short.mjs --dry-run --slot="$SLOT" --day="$DAY"
          else node scripts/channels/youtube-daily-short.mjs --phase=render --slot="$SLOT" --day="$DAY"; fi
      - name: Cross-post the Short (TikTok, Instagram Reels, Facebook, Telegram)
        if: ${{ !cancelled() && inputs.dry_run != 'true' && inputs.phase == 'publish' }}
        env:
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_AUDIT_APPROVED: ${{ vars.TIKTOK_AUDIT_APPROVED }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: node scripts/channels/short-crosspost.mjs --slot="$SLOT" --day="${SHORT_DAY:-}"
      - name: Keep the render candidates (MP4 + gate report) for human review (7 days)
        if: ${{ !cancelled() && inputs.phase != 'publish' }}
        uses: actions/upload-artifact@v4
        with:
          name: short-preview
          path: |
            /tmp/zevanory-daily-short*.mp4
            /tmp/zevanory-daily-short*.av-gate.json
            /tmp/zevanory-daily-short*.av/av-gate.json
            /tmp/zevanory-daily-short*.av/final.mp4
          if-no-files-found: warn
          retention-days: 7  # P05: review + publish within 7 days (same as the candidate TTL)
