name: YouTube autonomous daily Short

# Three Shorts per local day (reach mix 80/20): 10:00 practical AI tip for one of
# the 40 business types, 15:00 the product Short, 19:00 a free-calculator tip.
# Rendering needs ffmpeg, which Workers Free cannot run, so the publisher is this
# scheduled job. Upload is PUBLIC (YouTube may keep uploads from unaudited API
# projects private until the audit passes), idempotent per day, and recorded as a
# masked post_published activity in the shared KV.
on:
  schedule:
    - cron: "0 13 * * *"   # 10:00 dica
    - cron: "0 18 * * *"   # 15:00 oferta
    - cron: "0 22 * * *"   # 19:00 calc
    # Self-healing backstop (20:30 Brasília): idempotent per day and slot — published
    # Shorts are reused and cross-posts already done are skipped, so this only
    # completes what an earlier run could not.
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = render and gate only, no upload"
        required: false
        default: "false"
      slot:
        description: "dica | oferta | calc | all | amostras (dry_run=true)"
        required: false
        default: "oferta"

concurrency:
  group: youtube-autonomous-short
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  short:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' && inputs.slot != 'amostras' }}  # B01 patch 05b
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-inter && fc-match -f "%{file}\n" "Inter:style=ExtraBold"
      - name: Local forced alignment (no paid service)
        run: python3 -m pip install --user stable-ts==2.19.1 Pillow==12.0.0
      - name: Unit tests (plan, idempotency, recording)
        run: node --test tests/youtube-daily-short.test.mjs tests/short-crosspost.test.mjs
      - name: Render, gate and publish today's Short
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SCHEDULE: ${{ github.event.schedule }}
          SLOT_INPUT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          case "$SCHEDULE" in
            "0 13 * * *") SLOT=dica;; "0 18 * * *") SLOT=oferta;; "0 22 * * *") SLOT=calc;; "30 23 * * *") SLOT=all;;
            *) SLOT="${SLOT_INPUT:-oferta}";;
          esac
          # The 20:30 backstop completes ITS OWN day. GitHub delays schedules by hours: on 12/10 it
          # started at 00:44 of 13/10 and published the next day's dica/oferta at night. Anchor
          # the backstop to the Brasília day of six hours earlier (covers delays up to 02:30).
          DAY="$(TZ=America/Sao_Paulo date +%F)"
          if [ "$SCHEDULE" = "30 23 * * *" ]; then DAY="$(TZ=America/Sao_Paulo date -d '-6 hours' +%F)"; fi
          echo "SHORT_DAY=$DAY" >> "$GITHUB_ENV"
          # The cross-post step runs in another shell: export the resolved slot (dica/calc/all were never cross-posted).
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"
          echo "::notice title=SHORT_TARGET::slot=$SLOT day=$DAY schedule=${SCHEDULE:-dispatch}"
          if [ "$DRY_RUN" = "true" ]; then node scripts/channels/youtube-daily-short.mjs --dry-run --slot="$SLOT" --day="$DAY"; else node scripts/channels/youtube-daily-short.mjs --slot="$SLOT" --day="$DAY"; fi
      - name: Cross-post the Short (TikTok, Instagram Reels, Facebook, Telegram)
        if: ${{ !cancelled() && inputs.dry_run != 'true' }}
        env:
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_AUDIT_APPROVED: ${{ vars.TIKTOK_AUDIT_APPROVED }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: node scripts/channels/short-crosspost.mjs --slot="${SLOT:-oferta}" --day="${SHORT_DAY:-}"
      - name: Keep the dry-run preview for the owner to watch (3 days)
        if: ${{ always() && inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: short-preview
          path: |
            /tmp/zevanory-daily-short*.mp4
            /tmp/zevanory-daily-short*-qc.json
            /tmp/zevanory-daily-short*-roteiro.txt
            /tmp/zevanory-daily-short*-musica.*
            /tmp/zevanory-daily-short*-licenca.json
            /tmp/zevanory-daily-short*-alignment.json
            /tmp/zevanory-daily-short*-contato.png
            /tmp/zevanory-daily-short*-visual.json
            /tmp/zevanory-daily-short*-filter.txt
            /tmp/zevanory-daily-short*-legendas.ass
          if-no-files-found: error
          retention-days: 3

  voice_samples:
    if: ${{ github.ref == 'refs/heads/gh-pages' && github.event_name == 'workflow_dispatch' && inputs.slot == 'amostras' }}
    environment: gh-pages-automacao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject samples without dry_run
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: node --input-type=module -e "import {assertSamplesMode} from './scripts/shorts-v2/voice-samples-mode.mjs'; assertSamplesMode('amostras',process.env.DRY_RUN)"
      - name: Install sample audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate eight samples only (no videos or runtime writes)
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/shorts-v2/compare-voices.mjs --samples "$RUNNER_TEMP/voice-samples"
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: |
            ${{ runner.temp }}/voice-samples/*.wav
            ${{ runner.temp }}/voice-samples/comparacao.json
            ${{ runner.temp }}/voice-samples/index.html
          if-no-files-found: error
          retention-days: 7
