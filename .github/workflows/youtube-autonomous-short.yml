name: YouTube autonomous daily Short

# Three Shorts per local day (reach mix 80/20): 10:00 practical AI tip for one of
# the 40 business types, 15:00 the product Short, 19:00 a free-calculator tip.
# Rendering needs ffmpeg, which Workers Free cannot run, so the publisher is this
# scheduled job. Upload is PUBLIC (YouTube may keep uploads from unaudited API
# projects private until the audit passes), idempotent per day, and recorded as a
# masked post_published activity in the shared KV.
on:
  schedule:
    - cron: "0 13 * * *"   # 10:00 dica
    - cron: "0 18 * * *"   # 15:00 oferta
    - cron: "0 22 * * *"   # 19:00 calc
    # Self-healing backstop (20:30 Brasília): idempotent per day and slot — published
    # Shorts are reused and cross-posts already done are skipped, so this only
    # completes what an earlier run could not.
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = render and gate only, no upload"
        required: false
        default: "false"
      slot:
        description: "dica | oferta | calc | all"
        required: false
        default: "oferta"
      force_local_voice:
        description: "true = skip Gemini and narrate with the free local voice (test)"
        required: false
        default: "false"

concurrency:
  group: youtube-autonomous-short
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  short:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: "22"
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-inter && fc-match -f "%{file}\n" "Inter:style=ExtraBold"
      - name: Free local voice (Piper, open source) for the zero-cost fallback
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --user piper-tts
          mkdir -p "$HOME/piper" && cd "$HOME/piper"
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium
          curl -fsSL -o pt_BR-faber-medium.onnx "$base/pt_BR-faber-medium.onnx"
          curl -fsSL -o pt_BR-faber-medium.onnx.json "$base/pt_BR-faber-medium.onnx.json"
          echo "PIPER_MODEL=$HOME/piper/pt_BR-faber-medium.onnx" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Unit tests (plan, idempotency, recording)
        run: node --test tests/youtube-daily-short.test.mjs tests/short-crosspost.test.mjs
      - name: Render, gate and publish today's Short
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FORCE_LOCAL_VOICE: ${{ inputs.force_local_voice || 'false' }}
          SCHEDULE: ${{ github.event.schedule }}
          SLOT_INPUT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          case "$SCHEDULE" in
            "0 13 * * *") SLOT=dica;; "0 18 * * *") SLOT=oferta;; "0 22 * * *") SLOT=calc;; "30 23 * * *") SLOT=all;;
            *) SLOT="${SLOT_INPUT:-oferta}";;
          esac
          # The 20:30 backstop completes ITS OWN day. GitHub delays schedules by hours: on 12/10 it
          # started at 00:44 of 13/10 and published the next day's dica/oferta at night. Anchor
          # the backstop to the Brasília day of six hours earlier (covers delays up to 02:30).
          DAY="$(TZ=America/Sao_Paulo date +%F)"
          if [ "$SCHEDULE" = "30 23 * * *" ]; then DAY="$(TZ=America/Sao_Paulo date -d '-6 hours' +%F)"; fi
          echo "SHORT_DAY=$DAY" >> "$GITHUB_ENV"
          echo "::notice title=SHORT_TARGET::slot=$SLOT day=$DAY schedule=${SCHEDULE:-dispatch}"
          if [ "$DRY_RUN" = "true" ]; then node scripts/channels/youtube-daily-short.mjs --dry-run --slot="$SLOT" --day="$DAY"; else node scripts/channels/youtube-daily-short.mjs --slot="$SLOT" --day="$DAY"; fi
      - name: Cross-post the Short (TikTok, Instagram Reels, Facebook, Telegram)
        if: ${{ !cancelled() && inputs.dry_run != 'true' }}
        env:
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_AUDIT_APPROVED: ${{ vars.TIKTOK_AUDIT_APPROVED }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: node scripts/channels/short-crosspost.mjs --slot="$SLOT" --day="${SHORT_DAY:-}"
      - name: Keep the dry-run preview for the owner to watch (3 days)
        if: ${{ inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: short-preview
          path: |
            /tmp/zevanory-daily-short*.mp4
            /tmp/zevanory-daily-short*.mp3
          if-no-files-found: warn
          retention-days: 3
