name: Owner OAuth security contract
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "worker/owner-oauth.mjs"
      - "worker/multichannel-autonomy.mjs"
      - "scripts/channels/youtube-access.mjs"
      - "scripts/channels/youtube-identity.mjs"
      - "scripts/channels/youtube-preflight.mjs"
      - "scripts/channels/youtube-private-proof.mjs"
      - "scripts/channels/prove-youtube.mjs"
      - "worker/cloudflare-worker.compat.mjs"
      - "tests/owner-oauth.test.mjs"
      - ".github/workflows/owner-oauth-security.yml"
  push:
    branches: [gh-pages]
    paths:
      - "worker/owner-oauth.mjs"
      - "worker/multichannel-autonomy.mjs"
      - "scripts/channels/youtube-access.mjs"
      - "scripts/channels/youtube-identity.mjs"
      - "scripts/channels/youtube-preflight.mjs"
      - "scripts/channels/youtube-private-proof.mjs"
      - "scripts/channels/prove-youtube.mjs"
      - "worker/cloudflare-worker.compat.mjs"
      - "tests/owner-oauth.test.mjs"
      - ".github/workflows/owner-oauth-security.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oauth-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: "22"
      - name: Syntax and side-effect-free security contracts
        run: |
          set -euo pipefail
          node --check worker/owner-oauth.mjs
          node --check worker/cloudflare-worker.compat.mjs
          node --check scripts/channels/youtube-access.mjs
          node --check scripts/channels/youtube-identity.mjs
          node --check scripts/channels/youtube-preflight.mjs
          node --check scripts/channels/youtube-private-proof.mjs
          node --check scripts/channels/prove-youtube.mjs
          node --test tests/owner-oauth.test.mjs tests/multichannel-autonomy.test.mjs
