name: session-guard

# 22/11/2026 (pedido do titular): substitui o job session-guard do T1 publisher guard, que rodava em pull_request com a
# definição, o script e o ops/executor.json DO PRÓPRIO PR (um PR podia se autoautorizar ou apagar a regra).
# pull_request_target roda ESTE arquivo da branch padrão e o checkout é da BASE do PR: a lista de sessões, o script
# e a decisão vêm de código confiável. Commits e corpo do PR são lidos via API só como DADO. NUNCA fazer checkout do
# head do PR nem executar nada dele aqui. Sem segredos; token só leitura. Declaração de sessão é texto, não autenticação:
# o controle decisivo continua sendo a revisão e o merge do titular. Arquivo reservado (ops/owner-reserved-paths.json).
on:
  pull_request_target:
    branches: [gh-pages]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: session-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: session-guard / declared-session
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout da base (código confiável)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Coletar PR (antes), commits e PR (depois) como dado
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sg
          # Duas leituras do PR em volta da lista de commits: o script reprova se o head, a contagem ou o corpo mudarem
          # entre elas, se o head não for o do evento ou se o último commit da lista não for esse head.
          gh api "repos/$REPO/pulls/$PR" > /tmp/sg/pr-before.json
          gh api --paginate --slurp "repos/$REPO/pulls/$PR/commits?per_page=100" > /tmp/sg/commits.json
          gh api "repos/$REPO/pulls/$PR" > /tmp/sg/pr-after.json
      - name: Avaliar sessão declarada contra a lista da BASE, na mesma revisão do evento (FAIL-CLOSED)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          python3 -I scripts/ci/session_guard.py --executor ops/executor.json --commits /tmp/sg/commits.json \
            --pr-before /tmp/sg/pr-before.json --pr-after /tmp/sg/pr-after.json \
            --event-head-sha "$EVENT_HEAD_SHA" --base-sha "$BASE_SHA" > /tmp/sg/result.json
          rc=$?
          cat /tmp/sg/result.json
          {
            echo "## session-guard (lista e decisão da base, mesma revisão) — rc=$rc"
            echo '```json'; cat /tmp/sg/result.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=SESSION_GUARD::revisão inconsistente, sessão ausente/fora de ops/executor.json da base ou entrada inválida (ver resumo)."
          fi
          exit "$rc"
