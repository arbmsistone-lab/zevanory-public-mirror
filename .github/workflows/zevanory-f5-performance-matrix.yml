name: ZEVANORY F5 performance matrix (every run must pass)
on:
  workflow_dispatch:
  pull_request:
    branches: [gh-pages]
    paths: [".github/workflows/zevanory-f5-performance-matrix.yml", "scripts/f5_lighthouse_gate.mjs"]
permissions:
  contents: read
concurrency:
  group: f5-performance-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        page: ["/", "/solucoes", "/ia-na-pratica", "/vendas-na-pratica", "/lucro-e-caixa", "/combo-ia-vendas", "/negocio-completo", "/material-gratuito", "/afiliados", "/privacidade", "/termos", "/reembolso"]
        device: [mobile, desktop]
    env:
      ORIGIN: https://vendas.zevanory.api.br
      PAGE: ${{ matrix.page }}
      DEVICE: ${{ matrix.device }}
      RUNS: "5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: "22"
      - name: Install pinned tools
        run: npm install --no-save --prefix /tmp/f5 lighthouse@13.5.0 puppeteer-core@23.11.1 axe-core@4.10.2 >/dev/null 2>&1
      - name: Lighthouse x5 and axe, gate every individual run
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          NODE_PATH=/tmp/f5/node_modules node scripts/f5_lighthouse_gate.mjs
