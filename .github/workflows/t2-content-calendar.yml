name: T2 daily content calendar

on:
  schedule:
    # 08:07 America/Fortaleza: one new creative per day goes to the owner's approval queue.
    - cron: '7 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t2-creative-compose
  cancel-in-progress: false

jobs:
  compose:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: R4 owner approval gate (fail-closed)
        shell: bash
        env:
          R4_OWNER_APPROVAL: ${{ vars.R4_T2_COMMERCIAL_SIGNED_CALLS_OWNER_APPROVAL }}
        run: |
          # R4 (Sol rule, 24/10/2026): this job sends x-commercial-signature calls whose HMAC scheme also authorizes commercial publishing
          # (zevanory-product-control-edge cf-worker/worker.ts verifyFactoryRequest, shared with /api/commercial/publish/*).
          # Runs only after the owner records an explicit risk acceptance in the repository variable R4_T2_COMMERCIAL_SIGNED_CALLS_OWNER_APPROVAL
          # ("approved"). Checked by scripts/ci/no_forged_production_input.py (open_real_risks / gates).
          if [ "${R4_OWNER_APPROVAL:-}" != "approved" ]; then
            echo "::error title=R4_OWNER_APPROVAL_REQUIRED::R4_T2_COMMERCIAL_SIGNED_CALLS_OWNER_APPROVAL is not set to approved; this job is a registered open R4 risk"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: '22'
      - name: Install compositor toolchain
        run: |
          set -euo pipefail
          mkdir -p /tmp/t2 && cd /tmp/t2
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright @fontsource/inter@5.2.8
          npx playwright install --with-deps chromium
      - name: Compose and upload today's calendar creative
        env:
          T2_CALENDAR: '1'
          ZEVANORY_OPERATOR_TOKEN: ${{ secrets.ZEVANORY_OPERATOR_TOKEN || secrets.CERTIFICATION_E2E_TOKEN }}  # R9: nome novo; queda para o antigo só na transição
          T2_OUT: ${{ github.workspace }}/t2-output
        run: |
          set -euo pipefail
          cp scripts/t2/compose-creatives.mjs /tmp/t2/
          cd /tmp/t2 && node compose-creatives.mjs
      - name: Product artifacts still intact
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 https://zevanory.api.br/api/support/artifacts-status | tee /tmp/a.json
          jq -e '.artifacts | length == 5 and all(.integrity == true)' /tmp/a.json >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: t2-composed-creatives
          path: t2-output/
          retention-days: 7
          if-no-files-found: warn
