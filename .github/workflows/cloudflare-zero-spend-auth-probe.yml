name: Cloudflare ZERO_SPEND auth probe
on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/cloudflare-zero-spend-auth-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: "22"
      - name: Fail closed if credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN_MISSING"; exit 23; }
          echo "CLOUDFLARE_API_TOKEN_PRESENT"
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo "CLOUDFLARE_ACCOUNT_ID_PRESENT"; else echo "CLOUDFLARE_ACCOUNT_ID_NOT_REQUIRED_FOR_WHOAMI"; fi
      - name: Authenticate without exposing credentials
        run: npx --yes wrangler@4.135.0 whoami
      - name: Confirm zero-spend route
        run: |
          echo "ZERO_SPEND_REMOTE_ROUTE=github-actions"
          echo "LOCAL_HEAVY_EXECUTION=0"
          echo "DEPLOY_PERFORMED=0"
