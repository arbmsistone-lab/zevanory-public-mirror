name: P18 external monitor (read-only)

# Roteiro Mestre v4.7, P18 (seção 5) e N2 (seção 9): monitor EXTERNO e independente da Cloudflare, gratuito,
# sem conta nova. Runner do GitHub (Azure) sonda por GET as páginas de venda e o /api/status (nunca /comprar,
# checkout ou pagamento). Auditoria Sol 246.09: cron a cada 5 min (minutos 2, 7, ..., fora do pico do minuto 0) e
# confirmação da 1ª falha por re-sondagem NA MESMA EXECUÇÃO após 60 s (2 falhas seguidas sem esperar o próximo cron).
# Grava no ramo evidence/b0-baseline: p18/probes-*.jsonl, p18/incidents-*.jsonl (1ª falha observada, confirmação,
# emissão do alerta, recuperação, latências), p18/runs-*.jsonl (atraso do agendador) e p18/heartbeat.json (lido pelo
# vigia p18-monitor-watchdog). Alerta: issue do GitHub aberta na confirmação, fechada na 1ª sondagem boa.
#
# AVAL Sol 253/254: o agendador do GitHub está estrangulado neste repositório (o monitor não rodou desde a ativação).
# Gatilho principal = cron EXISTENTE do Worker de controle (Cloudflare), que pede workflow_dispatch a cada 5 min com
# window_id (p18w-AAAAMMDDTHHMMZ, início da janela de 5 min), dispatched_at e dispatch_source=cloudflare-cron.
# O schedule abaixo continua como caminho extra de melhor esforço e cai na MESMA janela (slot :02 -> janela :00).
# Idempotência: (1) concurrency abaixo = no máximo 1 execução rodando + 1 pendente no grupo (uma nova pendente
# cancela a pendente anterior; doc. GitHub "Control workflow concurrency"), nunca execuções ilimitadas;
# (2) o monitor grava window_id/start_window_id em p18/runs-*.jsonl e uma janela já sondada vira duplicate_window
# (sem sondagem, sem alerta, sem batimento). Os inputs entram por env (nunca interpolados no script) e são
# validados no monitor (formato, alinhamento, [-60 min, +2 min]); inválido = descartado, a sondagem acontece.
run-name: "P18 monitor ${{ inputs.window_id || github.event_name }}"
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      window_id:
        description: "Janela de 5 min (p18w-AAAAMMDDTHHMMZ); vazio = janela do início"
        required: false
        default: ""
        type: string
      dispatched_at:
        description: "Instante ISO-8601 UTC do pedido (preenchido pelo Worker de controle)"
        required: false
        default: ""
        type: string
      dispatch_source:
        description: "cloudflare-cron | manual"
        required: false
        default: "manual"
        type: string

permissions:
  contents: write   # só o ramo evidence/b0-baseline (scripts/b0/evidence-branch.sh recusa qualquer outro)
  issues: write     # a issue de alerta

concurrency:
  group: p18-external-monitor
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ github.ref == 'refs/heads/gh-pages' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8   # sondagem (<= 43 s) + espera de confirmação (60 s) + re-sondagem (<= 43 s) + API + publicação
    env:
      EVIDENCE_BRANCH: evidence/b0-baseline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/b0
            scripts/p20
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar o ramo de evidência
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          EVIDENCE_DIR="$RUNNER_TEMP/evidence" bash scripts/b0/evidence-branch.sh prepare
      - name: Sondar de fora da Cloudflare, confirmar na mesma execução e decidir o alerta
        env:
          GITHUB_TOKEN: ${{ github.token }}
          P18_WINDOW_ID: ${{ inputs.window_id }}
          P18_DISPATCHED_AT: ${{ inputs.dispatched_at }}
          P18_DISPATCH_SOURCE: ${{ inputs.dispatch_source }}
        run: node scripts/b0/p18-monitor.mjs
      - name: Publicar a sondagem no ramo de evidência
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d "$EVIDENCE_DIR/.git" ]; then bash scripts/b0/evidence-branch.sh publish "P18 sondagem externa (run ${GITHUB_RUN_ID})"; fi
