name: ZEVANORY Public Secret History Scan

on:
  push:
    branches:
      - audit/zevanory-sales-secret-history-20261002
  pull_request:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/secret-history-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify complete Git history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --count HEAD)" -gt 1
          echo "FULL_HISTORY_CHECKOUT=PASS"

      - name: Gitleaks full-history scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secret-scan
          set +e
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source=/repo --log-opts="--all" --redact --no-banner --report-format=json --report-path=/repo/secret-scan/gitleaks.json
          code=$?
          set -e
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('secret-scan/gitleaks.json')
          raw=p.read_text() if p.exists() else ''
          rows=json.loads(raw) if raw.strip() else []
          from collections import Counter
          rules=Counter(str(r.get('RuleID') or r.get('rule') or 'unknown') for r in rows)
          commits=len(set(str(r.get('Commit') or '') for r in rows if r.get('Commit')))
          pathlib.Path('secret-scan/gitleaks-summary.json').write_text(json.dumps({'scanner':'gitleaks','full_history':True,'redacted':True,'findings':len(rows),'commits_affected':commits,'rule_counts':dict(sorted(rules.items())),'pass':len(rows)==0},indent=2))
          PY
          rm -f secret-scan/gitleaks.json
          echo "GITLEAKS_EXIT=$code"

      - name: TruffleHog verified full-history scan
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:latest git file:///repo --only-verified --json --no-update > secret-scan/trufflehog.raw.jsonl 2>/tmp/trufflehog.err
          code=$?
          set -e
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('secret-scan/trufflehog.raw.jsonl')
          count=0
          if p.exists():
            for line in p.read_text(errors='ignore').splitlines():
              try: row=json.loads(line)
              except Exception: continue
              if row.get('Verified') is True: count+=1
          pathlib.Path('secret-scan/trufflehog-summary.json').write_text(json.dumps({'scanner':'trufflehog','full_history':True,'verified_only':True,'verified_findings':count,'pass':count==0},indent=2))
          PY
          rm -f secret-scan/trufflehog.raw.jsonl /tmp/trufflehog.err
          echo "TRUFFLEHOG_EXIT=$code"

      - name: Consolidate secret scan
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          g=json.loads(pathlib.Path('secret-scan/gitleaks-summary.json').read_text())
          t=json.loads(pathlib.Path('secret-scan/trufflehog-summary.json').read_text())
          out={'repository':'arbmsistone-lab/zevanory-public-mirror','scope':'complete_git_history','gitleaks':g,'trufflehog':t,'pass':bool(g['pass'] and t['pass'])}
          pathlib.Path('secret-scan/summary.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out))
          if not out['pass']: raise SystemExit(1)
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zevanory-public-secret-history
          path: secret-scan/*summary.json
          if-no-files-found: error
          retention-days: 90
