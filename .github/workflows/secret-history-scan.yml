name: ZEVANORY Public Secret History Scan

# Public repository: the full-history scan must run on every change and daily,
# not only when this file changes (that gap let 43 findings accumulate unseen
# between 2026-10-11 and 2026-10-26). Do not add branch or path filters here.
# This file is pinned byte-for-byte (SHA-256, test-hash line normalised) by
# tests/test_secret_history_scan_workflow.py; the authoritative check is
# secret-scan-contract-protected.yml, which runs the BASE branch's test.
on:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches:
      - gh-pages
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Scanner versions are pinned to exact releases and verified against the
# SHA-256 published in each project's official release checksums file.
# Never use a floating image tag or an unpinned download. Update both version and digest
# together and regenerate .gitleaksignore fingerprints if the rule set changes.
env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  TRUFFLEHOG_VERSION: '3.99.2'
  TRUFFLEHOG_SHA256: '3c7b0d1dc4278294269bfdd7594bca8bb28c78da0a4a06ad202ded37b48deca4'

jobs:
  full-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify complete Git history
        shell: bash
        run: |
          set -euo pipefail
          # Every branch head on the (public) origin must be present locally, so that the
          # all-refs gitleaks scan really covers the whole history, on pull_request and after merge.
          test "$(git rev-parse --is-shallow-repository)" = "false"
          mkdir -p secret-scan
          python3 - <<'PY'
          import json, pathlib, subprocess
          def git(*a, check=True):
              return subprocess.run(['git', *a], check=check, text=True, capture_output=True)
          def remote_heads():
              out = git('ls-remote', '--heads', 'origin').stdout.split('\n')
              return {ref: sha for sha, ref in (l.split('\t') for l in out if l.strip())}
          def missing(heads):
              return sorted(ref for ref, sha in heads.items() if git('cat-file', '-e', sha + '^{commit}', check=False).returncode != 0)
          heads = remote_heads()
          miss = missing(heads)
          if miss:
              # Heads created or moved after checkout: fetch exactly those, then re-check.
              git('fetch', '--no-tags', 'origin', *[f'+{r}:refs/remotes/origin/{r[len("refs/heads/"):]}' for r in miss])
              now = remote_heads()
              miss = [r for r in missing({r: now[r] for r in miss if r in now})]
          total = int(git('rev-list', '--all', '--count').stdout)
          non_merge = int(git('rev-list', '--all', '--no-merges', '--count').stdout)
          summary = {'remote_heads': len(heads), 'missing_heads': miss, 'commits_all_refs': total,
                     'non_merge_commits': non_merge, 'pass': not miss and len(heads) > 0 and total > 1}
          pathlib.Path('secret-scan/history-summary.json').write_text(json.dumps(summary, indent=2))
          print(f"::notice title=HISTORY_COVERAGE::remote_heads={len(heads)} missing={len(miss)} commits_all_refs={total} non_merge={non_merge}")
          if not summary['pass']:
              raise SystemExit(f'HISTORY_INCOMPLETE missing_heads={miss[:20]} remote_heads={len(heads)} commits={total}')
          PY
          echo "FULL_HISTORY_CHECKOUT=PASS"

      - name: Secret scan contract (offline)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          echo "20063d13160afc7c8f6cb1caaf9831556b70207789990435ce2c0f98e1fd3b93  tests/test_secret_history_scan_workflow.py" | sha256sum -c -
          test -f .github/workflows/secret-scan-contract.yml
          test -f .github/workflows/secret-scan-contract-protected.yml
          if ! python3 -c "import yaml" 2>/dev/null; then python3 -m pip install --quiet --user --break-system-packages "pyyaml==6.0.2"; fi
          python3 -m unittest discover -v -s tests -p test_secret_history_scan_workflow.py 2>&1 | tee "$RUNNER_TEMP/contract.txt"
          grep -qx "Ran 19 tests in .*" "$RUNNER_TEMP/contract.txt"
          grep -qx "OK" "$RUNNER_TEMP/contract.txt"

      - name: Install pinned scanners (checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/scanners"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$bin" gitleaks
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/trufflehog.tar.gz" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  $RUNNER_TEMP/trufflehog.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trufflehog.tar.gz" -C "$bin" trufflehog
          test "$("$bin/gitleaks" version)" = "${GITLEAKS_VERSION}"
          "$bin/trufflehog" --version 2>&1 | grep -qx "trufflehog ${TRUFFLEHOG_VERSION}"

      - name: Refuse repository gitleaks configuration
        shell: bash
        run: |
          set -euo pipefail
          # gitleaks auto-loads <source>/.gitleaks.toml and GITLEAKS_CONFIG(_TOML); any of them
          # could allowlist everything. Only the root .gitleaksignore (exact fingerprints) is accepted.
          found="$(find . -path ./.git -prune -o \( -name '.gitleaks*' -o -iname '*gitleaks*.toml' \) ! -path ./.gitleaksignore -print)"
          if [ -n "$found" ]; then
            echo "::error title=REPO_GITLEAKS_CONFIG_REFUSED::$found"
            exit 1
          fi
          for var in GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML; do
            if [ -n "${!var:-}" ]; then
              echo "::error title=GITLEAKS_CONFIG_ENV_REFUSED::$var must not be set"
              exit 1
            fi
          done
          # Scanners are always invoked by absolute path ($RUNNER_TEMP/scanners/...), never via PATH.
          test -x "$RUNNER_TEMP/scanners/gitleaks"
          test -x "$RUNNER_TEMP/scanners/trufflehog"
          # Controlled config: exactly the gitleaks built-in default ruleset, nothing else.
          printf '%s\n' 'title = "zevanory-controlled-default"' '[extend]' 'useDefault = true' > "$RUNNER_TEMP/gitleaks.toml"
          echo "GITLEAKS_CONFIG_CONTROLLED=PASS"

      - name: Gitleaks full-history scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secret-scan
          code=0
          "$RUNNER_TEMP/scanners/gitleaks" git --config "$RUNNER_TEMP/gitleaks.toml" --log-opts="--all" --redact --ignore-gitleaks-allow --no-banner --no-color --gitleaks-ignore-path .gitleaksignore --report-format json --report-path secret-scan/gitleaks.json . 2> "$RUNNER_TEMP/gitleaks.log" || code=$?
          # Redacted log (no finding details without --verbose); always shown for diagnosis.
          cat "$RUNNER_TEMP/gitleaks.log"
          GITLEAKS_EXIT="$code" SCAN_KIND=commits python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          from collections import Counter
          kind = os.environ['SCAN_KIND']
          code = int(os.environ['GITLEAKS_EXIT'])
          log_opts = {'commits': ['--no-merges'], 'merges': ['--merges', '--remerge-diff']}[kind]
          report = pathlib.Path({'commits': 'secret-scan/gitleaks.json', 'merges': 'secret-scan/gitleaks-merges.json'}[kind])
          logfile = pathlib.Path(os.environ['RUNNER_TEMP'], {'commits': 'gitleaks.log', 'merges': 'gitleaks-merges.log'}[kind])
          # Independent exact count of the commits gitleaks must read a text patch for:
          # at least one non-binary, non-deleted file with changed lines (rename detection on).
          raw = subprocess.run(['git', 'log', '--all', *log_opts, '--raw', '--numstat', '--format=@%H'],
                               check=True, capture_output=True, text=True).stdout
          expected = 0
          for block in raw.split('\n@'):
              lines = [l for l in block.split('\n') if l]
              if not lines:
                  continue
              entries = [l for l in lines[1:] if l.startswith(':')]
              stats = [l for l in lines[1:] if not l.startswith(':') and l.count('\t') >= 2]
              if len(entries) != len(stats):
                  raise SystemExit(f'GITLEAKS_EXPECTED_COUNT_PARSE_ERROR {lines[0][:12]}')
              for entry, stat in zip(entries, stats):
                  status = entry.split('\t', 1)[0].split()[-1][0]
                  added, deleted = stat.split('\t')[:2]
                  if added != '-' and status != 'D' and int(added) + int(deleted) > 0:
                      expected += 1
                      break
          log = re.sub(r'\x1b\[[0-9;]*m', '', logfile.read_text(errors='replace'))
          scanned_hits = re.findall(r'\b(\d+) commits scanned', log)
          scanned = int(scanned_hits[-1]) if len(scanned_hits) == 1 else -1
          err_lines = [l for l in log.splitlines() if re.search(r'\bERR\b|\bFTL\b|fatal:', l)]
          problems = []
          rows = []
          if not report.exists():
              problems.append('GITLEAKS_REPORT_MISSING')
          else:
              rows = json.loads(report.read_text())
              if not isinstance(rows, list):
                  problems.append('GITLEAKS_REPORT_NOT_A_LIST')
                  rows = []
          if code not in (0, 1):
              problems.append(f'GITLEAKS_EXIT={code}')
          if code == 1 and not rows:
              problems.append('GITLEAKS_EXIT_1_WITHOUT_FINDINGS')
          if code == 0 and rows:
              problems.append('GITLEAKS_EXIT_0_WITH_FINDINGS')
          if err_lines:
              problems.append(f'GITLEAKS_ERROR_LINES={len(err_lines)}')
          if scanned != expected:
              problems.append(f'SCANNED_COMMITS={scanned} expected exactly {expected}')
          rules = Counter(str(r.get('RuleID') or 'unknown') for r in rows)
          locations = sorted({(str(r.get('RuleID') or 'unknown'), str(r.get('File') or ''), int(r.get('StartLine') or 0),
                               str(r.get('Commit') or '')[:12], str(r.get('Fingerprint') or '')) for r in rows})
          summary = {'scanner': 'gitleaks', 'kind': kind, 'redacted': True, 'findings': len(rows),
                     'rule_counts': dict(sorted(rules.items())),
                     'locations': [dict(zip(('rule', 'file', 'line', 'commit', 'fingerprint'), l)) for l in locations],
                     'exit_code': code, 'scanned_commits': scanned, 'expected_commits': expected,
                     'execution_problems': problems, 'pass': code == 0 and not rows and not problems}
          pathlib.Path(f'secret-scan/gitleaks-{kind}-summary.json').write_text(json.dumps(summary, indent=2))
          print(f"::notice title=GITLEAKS_SCANNED_{kind.upper()}::scanned_commits={scanned} expected={expected} findings={len(rows)} exit={code}")
          if problems:
              raise SystemExit(f'GITLEAKS_EXECUTION_ERROR {kind} ' + '; '.join(problems))
          PY
          rm -f secret-scan/gitleaks.json
          echo "GITLEAKS_EXIT=$code"

      - name: Gitleaks merge-commit scan (remerge-diff)
        shell: bash
        run: |
          set -euo pipefail
          # A secret introduced by a merge itself (conflict resolution) has no ordinary patch;
          # --remerge-diff shows what the merge added compared with an automatic re-merge.
          code=0
          "$RUNNER_TEMP/scanners/gitleaks" git --config "$RUNNER_TEMP/gitleaks.toml" --log-opts="--all --merges --remerge-diff" --redact --ignore-gitleaks-allow --no-banner --no-color --gitleaks-ignore-path .gitleaksignore --report-format json --report-path secret-scan/gitleaks-merges.json . 2> "$RUNNER_TEMP/gitleaks-merges.log" || code=$?
          cat "$RUNNER_TEMP/gitleaks-merges.log"
          GITLEAKS_EXIT="$code" SCAN_KIND=merges python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          from collections import Counter
          kind = os.environ['SCAN_KIND']
          code = int(os.environ['GITLEAKS_EXIT'])
          log_opts = {'commits': ['--no-merges'], 'merges': ['--merges', '--remerge-diff']}[kind]
          report = pathlib.Path({'commits': 'secret-scan/gitleaks.json', 'merges': 'secret-scan/gitleaks-merges.json'}[kind])
          logfile = pathlib.Path(os.environ['RUNNER_TEMP'], {'commits': 'gitleaks.log', 'merges': 'gitleaks-merges.log'}[kind])
          # Independent exact count of the commits gitleaks must read a text patch for:
          # at least one non-binary, non-deleted file with changed lines (rename detection on).
          raw = subprocess.run(['git', 'log', '--all', *log_opts, '--raw', '--numstat', '--format=@%H'],
                               check=True, capture_output=True, text=True).stdout
          expected = 0
          for block in raw.split('\n@'):
              lines = [l for l in block.split('\n') if l]
              if not lines:
                  continue
              entries = [l for l in lines[1:] if l.startswith(':')]
              stats = [l for l in lines[1:] if not l.startswith(':') and l.count('\t') >= 2]
              if len(entries) != len(stats):
                  raise SystemExit(f'GITLEAKS_EXPECTED_COUNT_PARSE_ERROR {lines[0][:12]}')
              for entry, stat in zip(entries, stats):
                  status = entry.split('\t', 1)[0].split()[-1][0]
                  added, deleted = stat.split('\t')[:2]
                  if added != '-' and status != 'D' and int(added) + int(deleted) > 0:
                      expected += 1
                      break
          log = re.sub(r'\x1b\[[0-9;]*m', '', logfile.read_text(errors='replace'))
          scanned_hits = re.findall(r'\b(\d+) commits scanned', log)
          scanned = int(scanned_hits[-1]) if len(scanned_hits) == 1 else -1
          err_lines = [l for l in log.splitlines() if re.search(r'\bERR\b|\bFTL\b|fatal:', l)]
          problems = []
          rows = []
          if not report.exists():
              problems.append('GITLEAKS_REPORT_MISSING')
          else:
              rows = json.loads(report.read_text())
              if not isinstance(rows, list):
                  problems.append('GITLEAKS_REPORT_NOT_A_LIST')
                  rows = []
          if code not in (0, 1):
              problems.append(f'GITLEAKS_EXIT={code}')
          if code == 1 and not rows:
              problems.append('GITLEAKS_EXIT_1_WITHOUT_FINDINGS')
          if code == 0 and rows:
              problems.append('GITLEAKS_EXIT_0_WITH_FINDINGS')
          if err_lines:
              problems.append(f'GITLEAKS_ERROR_LINES={len(err_lines)}')
          if scanned != expected:
              problems.append(f'SCANNED_COMMITS={scanned} expected exactly {expected}')
          rules = Counter(str(r.get('RuleID') or 'unknown') for r in rows)
          locations = sorted({(str(r.get('RuleID') or 'unknown'), str(r.get('File') or ''), int(r.get('StartLine') or 0),
                               str(r.get('Commit') or '')[:12], str(r.get('Fingerprint') or '')) for r in rows})
          summary = {'scanner': 'gitleaks', 'kind': kind, 'redacted': True, 'findings': len(rows),
                     'rule_counts': dict(sorted(rules.items())),
                     'locations': [dict(zip(('rule', 'file', 'line', 'commit', 'fingerprint'), l)) for l in locations],
                     'exit_code': code, 'scanned_commits': scanned, 'expected_commits': expected,
                     'execution_problems': problems, 'pass': code == 0 and not rows and not problems}
          pathlib.Path(f'secret-scan/gitleaks-{kind}-summary.json').write_text(json.dumps(summary, indent=2))
          print(f"::notice title=GITLEAKS_SCANNED_{kind.upper()}::scanned_commits={scanned} expected={expected} findings={len(rows)} exit={code}")
          if problems:
              raise SystemExit(f'GITLEAKS_EXECUTION_ERROR {kind} ' + '; '.join(problems))
          PY
          rm -f secret-scan/gitleaks-merges.json
          echo "GITLEAKS_MERGES_EXIT=$code"

      - name: TruffleHog verified full-history scan
        shell: bash
        run: |
          set -euo pipefail
          code=0
          "$RUNNER_TEMP/scanners/trufflehog" git "file://$PWD" --only-verified --no-ignore-tag --json --no-update > secret-scan/trufflehog.raw.jsonl 2> "$RUNNER_TEMP/trufflehog.err" || code=$?
          TRUFFLEHOG_EXIT="$code" python3 - <<'PY'
          import json, os, pathlib
          code = int(os.environ['TRUFFLEHOG_EXIT'])
          errp = pathlib.Path(os.environ['RUNNER_TEMP'], 'trufflehog.err')
          err = errp.read_text(errors='replace') if errp.exists() else ''
          p = pathlib.Path('secret-scan/trufflehog.raw.jsonl')
          results = 0
          verified = 0
          if p.exists():
              for line in p.read_text(errors='ignore').splitlines():
                  try:
                      row = json.loads(line)
                  except Exception:
                      continue
                  if isinstance(row, dict) and 'DetectorName' in row:
                      results += 1
                      if row.get('Verified') is True:
                          verified += 1
          finished = []
          for line in err.splitlines():
              try:
                  row = json.loads(line)
              except Exception:
                  continue
              if isinstance(row, dict) and row.get('msg') == 'finished scanning':
                  finished.append(row)
          problems = []
          if code != 0:
              problems.append(f'TRUFFLEHOG_EXIT={code}')
          if len(finished) != 1:
              problems.append(f'TRUFFLEHOG_FINISHED_LINES={len(finished)}')
          chunks = int(finished[-1].get('chunks') or 0) if finished else -1
          nbytes = int(finished[-1].get('bytes') or 0) if finished else -1
          logged_verified = int(finished[-1].get('verified_secrets') or 0) if finished else -1
          if chunks <= 0 or nbytes <= 0 or chunks > nbytes:
              problems.append(f'TRUFFLEHOG_CHUNKS={chunks} BYTES={nbytes}')
          if finished and logged_verified != verified:
              problems.append(f'TRUFFLEHOG_VERIFIED_MISMATCH log={logged_verified} json={verified}')
          if results != verified:
              problems.append(f'TRUFFLEHOG_UNVERIFIED_RESULTS={results - verified} (only-verified expected)')
          summary = {'scanner': 'trufflehog', 'verified_only': True, 'verified_findings': verified, 'exit_code': code,
                     'chunks_scanned': chunks, 'bytes_scanned': nbytes, 'execution_problems': problems,
                     'pass': verified == 0 and not problems}
          pathlib.Path('secret-scan/trufflehog-summary.json').write_text(json.dumps(summary, indent=2))
          print(f"::notice title=TRUFFLEHOG_SCANNED::chunks={chunks} bytes={nbytes} verified={verified} exit={code}")
          if problems:
              # Logs only (no finding JSON, which goes to stdout): shown to diagnose the failure.
              print('\n'.join(err.splitlines()[-60:]))
              raise SystemExit('TRUFFLEHOG_EXECUTION_ERROR ' + '; '.join(problems))
          PY
          rm -f secret-scan/trufflehog.raw.jsonl "$RUNNER_TEMP/trufflehog.err"
          echo "TRUFFLEHOG_EXIT=$code"

      - name: Consolidate secret scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          names = ['history', 'gitleaks-commits', 'gitleaks-merges', 'trufflehog']
          parts = {n: json.loads(pathlib.Path(f'secret-scan/{n}-summary.json').read_text()) for n in names}
          ok = all(parts[n]['pass'] is True for n in names)
          out = {'repository': 'arbmsistone-lab/zevanory-public-mirror', 'scope': 'complete_git_history', **parts, 'pass': ok}
          pathlib.Path('secret-scan/summary.json').write_text(json.dumps(out, indent=2))
          print(json.dumps(out))
          if not ok:
              g = parts['gitleaks-commits']; m = parts['gitleaks-merges']; t = parts['trufflehog']
              print(f"::error title=SECRET_SCAN_FAILED::gitleaks findings={g['findings']} rules={g['rule_counts']} files={sorted(set(l['file'] for l in g['locations']))[:10]} problems={g['execution_problems']}; merges findings={m['findings']} problems={m['execution_problems']}; trufflehog verified={t['verified_findings']} problems={t['execution_problems']}")
              raise SystemExit(1)
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zevanory-public-secret-history
          path: secret-scan/*summary.json
          if-no-files-found: error
          retention-days: 90
