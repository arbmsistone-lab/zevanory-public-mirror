name: ZEVANORY Public Secret History Scan

# Public repository: the full-history scan must run on every change and daily,
# not only when this file changes (that gap let 43 findings accumulate unseen
# between 2026-10-11 and 2026-10-26). Do not add branch or path filters here.
# The contract tests/test_secret_history_scan_workflow.py pins this file's
# security-relevant shape; it runs as the first step of this job and in
# secret-scan-contract.yml.
on:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches:
      - gh-pages
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Scanner versions are pinned to exact releases and verified against the
# SHA-256 published in each project's official release checksums file.
# Never use a floating image tag or an unpinned download. Update both version and digest
# together and regenerate .gitleaksignore fingerprints if the rule set changes.
env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  TRUFFLEHOG_VERSION: '3.99.2'
  TRUFFLEHOG_SHA256: '3c7b0d1dc4278294269bfdd7594bca8bb28c78da0a4a06ad202ded37b48deca4'

jobs:
  full-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify complete Git history
        shell: bash
        run: |
          set -euo pipefail
          # Every branch head on the (public) origin must be present locally, so that the
          # all-refs gitleaks scan really covers the whole history, on pull_request and after merge.
          test "$(git rev-parse --is-shallow-repository)" = "false"
          mkdir -p secret-scan
          python3 - <<'PY'
          import json, pathlib, subprocess
          def git(*a, check=True):
              return subprocess.run(['git', *a], check=check, text=True, capture_output=True)
          def remote_heads():
              out = git('ls-remote', '--heads', 'origin').stdout.split('\n')
              return {ref: sha for sha, ref in (l.split('\t') for l in out if l.strip())}
          def missing(heads):
              return sorted(ref for ref, sha in heads.items() if git('cat-file', '-e', sha + '^{commit}', check=False).returncode != 0)
          heads = remote_heads()
          miss = missing(heads)
          if miss:
              # Heads created or moved after checkout: fetch exactly those, then re-check.
              git('fetch', '--no-tags', 'origin', *[f'+{r}:refs/remotes/origin/{r[len("refs/heads/"):]}' for r in miss])
              now = remote_heads()
              miss = [r for r in missing({r: now[r] for r in miss if r in now})]
          total = int(git('rev-list', '--all', '--count').stdout)
          non_merge = int(git('rev-list', '--all', '--no-merges', '--count').stdout)
          summary = {'remote_heads': len(heads), 'missing_heads': miss, 'commits_all_refs': total,
                     'non_merge_commits': non_merge, 'pass': not miss and len(heads) > 0 and total > 1}
          pathlib.Path('secret-scan/history-summary.json').write_text(json.dumps(summary, indent=2))
          print(f"::notice title=HISTORY_COVERAGE::remote_heads={len(heads)} missing={len(miss)} commits_all_refs={total} non_merge={non_merge}")
          if not summary['pass']:
              raise SystemExit(f'HISTORY_INCOMPLETE missing_heads={miss[:20]} remote_heads={len(heads)} commits={total}')
          PY
          echo "FULL_HISTORY_CHECKOUT=PASS"

      - name: Secret scan contract (offline)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test -f tests/test_secret_history_scan_workflow.py
          test -f .github/workflows/secret-scan-contract.yml
          test -f .github/workflows/secret-scan-contract-protected.yml
          if ! python3 -c "import yaml" 2>/dev/null; then python3 -m pip install --quiet --user --break-system-packages "pyyaml==6.0.2"; fi
          python3 -m unittest discover -v -s tests -p test_secret_history_scan_workflow.py 2>&1 | tee "$RUNNER_TEMP/contract.txt"
          grep -qx "Ran 28 tests in .*" "$RUNNER_TEMP/contract.txt"
          grep -qx "OK" "$RUNNER_TEMP/contract.txt"

      - name: Install pinned scanners (checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/scanners"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$bin" gitleaks
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/trufflehog.tar.gz" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  $RUNNER_TEMP/trufflehog.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trufflehog.tar.gz" -C "$bin" trufflehog
          test "$("$bin/gitleaks" version)" = "${GITLEAKS_VERSION}"
          "$bin/trufflehog" --version 2>&1 | grep -qx "trufflehog ${TRUFFLEHOG_VERSION}"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Refuse repository gitleaks configuration
        shell: bash
        run: |
          set -euo pipefail
          # gitleaks auto-loads <source>/.gitleaks.toml and GITLEAKS_CONFIG(_TOML); any of them
          # could allowlist everything. Only the root .gitleaksignore (exact fingerprints) is accepted.
          found="$(find . -path ./.git -prune -o -name '.gitleaks*' ! -path ./.gitleaksignore -print)"
          if [ -n "$found" ]; then
            echo "::error title=REPO_GITLEAKS_CONFIG_REFUSED::$found"
            exit 1
          fi
          for var in GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML; do
            if [ -n "${!var:-}" ]; then
              echo "::error title=GITLEAKS_CONFIG_ENV_REFUSED::$var must not be set"
              exit 1
            fi
          done
          # Controlled config: exactly the gitleaks built-in default ruleset, nothing else.
          printf '%s\n' 'title = "zevanory-controlled-default"' '[extend]' 'useDefault = true' > "$RUNNER_TEMP/gitleaks.toml"
          echo "GITLEAKS_CONFIG_CONTROLLED=PASS"

      - name: Gitleaks full-history scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secret-scan
          expected="$(git rev-list --all --no-merges --count)"
          code=0
          gitleaks git --config "$RUNNER_TEMP/gitleaks.toml" --log-opts="--all" --redact --ignore-gitleaks-allow --no-banner --no-color --gitleaks-ignore-path .gitleaksignore --report-format json --report-path secret-scan/gitleaks.json . 2> "$RUNNER_TEMP/gitleaks.log" || code=$?
          # Redacted log (no finding details without --verbose); always shown for diagnosis.
          cat "$RUNNER_TEMP/gitleaks.log"
          GITLEAKS_EXIT="$code" EXPECTED_COMMITS="$expected" python3 - <<'PY'
          import json, math, os, pathlib, re
          from collections import Counter
          code=int(os.environ['GITLEAKS_EXIT'])
          expected=int(os.environ['EXPECTED_COMMITS'])
          log=re.sub(r'\x1b\[[0-9;]*m','',pathlib.Path(os.environ['RUNNER_TEMP'],'gitleaks.log').read_text(errors='replace'))
          scanned_hits=re.findall(r'\b(\d+) commits scanned', log)
          scanned=int(scanned_hits[-1]) if scanned_hits else -1
          err_lines=[l for l in log.splitlines() if re.search(r'\bERR\b|\bFTL\b|fatal:', l)]
          # gitleaks counts commits whose patch it read; merges and empty commits have none.
          # Measured 2026-10-27: 4399 scanned of 4442 non-merge commits (99%).
          floor=math.floor(0.95*expected)
          p=pathlib.Path('secret-scan/gitleaks.json')
          problems=[]
          if not p.exists(): problems.append('GITLEAKS_REPORT_MISSING')
          rows=[]
          if p.exists():
              rows=json.loads(p.read_text())
              if not isinstance(rows, list): problems.append('GITLEAKS_REPORT_NOT_A_LIST'); rows=[]
          if code not in (0,1): problems.append(f'GITLEAKS_EXIT={code}')
          if code==1 and not rows: problems.append('GITLEAKS_EXIT_1_WITHOUT_FINDINGS')
          if code==0 and rows: problems.append('GITLEAKS_EXIT_0_WITH_FINDINGS')
          if err_lines: problems.append(f'GITLEAKS_ERROR_LINES={len(err_lines)}')
          if scanned<=0 or scanned<floor: problems.append(f'SCANNED_COMMITS={scanned} below floor {floor} (non-merge commits {expected})')
          rules=Counter(str(r.get('RuleID') or 'unknown') for r in rows)
          commits=len(set(str(r.get('Commit') or '') for r in rows if r.get('Commit')))
          locations=[]
          seen=set()
          for r in rows:
              item={
                'rule':str(r.get('RuleID') or 'unknown'),
                'file':str(r.get('File') or ''),
                'line':int(r.get('StartLine') or 0),
                'start_column':int(r.get('StartColumn') or 0),
                'end_column':int(r.get('EndColumn') or 0),
                'commit':str(r.get('Commit') or '')[:12],
                'fingerprint':str(r.get('Fingerprint') or '')
              }
              key=(item['rule'],item['file'],item['line'],item['commit'])
              if key not in seen:
                  seen.add(key); locations.append(item)
          summary={'scanner':'gitleaks','full_history':True,'redacted':True,'findings':len(rows),'commits_affected':commits,'rule_counts':dict(sorted(rules.items())),'locations':locations,'exit_code':code,'scanned_commits':scanned,'non_merge_commits':expected,'scanned_commit_floor':floor,'execution_problems':problems,'pass':code==0 and not rows and not problems}
          pathlib.Path('secret-scan/gitleaks-summary.json').write_text(json.dumps(summary,indent=2))
          print(f"::notice title=GITLEAKS_SCANNED::scanned_commits={scanned} floor={floor} non_merge_commits={expected} findings={len(rows)} exit={code}")
          if problems:
              raise SystemExit('GITLEAKS_EXECUTION_ERROR '+'; '.join(problems))
          PY
          rm -f secret-scan/gitleaks.json
          echo "GITLEAKS_EXIT=$code"

      - name: TruffleHog verified full-history scan
        shell: bash
        run: |
          set -euo pipefail
          code=0
          trufflehog git "file://$PWD" --only-verified --no-ignore-tag --json --no-update > secret-scan/trufflehog.raw.jsonl 2> "$RUNNER_TEMP/trufflehog.err" || code=$?
          TRUFFLEHOG_EXIT="$code" python3 - <<'PY'
          import json, os, pathlib
          code=int(os.environ['TRUFFLEHOG_EXIT'])
          errp=pathlib.Path(os.environ['RUNNER_TEMP'],'trufflehog.err')
          err=errp.read_text(errors='replace') if errp.exists() else ''
          p=pathlib.Path('secret-scan/trufflehog.raw.jsonl')
          count=0
          if p.exists():
            for line in p.read_text(errors='ignore').splitlines():
              try: row=json.loads(line)
              except Exception: continue
              if row.get('Verified') is True: count+=1
          chunks=-1
          for line in err.splitlines():
              try: row=json.loads(line)
              except Exception: continue
              if row.get('msg')=='finished scanning': chunks=int(row.get('chunks') or 0)
          problems=[]
          if code!=0: problems.append(f'TRUFFLEHOG_EXIT={code}')
          if chunks<=0: problems.append(f'TRUFFLEHOG_CHUNKS={chunks}')
          pathlib.Path('secret-scan/trufflehog-summary.json').write_text(json.dumps({'scanner':'trufflehog','full_history':True,'verified_only':True,'verified_findings':count,'exit_code':code,'chunks_scanned':chunks,'execution_problems':problems,'pass':count==0 and not problems},indent=2))
          if problems:
              # Logs only (no finding JSON, which goes to stdout): shown to diagnose the failure.
              print('\n'.join(err.splitlines()[-60:]))
              raise SystemExit('TRUFFLEHOG_EXECUTION_ERROR '+'; '.join(problems))
          PY
          rm -f secret-scan/trufflehog.raw.jsonl "$RUNNER_TEMP/trufflehog.err"
          echo "TRUFFLEHOG_EXIT=$code"

      - name: Consolidate secret scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          g=json.loads(pathlib.Path('secret-scan/gitleaks-summary.json').read_text())
          t=json.loads(pathlib.Path('secret-scan/trufflehog-summary.json').read_text())
          out={'repository':'arbmsistone-lab/zevanory-public-mirror','scope':'complete_git_history','gitleaks':g,'trufflehog':t,'pass':bool(g['pass'] and t['pass'])}
          pathlib.Path('secret-scan/summary.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out))
          if not out['pass']:
              print(f"::error title=SECRET_SCAN_FAILED::gitleaks findings={g['findings']} rules={g['rule_counts']} files={sorted(set(l['file'] for l in g['locations']))[:10]} problems={g['execution_problems']}; trufflehog verified={t['verified_findings']} problems={t['execution_problems']}")
          if not out['pass']: raise SystemExit(1)
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zevanory-public-secret-history
          path: secret-scan/*summary.json
          if-no-files-found: error
          retention-days: 90
