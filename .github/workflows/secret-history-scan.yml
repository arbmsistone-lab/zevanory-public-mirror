name: ZEVANORY Public Secret History Scan

# Public repository: the full-history scan must run on every change and daily,
# not only when this file changes (that gap let 43 findings accumulate unseen
# between 2026-10-11 and 2026-10-26). Do not add branch or path filters here.
# The scan logic lives in scripts/ci/secret_scan.py (pinned scanner versions,
# tarball and binary SHA-256, exact commit counts, fail-closed). This file, that
# script and the contract test are pinned byte-for-byte by
# tests/test_secret_history_scan_workflow.py; the authoritative checks run from the
# BASE branch in secret-scan-contract-protected.yml.
on:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches:
      - gh-pages
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan contract (offline)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          echo "818119e9bcaea182d2353b111ec46011da6586a96e0012cc966ebc27415e1d04  tests/test_secret_history_scan_workflow.py" | sha256sum -c -
          if ! python3 -c "import yaml" 2>/dev/null; then python3 -m pip install --quiet --user --break-system-packages "pyyaml==6.0.2"; fi
          python3 -m unittest discover -v -s tests -p test_secret_history_scan_workflow.py 2>&1 | tee "$RUNNER_TEMP/contract.txt"
          grep -qx "Ran 18 tests in .*" "$RUNNER_TEMP/contract.txt"
          grep -qx "OK" "$RUNNER_TEMP/contract.txt"

      - name: Full-history secret scan (pinned, verified scanners)
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S scripts/ci/secret_scan.py full-history --repo . --ignore .gitleaksignore --out secret-scan

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zevanory-public-secret-history
          path: secret-scan/*summary.json
          if-no-files-found: error
          retention-days: 90
