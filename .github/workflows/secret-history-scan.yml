name: ZEVANORY Public Secret History Scan

# Public repository: the full-history scan must run on every change and daily,
# not only when this file changes (that gap let 43 findings accumulate unseen
# between 2026-10-11 and 2026-10-26). Do not add path filters here.
on:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches:
      - gh-pages
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Scanner versions are pinned to exact releases and verified against the
# SHA-256 published in each project's official release checksums file.
# Never use a floating image tag or an unpinned download. Update both version and digest
# together and regenerate .gitleaksignore fingerprints if the rule set changes.
env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  TRUFFLEHOG_VERSION: '3.99.2'
  TRUFFLEHOG_SHA256: '3c7b0d1dc4278294269bfdd7594bca8bb28c78da0a4a06ad202ded37b48deca4'

jobs:
  full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify complete Git history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --count HEAD)" -gt 1
          echo "FULL_HISTORY_CHECKOUT=PASS"

      - name: Install pinned scanners (checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/scanners"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$bin" gitleaks
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/trufflehog.tar.gz" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  $RUNNER_TEMP/trufflehog.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trufflehog.tar.gz" -C "$bin" trufflehog
          test "$("$bin/gitleaks" version)" = "${GITLEAKS_VERSION}"
          "$bin/trufflehog" --version 2>&1 | grep -qx "trufflehog ${TRUFFLEHOG_VERSION}"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Gitleaks full-history scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secret-scan
          set +e
          gitleaks git --log-opts="--all" --redact --no-banner --gitleaks-ignore-path .gitleaksignore --report-format json --report-path secret-scan/gitleaks.json .
          code=$?
          set -e
          GITLEAKS_EXIT="$code" python3 - <<'PY'
          import json, os, pathlib
          code=int(os.environ['GITLEAKS_EXIT'])
          p=pathlib.Path('secret-scan/gitleaks.json')
          raw=p.read_text() if p.exists() else ''
          rows=json.loads(raw) if raw.strip() else []
          from collections import Counter
          rules=Counter(str(r.get('RuleID') or r.get('rule') or 'unknown') for r in rows)
          commits=len(set(str(r.get('Commit') or '') for r in rows if r.get('Commit')))
          locations=[]
          seen=set()
          for r in rows:
              item={
                'rule':str(r.get('RuleID') or r.get('rule') or 'unknown'),
                'file':str(r.get('File') or ''),
                'line':int(r.get('StartLine') or 0),
                'start_column':int(r.get('StartColumn') or 0),
                'end_column':int(r.get('EndColumn') or 0),
                'commit':str(r.get('Commit') or '')[:12],
                'fingerprint':str(r.get('Fingerprint') or '')
              }
              key=(item['rule'],item['file'],item['line'],item['commit'])
              if key not in seen:
                  seen.add(key); locations.append(item)
          pathlib.Path('secret-scan/gitleaks-summary.json').write_text(json.dumps({'scanner':'gitleaks','full_history':True,'redacted':True,'findings':len(rows),'commits_affected':commits,'rule_counts':dict(sorted(rules.items())),'locations':locations,'exit_code':code,'pass':code==0 and len(rows)==0},indent=2))
          # Exit 0 = clean, 1 = leaks found; anything else is an execution error and
          # must never be reported as a pass (an empty report is not proof of no leaks).
          if code not in (0,1) or (code==1 and not rows):
              raise SystemExit(f'GITLEAKS_EXECUTION_ERROR={code}')
          PY
          rm -f secret-scan/gitleaks.json
          echo "GITLEAKS_EXIT=$code"

      - name: TruffleHog verified full-history scan
        shell: bash
        run: |
          set -euo pipefail
          set +e
          trufflehog git "file://$PWD" --only-verified --json --no-update > secret-scan/trufflehog.raw.jsonl 2>/tmp/trufflehog.err
          code=$?
          set -e
          TRUFFLEHOG_EXIT="$code" python3 - <<'PY'
          import json, os, pathlib
          code=int(os.environ['TRUFFLEHOG_EXIT'])
          p=pathlib.Path('secret-scan/trufflehog.raw.jsonl')
          count=0
          if p.exists():
            for line in p.read_text(errors='ignore').splitlines():
              try: row=json.loads(line)
              except Exception: continue
              if row.get('Verified') is True: count+=1
          pathlib.Path('secret-scan/trufflehog-summary.json').write_text(json.dumps({'scanner':'trufflehog','full_history':True,'verified_only':True,'verified_findings':count,'exit_code':code,'pass':code==0 and count==0},indent=2))
          if code!=0:
              raise SystemExit(f'TRUFFLEHOG_EXECUTION_ERROR={code}')
          PY
          rm -f secret-scan/trufflehog.raw.jsonl /tmp/trufflehog.err
          echo "TRUFFLEHOG_EXIT=$code"

      - name: Consolidate secret scan
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          g=json.loads(pathlib.Path('secret-scan/gitleaks-summary.json').read_text())
          t=json.loads(pathlib.Path('secret-scan/trufflehog-summary.json').read_text())
          out={'repository':'arbmsistone-lab/zevanory-public-mirror','scope':'complete_git_history','gitleaks':g,'trufflehog':t,'pass':bool(g['pass'] and t['pass'])}
          pathlib.Path('secret-scan/summary.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out))
          if not out['pass']: raise SystemExit(1)
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zevanory-public-secret-history
          path: secret-scan/*summary.json
          if-no-files-found: error
          retention-days: 90
