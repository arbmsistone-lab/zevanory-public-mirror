name: Shorts v2 samples and preview (no publication)
on:
  workflow_dispatch:
    inputs:
      modo:
        description: Preparar amostras ou previa; nao aprova publicacao
        type: choice
        options: [amostras, previa]
        required: true
      nivel_gratuito_confirmado:
        description: Confirmo nivel gratuito para esta execucao autorizada no chat
        type: boolean
        default: false
        required: true
      dia:
        description: Data YYYY-MM-DD da previa (ignorada nas amostras)
        type: string
        default: '2026-11-12'
      slot:
        type: choice
        options: [oferta, dica, calc]
        default: oferta
      sha_ensaio:
        description: Ensaio pre-merge (v3.4, NC-V34-04) - SHA completo de um PR; vazio = codigo do gh-pages. Sem upload.
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: shorts-v2-preparation
  cancel-in-progress: false
jobs:
  amostras:
    if: ${{ github.ref == 'refs/heads/gh-pages' && inputs.modo == 'amostras' }}
    environment: gh-pages-automacao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: 'true'
      FREE_TIER_CONFIRMED: ${{ inputs.nivel_gratuito_confirmado }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Require explicit free preparation confirmation
        run: node --input-type=module -e "import {assertPreparation} from './scripts/shorts-v2/preparation.mjs'; assertPreparation('amostras',process.env.DRY_RUN,process.env.FREE_TIER_CONFIRMED)"
      - name: Install local audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate eight WAV samples without publication
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/shorts-v2/compare-voices.mjs --samples "$RUNNER_TEMP/voice-samples"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shorts-v2-voice-samples
          path: ${{ runner.temp }}/voice-samples/
          if-no-files-found: error
          retention-days: 7
  previa:
    if: ${{ github.ref == 'refs/heads/gh-pages' && inputs.modo == 'previa' }}
    environment: gh-pages-automacao
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DRY_RUN: 'true'
      FREE_TIER_CONFIRMED: ${{ inputs.nivel_gratuito_confirmado }}
      PREVIEW_DAY: ${{ inputs.dia }}
      PREVIEW_SLOT: ${{ inputs.slot }}
    steps:
      # Ensaio pre-merge (NC-V34-04): o job so recebe GEMINI_API_KEY (TTS gratis e juri). Nenhum segredo de upload,
      # Meta, Cloudflare/KV ou vendas e referenciado aqui; permissions: contents read; a previa nunca publica.
      - name: Validate rehearsal SHA (empty or 40 hex)
        env:
          SHA_ENSAIO: ${{ inputs.sha_ensaio }}
        run: |
          if [ -n "$SHA_ENSAIO" ] && ! printf '%s' "$SHA_ENSAIO" | grep -Eq '^[0-9a-f]{40}$'; then echo "::error::sha_ensaio invalido"; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.sha_ensaio || github.sha }}
      - name: Prove no publication credentials reach this job
        run: |
          # Padrões escritos com classe de caractere para o próprio texto do workflow não citar nomes de credenciais.
          if env | cut -d= -f1 | grep -Eq '^(YOU[T]UBE|ME[T]A|CLOUD[F]LARE|K[V]|HOT[M]ART|MERCADO[P]AGO)_|DECISAO_[K]EY'; then echo "::error::credencial de publicacao presente no ambiente"; exit 1; fi
          echo "ENSAIO_SHA=$(git rev-parse HEAD) sem credenciais de publicacao"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Require explicit free preparation confirmation
        run: node --input-type=module -e "import {assertPreparation} from './scripts/shorts-v2/preparation.mjs'; assertPreparation('previa',process.env.DRY_RUN,process.env.FREE_TIER_CONFIRMED)"
      - name: Install local media and alignment tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-inter tesseract-ocr tesseract-ocr-por
          python3 -m pip install --user stable-ts==2.19.1 Pillow==12.0.0 numpy==2.2.6
      - name: Render actual selected voice with comparison and free-tier gates
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/shorts-v2/preparation.mjs "$RUNNER_TEMP/shorts-preview"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shorts-v2-preview
          path: ${{ runner.temp }}/shorts-preview/
          if-no-files-found: error
          retention-days: 7
