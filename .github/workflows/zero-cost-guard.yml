name: Zero-cost guard
on:
  pull_request:
    branches: [gh-pages]
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zero-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Block reintroduction of paid dependencies
        run: python3 scripts/zero_cost_guard.py
