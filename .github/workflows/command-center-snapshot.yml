name: Command center snapshot (read-only)

# Hourly, zero-cost rollup for the owner's Revenue Command Center: revenue ledger,
# funnel, reach per channel (with daily history), engine runs (autonomy, failures,
# automatic recoveries, MTTR), publications, service probes, agenda and forecast.
# Read-only on every provider; writes one snapshot key to the shared KV.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: command-center-snapshot
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test tests/command-center-snapshot.test.mjs tests/command-center-main.test.mjs tests/experiments.test.mjs tests/autonomy-inventory.test.mjs tests/market-weekly.test.mjs tests/sales-ledger.test.mjs
      - name: Build and store the snapshot
        run: node scripts/audit/command-center-snapshot.mjs
