name: Command center snapshot (read-only)

# Hourly, zero-cost rollup for the owner's Revenue Command Center: revenue ledger,
# funnel, reach per channel (with daily history), engine runs (autonomy, failures,
# automatic recoveries, MTTR), publications, service probes, agenda and forecast.
# Read-only on every provider; writes one snapshot key to the shared KV.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: command-center-snapshot
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  # Only for the daily KV-quota alert issue (deduplicated, one per UTC day).
  issues: write

jobs:
  snapshot:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: "22"
      - name: Unit tests
        run: node --test tests/command-center-snapshot.test.mjs tests/kv-quota-issue.test.mjs tests/command-center-main.test.mjs tests/experiments.test.mjs tests/autonomy-inventory.test.mjs tests/market-weekly.test.mjs tests/sales-ledger.test.mjs
      - name: Consolidate the funnel in its own Worker invocation
        env:
          ZEVANORY_OPERATOR_TOKEN: ${{ secrets.ZEVANORY_OPERATOR_TOKEN || secrets.CERTIFICATION_E2E_TOKEN }}  # R9: nome novo; queda para o antigo só na transição
        run: |
          code=$(curl -sS -o /tmp/funnel.json -w '%{http_code}' -X POST -H "x-backup-token: $ZEVANORY_OPERATOR_TOKEN" --max-time 120 https://zevanory.api.br/api/internal/funnel/run || true)
          echo "::notice title=FUNNEL_RUN::http=$code $(head -c 300 /tmp/funnel.json 2>/dev/null)"
      - name: Build and store the snapshot
        env:
          KV_FORECAST_OUT: ${{ runner.temp }}/kv-forecast.json
        run: node scripts/audit/command-center-snapshot.mjs
      - name: Notify owner when the KV write quota is at risk (one issue per day)
        if: always()
        env:
          KV_FORECAST_OUT: ${{ runner.temp }}/kv-forecast.json
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/audit/kv-quota-issue.mjs
