name: ZEA-10 elite autonomy architecture gate
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "zea10/**"
      - "worker/zea10-autonomy.mjs"
      - "worker/zea10-evaluator.mjs"
      - "worker/zevanory-control-core.mjs"
      - "worker/cloudflare-worker.compat.mjs"
      - ".github/workflows/zea10-elite-autonomy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate ZEA-10 contract and module
        run: |
          set -euo pipefail
          node --check worker/zea10-autonomy.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync("zea10/autonomy-contract.json","utf8"));
          if(c.pillars?.length!==10) throw new Error("exactly 10 operational pillars required");
          if(c.zero_spend_first!==true) throw new Error("ZERO_SPEND_FIRST required");
          if(!String(c.green_rule).includes("all_10_pillars")) throw new Error("fail-closed 10/10 green rule missing");
          const ids=new Set(c.pillars.map(x=>x.id));
          if(ids.size!==10) throw new Error("duplicate pillar id");
          console.log("PASS: ZEA-10 elite autonomy contract");
          NODE
      - name: Prove fail-closed canonical evaluation projection
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { buildZea10AutonomyReport } from "./worker/zea10-autonomy.mjs";
          const core={
            generated_at:"2026-09-23T13:00:00Z",
            release_sha:"a".repeat(40),
            architecture:{
              flow:["runtime-ci","ZEES-16","ZEA-10","ZEVANORY Control Core","Admin"],
              circular_dependency:false
            },
            zea10:{
              evaluator:"ZEA-10/2026.09-evaluator-v1",
              source_layer:"ZEES-16",
              authority:false,
              counts:{proven:8,partial:1,blocked:1,unknown:0},
              pillars:[
                {id:"ZEA10-05",state:"BLOCKED"},
                {id:"ZEA10-07",state:"PARTIAL"}
              ]
            }
          };
          const worker={async fetch(req){
            const u=new URL(req.url);
            if(u.pathname==="/api/core/v1/snapshot") return Response.json(core);
            return new Response("not found",{status:404});
          }};
          const report=await buildZea10AutonomyReport(new Request("https://example.test/api/zea10/autonomy"),{}, {}, worker);
          if(report.overall_state!=="BLOCKED") throw new Error("non-10/10 evaluation must fail closed");
          if(report.source_layer!=="ZEES-16"||report.authority!==false) throw new Error("compatibility projection role mismatch");
          if(report.counts.blocked!==1||report.counts.partial!==1) throw new Error("canonical counts not preserved");
          console.log("PASS: ZEA-10 compatibility route projects canonical evaluation and fails closed");
          NODE
