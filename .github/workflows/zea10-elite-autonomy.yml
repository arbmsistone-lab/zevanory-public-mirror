name: ZEA-10 elite autonomy architecture gate
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "zea10/**"
      - "worker/zea10-autonomy.mjs"
      - "worker/cloudflare-worker.compat.mjs"
      - ".github/workflows/zea10-elite-autonomy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate ZEA-10 contract and module
        run: |
          set -euo pipefail
          node --check worker/zea10-autonomy.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync("zea10/autonomy-contract.json","utf8"));
          if(c.pillars?.length!==10) throw new Error("exactly 10 operational pillars required");
          if(c.zero_spend_first!==true) throw new Error("ZERO_SPEND_FIRST required");
          if(!String(c.green_rule).includes("all_10_pillars")) throw new Error("fail-closed 10/10 green rule missing");
          const ids=new Set(c.pillars.map(x=>x.id));
          if(ids.size!==10) throw new Error("duplicate pillar id");
          console.log("PASS: ZEA-10 elite autonomy contract");
          NODE
      - name: Prove separated capability, readiness and activation gates
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { buildZea10AutonomyReport } from "./worker/zea10-autonomy.mjs";

          function response(body,status=200){
            return new Response(JSON.stringify(body),{status,headers:{"content-type":"application/json"}});
          }

          const blockedWorker={async fetch(req){
            const u=new URL(req.url);
            if(u.pathname==="/api/health") return Response.json({ready:true,live:true});
            if(u.pathname==="/api/status") return Response.json({
              runtime:{sales:"globally-blocked"},
              sales_machine:{structure_ready:true},
              channel_readiness:{
                whatsapp:{scope_status:"active"},
                email:{scope_status:"active"},
                instagram:{scope_status:"active"},
                facebook:{scope_status:"active"}
              }
            });
            if(u.pathname==="/api/agent/status") return Response.json({
              lifecycle_certified:false,
              autopilot:{health:"DEGRADED",cycles_24h:3}
            });
            if(u.pathname==="/api/intelligence") return Response.json({ready:true});
            if(u.pathname==="/api/provider-health") return response({ready:false},503);
            if(u.pathname==="/api/config") return Response.json({
              commercial_enabled:false,
              whatsapp:{verified:false,reason:"credentials_missing"},
              email:{verified:false,reason:"credentials_missing"},
              instagram:{verified:false,reason:"credentials_missing"},
              facebook:{verified:false,reason:"credentials_missing"}
            });
            if(u.pathname==="/api/control-plane") return Response.json({global_state:"operational_commercial_blocked"});
            return new Response("not found",{status:404});
          }};

          const blocked=await buildZea10AutonomyReport(
            new Request("https://example.test/api/zea10/autonomy"),{}, {}, blockedWorker
          );
          if(blocked.engine_capability_state!=="GREEN") throw new Error("engine capability must remain GREEN when implementation exists");
          if(blocked.operational_readiness_state!=="BLOCKED") throw new Error("operational readiness must fail closed without live providers");
          if(blocked.commercial_activation_state!=="BLOCKED") throw new Error("commercial activation must remain blocked by policy");
          if(blocked.overall_state!=="BLOCKED") throw new Error("overall must remain BLOCKED while operation is not ready");
          if(blocked.capability_pillars["ZEA10-05"].state!=="GREEN") throw new Error("omnichannel capability should be GREEN when channel contracts are active");
          if(blocked.capability_pillars["ZEA10-07"].state!=="GREEN") throw new Error("conversion capability should be GREEN when sales-machine structure is ready");
          if(blocked.operational_checks.live_core_channels_verified!==false) throw new Error("live channel truth must be false");
          if(blocked.operational_checks.provider_health!==false) throw new Error("provider health must be false");

          const readyWorker={async fetch(req){
            const u=new URL(req.url);
            if(u.pathname==="/api/health") return Response.json({ready:true,live:true});
            if(u.pathname==="/api/status") return Response.json({
              runtime:{sales:"globally-blocked"},
              sales_machine:{structure_ready:true},
              channel_readiness:{
                whatsapp:{scope_status:"active"},
                email:{scope_status:"active"},
                instagram:{scope_status:"active"},
                facebook:{scope_status:"active"}
              }
            });
            if(u.pathname==="/api/agent/status") return Response.json({
              lifecycle_certified:true,
              autopilot:{health:"HEALTHY",cycles_24h:3}
            });
            if(u.pathname==="/api/intelligence") return Response.json({ready:true});
            if(u.pathname==="/api/provider-health") return Response.json({ready:true});
            if(u.pathname==="/api/config") return Response.json({
              commercial_enabled:false,
              whatsapp:{verified:true,reason:"provider_live"},
              email:{verified:true,reason:"provider_live"},
              instagram:{verified:true,reason:"provider_live"},
              facebook:{verified:true,reason:"provider_live"}
            });
            if(u.pathname==="/api/control-plane") return Response.json({global_state:"operational_commercial_blocked"});
            return new Response("not found",{status:404});
          }};

          const ready=await buildZea10AutonomyReport(
            new Request("https://example.test/api/zea10/autonomy"),{}, {}, readyWorker
          );
          if(ready.engine_capability_state!=="GREEN") throw new Error("capability should be GREEN");
          if(ready.operational_readiness_state!=="GREEN") throw new Error("operation should be GREEN with all live proofs");
          if(ready.commercial_activation_state!=="BLOCKED") throw new Error("owner commercial policy must remain independently blocked");
          if(ready.overall_state!=="GREEN") throw new Error("operational GREEN must not require commercial activation");
          console.log("PASS: ZEA-10 separates capability, readiness and commercial activation without weakening fail-closed safety");
          NODE
