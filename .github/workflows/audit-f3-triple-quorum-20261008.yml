name: ZEVANORY F3 triple independent quorum proof
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - ".github/workflows/audit-f3-triple-quorum-20261008.yml"
permissions:
  contents: read
jobs:
  f3:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Three successive live identity and independent-domain probes
        env:
          EXPECTED_SHA: 03e9c7dc44652218c76454b425d51c34cd49dc59
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, time
          c=json.load(open("evidence/three-provider-quorum.json"))
          assert c["min_quorum"]==3 and c["commercial_release_allowed"] is False and c["zero_spend"] is True
          def get(url):
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"ZEVANORY-F3-AUDIT-READONLY/1"})
              with urllib.request.urlopen(req,timeout=25) as r:
                  raw=r.read(32769)
                  if len(raw)>32768:raise ValueError("oversize")
                  return r.status,json.loads(raw)
          for attempt in range(1,4):
              code,release=get("https://zevanory.api.br/api/release")
              assert code==200 and release.get("deployment",{}).get("commit_sha")==os.environ["EXPECTED_SHA"],"EXACT_SHA_MISMATCH"
              good=[]
              for p in c["providers"]:
                  if p.get("enabled") is False:continue
                  try:
                      status,body=get(p.get("url") or p["status_url"])
                      runtime=body.get("runtime") or {}
                      sales=runtime.get("sales") if isinstance(runtime,dict) else None
                      expected=p.get("expected_provider_attestation")
                      attested=not expected or body.get("provider")==expected or (body.get("quorum_attestation") or {}).get("provider")==expected
                      expected_direct=p.get("expected_provider")
                      direct=not expected_direct or body.get("provider")==expected_direct
                      ok=status==200 and body.get(p["identity_field"])==p["identity_value"] and attested and direct and sales in (None,"globally-blocked") and body.get("public_sales_locked") is not False
                      if ok:good.append((p["provider"],p["failure_domain"]))
                      print("::notice title=F3_PROVIDER::sample=%s provider=%s healthy=%s"%(attempt,p["provider"],str(ok).lower()))
                  except Exception as exc:
                      print("::notice title=F3_PROVIDER::sample=%s provider=%s healthy=false error_type=%s"%(attempt,p["provider"],type(exc).__name__))
              proven=len(set(x[0] for x in good))>=3 and len(set(x[1] for x in good))>=3
              print("::notice title=F3_QUORUM::sample=%s providers=%s domains=%s pass=%s"%(attempt,len(set(x[0] for x in good)),len(set(x[1] for x in good)),str(proven).lower()))
              if not proven:raise SystemExit("F3_FAIL_CLOSED_SAMPLE_"+str(attempt))
              if attempt<3:time.sleep(2)
          print("::notice title=F3_TRIPLE::PASS exact_sha="+os.environ["EXPECTED_SHA"])
          PY
