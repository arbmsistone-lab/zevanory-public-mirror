{
  "name": "Catalog sandbox purchase, delivery and refund proof",
  "run-name": "catalog-sandbox:${{ inputs.offer_id }}:${{ github.sha }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "expected_sha": {
          "description": "Full approved source SHA; no default",
          "required": true,
          "type": "string"
        },
        "offer_id": {
          "description": "Catalog SKU proved at its table price (ALL = the 5 SKUs in sequence, one approval)",
          "required": true,
          "type": "choice",
          "default": "ZEV-CMB-011",
          "options": [
            "ALL",
            "ZEV-IA-011",
            "ZEV-VEN-011",
            "ZEV-LCX-011",
            "ZEV-CMB-011",
            "ZEV-NGC-011"
          ]
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "manual-combo-sandbox",
    "cancel-in-progress": false
  },
  "jobs": {
    "purchase": {
      "if": "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/gh-pages' && github.run_attempt == 1 && vars.SANDBOX_FINANCIAL_ENABLED == 'true'",
      "environment": {
        "name": "sandbox-financial-approved"
      },
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "steps": [
        {
          "uses": "actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify approved source",
          "env": {
            "EXPECTED_SHA": "${{ inputs.expected_sha }}"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\""
        },
        {
          "name": "Resolve exact successful isolated deployment artifact (no production Cloudflare token)",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "EXPECTED_SHA": "${{ inputs.expected_sha }}",
            "OVERRIDE_URL": "${{ vars.CERTIFICATION_SANDBOX_URL }}"
          },
          "run": "set -euo pipefail\ngh api \"repos/$GITHUB_REPOSITORY/actions/workflows/certification-isolated-deploy.yml/runs?branch=gh-pages&per_page=30\" > /tmp/certification-runs.json\nrun_id=\"$(jq -r --arg sha \"$EXPECTED_SHA\" '[.workflow_runs[]|select(.head_sha==$sha and .conclusion==\"success\")]|first|.id // empty' /tmp/certification-runs.json)\"\ntest -n \"$run_id\" || { echo 'CERTIFICATION_APPROVED_DEPLOY_RUN_MISSING'; exit 1; }\nmkdir -p /tmp/zevanory-certification-origin\ngh run download \"$run_id\" --name \"certification-origin-$EXPECTED_SHA\" --dir /tmp/zevanory-certification-origin\nexport CERTIFICATION_ORIGIN_PATH=\"/tmp/zevanory-certification-origin/certification-origin.json\"\norigin=\"$(python3 - <<'PY'\nimport os,json,re\np=json.load(open(os.environ[\"CERTIFICATION_ORIGIN_PATH\"]))\nurl=str(p.get(\"url\") or \"\")\nassert p.get(\"sha\")==os.environ[\"EXPECTED_SHA\"] and p.get(\"worker\")==\"zevanory-certification\"\nassert re.fullmatch(r\"https://zevanory-certification\\.[a-zA-Z0-9-]+\\.workers\\.dev\",url)\noverride=os.environ.get(\"OVERRIDE_URL\",\"\").strip()\nassert not override or override==url,\"CERTIFICATION_ORIGIN_OVERRIDE_MISMATCH\"\nprint(url)\nPY\n)\"\necho \"CERTIFICATION_SANDBOX_URL=$origin\" >> \"$GITHUB_ENV\"\necho \"CERTIFICATION_ORIGIN_ATTESTED=PASS\""
        },
        {
          "name": "Preflight and isolated sandbox proof",
          "env": {
            "EXPECTED_SHA": "${{ inputs.expected_sha }}",
            "SANDBOX_FINANCIAL_ENABLED": "${{ vars.SANDBOX_FINANCIAL_ENABLED }}",
            "MERCADOPAGO_TEST_PUBLIC_KEY": "${{ secrets.MERCADOPAGO_TEST_PUBLIC_KEY }}",
            "MERCADOPAGO_TEST_ACCESS_TOKEN": "${{ secrets.MERCADOPAGO_TEST_ACCESS_TOKEN }}",
            "SANDBOX_IDENTITY_MANIFEST": "${{ secrets.SANDBOX_IDENTITY_MANIFEST }}",
            "SANDBOX_INBOX_READ_TOKEN": "${{ secrets.SANDBOX_INBOX_READ_TOKEN }}",
            "CERTIFICATION_E2E_TOKEN": "${{ secrets.CERTIFICATION_E2E_TOKEN }}",
            "SANDBOX_OFFER_ID": "${{ inputs.offer_id }}",
            "CERTIFICATION_SANDBOX_URL": "${{ env.CERTIFICATION_SANDBOX_URL }}",
            "CERTIFICATION_WORKER_NAME": "zevanory-certification"
          },
          "run": "python3 scripts/mercadopago_combo_sandbox.py"
        },
        {
          "name": "Upload sanitized evidence only",
          "if": "always()",
          "uses": "actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4",
          "with": {
            "name": "catalog-sandbox-evidence-${{ inputs.offer_id }}",
            "path": "evidence/mercadopago-combo-sandbox.json",
            "if-no-files-found": "warn",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
