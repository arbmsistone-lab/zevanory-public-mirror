{
  "name": "Combo sandbox purchase and delivery proof",
  "run-name": "combo-sandbox:${{ github.sha }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "expected_sha": {
          "description": "Full approved source SHA; no default",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "manual-combo-sandbox",
    "cancel-in-progress": false
  },
  "jobs": {
    "purchase": {
      "if": "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/gh-pages' && github.run_attempt == 1 && vars.SANDBOX_FINANCIAL_ENABLED == 'true'",
      "environment": {
        "name": "sandbox-financial-approved"
      },
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 12,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify approved source",
          "env": {
            "EXPECTED_SHA": "${{ inputs.expected_sha }}"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\""
        },
        {
          "name": "Preflight and isolated sandbox proof",
          "env": {
            "EXPECTED_SHA": "${{ inputs.expected_sha }}",
            "SANDBOX_FINANCIAL_ENABLED": "${{ vars.SANDBOX_FINANCIAL_ENABLED }}",
            "MERCADOPAGO_TEST_PUBLIC_KEY": "${{ secrets.MERCADOPAGO_TEST_PUBLIC_KEY }}",
            "MERCADOPAGO_TEST_ACCESS_TOKEN": "${{ secrets.MERCADOPAGO_TEST_ACCESS_TOKEN }}",
            "SANDBOX_IDENTITY_MANIFEST": "${{ secrets.SANDBOX_IDENTITY_MANIFEST }}",
            "SANDBOX_INBOX_READ_TOKEN": "${{ secrets.SANDBOX_INBOX_READ_TOKEN }}",
            "CERTIFICATION_E2E_TOKEN": "${{ secrets.CERTIFICATION_E2E_TOKEN }}"
          },
          "run": "python3 scripts/mercadopago_combo_sandbox.py"
        },
        {
          "name": "Upload sanitized evidence only",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "combo-sandbox-evidence",
            "path": "evidence/mercadopago-combo-sandbox.json",
            "if-no-files-found": "warn",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
