name: r9-operator-token

# R9 (roteiro v4.7; auditoria Sol 164 §4): migração da credencial de operador da produção para ZEVANORY_OPERATOR_TOKEN.
# Gate estático (transição), testes comportamentais do Worker real (T1-T5), testes do gate/readback/presença (K1-K7),
# janela de migração com valor novo e inventário de consumidores (M1-M8, I1-I5; Sol 233) e mutantes causais pelo
# classificador compartilhado. Só pull_request: nunca dispara no merge, nenhum segredo, sem rede
# além do checkout e da instalação do PyYAML.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "worker/**"
      - "certification-worker.mjs"
      - "scripts/ci/**"
      - "tests/operator-token-transition.test.mjs"
      - "tests/ci/operator-token-gate.test.mjs"
      - "tests/ci/operator-token-migration.test.mjs"
      - "tests/ci/operator-token-inventory.test.mjs"
      - "scripts/**"
      - "docs/ops/operator-token-transition.md"
      - "tests/helpers/**"
      - "tests/t4_sim/**"

permissions:
  contents: read

jobs:
  operator-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: "22"
      - name: PyYAML (o gate lê YAML como dado)
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --user --break-system-packages "pyyaml==6.0.2"
      - name: Gate da transição (zero violações) e inventário de consumidores
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/operator_token_gate.py --inventory | tee /tmp/gate.txt
          grep -qx "OPERATOR_TOKEN_GATE=PASS violations=0 errors=0 mode=transition" /tmp/gate.txt
      - name: Testes (contagem exata 15, zero pulados)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/operator-token-transition.test.mjs tests/ci/operator-token-gate.test.mjs | tee /tmp/t.txt
          for l in "# tests 15" "# pass 15" "# fail 0" "# skipped 0" "# todo 0" "# cancelled 0"; do grep -qx "$l" /tmp/t.txt || { echo "::error::esperado '$l'"; exit 1; }; done
      - name: Mutantes causais (todos precisam morrer)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/mutants_operator_token.py < /dev/null | tee /tmp/mut.txt
          echo "::notice title=R9_OPERATOR_TOKEN_MUTANTS::$(grep -E '^MUTANTS ' /tmp/mut.txt)"
          grep -qE "^MUTANTS total=([0-9]+) killed=\1 survived=0 inconclusive=0$" /tmp/mut.txt || { echo "::error::mutante sobreviveu ou inconclusivo"; exit 1; }
          grep -qx "MUTANTS total=${R9_OPERATOR_TOKEN_MUTANTS} killed=${R9_OPERATOR_TOKEN_MUTANTS} survived=0 inconclusive=0" /tmp/mut.txt || { echo "::error::contagem de mutantes mudou"; exit 1; }
        env:
          R9_OPERATOR_TOKEN_MUTANTS: "34"
      - name: Janela de migração e inventário de consumidores (Sol 233/237; contagem exata 15)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/ci/operator-token-migration.test.mjs tests/ci/operator-token-inventory.test.mjs | tee /tmp/m.txt
          for l in "# tests 15" "# pass 15" "# fail 0" "# skipped 0" "# todo 0" "# cancelled 0"; do grep -qx "$l" /tmp/m.txt || { echo "::error::esperado '$l'"; exit 1; }; done
      - name: Mutantes da janela de migração (todos precisam morrer)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/mutants_operator_token_migration.py < /dev/null | tee /tmp/mutm.txt
          echo "::notice title=R9_OPERATOR_TOKEN_MIGRATION_MUTANTS::$(grep -E '^MUTANTS ' /tmp/mutm.txt)"
          grep -qx "MUTANTS total=35 killed=35 survived=0 inconclusive=0" /tmp/mutm.txt || { echo "::error::mutante sobreviveu ou contagem mudou"; exit 1; }
      - name: Sem bytecode rastreado
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files '*.pyc' '**/__pycache__/**')"
