name: IndexNow submit (Bing, Yandex, Seznam, Naver)

# IndexNow: changed repository-backed pages only, one URL per publication. Public key only.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 12 * * *"
  push:
    branches: [gh-pages]
    paths: ["sitemap.xml", "sales-public/sitemap.xml"]

permissions:
  contents: read

concurrency:
  group: indexnow-planner
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      day: ${{ steps.plan.outputs.day }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: plan
        run: node scripts/indexnow-publication.mjs plan
  submit:
    name: indexnow-${{ matrix.id }}-${{ matrix.revision }}-${{ needs.plan.outputs.day }}
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: indexnow-url-${{ matrix.id }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEY: 4782b8291736ddb8fc6239a51c81d3004324faba12f20f625ddbf52ae0d8e922
      PUBLICATION_URL: ${{ matrix.url }}
      PUBLICATION_REVISION: ${{ matrix.revision }}
      PUBLICATION_DAY: ${{ needs.plan.outputs.day }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: attempt
        run: node scripts/indexnow-publication.mjs prepare
      - name: Submit one changed publication
        if: steps.attempt.outputs.ready == 'true'
        run: node scripts/indexnow-publication.mjs submit
