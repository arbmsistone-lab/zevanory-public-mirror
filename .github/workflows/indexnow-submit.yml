name: IndexNow submit (Bing, Yandex, Seznam, Naver)

# IndexNow: changed repository-backed pages only, one URL per publication. Public key only.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 12 * * *"
  push:
    branches: [gh-pages]
    paths: ["sitemap.xml", "sales-public/sitemap.xml"]

permissions:
  contents: read

concurrency:
  group: indexnow-planner
  cancel-in-progress: false
  queue: max

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      day: ${{ steps.plan.outputs.day }}
      attempt: ${{ steps.plan.outputs.attempt }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Plan changed publications
        id: plan
        run: node scripts/indexnow-publication.mjs plan
  notify:
    name: indexnow-${{ matrix.id }}-${{ matrix.revision }}-${{ needs.submit.outputs.day }}
    needs: submit
    if: needs.submit.outputs.has_work == 'true'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.submit.outputs.matrix) }}
    concurrency:
      group: indexnow-url-${{ matrix.id }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEY: 4782b8291736ddb8fc6239a51c81d3004324faba12f20f625ddbf52ae0d8e922
      PUBLICATION_URL: ${{ matrix.url }}
      PUBLICATION_DAY: ${{ needs.submit.outputs.day }}
      PUBLICATION_PLANNED_ATTEMPT: ${{ needs.submit.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Submit one changed publication
        run: node scripts/indexnow-publication.mjs submit
