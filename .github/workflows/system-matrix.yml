name: System certification matrix

# Generated master matrix: every workflow, every public URL, every business process, the
# production panel proof and the test suite, each PASS / FAIL / BLOCKED / NOT_TESTED with
# evidence. Read-only on providers; started by the engine dispatcher every 6 hours.
on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  matrix:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/audit/system-matrix.mjs
