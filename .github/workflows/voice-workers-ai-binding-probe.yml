name: ZEVANORY Workers AI probe cleanup

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/voice-workers-ai-binding-probe.yml'

permissions:
  contents: read

jobs:
  cleanup:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'e3caca88f4343c3cdfcf66eebe6ac124' }}
    steps:
      - uses: actions/checkout@v4
      - name: Delete temporary Workers AI probe
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.135.0 delete --name zevanory-voice-ai-probe --force || true
          echo "TEMP_WORKERS_AI_PROBE_CLEANED"
