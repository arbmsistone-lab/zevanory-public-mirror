name: ZEVANORY Asaas certification environment fail-closed
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "scripts/deploy/prepare-central-candidate.py"
      - "scripts/deploy/verify-financial-boundary.py"
      - ".github/workflows/zpc-asaas-sandbox-config.yml"
permissions:
  contents: read
jobs:
  asaas-sandbox-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Verify sandbox-only release candidate source and fail-closed financial assertions
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          a=Path("scripts/deploy/prepare-central-candidate.py").read_text()
          v=Path("scripts/deploy/verify-financial-boundary.py").read_text()
          ast.parse(a);ast.parse(v)
          expected=[
            'c["vars"]["ASAAS_ENV"]="sandbox"',
            'c["vars"]["MERCADOPAGO_ENV"]="sandbox"',
            'c["vars"]["SALE_GLOBALLY_ENABLED"]="false"',
            'c["vars"]["PRE_SALE_GATES_APPROVED"]="false"'
          ]
          for e in expected:
            if e not in a:raise SystemExit("ASAAS_FINANCIAL_SAFETY_MISSING")
          if 'ASAAS_ENV_MUST_BE_SANDBOX' not in v:raise SystemExit("ASAAS_DEPLOY_PROOF_MISSING")
          # R9 (Sol 164 §4): piloto fora da produção; o verificador exige a AUSÊNCIA de CERTIFICATION_PILOT_*.
          if 'c["vars"]["CERTIFICATION_PILOT_' in a:raise SystemExit("PRODUCTION_PILOT_VAR_WRITTEN")
          if 'NO_PRODUCTION_PILOT_BINDING' not in v:raise SystemExit("PILOT_ABSENCE_PROOF_MISSING")
          print("::notice title=ASAAS_CERTIFICATION_ENV::SANDBOX_ONLY_PASS")
          print("::notice title=PRODUCTION_COMMERCE::SALES_CLOSED_PASS")
          PY
