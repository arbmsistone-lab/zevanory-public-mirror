name: credential-separation-gate

# F2 item 9 (roteiro 3.1 seção 7; incidente I4): gate estático de separação sandbox x produção. Sem filtro de caminho:
# roda em TODO pull request e em todo push para gh-pages, porque qualquer mudança de workflow ou de configuração pode
# reabrir o caminho que grava credencial de teste na produção. Verifica todos os workflows, a configuração do Worker de
# produção, o registro de dívida ops/r9-debt.json (itens nomeados com dono e PR planejado; exceções derivadas dele), os
# workflows aposentados (if: false + marcador) e o contrato do workflow de remoção (só manual, confirmação digitada,
# Worker zevanory, 2 nomes). Token só leitura, nenhum segredo, sem rede além do checkout e da instalação do PyYAML.
# Os testes do Worker real e os mutantes ficam em credential-separation-behaviour.yml.
on:
  pull_request:
  push:
    branches: [gh-pages]

permissions:
  contents: read

concurrency:
  group: credential-separation-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: PyYAML (o gate lê YAML como dado)
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --user --break-system-packages "pyyaml==6.0.2"
          python3 -c "import yaml; print('PYYAML', yaml.__version__)"
      - name: Gate estático no repositório (zero violações)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/credential_separation_gate.py | tee /tmp/gate.txt
          grep -qx "CREDENTIAL_SEPARATION_GATE=PASS violations=0 errors=0" /tmp/gate.txt
      - name: Testes do gate, do readback e da coleta (contagem exata 37, zero pulados)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/ci/credential-separation-gate.test.mjs tests/production-secret-names.test.mjs tests/ci/production-worker-state.test.mjs | tee /tmp/t.txt
          for l in "# tests 37" "# pass 37" "# fail 0" "# skipped 0" "# todo 0" "# cancelled 0"; do grep -qx "$l" /tmp/t.txt || { echo "::error::esperado '$l'"; exit 1; }; done
