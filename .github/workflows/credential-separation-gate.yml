name: credential-separation-gate

# F2 item 9 (roteiro 3.1 seção 7): gate estático de separação sandbox x produção sobre TODOS os workflows e a
# configuração de deploy de produção, mais os testes do próprio gate. Os testes comportamentais do Worker e os
# mutantes ficam em credential-separation-behaviour.yml (fora do escopo do sandbox-static-checks, que proíbe job
# automático que dispara com mudança na sandbox de citar scripts financeiros). Só pull_request: nunca dispara no merge,
# nenhum segredo, sem rede além do checkout e da instalação do PyYAML.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/ci/credential_separation_gate.py"
      - "scripts/deploy/prepare-central-candidate.py"
      - "wrangler*.toml"
      - "tests/ci/credential-separation-gate.test.mjs"
      - "tests/helpers/toolchain.mjs"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: PyYAML (o gate lê YAML como dado)
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --user --break-system-packages "pyyaml==6.0.2"
          python3 -c "import yaml; print('PYYAML', yaml.__version__)"
      - name: Gate estático no repositório (zero violações)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/credential_separation_gate.py | tee /tmp/gate.txt
          grep -qx "CREDENTIAL_SEPARATION_GATE=PASS violations=0 errors=0" /tmp/gate.txt
      - name: Testes do gate (contagem exata 8, zero pulados)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/ci/credential-separation-gate.test.mjs | tee /tmp/t.txt
          for l in "# tests 8" "# pass 8" "# fail 0" "# skipped 0" "# todo 0" "# cancelled 0"; do grep -qx "$l" /tmp/t.txt || { echo "::error::esperado '$l'"; exit 1; }; done
