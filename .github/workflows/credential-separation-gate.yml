name: credential-separation-gate

# F2 item 9 (roteiro 3.1 seção 7): sandbox x produção. Gate estático dos workflows e da configuração de produção,
# testes comportamentais do Worker real (credencial escolhida por rota), lógica do readback/remoção dirigida e mutantes
# causais pelo classificador compartilhado. Só pull_request: nunca dispara no merge, nenhum segredo, sem rede além do
# checkout e da instalação do PyYAML.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "worker/**"
      - "certification-worker.mjs"
      - "data/politica-unica.json"
      - "scripts/ci/credential_separation_gate.py"
      - "scripts/ci/production-secret-names.mjs"
      - "scripts/ci/mutants_credential_separation.py"
      - "scripts/ci/mutants_credential_separation_allow.json"
      - "scripts/ci/mutant_classifier.py"
      - "scripts/deploy/prepare-central-candidate.py"
      - "wrangler*.toml"
      - "tests/production-payment-credential-isolation.test.mjs"
      - "tests/production-secret-names.test.mjs"
      - "tests/ci/credential-separation-gate.test.mjs"
      - "tests/helpers/payment-credential-probe.mjs"
      - "tests/helpers/toolchain.mjs"
      - "tests/t4_sim/**"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: PyYAML (o gate lê YAML como dado)
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --user --break-system-packages "pyyaml==6.0.2"
          python3 -c "import yaml; print('PYYAML', yaml.__version__)"
      - name: Gate estático no repositório (zero violações)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/credential_separation_gate.py | tee /tmp/gate.txt
          grep -qx "CREDENTIAL_SEPARATION_GATE=PASS violations=0 errors=0" /tmp/gate.txt
      - name: Testes (contagem exata 21, zero pulados)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/production-payment-credential-isolation.test.mjs tests/production-secret-names.test.mjs tests/ci/credential-separation-gate.test.mjs | tee /tmp/t.txt
          for l in "# tests 21" "# pass 21" "# fail 0" "# skipped 0" "# todo 0" "# cancelled 0"; do grep -qx "$l" /tmp/t.txt || { echo "::error::esperado '$l'"; exit 1; }; done
      - name: Mutantes causais (todos precisam morrer)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/mutants_credential_separation.py < /dev/null | tee /tmp/mut.txt
          echo "::notice title=CREDENTIAL_SEPARATION_MUTANTS::$(grep -E '^MUTANTS ' /tmp/mut.txt)"
          grep -qx "MUTANTS total=39 killed=39 survived=0 inconclusive=0" /tmp/mut.txt || { echo "::error::mutante sobreviveu ou contagem mudou"; exit 1; }
      - name: Sem bytecode rastreado
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files '*.pyc' '**/__pycache__/**')"
