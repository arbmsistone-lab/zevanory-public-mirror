name: Vigia dos workflows (observa a gh-pages, repete 1x só o somente-leitura, avisa)

# Requisito permanente do proprietário (12/11/2026): identificar, diagnosticar, corrigir e avisar.
# Observa só runs da gh-pages; repete UMA vez apenas p18-commercial-check (somente leitura), com reserva
# durável antes do POST; grava zpc:vigia:actions:v2 para o Epaminondas. Nunca repete publicação, deploy ou envio.
on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch:

concurrency:
  group: vigia-actions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    if: ${{ github.ref == 'refs/heads/gh-pages' }}
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Observe gh-pages runs, rerun allowlisted once, record summary
        run: node scripts/vigia/actions-watch.mjs
