name: F6 official ZEES-16 final reconciliation trigger
on:
  push:
    branches: [ops/f4-get-only-reconcile-569-20261009]
    paths: ['.github/workflows/f6-final-reconcile-569.yml']
permissions:
  contents: read
  actions: write
jobs:
  run-official-reconciler:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact published SHA and dispatch official ZEES-16 control reconciler
        shell: bash
        run: |
          set -euo pipefail
          REPO="arbmsistone-lab/zevanory-public-mirror"
          SHA="a69b0abd52ad7d6576d53a59a5facc0d0795a3cf"
          actual="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/branches/gh-pages" | jq -r '.commit.sha')"
          test "$actual" = "$SHA"
          echo "F6_TARGET_SHA=$actual"
          http="$(curl -sS -o /tmp/f6-official-dispatch.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data '{"ref":"gh-pages"}' \
            "https://api.github.com/repos/$REPO/actions/workflows/zees16-control-reconciler.yml/dispatches")"
          echo "F6_OFFICIAL_RECONCILER_DISPATCH_HTTP=$http"
          test "$http" = "204"
