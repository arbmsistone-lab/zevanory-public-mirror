name: mp-signature-vectors

# Roteiro v4.4, seção 7 ("Vetores de teste reproduzíveis pelo auditor"): x-signature do webhook Mercado Pago.
# 1) recálculo independente com OpenSSL de cada v1/sha256 de data/test-vectors/mercadopago-signature-v1.json
#    (+ meta-teste: cópias adulteradas TÊM de falhar); 2) cada vetor pela função REAL verifyMercadoPagoSignature
#    extraída do Worker (contagem exata 16); 3) mutantes causais pelo classificador compartilhado (exatamente 7 KILLED).
# Só pull_request: nunca dispara no merge, sem segredos (o segredo dos vetores é FICTÍCIO e versionado), token só leitura.
on:
  pull_request:
    paths:
      - ".github/workflows/mp-signature-vectors.yml"
      - "data/test-vectors/mercadopago-signature-v1.json"
      - "scripts/ci/mp_vectors_openssl.sh"
      - "scripts/ci/mutants_mp_signature_vectors.py"
      - "scripts/ci/mutant_classifier.py"
      - "tests/mercadopago-signature-vectors.test.mjs"
      - "tests/helpers/text.mjs"
      - "worker/cloudflare-worker.recovered.mjs"

permissions:
  contents: read

jobs:
  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: OpenSSL recalcula cada vetor (independente do Node e do Worker)
        shell: bash
        run: |
          set -euo pipefail
          openssl version
          bash scripts/ci/mp_vectors_openssl.sh | tee openssl.txt
          grep -qx 'MP_VECTORS_OPENSSL total=15 ok=15 mismatch=0 openssl=.*' openssl.txt || { echo "::error::esperados 15 vetores conferidos pelo OpenSSL"; exit 1; }
          echo "::notice title=MP_VECTORS_OPENSSL::$(grep '^MP_VECTORS_OPENSSL' openssl.txt)"
      - name: Meta-teste do script OpenSSL (cada adulteração tem de falhar)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/mp_vectors_openssl.sh --self-test | tee self.txt
          [ "$(grep -c '^MP_VECTORS_SELF_TEST .* PASS' self.txt)" = 9 ] || { echo "::error::esperadas 9 adulterações detectadas"; exit 1; }
          if grep -q '^MP_VECTORS_SELF_TEST .* FAIL' self.txt; then echo "::error::adulteração não detectada"; exit 1; fi
      - name: Vetores pela função real do Worker (contagem exata 16)
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --test --test-reporter=tap --test-reporter-destination=stdout tests/mercadopago-signature-vectors.test.mjs | tee vec.txt
          for kv in "tests 16" "pass 16" "fail 0" "cancelled 0" "skipped 0" "todo 0"; do
            grep -qx "# $kv" vec.txt || { echo "::error::contagem divergente: esperado '# $kv'"; exit 1; }
          done
          echo "::notice title=MP_VECTORS_NODE::$(grep -E '^# (tests|pass|fail|skipped|todo) ' vec.txt | paste -sd' ' -)"
      - name: Mutantes causais (classificador compartilhado; exatamente 7 KILLED)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          set -euo pipefail
          python3 scripts/ci/mutant_classifier.py self-check
          rc=0
          python3 scripts/ci/mutants_mp_signature_vectors.py < /dev/null | tee mut.txt || rc=$?
          echo "::notice title=MP_VECTORS_MUTANTS::$(grep '^MUTANTS ' mut.txt || echo ausente) rc=$rc"
          [ "$rc" = 0 ] || { echo "::error::mutantes saíram com $rc (1=sobrevivente, 2=baseline/config, 3=inconclusivo)"; exit 1; }
          grep -qx "MUTANTS total=7 killed=7 survived=0 inconclusive=0" mut.txt || { echo "::error::contagem de mutantes mudou"; exit 1; }
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then echo "::error::arquivo versionado modificado"; exit 1; fi
