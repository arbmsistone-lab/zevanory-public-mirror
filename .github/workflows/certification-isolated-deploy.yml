{
  "name": "ZEVANORY isolated certification Worker (manual Free)",
  "run-name": "certification-only:${{ inputs.expected_sha }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "expected_sha": {
          "description": "Full reviewed gh-pages SHA; mandatory exact pin",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "certification-worker-free",
    "cancel-in-progress": false
  },
  "jobs": {
    "certification": {
      "if": "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/gh-pages' && github.run_attempt == 1 && vars.SANDBOX_FINANCIAL_ENABLED == 'true'",
      "environment": {
        "name": "sandbox-financial-approved"
      },
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "env": {
        "EXPECTED_SHA": "${{ inputs.expected_sha }}",
        "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}",
        "CLOUDFLARE_ACCOUNT_ID": "1b26415802588185a86c1d4d3ebf5bdb",
        "TARGET_RUNTIME_SHA": "${{ github.sha }}",
        "CERTIFICATION_KV_ID": "${{ vars.CERTIFICATION_KV_ID || '48afe69de2ff4014b89acb553780ef35' }}",
        "CERTIFICATION_D1_ID": "${{ vars.CERTIFICATION_D1_ID || '7ff006f3-1daf-44c5-9494-aabab600608e' }}",
        "CERTIFICATION_SANDBOX_URL": "${{ vars.CERTIFICATION_SANDBOX_URL }}",
        "MERCADOPAGO_TEST_PUBLIC_KEY": "${{ secrets.MERCADOPAGO_TEST_PUBLIC_KEY }}",
        "MERCADOPAGO_TEST_ACCESS_TOKEN": "${{ secrets.MERCADOPAGO_TEST_ACCESS_TOKEN }}",
        "MERCADOPAGO_TEST_WEBHOOK_SECRET": "${{ secrets.MERCADOPAGO_TEST_WEBHOOK_SECRET }}",
        "CERTIFICATION_E2E_TOKEN": "${{ secrets.CERTIFICATION_E2E_TOKEN }}",
        "CERTIFICATION_DATABASE_URL": "${{ secrets.CERTIFICATION_DATABASE_URL }}",
        "CERTIFICATION_RESEND_API_KEY": "${{ secrets.CERTIFICATION_RESEND_API_KEY }}",
        "SANDBOX_INBOX_READ_TOKEN": "${{ secrets.SANDBOX_INBOX_READ_TOKEN }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Build same pinned canonical source, generate wholly separate Free config, tests and dry-run",
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ntest \"$TARGET_RUNTIME_SHA\" = \"$EXPECTED_SHA\"\npython3 scripts/zero_cost_guard.py\ngit fetch origin final-83620c6\nrm -rf public\ngit archive 83620c680958d726fc4b0fd16e2574cdcc362a6d public | tar -x\nnode scripts/deploy/materialize-control-plane.mjs\ncp admin.css public/admin.css\npython3 scripts/deploy/write-build-info.py\ngit show 83620c680958d726fc4b0fd16e2574cdcc362a6d:wrangler.jsonc > wrangler.central-fix.jsonc\nZEVANORY_LAUNCH_AUTHORIZATION='' python3 scripts/deploy/prepare-central-candidate.py\npython3 scripts/deploy/prepare-certification-config.py\nnode --check certification-worker.mjs\npython3 -m unittest discover -s tests -p test_sandbox_guards.py\nnode --test tests/certification-worker.test.mjs\nnpx --yes wrangler@4.143.0 deploy --dry-run --config wrangler.certification.generated.jsonc --outdir /tmp/certification-bundle"
        },
        {
          "name": "Deploy CERTIFICATION script only, never zevanory or sales workers",
          "run": "set -euo pipefail\nnode -e 'const c=JSON.parse(require(\"fs\").readFileSync(\"wrangler.certification.generated.jsonc\"));if(c.name!==\"zevanory-certification\"||c.routes.length||c.services?.length||c.triggers.crons.length)process.exit(1)'\nnpx --yes wrangler@4.143.0 deploy --config wrangler.certification.generated.jsonc --tag=\"$EXPECTED_SHA\" 2>&1 | tee /tmp/zevanory-certification-deploy.log\ndetected=\"$(grep -Eo 'https://zevanory-certification\\.[A-Za-z0-9-]+\\.workers\\.dev' /tmp/zevanory-certification-deploy.log | tail -1 || true)\"\ntest -n \"$detected\" || { echo 'CERTIFICATION_DEPLOY_URL_MISSING'; exit 1; }\norigin=\"${CERTIFICATION_SANDBOX_URL:-$detected}\"\ncase \"$origin\" in https://zevanory-certification.*.workers.dev) ;; *) echo 'CERTIFICATION_ORIGIN_INVALID'; exit 1;; esac\ntest \"$origin\" = \"$detected\" || { echo 'CERTIFICATION_ORIGIN_OVERRIDE_MISMATCH'; exit 1; }\necho \"CERTIFICATION_SANDBOX_URL=$origin\" >> \"$GITHUB_ENV\"\necho \"CERTIFICATION_ISOLATED_WORKER_URL=$origin\" >> \"$GITHUB_STEP_SUMMARY\"\necho 'CERTIFICATION_ONLY_DEPLOY_REQUESTED=PASS'"
        },
        {
          "name": "Attach only sandbox-named secrets to certification Worker",
          "run": "set -euo pipefail\nexport CERTIFICATION_OPERATOR_TOKEN=\"$(openssl rand -hex 32)\"\npython3 - <<'PY'\nimport json,os,pathlib,sys\nnames=[\"MERCADOPAGO_TEST_PUBLIC_KEY\",\"MERCADOPAGO_TEST_ACCESS_TOKEN\",\n \"MERCADOPAGO_TEST_WEBHOOK_SECRET\",\"CERTIFICATION_E2E_TOKEN\",\n \"CERTIFICATION_DATABASE_URL\",\"CERTIFICATION_OPERATOR_TOKEN\",\n \"CERTIFICATION_RESEND_API_KEY\",\"SANDBOX_INBOX_READ_TOKEN\"]\nmissing=[n for n in names if not os.environ.get(n)]\nif missing:sys.exit(\"CERTIFICATION_SECRETS_MISSING: \"+\",\".join(missing))\ndata={n:os.environ[n] for n in names}\ndata[\"CERTIFICATION_RESEND_RECEIVING_API_KEY\"]=data[\"CERTIFICATION_RESEND_API_KEY\"]\np=pathlib.Path(\"/tmp/certification-secrets-only.json\")\nfd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)\nwith os.fdopen(fd,\"w\") as f:json.dump(data,f)\nPY\ntrap 'rm -f /tmp/certification-secrets-only.json; unset CERTIFICATION_OPERATOR_TOKEN' EXIT\nnpx --yes wrangler@4.143.0 secret bulk /tmp/certification-secrets-only.json --config wrangler.certification.generated.jsonc\necho 'CERTIFICATION_SECRET_SCOPE=ISOLATED'"
        },
        {
          "name": "Read back isolated Worker capability with exact deployed SHA",
          "run": "set -euo pipefail\ncase \"$CERTIFICATION_SANDBOX_URL\" in https://zevanory-certification.*.workers.dev) ;; *) echo 'CERTIFICATION_SANDBOX_URL_INVALID'; exit 1;; esac\ncode=\"$(curl -sS -o /tmp/certification-readback.json -w '%{http_code}' --connect-timeout 10 --max-time 25 -H \"x-certification-e2e-token: $CERTIFICATION_E2E_TOKEN\" \"$CERTIFICATION_SANDBOX_URL/api/internal/certification/e2e/status\")\"\ntest \"$code\" = 200 || { echo 'CERTIFICATION_READBACK_HTTP_FAIL'; exit 1; }\npython3 - <<'PY'\nimport json,os\nj=json.load(open('/tmp/certification-readback.json'))\nassert j.get('certification_worker_source_sha')==os.environ['EXPECTED_SHA']\nassert j.get('sale_globally_enabled') is False and j.get('sales_mode')=='globally-blocked'\nassert j.get('sandbox_proof_contract')=='v2' and j.get('sandbox_checkout_isolated') is True\nprint('CERTIFICATION_ONLY_READBACK=PASS; PUBLIC_SALES_UNMODIFIED=true')\nPY"
        },
        {
          "name": "Write nonsecret exact-SHA deployment origin evidence",
          "run": "set -euo pipefail\nmkdir -p evidence\npython3 - <<'PY'\nimport os,json,pathlib\nurl=os.environ[\"CERTIFICATION_SANDBOX_URL\"]\nsha=os.environ[\"EXPECTED_SHA\"]\nassert url.startswith(\"https://zevanory-certification.\") and url.endswith(\".workers.dev\")\npathlib.Path(\"evidence/certification-origin.json\").write_text(json.dumps({\"url\":url,\"sha\":sha,\"worker\":\"zevanory-certification\"})+\"\\n\")\nprint(\"CERTIFICATION_ORIGIN_EVIDENCE=PASS\")\nPY"
        },
        {
          "name": "Store deploy origin for manually approved ALL sandbox job",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "certification-origin-${{ github.sha }}",
            "path": "evidence/certification-origin.json",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
