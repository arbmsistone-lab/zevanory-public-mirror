name: ZEVANORY financial E2E closure

on:
  pull_request:
    branches: [gh-pages]
    paths:
      - ".github/workflows/financial-e2e-closure.yml"
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/financial-e2e-closure.yml"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed runtime SHA to certify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: financial-e2e-closure
  cancel-in-progress: false

jobs:
  financial-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERCADOPAGO_TEST_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_TEST_ACCESS_TOKEN || secrets.MERCADOPAGO_ACCESS_TOKEN }}
      MERCADOPAGO_TEST_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_TEST_WEBHOOK_SECRET || secrets.MERCADOPAGO_WEBHOOK_SECRET }}
      CERTIFICATION_E2E_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN }}
      EXPECTED_SHA: ${{ inputs.expected_sha || '2237836450cd371365d9fe00c83e42f70df28025' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact certified runtime SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Synchronize internal certification token to Worker
        shell: bash
        run: |
          set -euo pipefail
          test "${#CERTIFICATION_E2E_TOKEN}" -ge 32
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          mapfile -t ACCOUNT_IDS < <(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[].id')
          MATCHES=()
          for aid in "${ACCOUNT_IDS[@]}"; do
            payload="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$aid/workers/services/zevanory" || true)"
            if jq -e '.success == true and .result != null' >/dev/null 2>&1 <<<"$payload"; then
              MATCHES+=("$aid")
            fi
          done
          test "${#MATCHES[@]}" -eq 1
          export CLOUDFLARE_ACCOUNT_ID="${MATCHES[0]}"
          printf '%s' "$CERTIFICATION_E2E_TOKEN" | npx --yes wrangler@4.135.0 secret put CERTIFICATION_E2E_TOKEN --name zevanory
          echo "CANONICAL_WORKER_ACCOUNT=RESOLVED"
          echo "CERTIFICATION_E2E_TOKEN_SYNC=PASS"

      - name: Diagnose certification route ownership
        shell: bash
        run: |
          set -euo pipefail
          ORDER_ID="00000000-0000-4000-8000-000000000000"
          for base in "https://zevanory.zevanory.workers.dev" "https://zevanory.api.br"; do
            code="$(curl -sS -o /tmp/e2e-probe.json -w '%{http_code}' -H "x-certification-e2e-token: $CERTIFICATION_E2E_TOKEN" "$base/api/internal/certification/e2e/status?order_id=$ORDER_ID")"
            body="$(cat /tmp/e2e-probe.json)"
            echo "E2E_ROUTE_PROBE base=$base status=$code body=$body"
          done

      - name: Validate Mercado Pago sandbox preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${#EXPECTED_SHA}" -eq 40
          test -n "${MERCADOPAGO_TEST_ACCESS_TOKEN:-}" || { echo "MISSING_REQUIRED_SECRET=MERCADOPAGO_TEST_ACCESS_TOKEN"; exit 2; }
          test -n "${MERCADOPAGO_TEST_WEBHOOK_SECRET:-}" || { echo "MISSING_REQUIRED_SECRET=MERCADOPAGO_TEST_WEBHOOK_SECRET"; exit 2; }
          test "${#MERCADOPAGO_TEST_WEBHOOK_SECRET}" -ge 16
          test "${#CERTIFICATION_E2E_TOKEN}" -ge 32
          echo "PAYMENT_PROVIDER=mercadopago"
          echo "MERCADOPAGO_ENV=sandbox"
          echo "SALE_GLOBALLY_ENABLED=false"
          echo "FINANCIAL_PREFLIGHT=PASS"

      - name: Probe Mercado Pago sandbox Pix routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, uuid
          token=os.environ["MERCADOPAGO_TEST_ACCESS_TOKEN"].strip()
          base="https://api.mercadopago.com"
          def call(path, method="GET", body=None, idem=None):
              headers={"accept":"application/json","authorization":"Bearer "+token,"user-agent":"ZEVANORY-MP-Sandbox-Probe/1.0"}
              if body is not None: headers["content-type"]="application/json"
              if idem: headers["x-idempotency-key"]=idem
              req=urllib.request.Request(base+path,method=method,headers=headers,data=None if body is None else json.dumps(body).encode())
              try:
                  with urllib.request.urlopen(req,timeout=40) as r: return r.status,json.loads(r.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors="replace")
                  try: data=json.loads(raw or "{}")
                  except: data={"raw":raw[:300]}
                  return e.code,data
          req=urllib.request.Request("https://api.mercadolibre.com/users/me",headers={"accept":"application/json","authorization":"Bearer "+token,"user-agent":"ZEVANORY-MP-Sandbox-Probe/1.0"})
          try:
              with urllib.request.urlopen(req,timeout=40) as rr:
                  code=rr.status
                  me=json.loads(rr.read().decode() or "{}")
          except urllib.error.HTTPError as e:
              code=e.code
              raw=e.read().decode(errors="replace")
              try: me=json.loads(raw or "{}")
              except: me={}
          print("MP_ACCESS_TOKEN_AUTH="+("PASS" if code==200 else f"FAIL_{code}"))
          pix_body={
            "transaction_amount":1.0,
            "description":"ZEVANORY sandbox Pix probe",
            "payment_method_id":"pix",
            "external_reference":"ZEVANORY_PIX_PROBE_"+uuid.uuid4().hex,
            "payer":{"email":"test_user_br@testuser.com","first_name":"APRO"}
          }
          pcode,p=call("/v1/payments","POST",pix_body,str(uuid.uuid4()))
          print("MP_PIX_PAYMENTS_CREATE_HTTP="+str(pcode))
          print("MP_PIX_PAYMENTS_PROVIDER_CODE="+str(p.get("code") or p.get("error") or p.get("status_detail") or "none")[:120])
          pid=str(p.get("id",""))
          pstatus=str(p.get("status",""))
          if pid.isdigit():
              for _ in range(8):
                  if pstatus in ("approved","rejected","cancelled","refunded"): break
                  time.sleep(2)
                  qcode,q=call("/v1/payments/"+pid)
                  if qcode==200: pstatus=str(q.get("status",""))
          print("MP_PIX_PAYMENTS_FINAL="+(pstatus or "unknown"))
          order_body={
            "type":"online",
            "external_reference":"ZEVANORY_ORDER_PROBE_"+uuid.uuid4().hex,
            "total_amount":"1.00",
            "payer":{"email":"test_user_br@testuser.com","first_name":"APRO"},
            "transactions":{"payments":[{"amount":"1.00","payment_method":{"id":"pix","type":"bank_transfer"}}]}
          }
          ocode,o=call("/v1/orders","POST",order_body,str(uuid.uuid4()))
          print("MP_PIX_ORDERS_CREATE_HTTP="+str(ocode))
          order_errors=o.get("errors") if isinstance(o,dict) else None
          print("MP_PIX_ORDERS_PROVIDER_CODE="+str((order_errors or o.get("code") or o.get("error") or "none"))[:180])
          oid=str(o.get("id",""))
          ostatus=str(o.get("status",""))
          if oid.startswith("ORD"):
              for _ in range(8):
                  if ostatus in ("processed","failed","cancelled"): break
                  time.sleep(2)
                  qcode,q=call("/v1/orders/"+oid)
                  if qcode==200: ostatus=str(q.get("status",""))
          print("MP_PIX_ORDERS_FINAL="+(ostatus or "unknown"))
          assert code==200, ("access_token_auth",code)
          assert pcode in (200,201) or ocode in (200,201), ("pix_probe_failed",pcode,ocode)
          PY

      - name: Run Mercado Pago sandbox financial lifecycle
        run: python3 scripts/financial_e2e_mercadopago.py

      - name: Verify immutable GREEN evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          p=json.load(open("evidence/financial-e2e-mercadopago.json",encoding="utf-8"))
          sha=os.environ["EXPECTED_SHA"].lower()
          assert re.fullmatch(r"[0-9a-f]{40}",sha)
          assert set(p["sha"].values())=={sha},p["sha"]
          assert p["provider"]=="mercadopago"
          assert p["provider_environment"]=="sandbox"
          assert p["sales_mode"]=="globally-blocked"
          assert p["checks"]["FINAL_FINANCIAL_E2E"]=="GREEN"
          assert p["checks"]["PROVIDER_FINAL_STATE"]=="TERMINAL"
          assert all(v in ("PASS","GREEN","TERMINAL") for v in p["checks"].values()),p["checks"]
          assert p["final_order_status"]=="refunded"
          assert p["final_fulfillment_status"]=="canceled"
          assert p["payment_confirmation_count"]==1
          assert p["provider_refund_count"]==1
          print("FINANCIAL_EXACT_SHA_CERTIFICATION=PASS")
          print("FALSE_GREEN=0")
          PY

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercadopago-financial-e2e-${{ env.EXPECTED_SHA }}
          path: evidence/financial-e2e-mercadopago.json
          if-no-files-found: error
          retention-days: 90
