name: ZEVANORY financial E2E closure

on:
  workflow_run:
    workflows: ["ZEVANORY central production deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed SHA to certify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: financial-e2e-closure
  cancel-in-progress: false

jobs:
  financial-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'gh-pages')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY || secrets.ASAAS_SANDBOX_API_KEY }}
      ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
      ASAAS_WEBHOOK_EMAIL: ${{ secrets.ASAAS_WEBHOOK_EMAIL || vars.ASAAS_WEBHOOK_EMAIL }}
      OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
      CERTIFICATION_E2E_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'e3caca88f4343c3cdfcf66eebe6ac124' }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.expected_sha || github.sha }}
    steps:
      - name: Checkout exact canonical SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Validate external credential presence and SHA shape
        shell: bash
        run: |
          set -euo pipefail
          test "${#EXPECTED_SHA}" -eq 40
          test -n "${ASAAS_API_KEY:-}" || { echo "MISSING_REQUIRED_SECRET=ASAAS_API_KEY"; exit 2; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "MISSING_REQUIRED_SECRET=CLOUDFLARE_API_TOKEN"; exit 2; }
          echo "FINANCIAL_EXTERNAL_SECRET_READINESS=PASS"
          echo "EXPECTED_SHA=$EXPECTED_SHA"

      - name: Generate internal certification credentials
        shell: bash
        run: |
          set -euo pipefail
          gen_secret(){ openssl rand -hex 32; }
          if [ -z "${ASAAS_WEBHOOK_TOKEN:-}" ]; then echo "ASAAS_WEBHOOK_TOKEN=$(gen_secret)" >> "$GITHUB_ENV"; fi
          if [ -z "${OPERATOR_TOKEN:-}" ]; then echo "OPERATOR_TOKEN=$(gen_secret)" >> "$GITHUB_ENV"; fi
          if [ -z "${CERTIFICATION_E2E_TOKEN:-}" ]; then echo "CERTIFICATION_E2E_TOKEN=$(gen_secret)" >> "$GITHUB_ENV"; fi
          echo "FINANCIAL_INTERNAL_SECRET_GENERATION=PASS"

      - name: Synchronize certification credentials to Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          for k in ASAAS_WEBHOOK_TOKEN OPERATOR_TOKEN CERTIFICATION_E2E_TOKEN; do
            test -n "${!k:-}" || { echo "INTERNAL_SECRET_GENERATION_FAILED=$k"; exit 2; }
            printf '%s' "${!k}" | npx --yes wrangler@4.135.0 secret put "$k" --name zevanory
          done
          echo "FINANCIAL_INTERNAL_SECRET_SYNC=PASS"

      - name: Validate complete financial preflight
        shell: bash
        run: |
          set -euo pipefail
          for k in ASAAS_API_KEY ASAAS_WEBHOOK_TOKEN OPERATOR_TOKEN CERTIFICATION_E2E_TOKEN; do
            test -n "${!k:-}" || { echo "MISSING_REQUIRED_SECRET=$k"; exit 2; }
          done
          test "${#ASAAS_WEBHOOK_TOKEN}" -ge 32
          echo "ASAAS_API_KEY_PRESENT=true"
          echo "ASAAS_WEBHOOK_TOKEN_PRESENT=true"
          if [ -n "${ASAAS_WEBHOOK_EMAIL:-}" ]; then echo "ASAAS_WEBHOOK_EMAIL_PRESENT=true"; else echo "ASAAS_WEBHOOK_EMAIL_PRESENT=false_optional_if_webhook_exists"; fi
          echo "OPERATOR_TOKEN_PRESENT=true"
          echo "CERTIFICATION_E2E_TOKEN_PRESENT=true"
          echo "FINANCIAL_PREFLIGHT=PASS"

      - name: Run real provider financial lifecycle
        run: python3 scripts/financial_e2e_closure.py

      - name: Verify evidence is GREEN and exact-SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          p=json.load(open("evidence/financial-e2e-current.json",encoding="utf-8"))
          sha=os.environ["EXPECTED_SHA"].lower()
          assert re.fullmatch(r"[0-9a-f]{40}",sha)
          assert set(p["sha"].values())=={sha},p["sha"]
          assert p["checks"]["FINANCIAL_E2E"]=="GREEN"
          assert all(v in ("PASS","GREEN") for v in p["checks"].values()),p["checks"]
          assert p["final_order_status"]=="refunded"
          assert p["final_fulfillment_status"]=="canceled"
          assert p["payment_confirmation_count"]==1
          assert p["invariants"]["provider_final_status"]=="REFUNDED"
          print("FINANCIAL_EXACT_SHA_CERTIFICATION=PASS")
          PY

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-e2e-${{ env.EXPECTED_SHA }}
          path: evidence/financial-e2e-current.json
          if-no-files-found: error
          retention-days: 90
