name: ZEVANORY No Scroll Responsive Gate
# E1 (2026-10-24): the gate keeps its name (status history) but its contract is inverted on purpose.
# The old "no global page scroll" app shell (body overflow:hidden, <main> as the inner scroller) broke
# native scroll, anchors, scroll restoration, the mobile address-bar collapse, print and find-in-page.
# Contract now: NO HORIZONTAL scroll at any width, the document (html) is the only vertical scroller,
# <main> is not an inner scroll container, and the bottom of every page is reachable by window scroll.

on:
  pull_request:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.62.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 --directory .. > /tmp/zevanory-static.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/zevanory-public-mirror/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/zevanory-static.log
          exit 1
      - name: Measure global overflow
        shell: bash
        run: |
          cat > audit.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          // /arbm-sist/ left this gate with E1: retired product (410 on the sales domain) with its own stylesheet
          // and its own gate (arbm-sist-ped-supreme.yml); every remaining route uses the shared product.css.
          const routes=['/','/ia-na-pratica/','/vendas-na-pratica/','/combo-ia-vendas/','/lucro-e-caixa/','/negocio-completo/','/zevanory-one/','/zevanory-cfo/'];
          const views=[
            {name:'desktop',width:1440,height:900},
            {name:'laptop',width:1366,height:768},
            {name:'tablet',width:768,height:1024},
            {name:'mobile',width:390,height:844},
            {name:'reflow320',width:320,height:640}
          ];
          const browser=await chromium.launch({headless:true});
          const rows=[];
          for(const v of views){
            for(const route of routes){
              const page=await browser.newPage({viewport:{width:v.width,height:v.height}});
              const response=await page.goto('http://127.0.0.1:4173/zevanory-public-mirror'+route,{waitUntil:'load'});
              const m=await page.evaluate(()=>{
                const root=document.documentElement;
                const main=document.querySelector('main');
                const mainStyle=main?getComputedStyle(main):null;
                window.scrollTo({top:root.scrollHeight,behavior:'instant'});
                const bottomReachable=window.scrollY+window.innerHeight>=root.scrollHeight-2;
                const mainInnerScroller=!!main && /(auto|scroll|hidden)/.test(mainStyle.overflowY) && main.scrollHeight>main.clientHeight+1;
                return {
                  sh:root.scrollHeight,
                  sw:root.scrollWidth,
                  ih:window.innerHeight,
                  iw:window.innerWidth,
                  htmlOverflowY:getComputedStyle(root).overflowY,
                  bodyOverflowY:getComputedStyle(document.body).overflowY,
                  mainOverflowY:mainStyle?.overflowY||null,
                  mainScrollHeight:main?.scrollHeight||0,
                  mainClientHeight:main?.clientHeight||0,
                  mainInnerScroller,
                  bottomReachable
                };
              });
              rows.push({view:v.name,route,http:response?.status()||0,...m,
                documentScroll:m.htmlOverflowY!=='hidden'&&m.bodyOverflowY!=='hidden'&&!m.mainInnerScroller,
                horizontalOverflow:m.sw>m.iw+1});
              await page.close();
            }
          }
          await browser.close();
          const result={schema:'zevanory.document-scroll-responsive.v3',rows,pass:rows.every(r=>r.documentScroll&&r.bottomReachable&&!r.horizontalOverflow&&r.http===200)};
          fs.writeFileSync('no-scroll-baseline.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          if(result.pass) console.log('LAYOUT_DOCUMENT_SCROLL=PASS');
          else { console.log('LAYOUT_DOCUMENT_SCROLL=FAIL'); process.exitCode=1; }
          NODE
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zevanory-no-scroll-baseline
          path: no-scroll-baseline.json
          retention-days: 30
