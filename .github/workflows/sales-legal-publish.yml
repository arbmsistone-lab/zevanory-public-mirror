name: ZEVANORY sales legal publish

on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "sales-public/**"
      - "wrangler.sales.toml"
      - "sales-worker.mjs"
      - ".github/workflows/sales-legal-publish.yml"
  push:
    branches: [gh-pages]
    paths:
      - "sales-public/**"
      - "wrangler.sales.toml"
      - "sales-worker.mjs"
      - ".github/workflows/sales-legal-publish.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved seller text and fail-closed state
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'A ZEVANORY é a marca comercial de A. RENAN ALVES MOREIRA BITU LTDA, inscrita no CNPJ sob o nº 69.077.233/0001-99, com sede na Rua Francisco de Freitas Neto, 96, Casa Residencial, Alto do Tenente, Várzea Alegre/CE, CEP 63540-000. Atendimento e suporte: suporte@zevanory.api.br e WhatsApp +55 88 99254-5413.' sales-public/termos.html
          # Opening sales is an owner switch with production preflight (worker/sales-control.mjs);
          # the static pages never carry the switch.
          ! grep -R -E 'SALE_GLOBALLY_ENABLED["=: ]+true' sales-public sales-worker.mjs
          echo "LEGAL_TEXT_EXACT=PASS"
          echo "GLOBAL_SALES_FAIL_CLOSED=PASS"

# T1 (plan 3.1): this workflow only validates. The sales Worker is published exclusively by
# zevanory-sales-public-release.yml, which builds sales-public/ from source and runs the
# pre-promotion guard. Two publishers deploying different artifacts made vendas flip-flop.
