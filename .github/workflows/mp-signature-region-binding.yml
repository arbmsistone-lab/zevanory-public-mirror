name: mp-signature-region-binding

# Roteiro seção 7 ("Amarração ao código publicado"): a região de assinatura Mercado Pago testada é a publicada no
# build-info. Só pull_request: nunca dispara no merge, sem segredos, token só de leitura, sem rede além do checkout.
# 1) testes com contagem exata; 2) guarda sobre a base estática REAL pinada (83620c68), os dois modos do prepare;
# 3) mutantes causais pelo classificador compartilhado (todos precisam morrer).
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - ".github/workflows/mp-signature-region-binding.yml"
      - ".github/workflows/central-candidate-dryrun.yml"
      - ".github/workflows/central-production-deploy.yml"
      - ".github/workflows/certification-isolated-deploy.yml"
      - "worker/cloudflare-worker.recovered.mjs"
      - "worker/binding-aliases.mjs"
      - "certification-worker.mjs"
      - "scripts/deploy/build_provenance.py"
      - "scripts/deploy/mp-signature-region.json"
      - "scripts/deploy/write-build-info.py"
      - "scripts/deploy/prepare-central-candidate.py"
      - "scripts/deploy/prepare-certification-config.py"
      - "scripts/deploy/verify-signature-region-binding.py"
      - "scripts/deploy/verify-live-build-info.py"
      - "scripts/ci/cloudflare-build.sh"
      - "scripts/ci/mutant_classifier.py"
      - "scripts/ci/mutants_mp_signature_binding.py"
      - "scripts/ci/mutants_mp_signature_binding.json"
      - "tests/mp-signature-binding.test.mjs"
      - "tests/mercadopago-webhook-signature.test.mjs"
      - "tests/helpers/mp-signature-region.mjs"
      - "tests/helpers/text.mjs"
      - "tests/helpers/toolchain.mjs"

permissions:
  contents: read

concurrency:
  group: mp-signature-region-binding-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  binding:
    name: mp-signature-region-binding / tests, guard, mutants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (exact count 22, no skips)
        run: |
          set -euo pipefail
          node --test tests/mp-signature-binding.test.mjs tests/mercadopago-webhook-signature.test.mjs | tee /tmp/sig.txt
          for k in "tests 22" "pass 22" "fail 0" "skipped 0" "todo 0" "cancelled 0"; do grep -qx "# $k" /tmp/sig.txt || { echo "::error::expected '# $k'"; exit 1; }; done
      - name: Guard on the real pinned base (deploy patches leave the signature region byte-identical)
        run: |
          set -euo pipefail
          git fetch -q origin final-83620c6 || true
          python3 scripts/deploy/verify-signature-region-binding.py --base 83620c680958d726fc4b0fd16e2574cdcc362a6d | tee /tmp/binding.json
          python3 scripts/deploy/build_provenance.py region | tee /tmp/region.json
          echo "::notice title=MP_SIGNATURE_REGION_BINDING::$(python3 -c 'import json;j=json.load(open("/tmp/binding.json"));print(j["MP_SIGNATURE_REGION_BINDING"],j["tested_region"],[(m["mode"],m["region_after_patch"]==j["tested_region"],m["worker_patched"],m["free_identifiers_changed"]) for m in j["modes"]])')"
      - name: Causal mutants (shared classifier; all must be KILLED)
        run: |
          set -euo pipefail
          python3 scripts/ci/mutants_mp_signature_binding.py < /dev/null | tee /tmp/mut.txt
          echo "::notice title=MP_SIGNATURE_BINDING_MUTANTS::$(grep -E '^MUTANTS ' /tmp/mut.txt)"
          grep -qx "MUTANTS total=31 killed=31 survived=0 inconclusive=0" /tmp/mut.txt || { echo "::error::mutant survived/inconclusive or count changed"; exit 1; }
      - name: No tracked or generated bytecode
        run: |
          set -euo pipefail
          test -z "$(git ls-files '*.pyc' '*__pycache__*')"
          test -z "$(find scripts tests -name '*.pyc' -o -name __pycache__ | head -1)"
