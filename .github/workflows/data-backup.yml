name: Data backup and restore drill (daily)

# KV -> Neon and Neon -> KV cross-provider copies with a real restore drill (isolated schema and
# sampled KV keys), executed inside the production Worker. Zero cost. Nothing is stored in GitHub;
# the endpoint and the logs carry only counts and hashes.
on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-backup
  cancel-in-progress: false

jobs:
  backup:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZEVANORY_OPERATOR_TOKEN: ${{ secrets.ZEVANORY_OPERATOR_TOKEN || secrets.CERTIFICATION_E2E_TOKEN }}  # R9: nome novo; queda para o antigo só na transição
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: "22"
      - run: node --test tests/data-backup.test.mjs
      - run: node scripts/ops/data-backup.mjs
