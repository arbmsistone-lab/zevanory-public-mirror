name: Data backup and restore drill (daily)

# KV -> Neon and Neon -> KV cross-provider copies with a real restore drill (isolated schema and
# sampled KV keys), executed inside the production Worker. Zero cost. Nothing is stored in GitHub;
# the endpoint and the logs carry only counts and hashes.
on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CERTIFICATION_E2E_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/data-backup.test.mjs
      - run: node scripts/ops/data-backup.mjs
