name: circuits-contract

# B04 "Circuitos A/B": testes adversariais (fail-open/fail-close) da lógica local de circuito e seleção de rota
# (chave de vendas, portão de checkout, roteador de continuidade, disjuntor de voz, prontidão).
# Só pull_request: nunca dispara no merge, nunca usa segredo, sem rede além do checkout.
# B04 só fecha com B03 (segundo provedor independente); estes testes não medem transferência real entre provedores.
on:
  pull_request:
    paths:
      - ".github/workflows/circuits-contract.yml"
      - "tests/circuits-adversarial.test.mjs"
      - "scripts/ci/mutants_circuits.py"
      - "worker/sales-control.mjs"
      - "worker/commercial-checkout-guard.mjs"
      - "worker/continuity-router.mjs"
      - "worker/voice-provider-router.mjs"
      - "worker/production-health-safety.mjs"
      - "worker/commercial-metrics-projection.mjs"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Circuitos A/B — contrato adversarial (offline)
        shell: bash
        run: |
          set -euo pipefail
          command -v node >/dev/null || { echo "::error::node ausente"; exit 1; }
          node --version
          node --test tests/circuits-adversarial.test.mjs 2>&1 | tee /tmp/circuits.txt
          # Contagem exata: teste removido, pulado ou pendente não pode passar despercebido.
          grep -qx "# tests 31" /tmp/circuits.txt || { echo "::error::contagem de testes diferente de 31"; exit 1; }
          grep -qx "# pass 31" /tmp/circuits.txt || { echo "::error::nem todos os 31 testes passaram"; exit 1; }
          grep -qx "# fail 0" /tmp/circuits.txt || { echo "::error::há testes falhando"; exit 1; }
          grep -qx "# skipped 0" /tmp/circuits.txt || { echo "::error::testes pulados"; exit 1; }
          grep -qx "# todo 0" /tmp/circuits.txt || { echo "::error::testes pendentes (todo)"; exit 1; }
          echo "::notice title=CIRCUITS_TESTS::$(grep -E '^# (tests|pass|fail|skipped|todo) ' /tmp/circuits.txt | paste -sd' ' -)"

  # Os 20 mutantes da PR rodam no runner (independente de quem escreveu a PR); cada linha MUTANT fica no log.
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Circuitos A/B — 20 mutantes (cada um precisa ser morto)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          node --version
          rc=0
          python3 scripts/ci/mutants_circuits.py < /dev/null | tee /tmp/mutants.txt || rc=$?
          # Resumo como anotação (legível pela API de check-runs sem baixar o log).
          echo "::notice title=MUTANTS_CIRCUITS::$(grep '^MUTANT' /tmp/mutants.txt | sed 's/ — .*//' | paste -sd'|' - | sed 's/|/%0A/g')%0Arc=$rc"
          [ "$rc" = 0 ] || { echo "::error::script de mutantes saiu com $rc"; exit 1; }
          n="$(grep -c '^MUTANT M[0-9][0-9] KILLED' /tmp/mutants.txt || true)"
          [ "$n" = "20" ] || { echo "::error::esperados 20 mutantes mortos, obtidos $n"; exit 1; }
          if grep -q '^MUTANT M[0-9][0-9] SURVIVED' /tmp/mutants.txt; then echo "::error::mutante sobrevivente"; exit 1; fi
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then echo "::error::arquivo versionado modificado pelos mutantes"; exit 1; fi
