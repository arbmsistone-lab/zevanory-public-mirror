name: Architecture Observability Failover Proof

on:
  push:
    branches:
      - architecture/observability-failover-proof-20260929

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIMARY_SIMULATED_UNAVAILABLE: "true"
      SECONDARY_URL: "https://zevanory-product-control-edge-ha.onrender.com"
      EXPECTED_SOURCE_SHA: "a628145bb088ad4bf07841d4f9f4b1e90e20266e"
    steps:
      - name: Prove primary is excluded from test path
        shell: bash
        run: |
          set -euo pipefail
          test "$PRIMARY_SIMULATED_UNAVAILABLE" = "true"
          echo "PRIMARY_UNAVAILABLE_SIMULATION=PASS"

      - name: Secondary health and failover readback
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            -w '%{http_code} %{time_total}\n' -o secondary-health.json "$SECONDARY_URL/portable-health" \
            | tee secondary-metrics.txt
          cat secondary-health.json
          jq -e '.ok == true' secondary-health.json
          jq -e '.instance == "render-ha"' secondary-health.json
          jq -e '.mode == "portable-dual-store-v1"' secondary-health.json
          jq -e '.primary.ok == false and .secondary.ok == true' secondary-health.json
          cp secondary-health.json secondary-readback.json
          echo "SECONDARY_HEALTH=PASS"
          echo "SECONDARY_READBACK=PASS"

      - name: Emit failover observability signal
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg primary "simulated-unavailable" \
            --arg secondary "$SECONDARY_URL" \
            --arg source_sha "$EXPECTED_SOURCE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{schema:"zevanory.architecture.observability-failover.v1",primary:$primary,secondary:$secondary,source_sha:$source_sha,run_id:$run_id,health:"pass",readback:"pass",alert:"visible-in-github-actions-log"}' \
            | tee observability-failover-evidence.json
          echo "::warning title=Controlled primary failure simulation::Primary marked unavailable; secondary health/readback remained PASS"
          test -s secondary-metrics.txt
          echo "METRICS_VISIBLE=PASS"
          echo "LOGS_VISIBLE=PASS"
          echo "ALERT_VISIBLE=PASS"
          echo "OBSERVABILITY_SIGNAL=PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: architecture-observability-failover-evidence
          path: |
            secondary-health.json
            secondary-readback.json
            secondary-metrics.txt
            observability-failover-evidence.json
          retention-days: 30
