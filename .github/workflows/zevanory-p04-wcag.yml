name: zevanory-p04-wcag
on:
  pull_request:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wcag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve certified live release
        shell: bash
        run: |
          set -euo pipefail
          # Live release must be a real commit on the canonical gh-pages branch.
          # Pure git + public endpoint: no GitHub API quota involved.
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 https://zevanory.api.br/api/release -o /tmp/certified-release.json
          sha="$(jq -r '.deployment.commit_sha // empty' /tmp/certified-release.json)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "::error title=CERTIFIED_LIVE_SHA::live release has no exact commit sha"; exit 1; fi
          rm -rf /tmp/canonical-gh-pages
          git clone --quiet --filter=blob:none --no-checkout --depth 400 --branch gh-pages "https://github.com/${{ github.repository }}.git" /tmp/canonical-gh-pages
          if ! git -C /tmp/canonical-gh-pages merge-base --is-ancestor "$sha" HEAD; then echo "::error title=CERTIFIED_LIVE_SHA::live $sha is not a commit of canonical gh-pages"; exit 1; fi
          echo "EXPECTED_SHA=$sha" >> "$GITHUB_ENV"
          echo "CERTIFIED_LIVE_SHA=$sha"
      - name: Bind audit to exact live release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 https://zevanory.api.br/api/release -o /tmp/release.json
          ACTUAL_SHA="$(jq -r '.deployment.commit_sha // empty' /tmp/release.json)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_RELEASE_BINDING=PASS sha=$ACTUAL_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Pa11y
        run: npm install --no-save pa11y@9.0.1
      - name: WCAG AA automated gate
        run: |
          cat > wcag.mjs <<'JS'
          import pa11y from 'pa11y'; import fs from 'fs';
          const urls=['https://zevanory.api.br/solucoes']; const evidence=[]; let failed=false;
          for(const url of urls){const result=await pa11y(url,{standard:'WCAG2AA',timeout:30000,wait:1000,chromeLaunchConfig:{args:['--no-sandbox','--disable-setuid-sandbox']},includeWarnings:false,includeNotices:false});const errors=result.issues.filter(x=>x.type==='error');evidence.push({url,documentTitle:result.documentTitle,errorCount:errors.length,errors});if(errors.length)failed=true;}
          fs.writeFileSync('p04-wcag-evidence.json',JSON.stringify({schema:'zevanory.p04.wcag.v1',standard:'WCAG2AA',evidence},null,2)); console.log(JSON.stringify(evidence)); if(failed)process.exit(1);
          JS
          node wcag.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p04-wcag-evidence-37e695127af0
          path: p04-wcag-evidence.json
          retention-days: 90
