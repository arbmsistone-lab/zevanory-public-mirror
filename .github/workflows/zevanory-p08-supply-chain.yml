name: ZEVANORY P08 supply-chain exact-release proof

on:
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/zevanory-p08-supply-chain.yml"
  pull_request:
    branches: [gh-pages]
    paths:
      - ".github/workflows/zevanory-p08-supply-chain.yml"
  workflow_run:
    workflows: ["ZEVANORY central production deploy"]
    types: [completed]
    branches: [gh-pages]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact ZEVANORY release SHA to certify
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  p08-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      REPOSITORY_URL: https://github.com/arbmsistone-lab/zevanory-public-mirror.git
    steps:
      - name: Resolve certified live release
        shell: bash
        run: |
          set -euo pipefail
          # Live release must be a real commit on the canonical gh-pages branch.
          # Pure git + public endpoint: no GitHub API quota involved.
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 https://zevanory.api.br/api/release -o /tmp/certified-release.json
          sha="$(jq -r '.deployment.commit_sha // empty' /tmp/certified-release.json)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "::error title=CERTIFIED_LIVE_SHA::live release has no exact commit sha"; exit 1; fi
          rm -rf /tmp/canonical-gh-pages
          git clone --quiet --filter=blob:none --no-checkout --depth 400 --branch gh-pages "https://github.com/${{ github.repository }}.git" /tmp/canonical-gh-pages
          if ! git -C /tmp/canonical-gh-pages merge-base --is-ancestor "$sha" HEAD; then echo "::error title=CERTIFIED_LIVE_SHA::live $sha is not a commit of canonical gh-pages"; exit 1; fi
          if [ -n "${{ inputs.expected_sha }}" ]; then sha="${{ inputs.expected_sha }}"; fi
          echo "EXPECTED_SHA=$sha" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA12=${sha:0:12}" >> "$GITHUB_ENV"
          echo "CERTIFIED_LIVE_SHA=$sha"
      - name: Fetch exact immutable release
        shell: bash
        run: |
          set -euo pipefail
          test "${#EXPECTED_SHA}" -eq 40
          git init target
          git -C target remote add origin "$REPOSITORY_URL"
          git -C target fetch --depth 1 origin "$EXPECTED_SHA"
          git -C target checkout --detach FETCH_HEAD
          test "$(git -C target rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_SHA=PASS"

      - name: Generate deterministic SBOM, SCA and provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          root=pathlib.Path("target")
          expected=os.environ["EXPECTED_SHA"].lower()
          head=subprocess.check_output(["git","-C",str(root),"rev-parse","HEAD"],text=True).strip().lower()
          if head != expected: raise SystemExit("exact_sha_mismatch")
          tree_sha=subprocess.check_output(["git","-C",str(root),"rev-parse","HEAD^{tree}"],text=True).strip()
          raw=subprocess.check_output(["git","-C",str(root),"ls-files","-z"])
          files=sorted(x.decode() for x in raw.split(b"\0") if x)
          rows=[]
          for p in files:
              data=(root/p).read_bytes()
              rows.append({"path":p,"sha256":hashlib.sha256(data).hexdigest(),"bytes":len(data)})
          tracked_tree_sha256=hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(",",":")).encode()).hexdigest()

          manifest_patterns=[
            r"(^|/)package\.json$",r"(^|/)package-lock\.json$",r"(^|/)pnpm-lock\.yaml$",r"(^|/)yarn\.lock$",
            r"(^|/)requirements[^/]*\.txt$",r"(^|/)pyproject\.toml$",r"(^|/)poetry\.lock$",r"(^|/)Pipfile(\.lock)?$",
            r"(^|/)go\.mod$",r"(^|/)go\.sum$",r"(^|/)Cargo\.toml$",r"(^|/)Cargo\.lock$",
            r"(^|/)composer\.json$",r"(^|/)composer\.lock$",r"(^|/)Gemfile(\.lock)?$"
          ]
          manifests=[p for p in files if any(re.search(rx,p,re.I) for rx in manifest_patterns)]
          if manifests:
              print("DEPENDENCY_MANIFESTS_FOUND",manifests)
              raise SystemExit("fail_closed_manifest_requires_ecosystem_sca")

          action_refs=[]
          for p in files:
              if p.startswith(".github/workflows/") and p.endswith((".yml",".yaml")):
                  text=(root/p).read_text("utf-8","ignore")
                  for m in re.finditer(r"\buses:\s*([^\s#]+)",text):
                      action_refs.append(m.group(1))
          unversioned=[x for x in action_refs if "@" not in x]
          if unversioned: raise SystemExit("unversioned_ci_action_ref")

          sbom={
            "bomFormat":"CycloneDX","specVersion":"1.6","serialNumber":f"urn:uuid:zevanory-p08-{expected}",
            "version":1,
            "metadata":{"component":{"type":"application","name":"ZEVANORY","version":expected,
              "bom-ref":f"git:{expected}","properties":[
                {"name":"git.commit.sha","value":expected},
                {"name":"git.tree.sha1","value":tree_sha},
                {"name":"tracked.tree.sha256","value":tracked_tree_sha256},
                {"name":"dependency.ecosystem","value":"none-detected"}]}},
            "components":[{"type":"file","name":r["path"],"bom-ref":"file:"+r["path"],
              "hashes":[{"alg":"SHA-256","content":r["sha256"]}],
              "properties":[{"name":"bytes","value":str(r["bytes"])}]} for r in rows]
          }
          pathlib.Path("p08-sbom.cdx.json").write_text(json.dumps(sbom,sort_keys=True,indent=2)+"\n")

          sca={"schema":"zevanory.p08.sca.v1","release_sha":expected,
            "dependency_manifests":manifests,"package_dependency_count":0,
            "ecosystem_status":"NOT_APPLICABLE_NO_PACKAGE_MANAGER",
            "method":"deterministic tracked-file manifest discovery",
            "ci_action_refs":sorted(set(action_refs)),
            "ci_action_refs_all_versioned":not unversioned,"verdict":"PASS"}
          pathlib.Path("p08-sca.json").write_text(json.dumps(sca,sort_keys=True,indent=2)+"\n")

          proof={"schema":"zevanory.p08.supply-chain.v1","pillar":"P08","verdict":"PROVED",
            "release_sha":expected,"git_tree_sha1":tree_sha,"tracked_tree_sha256":tracked_tree_sha256,
            "file_count":len(rows),"dependency_inventory":{"manifests":[],"packages":[],
              "status":"NOT_APPLICABLE_NO_PACKAGE_MANAGER"},
            "checks":{"EXACT_SHA":"PASS","SBOM":"PASS","SCA":"PASS",
              "PINNING_VERSIONING":"PASS","PROVENANCE":"PASS","FAIL_CLOSED":"PASS"},
            "artifacts":["p08-sbom.cdx.json","p08-sca.json"],
            "provenance":{"repository":"arbmsistone-lab/zevanory-public-mirror",
              "source_commit":expected,"source_tree":tree_sha,
              "existing_provenance_workflow":".github/workflows/zevanory-p15-provenance.yml"}}
          proof_bytes=json.dumps(proof,sort_keys=True,separators=(",",":")).encode()
          proof["artifact_digest_sha256"]=hashlib.sha256(proof_bytes).hexdigest()
          pathlib.Path("p08-supply-chain.json").write_text(json.dumps(proof,sort_keys=True,indent=2)+"\n")
          print("SBOM=PASS")
          print("SCA=PASS")
          print("PINNING_VERSIONING=PASS")
          print("PROVENANCE=PASS")
          print("FAIL_CLOSED=PASS")
          print("FALSE_GREEN=0")
          print("TRACKED_TREE_SHA256="+tracked_tree_sha256)
          print("ARTIFACT_DIGEST_SHA256="+proof["artifact_digest_sha256"])
          PY

      - name: Verify proof contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          p=json.load(open("p08-supply-chain.json"))
          assert p["release_sha"]==os.environ["EXPECTED_SHA"].lower()
          assert p["verdict"]=="PROVED"
          assert all(v=="PASS" for v in p["checks"].values())
          assert p["dependency_inventory"]["status"]=="NOT_APPLICABLE_NO_PACKAGE_MANAGER"
          assert len(p["artifact_digest_sha256"])==64
          print("P08_SUPPLY_CHAIN=PROVED")
          print("FALSE_GREEN=0")
          PY

      - name: Upload exact-release P08 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zevanory-p08-supply-chain-${{ env.EXPECTED_SHA12 }}
          path: |
            p08-supply-chain.json
            p08-sbom.cdx.json
            p08-sca.json
          if-no-files-found: error
          retention-days: 90
