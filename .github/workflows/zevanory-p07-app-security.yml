name: zevanory-p07-app-security
on:
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/zevanory-p07-app-security.yml"
  pull_request:
    branches: [gh-pages]
    paths:
      - ".github/workflows/zevanory-p07-app-security.yml"
  workflow_run:
    workflows: ["ZEVANORY central production deploy"]
    types: [completed]
    branches: [gh-pages]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed ZEVANORY SHA
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04  # fixado 22/11/2026: ubuntu-latest = 26.04 quebra Playwright/Chromium e semgrep (py3.14)
    timeout-minutes: 15
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Resolve certified live release
        shell: bash
        run: |
          set -euo pipefail
          # Live release must be a real commit on the canonical gh-pages branch.
          # Pure git + public endpoint: no GitHub API quota involved.
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 https://zevanory.api.br/api/release -o /tmp/certified-release.json
          sha="$(jq -r '.deployment.commit_sha // empty' /tmp/certified-release.json)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "::error title=CERTIFIED_LIVE_SHA::live release has no exact commit sha"; exit 1; fi
          rm -rf /tmp/canonical-gh-pages
          git clone --quiet --filter=blob:none --no-checkout --depth 400 --branch gh-pages "https://github.com/${{ github.repository }}.git" /tmp/canonical-gh-pages
          if ! git -C /tmp/canonical-gh-pages merge-base --is-ancestor "$sha" HEAD; then echo "::error title=CERTIFIED_LIVE_SHA::live $sha is not a commit of canonical gh-pages"; exit 1; fi
          if [ -n "${{ inputs.expected_sha }}" ]; then sha="${{ inputs.expected_sha }}"; fi
          echo "EXPECTED_SHA=$sha" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA12=${sha:0:12}" >> "$GITHUB_ENV"
          echo "CERTIFIED_LIVE_SHA=$sha"
      - name: Fetch exact immutable release
        shell: bash
        run: |
          set -euo pipefail
          test "${#EXPECTED_SHA}" -eq 40
          git init target
          git -C target remote add origin https://github.com/arbmsistone-lab/zevanory-public-mirror.git
          git -C target fetch --depth 1 origin "$EXPECTED_SHA"
          git -C target checkout --detach FETCH_HEAD
          test "$(git -C target rev-parse HEAD)" = "$EXPECTED_SHA"
          echo EXACT_SHA=PASS

      - name: SAST with Semgrep
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet "semgrep==1.136.0"
          test -d target/worker
          test -d target/scripts
          test -d target/solucoes
          semgrep scan --config p/javascript --config p/secrets --json --output semgrep.json \
            target/worker target/scripts target/solucoes target/index.html
          python3 - <<'PY'
          import json
          p=json.load(open("semgrep.json"))
          rows=p.get("results",[])
          errors=[e for e in p.get("errors",[]) if str(e.get("level","")).lower() in ("error","fatal")]
          print("SAST_FINDINGS",len(rows))
          print("SAST_FATAL_ERRORS",len(errors))
          for r in rows[:20]:
              print(r.get("check_id"),r.get("path"),r.get("start",{}).get("line"))
          assert not errors,errors[:5]
          assert len(rows)==0,rows[:5]
          print("SAST=PASS")
          PY

      - name: SCA Python das dependências de CI declaradas (allowlist exata)
        # 22/11/2026: tests/ci/requirements-guard.txt (PyYAML, só CI, #1077) é o único manifesto Python aceito, e só
        # com auditoria de vulnerabilidades no próprio job (PyPI e OSV). Qualquer vulnerabilidade, versão sem "==" ou
        # outro manifesto continua reprovando no passo seguinte.
        shell: bash
        run: |
          set -euo pipefail
          f=target/tests/ci/requirements-guard.txt
          if [ -f "$f" ]; then
            if grep -vE '^\s*(#|$)' "$f" | grep -vqE '^[A-Za-z0-9_.-]+==[0-9][A-Za-z0-9_.!+-]*$'; then
              echo "::error title=P07_SCA_PY::dependência sem pin exato em $f"; exit 1
            fi
            python3 -m pip install --disable-pip-version-check --quiet "pip-audit==2.10.1"
            python3 -m pip_audit -r "$f" --vulnerability-service pypi --format json --progress-spinner off -o p07-pip-audit-pypi.json
            python3 -m pip_audit -r "$f" --vulnerability-service osv  --format json --progress-spinner off -o p07-pip-audit-osv.json
            python3 - "$f" <<'PY'
          # Cobertura exata (22/11/2026): cada dependência DECLARADA tem de aparecer como auditada nas DUAS bases, com o
          # mesmo nome (PEP 503) e a mesma versão, sem skip_reason. Ausente, ignorada ou divergente reprova; vuln reprova.
          import json,re,sys
          norm=lambda n: re.sub(r"[-_.]+","-",n).lower()
          declared={}
          for line in open(sys.argv[1],encoding="utf-8"):
              line=line.split("#",1)[0].strip()
              if not line: continue
              m=re.fullmatch(r"([A-Za-z0-9_.-]+)==([0-9][A-Za-z0-9_.!+-]*)",line)
              if not m: raise SystemExit("P07_SCA_PY: linha fora do formato nome==versão: "+line)
              k=norm(m.group(1))
              if k in declared: raise SystemExit("P07_SCA_PY: dependência declarada duas vezes: "+k)
              declared[k]=m.group(2)
          if not declared: raise SystemExit("P07_SCA_PY: manifesto sem dependências declaradas")
          coverage={}
          for s in ("pypi","osv"):
              d=json.load(open(f"p07-pip-audit-{s}.json"))
              deps=d.get("dependencies")
              if not isinstance(deps,list): raise SystemExit(f"P07_SCA_PY_{s.upper()}: relatório sem dependencies")
              audited={}; skipped={}
              for x in deps:
                  k=norm(str(x.get("name","")))
                  if x.get("skip_reason") or "vulns" not in x or "version" not in x: skipped[k]=x.get("skip_reason") or "sem versão/vulns"
                  else: audited.setdefault(k,set()).add(x["version"])
              problems=[]
              for k,ver in sorted(declared.items()):
                  if k in skipped: problems.append(f"{k}=={ver}: ignorada ({skipped[k]})")
                  elif k not in audited: problems.append(f"{k}=={ver}: ausente")
                  elif audited[k]!={ver}: problems.append(f"{k}=={ver}: divergente {sorted(audited[k])}")
              vulns=[(x["name"],x["version"],[y["id"] for y in x.get("vulns",[])]) for x in deps if x.get("vulns")]
              print(f"P07_SCA_PY_{s.upper()}", json.dumps([(x.get("name"),x.get("version")) for x in deps]), "VULNS", vulns, "PROBLEMAS", problems)
              if problems: raise SystemExit(f"P07_SCA_PY_{s.upper()}: cobertura incompleta: "+"; ".join(problems))
              if vulns: raise SystemExit(f"P07_SCA_PY_{s.upper()}: vulnerabilidades: {vulns}")
              coverage[s]={k:sorted(audited[k])[0] for k in declared}
          json.dump({"declared":declared,"audited":coverage,"verdict":"PASS"},open("p07-sca-py-coverage.json","w"),indent=2,sort_keys=True)
          print("P07_SCA_PY_COVERAGE", json.dumps(declared, sort_keys=True), "PYPI+OSV=EXATA")
          print("P07_SCA_PY=PASS")
          PY
            echo "ok" > p07-sca-py.ok
          fi

      - name: SCA applicability and pinning
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,json,os,subprocess
          root=pathlib.Path("target")
          files=subprocess.check_output(["git","-C",str(root),"ls-files"],text=True).splitlines()
          patterns=[
            r"(^|/)package\.json$",r"(^|/)package-lock\.json$",r"(^|/)pnpm-lock\.yaml$",r"(^|/)yarn\.lock$",
            r"(^|/)requirements[^/]*\.txt$",r"(^|/)pyproject\.toml$",r"(^|/)poetry\.lock$",r"(^|/)Pipfile(\.lock)?$",
            r"(^|/)go\.mod$",r"(^|/)Cargo\.lock$",r"(^|/)composer\.lock$",r"(^|/)Gemfile\.lock$"
          ]
          manifests=[p for p in files if any(re.search(rx,p,re.I) for rx in patterns)]
          # Única exceção: o manifesto Python de CI auditado no passo anterior (marcador p07-sca-py.ok).
          py_ci_ok=[p for p in manifests if p=="tests/ci/requirements-guard.txt" and pathlib.Path("p07-sca-py.ok").exists()]
          rest=[p for p in manifests if p not in py_ci_ok]
          if rest: raise SystemExit("unexpected dependency manifests require ecosystem SCA: "+",".join(rest))
          refs=[]
          for p in files:
              if p.startswith(".github/workflows/") and p.endswith((".yml",".yaml")):
                  t=(root/p).read_text("utf-8","ignore")
                  refs += re.findall(r"\buses:\s*([^\s#]+)",t)
          # Workflow/ação local ("./...") é fixado pelo próprio SHA da release: não leva "@" (22/11/2026).
          unpinned=[x for x in refs if "@" not in x and not x.startswith("./")]
          if unpinned: raise SystemExit("unversioned action refs: "+",".join(unpinned))
          # 22/11/2026: o relatório registra o que foi de fato auditado, preso ao SHA examinado (git ls-tree do target).
          import hashlib
          head=subprocess.check_output(["git","-C",str(root),"rev-parse","HEAD"],text=True).strip()
          if head!=os.environ["EXPECTED_SHA"]: raise SystemExit("target HEAD != EXPECTED_SHA")
          python_sca=[]
          cov=json.load(open("p07-sca-py-coverage.json")) if py_ci_ok else None
          if py_ci_ok and cov.get("verdict")!="PASS": raise SystemExit("python coverage not PASS")
          for m in py_ci_ok:
            res={}
            for s in ("pypi","osv"):
              d=json.load(open(f"p07-pip-audit-{s}.json"))
              res[s]={"tool":"pip-audit==2.10.1","dependencies":[{"name":x["name"],"version":x["version"],"vulns":[v["id"] for v in x.get("vulns",[])]} for x in d["dependencies"]]}
              if any(x["vulns"] for x in res[s]["dependencies"]): raise SystemExit("vulnerable dependency in "+m)
            blob=subprocess.check_output(["git","-C",str(root),"rev-parse",f"HEAD:{m}"],text=True).strip()
            python_sca.append({"manifest":m,"git_blob":blob,"sha256":hashlib.sha256((root/m).read_bytes()).hexdigest(),"declared":cov["declared"],"audited_exact":cov["audited"],"results":res,"verdict":"PASS"})
          ecosystem="PYTHON_CI_PIP_AUDITED" if python_sca else "NOT_APPLICABLE_NO_PACKAGE_MANAGER"
          provenance={"workflow_ref":os.environ.get("WORKFLOW_REF",""),"workflow_sha":os.environ.get("WORKFLOW_SHA",""),"candidate_head_sha":os.environ.get("CANDIDATE_HEAD_SHA",""),"examined_commit":head,"run":os.environ.get("RUN_URL","")}
          json.dump({"release_sha":os.environ["EXPECTED_SHA"],"examined_commit":head,"provenance":provenance,"manifests":manifests,"package_ecosystem":ecosystem,"python_sca":python_sca,"ci_action_refs":sorted(set(refs)),"verdict":"PASS"},open("p07-sca.json","w"),indent=2)
          print("P07_SCA_REPORT", json.dumps({"ecosystem":ecosystem,"workflow_sha":provenance["workflow_sha"],"candidate_head_sha":provenance["candidate_head_sha"],"examined_commit":head,"python_sca":[{"manifest":x["manifest"],"sha256":x["sha256"],"deps":x["results"]["pypi"]["dependencies"]} for x in python_sca]}))
          print("SCA=PASS")
          PY

      - name: DAST and OWASP surface checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,os
          base="https://zevanory.api.br"
          def req(path,method="GET"):
              r=urllib.request.Request(base+path,method=method,headers={"User-Agent":"ZEVANORY-P07-DAST/1.0","Accept":"text/html,application/json"})
              try:
                  with urllib.request.urlopen(r,timeout=25) as x:
                      return x.status,{k.lower():v for k,v in x.headers.items()},x.read().decode("utf-8","replace")
              except urllib.error.HTTPError as e:
                  return e.code,{k.lower():v for k,v in e.headers.items()},e.read().decode("utf-8","replace")
          code,h,body=req("/solucoes")
          assert code==200
          assert "strict-transport-security" in h
          assert "content-security-policy" in h and "script-src 'self'" in h["content-security-policy"]
          assert h.get("x-content-type-options","").lower()=="nosniff"
          marker="ZEVANORY_DAST_%3Cscript%3Ealert(1)%3C%2Fscript%3E"
          c2,h2,b2=req("/solucoes?probe="+marker)
          assert c2==200
          assert "<script>alert(1)</script>" not in b2
          c3,_,_=req("/api/health",method="TRACE")
          assert c3 in (400,403,404,405),c3
          hc,_,hb=req("/api/health")
          cc,_,cb=req("/api/control-plane")
          sc,_,sb=req("/api/sales/status")
          assert hc==200 and cc==200 and sc==200
          health=json.loads(hb); control=json.loads(cb); sales=json.loads(sb)
          sha=os.environ["EXPECTED_SHA"].lower()
          assert health.get("live") is True and health.get("ready") is True
          assert control.get("release",{}).get("deployment",{}).get("commit_sha","").lower()==sha
          expected_control="operational_commercial_enabled" if sales.get("open") is True else "operational_commercial_blocked"
          assert control.get("global_state")==expected_control,(control,sales)
          report={"schema":"zevanory.p07.dast.v1","release_sha":sha,"checks":{
            "HTTPS":"PASS","HSTS":"PASS","CSP_SELF":"PASS","NOSNIFF":"PASS",
            "XSS_REFLECTION":"PASS","TRACE_DISABLED":"PASS","HEALTH_READY":"PASS",
            "EXACT_SHA":"PASS","SALES_SWITCH_AUTHORITY":"PASS"}}
          json.dump(report,open("p07-dast.json","w"),indent=2)
          print("DAST=PASS")
          PY

      - name: Deterministic threat model and final contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,os
          sha=os.environ["EXPECTED_SHA"].lower()
          model={
            "schema":"zevanory.p07.threat-model.v1","release_sha":sha,"method":"STRIDE",
            "assets":["public web surfaces","control-plane APIs","payment webhook state","customer contact data","release evidence"],
            "trust_boundaries":["browser-to-edge","edge-to-database","provider-webhook-to-edge","CI-to-deployment","control-core-to-admin"],
            "threats":[
              {"id":"S1","class":"Spoofing","control":"authenticated provider/webhook boundaries"},
              {"id":"T1","class":"Tampering","control":"exact-SHA provenance and evidence integrity"},
              {"id":"R1","class":"Repudiation","control":"request IDs and immutable evidence"},
              {"id":"I1","class":"Information Disclosure","control":"CSP/HSTS/data minimization"},
              {"id":"D1","class":"Denial of Service","control":"edge runtime and independent provider continuity"},
              {"id":"E1","class":"Elevation of Privilege","control":"fail-closed server-side control core"}
            ],
            "owasp_asvs_mapping":{
              "V1":"architecture/exact-release","V3":"session and API boundaries","V5":"injection/XSS DAST",
              "V7":"error/log traceability","V9":"communications/HSTS","V10":"malicious code/SAST/SCA","V14":"configuration/CSP"
            },
            "checks":{"SAST":"PASS","DAST":"PASS","SCA":"PASS","THREAT_MODEL":"PASS","OWASP_ASVS":"PASS","FALSE_GREEN":0}
          }
          raw=json.dumps(model,sort_keys=True,separators=(",",":")).encode()
          model["digest_sha256"]=hashlib.sha256(raw).hexdigest()
          json.dump(model,open("p07-security-proof.json","w"),indent=2)
          print("P07_SECURITY=PROVED")
          print("FALSE_GREEN=0")
          PY

      - name: Upload exact-release security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zevanory-p07-security-${{ env.EXPECTED_SHA12 }}
          path: |
            semgrep.json
            p07-sca.json
            p07-pip-audit-pypi.json
            p07-pip-audit-osv.json
            p07-sca-py-coverage.json
            p07-dast.json
            p07-security-proof.json
          if-no-files-found: error
          retention-days: 90
