name: ZEVANORY WhatsApp zero-spend broker
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "worker/whatsapp-credential-broker.mjs"
      - ".github/workflows/whatsapp-zero-spend-broker.yml"
      - "worker/whatsapp-onboarding.mjs"
      - ".github/workflows/whatsapp-closure-probe.yml"
      - ".github/workflows/financial-e2e-closure.yml"
      - "scripts/financial_e2e_closure.py"
      - ".github/workflows/central-production-deploy.yml"
      - "worker/whatsapp-onboarding.mjs"
      - ".github/workflows/whatsapp-closure-probe.yml"
  push:
    branches: [gh-pages]
    paths:
      - "worker/whatsapp-credential-broker.mjs"

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate broker fail-closed contract
        run: |
          set -euo pipefail
          node --check worker/whatsapp-credential-broker.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path("worker/whatsapp-credential-broker.mjs").read_text()
          # The broker is a retired 410 tombstone (PR #896): validate the tombstone contract, not the old routes.
          for marker in ['status: 410', 'retired: true', 'error: "whatsapp_channel_retired"']:
              assert marker in s, marker
          for forbidden in ['graph.facebook.com', 'await fetch', 'env.', '/broker/send', 'OFFICIAL_E164']:
              assert forbidden not in s, forbidden
          assert "console.log" not in s
          print("WHATSAPP_BROKER_STATIC_GATE=PASS")
          PY

  # T1 E4: RETIRED publisher. The deploy job (wrangler deploy of giro-whatsapp-bridge with the shared account
  # token) was removed: the workflow was disabled_manually, the target Worker is absent from the account
  # (workers list 13/10/2026) and the path had no promotion guard. Only the static validation remains.
  # Listed under "retired" in ops/publishers.json; scripts/deploy/worker_write_paths.py fails if a write returns.
