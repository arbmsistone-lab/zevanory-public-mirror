name: ZPC control worker deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact zevanory-product-control-edge main SHA
        required: true
        type: string
  push:
    branches:
      - gh-pages
    paths:
      - 'zpc-control-worker-source.txt'
      - '.github/workflows/zpc-control-worker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: zpc-control-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact source SHA
        shell: bash
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${DISPATCH_SHA:-}"
          if [ -z "$SOURCE_SHA" ]; then
            SOURCE_SHA="$(tr -d '\r\n ' < zpc-control-worker-source.txt)"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Validate exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git clone --quiet --filter=blob:none https://github.com/arbmsistone-lab/zevanory-product-control-edge.git zpc
          git -C zpc fetch --quiet origin "$SOURCE_SHA"
          git -C zpc checkout --quiet --detach "$SOURCE_SHA"
          test "$(git -C zpc rev-parse HEAD)" = "$SOURCE_SHA"
          git -C zpc fetch --quiet origin main
          git -C zpc merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build exact control-plane source
        working-directory: zpc
        env:
          ZPC_BASE_PATH: /
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build

      - name: Bind current GREEN trust artifact from Control Core
        working-directory: zpc
        shell: bash
        run: |
          set -euo pipefail
          # Core snapshot is authoritative for three independent control engines.
          # Missing data, absent proof, incompatible SHA or error always fails closed.
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 \
            https://zevanory.api.br/api/core/v1/snapshot -o /tmp/zpc-core-snapshot.json
          jq '{
            sha: (.release_sha // null),
            checkedAt: (.generated_at // null),
            evidenceRoot: (.zees16.decision_hash // null),
            policyVersion: (.zees16.policy_version // null),
            source: "ZEVANORY Control Core /api/core/v1/snapshot",
            zea10: {
              proven: (.zea10.counts.proven // 0),
              partial: (.zea10.counts.partial // 0),
              blocked: (.zea10.counts.blocked // 10),
              unknown: (.zea10.counts.unknown // 10)
            },
            zees16: {
              proven: (.zees16.counts.proven // 0),
              partial: (.zees16.counts.partial // 0),
              blocked: (.zees16.counts.blocked // 16),
              na: (.zees16.counts.na // 16)
            },
            quorum: {
              passed: (if .invariants.quorum_ok == true then 3 else 0 end),
              total: 3, required: 3, conflicts: 0, independentKeys: 3
            },
            engines: [
              {id:"ZEES-16",state:(if (.zees16.counts.proven == 16 and .zees16.counts.partial == 0 and .zees16.counts.blocked == 0 and .zees16.counts.na == 0 and (.zees16.persistence == "kv-append-only" or .zees16.persistence == "recomputed-immutable-sources")) then "GREEN" else "BLOCKED" end)},
              {id:"ZEA-10",state:(if (.zea10.counts.proven == 10 and .zea10.counts.partial == 0 and .zea10.counts.blocked == 0 and .zea10.counts.unknown == 0 and .zea10.authority == true and .zea10.external_review_required != true) then "GREEN" else "BLOCKED" end)},
              {id:"CORE",state:(if (.authority == "server-side-core-only" and .source_of_truth == true and .fail_closed == true and .ui_can_authorize == false and .invariants.exact_release_bound == true and .invariants.control_plane_ready == true and .invariants.health_ready == true and .invariants.quorum_ok == true and .invariants.evidence_to_evaluation_unidirectional == true) then "GREEN" else "BLOCKED" end)}
            ],
            source_error: null
          } | .state = (if ([.engines[].state] | length == 3 and all(. == "GREEN")) then "GREEN" else "BLOCKED" end)' /tmp/zpc-core-snapshot.json > dist/global-trust.json
          # Never accept a missing or unverified release or missing core fields.
          if ! jq -e '.state == "GREEN" and (.sha|type=="string" and test("^[a-f0-9]{40}$")) and (.checkedAt|type=="string")' dist/global-trust.json >/dev/null; then
            value="$(jq -cr '{state,sha,zea10,zees16,engines,checkedAt}' dist/global-trust.json)"
            echo "::error title=TRUST_CORE_BLOCKED::$value"
            exit 1
          fi
          if ! jq -e '.zea10.proven == 10 and .zea10.partial == 0 and .zea10.blocked == 0 and .zea10.unknown == 0' dist/global-trust.json >/dev/null; then
            echo "::error title=TRUST_ZEA10::$(jq -cr '.zea10' dist/global-trust.json)"
            exit 1
          fi
          if ! jq -e '[.engines[].state] | length == 3 and all(. == "GREEN")' dist/global-trust.json >/dev/null; then
            echo "::error title=TRUST_ENGINES::$(jq -cr '.engines' dist/global-trust.json)"
            exit 1
          fi
          printf '{"sha":"%s","repository":"arbmsistone-lab/zevanory-product-control-edge","workflow_run":"%s"}\n' \
            "$SOURCE_SHA" "${{ github.run_id }}" > dist/zpc-build.json

      - name: Promote exact main SHA and verify production
        working-directory: zpc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "1b26415802588185a86c1d4d3ebf5bdb"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          EXPECTED_ZPC_SHA="$SOURCE_SHA" node scripts/cloudflare-authoritative-repair.mjs

      - name: Verify exact trust and artifact readback
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 25 \
            https://controle.zevanory.api.br/version.json -o /tmp/version.json
          test "$(jq -r '.sha' /tmp/version.json)" = "$SOURCE_SHA"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 25 \
            https://controle.zevanory.api.br/global-trust.json -o /tmp/global-trust.json
          jq -e '.state == "GREEN"' /tmp/global-trust.json >/dev/null
          jq -e '.zea10.proven == 10 and ([.engines[].state] | length == 3 and all(. == "GREEN"))' /tmp/global-trust.json >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 \
            https://zevanory.api.br/api/support/artifacts-status -o /tmp/artifacts.json
          jq -e '.artifacts | length == 5 and all(.integrity == true)' /tmp/artifacts.json >/dev/null
          cat /tmp/version.json
          cat /tmp/global-trust.json
          cat /tmp/artifacts.json
