name: ZPC control worker deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact zevanory-product-control-edge main SHA
        required: true
        type: string
      allow_backwards:
        description: Deliberate rollback to an older panel SHA than the one in production
        required: false
        default: false
        type: boolean
      rollback_reason:
        description: Required with allow_backwards (min 20 chars) - why production must move back
        required: false
        default: ''
        type: string
      skip_if_live:
        description: Do nothing when the source is already live (set by the scheduled reconciler request)
        required: false
        default: false
        type: boolean
  push:
    branches:
      - gh-pages
    paths:
      # Only a pin change deploys on push. Editing this workflow used to redeploy whatever the pin
      # held (13/10: #794 republished panel #185, 21 commits behind main). Use workflow_dispatch.
      - 'zpc-control-worker-source.txt'

permissions:
  contents: read

concurrency:
  group: deploy-zevanory-product-control-portable
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    environment: producao-critica  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact source SHA
        shell: bash
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${DISPATCH_SHA:-}"
          if [ -z "$SOURCE_SHA" ]; then
            SOURCE_SHA="$(tr -d '\r\n ' < zpc-control-worker-source.txt)"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Validate exact source SHA
        shell: bash
        env:
          ALLOW_BACKWARDS: ${{ inputs.allow_backwards == true && 'true' || 'false' }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
          ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          SKIP_IF_LIVE: ${{ inputs.skip_if_live == true && 'true' || 'false' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "1b26415802588185a86c1d4d3ebf5bdb"
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git clone --quiet --filter=blob:none https://github.com/arbmsistone-lab/zevanory-product-control-edge.git zpc
          git -C zpc fetch --quiet origin "$SOURCE_SHA"
          git -C zpc checkout --quiet --detach "$SOURCE_SHA"
          test "$(git -C zpc rev-parse HEAD)" = "$SOURCE_SHA"
          git -C zpc fetch --quiet origin main
          git -C zpc merge-base --is-ancestor "$SOURCE_SHA" origin/main
          # Fail closed BEFORE promotion: a source without the live trust route would serve the SPA
          # (or a stale file) at /global-trust.json and could only be caught after it is in production.
          if ! grep -q 'globalTrustResponse(' zpc/cf-worker/worker.ts \
             || ! grep -q "'x-zpc-trust-source': 'live-control-core'" zpc/cf-worker/global-trust.ts; then
            echo "::error title=SOURCE_WITHOUT_LIVE_TRUST::$SOURCE_SHA predates the live /global-trust.json (edge #207); refusing to deploy it"
            exit 1
          fi
          # Never move production backwards silently: report how far the source is behind main.
          behind="$(git -C zpc rev-list --count "$SOURCE_SHA"..origin/main)"
          echo "::notice title=SOURCE_VS_MAIN::source=${SOURCE_SHA:0:12} behind_main_by=$behind"
          # Never move production backwards by accident (13/10: the push deploy of #795 republished
          # de7c0bcd over c1182c54/#208). Rollback = explicit, authorised, justified and audited.
          rollback_requested=false
          if [ "$ALLOW_BACKWARDS" = "true" ]; then
            reason="$(printf '%s' "${ROLLBACK_REASON:-}" | tr -d '\r\n' | cut -c1-300)"
            if [ "$EVENT" != "workflow_dispatch" ] || [ "$ACTOR" != "$REPO_OWNER" ] || [ "${#reason}" -lt 20 ]; then
              echo "::error title=ROLLBACK_NOT_AUTHORISED::allow_backwards needs workflow_dispatch by the repository owner and rollback_reason >= 20 chars (event=$EVENT actor=$ACTOR reason_len=${#reason})"
              exit 1
            fi
            rollback_requested=true
          fi
          # T1 (plan 3.1): the forward path uses the SAME pre-promotion guard as every other
          # publisher (scripts/deploy/promotion_guard.py): the effective version (Cloudflare tag of the
          # active version and version.json) must be known and agree; the source must be the live SHA
          # or a descendant of it. Unknown production, diverged history => refuse; older => skip.
          # The only backwards path is the explicit, owner-dispatched rollback below (documented
          # exception, serialized in this same queue, audited).
          main_tip="$(git -C zpc rev-parse origin/main)"
          live=""
          backwards=false
          if [ "$rollback_requested" != "true" ]; then
            python3 scripts/deploy/promotion_guard.py --service zevanory-product-control-portable \
              --candidate "$SOURCE_SHA" --repo zpc \
              --readback-url https://controle.zevanory.api.br/version.json --readback-path sha \
              --cloudflare-script zevanory-product-control-portable > /tmp/guard.txt || { cat /tmp/guard.txt; exit 1; }
            cat /tmp/guard.txt
            decision="$(sed -n 's/^PROMOTION_GUARD=//p' /tmp/guard.txt | jq -r .decision)"
            live="$(sed -n 's/^PROMOTION_GUARD=//p' /tmp/guard.txt | jq -r '.live_cloudflare // .live_readback // empty')"
            reason_g="$(sed -n 's/^PROMOTION_GUARD=//p' /tmp/guard.txt | jq -r .reason)"
            if [ "$decision" = "skip-superseded" ]; then
              echo "::notice title=SUPERSEDED::source ${SOURCE_SHA:0:12} is older than live ${live:0:12}; nothing to publish"
              echo "PROMOTE=false" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$SKIP_IF_LIVE" = "true" ] && [ "$reason_g" = "same_as_live_redeploy" ]; then
              echo "::notice title=ALREADY_LIVE::source ${SOURCE_SHA:0:12} is already live; reconciler request satisfied"
              echo "PROMOTE=false" >> "$GITHUB_ENV"
              exit 0
            fi
            # Post-promotion certification needs the Cloudflare tag of the active version; the deploy
            # script tags it only since edge #210. A forward promotion of a source that cannot be
            # certified by both sources is refused BEFORE any publish (this also closes the window
            # between mirror #799 and edge #210). Checked after skip decisions, so a stale queued run
            # is still reported as superseded. The owner rollback path below is not affected.
            if ! grep -q "'--tag='" zpc/scripts/cloudflare-authoritative-repair.mjs; then
              echo "::error title=SOURCE_WITHOUT_VERSION_TAG::${SOURCE_SHA:0:12} deploy script does not tag the Cloudflare version (needs edge #210); refusing an uncertifiable forward promotion"
              exit 1
            fi
          else
            live="$(curl -fsS --max-time 20 "https://controle.zevanory.api.br/version.json?t=$(date +%s%N)" 2>/dev/null | jq -r '.sha // empty' || true)"
            backwards=deliberate
          fi
          echo "PROMOTE=true" >> "$GITHUB_ENV"
          if [ "$rollback_requested" = "true" ]; then
            mkdir -p /tmp/rollback-audit
            jq -n --arg at "$(date -u +%FT%TZ)" --arg actor "$ACTOR" --arg reason "$reason" --arg live "$live" \
                  --arg source "$SOURCE_SHA" --arg main "$main_tip" --arg backwards "$backwards" \
                  --arg run "${{ github.run_id }}" --arg repo "${{ github.repository }}" \
              '{schema:"zpc-rollback-audit/v1",at:$at,actor:$actor,reason:$reason,live_before:$live,source:$source,main_tip:$main,backwards:$backwards,run:$run,repository:$repo}' \
              > /tmp/rollback-audit/rollback.json
            echo "::warning title=DELIBERATE_ROLLBACK::actor=$ACTOR live=${live:-unreadable} -> ${SOURCE_SHA:0:12} reason=$reason"
            { echo "## Rollback deliberado"; echo; echo '```json'; cat /tmp/rollback-audit/rollback.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "ROLLBACK_AUDIT=true" >> "$GITHUB_ENV"
          fi

      - name: Retain rollback audit record
        if: env.ROLLBACK_AUDIT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zpc-rollback-audit-${{ github.run_id }}
          path: /tmp/rollback-audit/rollback.json
          retention-days: 90
          if-no-files-found: error

      - uses: actions/setup-node@v4
        if: env.PROMOTE == 'true'
        with:
          node-version: '24'

      - name: Build exact control-plane source
        if: env.PROMOTE == 'true'
        working-directory: zpc
        env:
          ZPC_BASE_PATH: /
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build

      - name: Write build lineage (trust is served live by the worker)
        if: env.PROMOTE == 'true'
        working-directory: zpc
        shell: bash
        run: |
          set -euo pipefail
          # P0 13/10/2026: no deploy-time global-trust.json. The old step wrote it with
          # independentKeys:3 and conflicts:0 hard-coded and passed:3 taken from the core's
          # continuity.quorum_ok (sales channels); the Central froze GREEN on an old SHA.
          # Since edge #207 the worker derives /global-trust.json live (schema zpc-global-trust/v2).
          rm -f dist/global-trust.json
          printf '{"sha":"%s","repository":"arbmsistone-lab/zevanory-product-control-edge","workflow_run":"%s"}\n' \
            "$SOURCE_SHA" "${{ github.run_id }}" > dist/zpc-build.json

      - name: Promote exact main SHA and verify production
        if: env.PROMOTE == 'true'
        working-directory: zpc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "1b26415802588185a86c1d4d3ebf5bdb"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          EXPECTED_ZPC_SHA="$SOURCE_SHA" node scripts/cloudflare-authoritative-repair.mjs

      - name: Verify exact trust and artifact readback
        if: env.PROMOTE == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "1b26415802588185a86c1d4d3ebf5bdb"
        run: |
          set -euo pipefail
          # T1: effective version = source, by BOTH the Cloudflare tag and version.json.
          python3 scripts/deploy/promotion_guard.py --verify-promoted --service zevanory-product-control-portable \
            --candidate "$SOURCE_SHA" --readback-url https://controle.zevanory.api.br/version.json --readback-path sha \
            --cloudflare-script zevanory-product-control-portable
          # Wait for the promoted version to propagate (13/10: run 38414945576 read the previous SHA
          # ~15 s after a successful promotion; seconds later the edge served the new one). Same
          # exact-SHA requirement, just polled for up to ~3 minutes before failing.
          ok=false
          for i in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 25 "https://controle.zevanory.api.br/version.json?t=$(date +%s%N)" -o /tmp/version.json \
               && jq -e --arg expected "$SOURCE_SHA" '.sha == $expected' /tmp/version.json >/dev/null 2>&1; then ok=true; break; fi
            sleep 5
          done
          if [ "$ok" != "true" ]; then
            echo "::error title=READBACK_VERSION::$(jq -c '{sha,repository}' /tmp/version.json 2>/dev/null || head -c 80 /tmp/version.json | tr -cd '[:print:]')"
            exit 1
          fi
          if ! curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 25 \
            https://controle.zevanory.api.br/global-trust.json -o /tmp/global-trust.json; then
            echo "::error title=READBACK_TRUST::HTTP fetch failed"
            exit 1
          fi
          # Coherence, not colour (edge #207 contract): live, v2, bound to the running core release,
          # and GREEN only with a proven independent quorum. BLOCKED/DEGRADED/NO_PROOF are honest states.
          curl --fail --silent --show-error --max-time 25 https://zevanory.api.br/api/core/v1/snapshot -o /tmp/core.json
          src="$(curl -sS -D - -o /dev/null --max-time 25 https://controle.zevanory.api.br/global-trust.json | tr -d '\r' | awk -F': ' 'tolower($1)=="x-zpc-trust-source"{print $2}')"
          if [ "$src" != "live-control-core" ]; then echo "::error title=READBACK_TRUST_SOURCE::source=${src:-none} (deploy-time artifact still served)"; exit 1; fi
          if ! jq -e --slurpfile core /tmp/core.json --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
              .schema == "zpc-global-trust/v2"
              and (.state | IN("GREEN","DEGRADED","BLOCKED","NO_PROOF"))
              and (if .state != "NO_PROOF" then .sha == $core[0].release_sha else true end)
              and (if .state == "GREEN" then
                    .quorum.ok == true and .quorum.required >= 2 and .quorum.passed >= .quorum.required
                    and .quorum.independentKeys >= .quorum.required and .quorum.conflicts == 0
                    and (.evidenceRoot|type=="string" and length>0) and .crossCheck.state == "agree"
                    and (.validUntil|type=="string") and .validUntil > $now
                    and $core[0].control.trust_chain.state == "GREEN"
                  else true end)'\
              /tmp/global-trust.json >/dev/null; then
            echo "::error title=READBACK_TRUST_INCOHERENT::$(jq -c '{schema,state,reasons,sha,quorum,crossCheck,validUntil}' /tmp/global-trust.json 2>/dev/null || echo invalid_json)"
            exit 1
          fi
          echo "::notice title=TRUST_LIVE::$(jq -c '{state,reasons,sha,validUntil,quorum:{passed:.quorum.passed,required:.quorum.required,ok:.quorum.ok}}' /tmp/global-trust.json)"
          if ! curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 \
            https://zevanory.api.br/api/support/artifacts-status -o /tmp/artifacts.json; then
            echo "::error title=READBACK_ARTIFACTS::HTTP fetch failed"
            exit 1
          fi
          if ! jq -e '.artifacts | length == 5 and all(.integrity == true)' /tmp/artifacts.json >/dev/null; then
            echo "::error title=READBACK_ARTIFACTS::$(jq -c '{count:(.artifacts|length),integrity:[.artifacts[]?|{id,integrity}]}' /tmp/artifacts.json 2>/dev/null || echo invalid_json)"
            exit 1
          fi
          # Authenticated T2 route still guarded (smoke formerly run by the scheduled reconciler).
          code="$(curl -sS -o /tmp/t2route.json -w '%{http_code}' --max-time 25 -X POST https://controle.zevanory.api.br/api/commercial/creative/factory/tick -H 'content-type: application/json' -d '{}')"
          if [ "$code" != "401" ] || ! jq -e '.error == "commercial_creative_factory_auth_required"' /tmp/t2route.json >/dev/null; then
            echo "::error title=READBACK_T2_ROUTE::http=$code"
            exit 1
          fi
          cat /tmp/version.json
          cat /tmp/global-trust.json
          cat /tmp/artifacts.json
