name: ZPC control worker deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact zevanory-product-control-edge main SHA
        required: true
        type: string
  push:
    branches:
      - gh-pages
    paths:
      - 'zpc-control-worker-source.txt'
      - '.github/workflows/zpc-control-worker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: zpc-control-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact source SHA
        shell: bash
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${DISPATCH_SHA:-}"
          if [ -z "$SOURCE_SHA" ]; then
            SOURCE_SHA="$(tr -d '\r\n ' < zpc-control-worker-source.txt)"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Validate exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git clone --quiet --filter=blob:none https://github.com/arbmsistone-lab/zevanory-product-control-edge.git zpc
          git -C zpc fetch --quiet origin "$SOURCE_SHA"
          git -C zpc checkout --quiet --detach "$SOURCE_SHA"
          test "$(git -C zpc rev-parse HEAD)" = "$SOURCE_SHA"
          git -C zpc fetch --quiet origin main
          git -C zpc merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build exact control-plane source
        working-directory: zpc
        env:
          ZPC_BASE_PATH: /
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build

      - name: Bind current GREEN trust artifact
        working-directory: zpc
        shell: bash
        run: |
          set -euo pipefail
          # Store-facing control plane is the authority; do not read stale panel static JSON.
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 \
            https://zevanory.api.br/api/control-plane -o /tmp/zpc-authoritative-control-plane.json
          jq -e '
            (.trust_chain | type == "object") and
            (.policy.counts | type == "object") and
            (.trust_chain.engines | type == "array")
          ' /tmp/zpc-authoritative-control-plane.json >/dev/null
          jq '{
            state: (.trust_chain.state // "BLOCKED"),
            sha: (.trust_chain.artifact_sha // .release.deployment.commit_sha // null),
            evidenceRoot: (.trust_chain.evidence_root // null),
            policyVersion: (.trust_chain.policy_version // null),
            quorum: {passed: (.trust_chain.passed // 0), total: (.trust_chain.total // 3), required: (.trust_chain.required // 2), conflicts: (.trust_chain.conflicts // 0), independentKeys: (.trust_chain.independent_keys // 0)},
            zea10: {proven: (.policy.counts.proven // 0), partial: (.policy.counts.partial // 0), blocked: (.policy.counts.blocked // 10)},
            engines: [.trust_chain.engines[] | {id: (.id // ""), state: (.state // "UNKNOWN")}],
            checkedAt: (.trust_chain.ledger.checked_at // null),
            source_error: null
          }' /tmp/zpc-authoritative-control-plane.json > dist/global-trust.json
          if ! jq -e '.state == "GREEN"' dist/global-trust.json >/dev/null; then
            value="$(jq -cr '{state: .state}' dist/global-trust.json)"
            echo "::error title=TRUST_STATE::$value"
            exit 1
          fi
          if ! jq -e '.zea10.proven == 10 and .zea10.partial == 0 and .zea10.blocked == 0' dist/global-trust.json >/dev/null; then
            value="$(jq -cr '{zea10: {proven: .zea10.proven, partial: .zea10.partial, blocked: .zea10.blocked}}' dist/global-trust.json)"
            echo "::error title=TRUST_ZEA10::$value"
            exit 1
          fi
          if ! jq -e '[.engines[].state] | length == 3 and all(. == "GREEN")' dist/global-trust.json >/dev/null; then
            value="$(jq -cr '{engines: [.engines[] | {name: (.name // .id // ""), state}]}' dist/global-trust.json)"
            echo "::error title=TRUST_ENGINES::$value"
            exit 1
          fi
          printf '{"sha":"%s","repository":"arbmsistone-lab/zevanory-product-control-edge","workflow_run":"%s"}\n' \
            "$SOURCE_SHA" "${{ github.run_id }}" > dist/zpc-build.json

      - name: Promote exact main SHA and verify production
        working-directory: zpc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "1b26415802588185a86c1d4d3ebf5bdb"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          EXPECTED_ZPC_SHA="$SOURCE_SHA" node scripts/cloudflare-authoritative-repair.mjs

      - name: Verify exact trust and artifact readback
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 25 \
            https://controle.zevanory.api.br/version.json -o /tmp/version.json
          test "$(jq -r '.sha' /tmp/version.json)" = "$SOURCE_SHA"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 25 \
            https://controle.zevanory.api.br/global-trust.json -o /tmp/global-trust.json
          jq -e '.state == "GREEN"' /tmp/global-trust.json >/dev/null
          jq -e '.zea10.proven == 10 and ([.engines[].state] | length == 3 and all(. == "GREEN"))' /tmp/global-trust.json >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 \
            https://zevanory.api.br/api/support/artifacts-status -o /tmp/artifacts.json
          jq -e '.artifacts | length == 5 and all(.integrity == true)' /tmp/artifacts.json >/dev/null
          cat /tmp/version.json
          cat /tmp/global-trust.json
          cat /tmp/artifacts.json
