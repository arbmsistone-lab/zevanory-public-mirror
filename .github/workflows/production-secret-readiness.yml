name: ZEVANORY production secret readiness
on:
  pull_request:
    paths:
      - ".github/workflows/production-secret-readiness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MP_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
      MP_WEBHOOK: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
      META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      WA_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WA_PHONE: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      RESEND: ${{ secrets.RESEND_API_KEY }}
      ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY || secrets.ASAAS_SANDBOX_API_KEY }}
      ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          present(){ if [ -n "$2" ]; then echo "$1=PRESENT"; else echo "$1=ABSENT"; fi; }
          present CLOUDFLARE_API_TOKEN "${CF:-}"
          present MERCADOPAGO_ACCESS_TOKEN "${MP_TOKEN:-}"
          present MERCADOPAGO_WEBHOOK_SECRET "${MP_WEBHOOK:-}"
          present META_ACCESS_TOKEN "${META_TOKEN:-}"
          present META_APP_SECRET "${META_APP_SECRET:-}"
          present WHATSAPP_ACCESS_TOKEN "${WA_TOKEN:-}"
          present WHATSAPP_PHONE_NUMBER_ID "${WA_PHONE:-}"
          present RESEND_API_KEY "${RESEND:-}"
          present ASAAS_API_KEY "${ASAAS_API_KEY:-}"
          present ASAAS_WEBHOOK_TOKEN "${ASAAS_WEBHOOK_TOKEN:-}"
