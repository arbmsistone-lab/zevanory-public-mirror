name: ZEVANORY TTS hop deploy
on:
  push:
    branches: [gh-pages]
    paths:
      - "worker/tts-hop/**"
      - ".github/workflows/tts-hop-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HOP_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy hop worker on the legacy workers.dev zone (Workers Free)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test ${#HOP_TOKEN} -ge 24
          npx --yes wrangler@4.143.0 whoami > /tmp/whoami.log 2>&1 || true
          echo "::notice title=HOP_WHOAMI::$(grep -E '[0-9a-f]{32}' /tmp/whoami.log | tr -s ' ' | tr '\n' ' ' | head -c 400)"
          cat > /tmp/wrangler.tts-hop.toml <<TOML
          name = "zevanory-tts-hop"
          main = "$GITHUB_WORKSPACE/worker/tts-hop/index.mjs"
          compatibility_date = "2026-09-19"
          workers_dev = true
          TOML
          npx --yes wrangler@4.143.0 deploy --config /tmp/wrangler.tts-hop.toml > /tmp/hop-deploy.log 2>&1 || { echo "::error title=HOP_DEPLOY::$(tail -c 600 /tmp/hop-deploy.log | tr '\n' ' ')"; exit 1; }
          printf '%s' "$HOP_TOKEN" | npx --yes wrangler@4.143.0 secret put HOP_TOKEN --config /tmp/wrangler.tts-hop.toml > /tmp/hop-secret.log 2>&1 || { echo "::error title=HOP_SECRET::$(tail -c 600 /tmp/hop-secret.log | tr '\n' ' ')"; exit 1; }
          url="$(grep -oE 'https://zevanory-tts-hop\.[a-z0-9-]+\.workers\.dev' /tmp/hop-deploy.log | head -1)"
          echo "::notice title=HOP_URL::$url"
          echo "HOP_URL=$url" >> "$GITHUB_ENV"
      - name: Verify hop synthesizes pt-BR audio through the relay
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          code="$(curl -sS -o /tmp/hop.wav -w '%{http_code}' -X POST "$HOP_URL/tts" -H 'content-type: application/json' -H "x-zevanory-relay-auth: $HOP_TOKEN" --data '{"text":"Teste de voz ZEVANORY."}' || true)"
          size="$(wc -c < /tmp/hop.wav)"
          echo "::notice title=HOP_TTS::HTTP $code bytes=$size $(head -c 120 /tmp/hop.wav | tr -dc '[:print:]' | head -c 120)"
          test "$code" = "200" && test "$size" -gt 1000
