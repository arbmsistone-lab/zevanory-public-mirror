name: T2 regenerate IA clean visual

on:
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/t2-regenerate-ia-clean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: R4 owner approval gate (fail-closed)
        shell: bash
        env:
          R4_OWNER_APPROVAL: ${{ vars.R4_T2_COMMERCIAL_SIGNED_CALLS_OWNER_APPROVAL }}
        run: |
          # R4 (Sol rule, 24/10/2026): this job sends x-commercial-signature calls whose HMAC scheme also authorizes commercial publishing
          # (zevanory-product-control-edge cf-worker/worker.ts verifyFactoryRequest, shared with /api/commercial/publish/*).
          # Runs only after the owner records an explicit risk acceptance in the repository variable R4_T2_COMMERCIAL_SIGNED_CALLS_OWNER_APPROVAL
          # ("approved"). Checked by scripts/ci/no_forged_production_input.py (open_real_risks / gates).
          if [ "${R4_OWNER_APPROVAL:-}" != "approved" ]; then
            echo "::error title=R4_OWNER_APPROVAL_REQUIRED::R4_T2_COMMERCIAL_SIGNED_CALLS_OWNER_APPROVAL is not set to approved; this job is a registered open R4 risk"
            exit 1
          fi
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: '24'

      - name: Regenerate only IA na Prática
        env:
          ZEVANORY_OPERATOR_TOKEN: ${{ secrets.ZEVANORY_OPERATOR_TOKEN || secrets.CERTIFICATION_E2E_TOKEN }}  # R9: nome novo; queda para o antigo só na transição
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ZEVANORY_OPERATOR_TOKEN:-}"
          mkdir -p t2-output
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHmac, randomUUID } from 'node:crypto';

          const secret = process.env.ZEVANORY_OPERATOR_TOKEN || '';
          const timestamp = String(Date.now());
          const nonce = randomUUID();
          const message = ['zevanory-commercial-creative-factory-v1', timestamp, nonce].join('\n');
          const signature = createHmac('sha256', secret).update(message).digest('hex');
          const endpoint = 'https://controle.zevanory.api.br/api/commercial/creative/factory/tick?product=ia-na-pratica&force=1';

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'x-commercial-timestamp': timestamp,
              'x-commercial-nonce': nonce,
              'x-commercial-signature': signature,
              'cache-control': 'no-store',
            },
            signal: AbortSignal.timeout(180_000),
          });
          const raw = await response.text();
          console.log('T2_IA_REGEN_HTTP=' + response.status);
          console.log('T2_IA_REGEN_RESPONSE=' + raw);
          if (!response.ok) throw new Error('T2_IA_REGEN_HTTP_' + response.status + '_' + raw.slice(0,800));
          const result = JSON.parse(raw);
          const ia = (result.creativeProof || []).find(x => x?.sourceKey === 't2-workers-ai:ia-na-pratica');
          if (!ia?.imageUrl || ia.status !== 'approval') throw new Error('T2_IA_REGEN_PROOF_MISSING');
          fs.writeFileSync('t2-output/regen.json', JSON.stringify(result,null,2));
          fs.writeFileSync('t2-output/image-url.txt', ia.imageUrl + '\n');
          NODE

          url="$(cat t2-output/image-url.txt)"
          curl -fsS --retry 4 --retry-delay 2 "$url" -o t2-output/ia-na-pratica.jpg
          file t2-output/ia-na-pratica.jpg
          test -s t2-output/ia-na-pratica.jpg

      - name: Verify artifacts status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 https://zevanory.api.br/api/support/artifacts-status -o t2-output/artifacts-status.json
          echo 'T2_ARTIFACTS_STATUS_RAW<<JSON'
          cat t2-output/artifacts-status.json
          echo
          echo 'JSON'
          jq -e '.artifacts | length == 5 and all(.integrity == true)' t2-output/artifacts-status.json >/dev/null

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: t2-ia-clean-regeneration
          path: t2-output/
          retention-days: 3
          if-no-files-found: error
