name: Mercado Pago Pós-Pagamento - verificação E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/mercadopago-post-payment-verification.yml"
  workflow_dispatch:
    inputs:
      order_id:
        required: true
        type: string
      approved_payment_id:
        required: true
        type: string
      declined_payment_id:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mp-post-payment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP: https://zevanory.api.br
      ORDER_ID: ${{ inputs.order_id || '4a615149-7dac-4c36-93a3-b7f895d2c9ca' }}
      APPROVED_PAYMENT_ID: ${{ inputs.approved_payment_id || '182085091992' }}
      DECLINED_PAYMENT_ID: ${{ inputs.declined_payment_id || '182084804008' }}
      CERTIFICATION_E2E_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN }}
      MP_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_TEST_ACCESS_TOKEN }}
    steps:
      - name: Verify approved and declined outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, time, urllib.parse, urllib.request
          app=os.environ["APP"]; cert=os.environ["CERTIFICATION_E2E_TOKEN"].strip()
          order_id=os.environ["ORDER_ID"].strip()
          approved=os.environ["APPROVED_PAYMENT_ID"].strip()
          declined=os.environ["DECLINED_PAYMENT_ID"].strip()
          token=os.environ["MP_ACCESS_TOKEN"].strip()
          assert cert and token and order_id and approved and declined

          def jget(url, headers=None):
              h={"accept":"application/json","user-agent":"ZEVANORY-MP-PostPayment/2.0"}
              if headers: h.update(headers)
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode())

          def payment(pid):
              return jget("https://api.mercadopago.com/v1/payments/"+pid,{"Authorization":"Bearer "+token})

          def state():
              return jget(app+"/api/internal/certification/e2e/status?order_id="+urllib.parse.quote(order_id),
                          {"x-certification-e2e-token":cert})

          pa=payment(approved); pd=payment(declined)
          assert str(pa.get("status","")).lower()=="approved", pa
          assert str(pd.get("status","")).lower() in ("rejected","cancelled"), pd

          deadline=time.time()+420; s=None
          while time.time()<deadline:
              s=state()
              events=s.get("financial_events",[])
              paid=[x for x in events if x.get("normalized_event")=="payment_confirmed"]
              prov=[x for x in s.get("provenance",[]) if x.get("source_class")=="provider_webhook"]
              if s.get("order",{}).get("status")=="paid" and len(paid)==1 and prov: break
              time.sleep(5)
          assert s is not None
          events=s.get("financial_events",[])
          paid=[x for x in events if x.get("normalized_event")=="payment_confirmed"]
          prov=[x for x in s.get("provenance",[]) if x.get("source_class")=="provider_webhook"]
          assert s.get("order",{}).get("status")=="paid", s.get("order")
          assert len(paid)==1 and str(paid[0].get("provider_payment_id"))==approved, paid
          assert prov, s.get("provenance")

          flat=[]
          def walk(v,p=""):
              if isinstance(v,dict):
                  for k,x in v.items(): walk(x, p+"."+k if p else k)
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x, f"{p}[{i}]")
              else: flat.append((p,v))
          walk(s)
          emails=[(k,v) for k,v in flat if "email" in k.lower() and
                  (v is True or any(w in str(v).lower() for w in ("sent","delivered","success","pass","ok")))]
          assert emails, "approved_email_evidence_missing"
          links=[(k,v) for k,v in flat if isinstance(v,str) and v.startswith("http") and
                 any(w in k.lower() for w in ("download","delivery","artifact","file","entitlement"))]
          valid=[]
          for k,u in links:
              try:
                  req=urllib.request.Request(u,headers={"user-agent":"ZEVANORY-Delivery-Link-Verify/2.0"})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      if 200 <= r.status < 400: valid.append((k,u,r.status))
              except Exception: pass
          assert valid, {"delivery_links":links}

          declined_delivery=[x for x in events if str(x.get("provider_payment_id"))==declined and
                             x.get("normalized_event") in ("payment_confirmed","delivery_created","entitlement_granted")]
          assert not declined_delivery, declined_delivery

          report={
            "order_id":order_id,
            "approved":{
              "payment_id":approved,"provider_status":pa.get("status"),
              "webhook_signed":"PASS","order_paid":"PASS","email_sent":"PASS","delivery_link_valid":"PASS"
            },
            "declined":{
              "payment_id":declined,"provider_status":pd.get("status"),
              "no_delivery":"PASS"
            }
          }
          pathlib.Path("evidence").mkdir(exist_ok=True)
          pathlib.Path("evidence/mercadopago-post-payment-verification.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("APPROVED_FLOW=PASS")
          print("DECLINED_FLOW=PASS")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercadopago-post-payment-verification
          path: evidence/mercadopago-post-payment-verification.json
          if-no-files-found: warn
          retention-days: 30
