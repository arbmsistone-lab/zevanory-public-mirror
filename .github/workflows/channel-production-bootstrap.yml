name: Activate Telegram and YouTube production channels
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-zevanory
  cancel-in-progress: false
  queue: max

jobs:
  channels:
    environment: producao-critica  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      ZEVANORY_OPERATOR_TOKEN: ${{ secrets.ZEVANORY_OPERATOR_TOKEN || secrets.CERTIFICATION_E2E_TOKEN }}  # R9: nome novo; queda para o antigo só na transição
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
    steps:
      - name: R4 owner approval gate (fail-closed)
        shell: bash
        env:
          R4_OWNER_APPROVAL: ${{ vars.R4_TELEGRAM_PROOF_OWNER_APPROVAL }}
        run: |
          # R4 (Sol rule, 24/10/2026): the Telegram proof step publishes a real promotional post (price included) through the production Worker
          # (worker/cloudflare-worker.recovered.mjs /api/internal/channels/telegram-proof): a commercial effect.
          # Runs only after the owner records an explicit risk acceptance in the repository variable R4_TELEGRAM_PROOF_OWNER_APPROVAL
          # ("approved"). Checked by scripts/ci/no_forged_production_input.py (open_real_risks / gates).
          if [ "${R4_OWNER_APPROVAL:-}" != "approved" ]; then
            echo "::error title=R4_OWNER_APPROVAL_REQUIRED::R4_TELEGRAM_PROOF_OWNER_APPROVAL is not set to approved; this job is a registered open R4 risk"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate mandatory inputs without printing values
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN ZEVANORY_OPERATOR_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHANNEL_ID; do
            test -n "${!name:-}" || { echo "missing secret: $name"; exit 1; }
          done
      - name: Build and synchronize the single channel credential binding
        shell: bash
        run: |
          set -euo pipefail
          node scripts/channels/build-credentials-json.mjs > /tmp/channel-credentials.json
          npx --yes wrangler@4.143.0 secret put CHANNEL_CREDENTIALS_JSON --name zevanory < /tmp/channel-credentials.json
          rm -f /tmp/channel-credentials.json
          echo "CHANNEL_CREDENTIALS_JSON_SYNCED=PASS"
      - name: Publish the first F1-approved Telegram creative through the real Worker
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "x-certification-e2e-token: $ZEVANORY_OPERATOR_TOKEN" https://zevanory.api.br/api/internal/channels/telegram-proof -o /tmp/telegram-proof.json
          node -e 'const x=require("/tmp/telegram-proof.json");if(!x.provider_post_id||!/^https:\/\/t\.me\/zevanory\/\d+$/.test(x.url||""))process.exit(1);console.log(JSON.stringify({provider_post_id:x.provider_post_id,url:x.url}))'
      - name: Validate YouTube inputs without printing values
        shell: bash
        run: |
          set -euo pipefail
          for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            test -n "${!name:-}" || { echo "missing repository secret: $name"; exit 1; }
          done
      - name: Render one F1-approved vertical Short
        run: node scripts/channels/render-youtube-short.mjs /tmp/zevanory-short.mp4
      - name: Prove YouTube channel and upload private Short
        run: node scripts/channels/prove-youtube.mjs /tmp/zevanory-short.mp4
