name: ZEVANORY support knowledge gate
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "worker/support-knowledge.mjs"
      - "worker/**/*.mjs"
      - "scripts/whatsapp_conversation_test.mjs"
      - "scripts/whatsapp_audio_runtime_test.mjs"
      - "scripts/voice_remote_tts_test.mjs"
      - "scripts/voice_cache_warm*.mjs"
      - "scripts/deploy/prepare-central-candidate.py"
      - "scripts/support_knowledge_test.mjs"
      - "sales-overlay/approved.json"
      - ".github/workflows/support-knowledge-gate.yml"
  push:
    branches: [gh-pages]
    paths:
      - "worker/support-knowledge.mjs"
      - "worker/**/*.mjs"
      - "scripts/whatsapp_conversation_test.mjs"
      - "scripts/whatsapp_audio_runtime_test.mjs"
      - "scripts/voice_remote_tts_test.mjs"
      - "scripts/voice_cache_warm*.mjs"
      - "scripts/deploy/prepare-central-candidate.py"
      - "scripts/support_knowledge_test.mjs"
      - "sales-overlay/approved.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: support-knowledge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  knowledge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: "22"
      - name: 20 canonical questions, handoff and HTTP contract
        run: node scripts/support_knowledge_test.mjs
      - name: Grounded WhatsApp conversation, encrypted voice onboarding and MP3
        run: node scripts/whatsapp_conversation_test.mjs
      - name: Syntax check every Worker module
        run: find worker -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Webhook background lifetime, stage checkpoints and alternate encoder
        run: node scripts/whatsapp_audio_runtime_test.mjs
      - name: Voice synthesized on Render, signed, cached and quota-safe
        run: node scripts/voice_remote_tts_test.mjs
      - name: Manual cache warm limit, quota stop and resume without real calls
        run: node scripts/voice_cache_warm_test.mjs
