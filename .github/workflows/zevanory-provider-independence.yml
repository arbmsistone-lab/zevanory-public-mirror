name: ZEVANORY provider independence gate
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "worker/continuity-router.mjs"
      - "worker/cloudflare-worker.compat.mjs"
      - "evidence/provider-independence.json"
      - ".github/workflows/zevanory-provider-independence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test production-shaped continuity router
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { buildContinuityPlan } from "./worker/continuity-router.mjs";
          const productionBlocked = {scope_status:"active",release_gate:"globally-blocked",commercial_execution:"blocked"};
          const transportDown = {scope_status:"down",release_gate:"globally-blocked",commercial_execution:"blocked"};
          const status = {
            runtime:{sales:"globally-blocked"},
            channel_readiness:{
              zevanory:productionBlocked,
              email:productionBlocked,
              instagram:productionBlocked,
              facebook:productionBlocked,
              youtube:productionBlocked,
              mercado_livre:productionBlocked,
              whatsapp:transportDown
            }
          };
          const plan=buildContinuityPlan(status,{minQuorum:3});
          if(!plan.quorum_ok) throw new Error("technical quorum must survive commercial lock");
          if(plan.mode!=="provider_independent") throw new Error("wrong technical continuity mode");
          if(plan.available_channels.length<3) throw new Error("insufficient transport fallbacks");
          if(plan.commercial_available_channels.length!==0) throw new Error("commercial fail-closed regression");
          if(plan.whatsapp_dependency_required!==false) throw new Error("WhatsApp dependency regression");
          if(plan.whatsapp_transport_operational!==false) throw new Error("WhatsApp transport should be down");
          if(plan.sales_state!=="globally-blocked") throw new Error("sales lock regression");

          const degraded=buildContinuityPlan({
            runtime:{sales:"globally-blocked"},
            channel_readiness:{zevanory:productionBlocked,email:transportDown,instagram:transportDown}
          },{minQuorum:3});
          if(degraded.quorum_ok) throw new Error("below-quorum transport must fail closed");
          if(degraded.mode!=="degraded_fail_closed") throw new Error("degraded mode mismatch");
          console.log("PASS: technical continuity is independent from commercial release and still fail-closed below transport quorum");
          JS
      - name: Verify evidence contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          c=json.load(open("evidence/provider-independence.json"))
          assert c["min_operational_channel_quorum"]==3
          assert c["whatsapp_dependency_required"] is False
          assert c["commercial_actions_remain_fail_closed"] is True
          assert c["rollback_version"]=="52a989a2"
          PY
      - name: Probe live production alternatives
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          req=urllib.request.Request(
              "https://zevanory.api.br/api/status",
              headers={"User-Agent":"ZEVANORY-Provider-Independence/2.0","Accept":"application/json"}
          )
          with urllib.request.urlopen(req,timeout=20) as r:
              assert r.status==200
              body=json.loads(r.read().decode())
          channels=body.get("channel_readiness",{})
          technical=[
              name for name,state in channels.items()
              if str(state.get("scope_status","")).lower()=="active" and name!="whatsapp"
          ]
          commercial=[
              name for name,state in channels.items()
              if str(state.get("scope_status","")).lower()=="active"
              and str(state.get("release_gate","")).lower() not in ("blocked","globally-blocked","disabled")
              and str(state.get("commercial_execution","")).lower() not in ("blocked","globally-blocked","disabled")
          ]
          assert len(technical)>=3, technical
          assert body["runtime"]["sales"]=="globally-blocked"
          assert len(commercial)==0, commercial
          print("PASS: production has >=3 technical alternatives while commercial execution remains locked")
          PY
      - name: Remote Wrangler compile
        run: |
          set -euo pipefail
          cat > wrangler.continuity-proof.jsonc <<'JSON'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "zevanory-continuity-proof",
            "main": "worker/cloudflare-worker.compat.mjs",
            "compatibility_date": "2026-09-04",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "preview_urls": true
          }
          JSON
          rm -rf /tmp/continuity-out
          npx --yes wrangler@4.135.0 deploy --dry-run --config wrangler.continuity-proof.jsonc --outdir /tmp/continuity-out
          test -n "$(find /tmp/continuity-out -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \) -print -quit)"
          rm -f wrangler.continuity-proof.jsonc
          echo "PASS: provider-independent Worker compiles remotely"
