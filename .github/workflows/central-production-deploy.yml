      - name: Authenticate Cloudflare
        if: steps.auth.outputs.available == 'true' && needs.p21_token.outputs.cutover != 'true'
        run: npx --yes wrangler@4.135.0 whoami
      - name: Verify legacy production bridge route
        if: steps.auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/predeploy-health.json -w '%{http_code}' https://zevanory.api.br/api/health || true)"
          if [ "$code" = "200" ]; then
            python3 scripts/deploy/verify-predeploy-health.py
          elif [ "$code" = "503" ]; then
            echo "LEGACY_PRODUCTION_BRIDGE_ROUTE=DEGRADED_RECOVERY_ALLOWED"
            echo "RECOVERY_REASON=HTTP_503_PREEXISTING"
          else
            echo "LEGACY_PRODUCTION_BRIDGE_ROUTE_UNEXPECTED_HTTP=$code"
            exit 22
          fi
      - name: Discover production KV namespaces
        if: steps.auth.outputs.available == 'true' && needs.p21_token.outputs.cutover != 'true'
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" -o /tmp/kv.json
          python3 scripts/deploy/inspect-kv.py
      - name: Discover Worker service bindings
        if: steps.auth.outputs.available == 'true' && needs.p21_token.outputs.cutover != 'true'
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" -o /tmp/scripts.json
          python3 scripts/deploy/inspect-workers.py
      - name: P21 token dedicado - descoberta sem permissão extra
        if: steps.auth.outputs.available == 'true' && needs.p21_token.outputs.cutover == 'true'
        run: |
          # CF_TOKEN_ZEVANORY só tem Editor no Worker zevanory (+ leitura da conta): o gate já provou o token por
          # /accounts/<conta>/tokens/verify (no lugar de wrangler whoami); a lista de namespaces KV e de Workers da
          # conta era só informativa e não é lida (subir binding KV/serviço só exige Editor no Worker:
          # developers.cloudflare.com/workers/authorization/#bindings). As configurações do zevanory seguem lidas abaixo.
          echo "::notice title=P21_DISCOVERY::whoami, KV namespaces e lista de Workers não lidos com o token dedicado (sem permissão de conta)"
      - name: Inspect current zevanory bindings
        if: steps.auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory/settings" -o /tmp/settings.json
          python3 scripts/deploy/inspect-bindings.py
          python3 scripts/deploy/check-binding-budget.py wrangler.central-fix.jsonc /tmp/settings.json
      - name: Verify financial safety boundary without mutating secrets
        if: steps.auth.outputs.available == 'true'
        env:
          ZEVANORY_LAUNCH_AUTHORIZATION: ${{ vars.ZEVANORY_LAUNCH_AUTHORIZATION }}
          MERCADOPAGO_PRODUCTION_ACCOUNT_HASH16: ${{ vars.MERCADOPAGO_PRODUCTION_ACCOUNT_HASH16 }}
          MERCADOPAGO_PRODUCTION_WEBHOOK_VERIFIED: ${{ vars.MERCADOPAGO_PRODUCTION_WEBHOOK_VERIFIED }}
        shell: bash
        run: |
          set -euo pipefail
          # This workflow repairs/proves the Control Core only. Financial credential provisioning
          # belongs to the financial closure workflow and must not block a fail-closed Core deploy.
          # Sales remain globally disabled by the candidate configuration.
          python3 scripts/deploy/verify-financial-boundary.py

      - name: Require production operator secret before production deploy
        if: steps.auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          # R9 transição: o Worker aceita ZEVANORY_OPERATOR_TOKEN e, só na ausência dele, CERTIFICATION_E2E_TOKEN
          # (worker/operator-credential.mjs). O deploy exige ao menos um dos dois e imprime só a categoria.
          npx --yes wrangler@4.143.0 secret list --name zevanory --format json > /tmp/zevanory-secrets.json
          if jq -e 'map(.name) | index("ZEVANORY_OPERATOR_TOKEN") != null' /tmp/zevanory-secrets.json >/dev/null; then
            echo "OPERATOR_TOKEN_BINDING=primary"
          elif jq -e 'map(.name) | index("CERTIFICATION_E2E_TOKEN") != null' /tmp/zevanory-secrets.json >/dev/null; then
            echo "OPERATOR_TOKEN_BINDING=legacy_fallback"
            echo "::warning title=R9_OPERATOR_TOKEN_LEGACY::Worker zevanory ainda sem ZEVANORY_OPERATOR_TOKEN; usando o nome antigo (transição)"
          else
            echo "OPERATOR_TOKEN_BINDING=absent"
            exit 1
          fi

      - name: P20 diário D1 - migrações e certificação antes da promoção (fail-closed em certificar e manter)
        # docs/p20/diario-d1.md, seções "Binding e migração", "Credenciais dedicadas (DEC-P20-D1-01)" e "Primeiro deploy
        # com D1" (NO-GO do GPT-6, NC-P2b-DEP-02 e follow-up NC-1017-01). DEC-P20-D1-01: o D1 só é tocado com token
        # DEDICADO, entregue SÓ a este passo e só no modo que o usa; os dois nomes do token compartilhado ficam vazios aqui.
        #  - off/rollback: NENHUMA chamada D1, mesmo com os segredos cadastrados; o candidato precisa estar sem DIARIO.
        #  - certificar: token de MIGRAÇÃO (D1 Edit); aplica 0001, 0002 e 0003 ANTES da promoção e confere d1_migrations
        #    (as 3), objetos (tabelas, índices e gatilhos), diario_head = 1 e abandono_* = 0.
        #  - manter (sombra, depois de uma certificação): token de LEITURA (D1 Read); NUNCA migra; só religa o binding se
        #    o banco já estiver certificado (a mesma conferência).
        # Qualquer falha em certificar/manter tira o binding DIARIO do candidato E reprova o job aqui: nada é promovido.
        id: diariomig
        if: steps.auth.outputs.available == 'true'
        env:
          # Cada segredo só chega ao processo no modo que o usa; nos outros o valor é vazio.
          CF_TOKEN_D1_DIARIO_MIGRATE: ${{ needs.guard.outputs.diario_d1 == 'certificar' && secrets.CF_TOKEN_D1_DIARIO_MIGRATE || '' }}
          CF_TOKEN_D1_DIARIO_READ: ${{ needs.guard.outputs.diario_d1 == 'manter' && secrets.CF_TOKEN_D1_DIARIO_READ || '' }}
          CLOUDFLARE_API_TOKEN: ""
          CLOUDFLARE_PUBLIC_OWNER_API_TOKEN: ""
          CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
        shell: bash
        run: |
          set -uo pipefail
          modo="${DIARIO_D1_MODO:-}"; [ -n "$modo" ] || modo="off"
          echo "state=pendente" >> "$GITHUB_OUTPUT"
          DB_ID="$(python3 -c 'import json;r=[d for d in json.load(open("wrangler.central-fix.jsonc")).get("d1_databases",[]) if d.get("binding")=="DIARIO"];print(r[0]["database_id"] if len(r)==1 else ("varios" if r else ""))')"
          drop_binding() {
            python3 -c 'import json;p="wrangler.central-fix.jsonc";c=json.load(open(p));c["d1_databases"]=[d for d in c.get("d1_databases",[]) if d.get("binding")!="DIARIO"] or None;c.get("d1_databases") is None and c.pop("d1_databases");open(p,"w").write(json.dumps(c,indent=2)+"\n")'
            echo "state=binding_removido" >> "$GITHUB_OUTPUT"
          }
          falha() {
            drop_binding
            echo "state=falhou" >> "$GITHUB_OUTPUT"
            echo "::error title=$1::$2 Modo $modo é fail-closed: o candidato sai SEM o binding DIARIO e este deploy NÃO é promovido (a produção fica como estava)."
            exit 1
          }
          case "$modo" in
            certificar|manter) ;;
            *)
              if [ -n "$DB_ID" ]; then
                drop_binding
                echo "::error title=DIARIO_D1_BINDING::binding DIARIO no candidato com diario_d1=$modo; o gerador deveria ter tirado. Deploy reprovado antes da promoção."
                exit 1
              fi
              echo "state=desligado" >> "$GITHUB_OUTPUT"
              echo "::notice title=DIARIO_D1_MODO::diario_d1=$modo: nenhuma migração, nenhuma chamada D1 e candidato SEM o binding DIARIO (segredos D1 não usados)"
              exit 0
              ;;
          esac
          case "$DB_ID" in
            1b1bfa19-ccc5-423a-bc1f-62d89020c8e2) ;;
            *) falha DIARIO_D1_BINDING "binding DIARIO ausente ou com banco inesperado no candidato ($DB_ID); o gerador deveria ter injetado o banco certo." ;;
          esac
          SQL="$(python3 scripts/deploy/diario_d1_certify.py sql)" || falha DIARIO_D1_MIGRACOES_NAO_REVISADAS "migrations/d1 diverge das migrações revisadas pela certificação."
          if [ "$modo" = "certificar" ]; then
            [ -n "${CF_TOKEN_D1_DIARIO_MIGRATE:-}" ] || falha DIARIO_D1_TOKEN_DEDICADO_AUSENTE "segredo CF_TOKEN_D1_DIARIO_MIGRATE ausente no environment producao-critica (DEC-P20-D1-01: o token compartilhado nunca toca o D1)."
            code="$(curl -sS -o /tmp/diario-d1.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN_D1_DIARIO_MIGRATE" "https://api.cloudflare.com/client/v4/accounts/$PUBLIC_OWNER_ACCOUNT_ID/d1/database/$DB_ID" || true)"
            name="$(python3 -c 'import json;print((json.load(open("/tmp/diario-d1.json")).get("result") or {}).get("name",""))' 2>/dev/null || true)"
            [ "$code" = "200" ] || falha DIARIO_D1_BANCO_INACESSIVEL "o token CF_TOKEN_D1_DIARIO_MIGRATE não lê o banco zevanory-diario-p20 (HTTP $code); ele precisa de Conta > D1 > Editar na conta 1b26415802588185a86c1d4d3ebf5bdb."
            [ "$name" = "zevanory-diario-p20" ] || falha DIARIO_D1_BANCO_DIVERGENTE "o UUID do binding DIARIO não corresponde ao banco zevanory-diario-p20."
            if ! CLOUDFLARE_API_TOKEN="$CF_TOKEN_D1_DIARIO_MIGRATE" npx --yes wrangler@4.143.0 d1 migrations apply zevanory-diario-p20 --remote --config wrangler.central-fix.jsonc > /tmp/diario-mig.log 2>&1; then
              falha DIARIO_D1_MIGRACAO_FALHOU "migrations apply falhou: $(tail -8 /tmp/diario-mig.log | tr '\n' ' ' | cut -c1-700)"
            fi
            echo "::notice title=DIARIO_D1_MIGRACAO::$(grep -Eio 'no migrations to apply|migrations? applied|✅[^|]*' /tmp/diario-mig.log | head -3 | tr '\n' ' ' | cut -c1-300)"
            if ! CLOUDFLARE_API_TOKEN="$CF_TOKEN_D1_DIARIO_MIGRATE" npx --yes wrangler@4.143.0 d1 execute zevanory-diario-p20 --remote --config wrangler.central-fix.jsonc --json --command "$SQL" > /tmp/diario-antes.json 2>/tmp/diario-antes.err; then
              falha DIARIO_D1_VERIFICACAO_FALHOU "SELECT de certificação falhou: $(tail -3 /tmp/diario-antes.err | tr '\n' ' ' | cut -c1-400)"
            fi
          else
            # manter: nenhuma migração; só religa o binding se o banco JÁ estiver certificado. Token de leitura.
            [ -n "${CF_TOKEN_D1_DIARIO_READ:-}" ] || falha DIARIO_D1_TOKEN_DEDICADO_AUSENTE "segredo CF_TOKEN_D1_DIARIO_READ ausente no environment producao-critica (manter só lê o D1)."
            code="$(curl -sS -o /tmp/diario-d1.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN_D1_DIARIO_READ" "https://api.cloudflare.com/client/v4/accounts/$PUBLIC_OWNER_ACCOUNT_ID/d1/database/$DB_ID" || true)"
            name="$(python3 -c 'import json;print((json.load(open("/tmp/diario-d1.json")).get("result") or {}).get("name",""))' 2>/dev/null || true)"
            [ "$code" = "200" ] || falha DIARIO_D1_BANCO_INACESSIVEL "o token CF_TOKEN_D1_DIARIO_READ não lê o banco zevanory-diario-p20 (HTTP $code); ele precisa de Conta > D1 > Ler."
            [ "$name" = "zevanory-diario-p20" ] || falha DIARIO_D1_BANCO_DIVERGENTE "o UUID do binding DIARIO não corresponde ao banco zevanory-diario-p20."
            if ! CLOUDFLARE_API_TOKEN="$CF_TOKEN_D1_DIARIO_READ" npx --yes wrangler@4.143.0 d1 execute zevanory-diario-p20 --remote --config wrangler.central-fix.jsonc --json --command "$SQL" > /tmp/diario-antes.json 2>/tmp/diario-antes.err; then
              falha DIARIO_D1_VERIFICACAO_FALHOU "SELECT de conferência falhou (banco não certificado?): $(tail -3 /tmp/diario-antes.err | tr '\n' ' ' | cut -c1-400)"
            fi
          fi
          python3 scripts/deploy/diario_d1_certify.py check --fase antes /tmp/diario-antes.json > /tmp/diario-antes.out 2>&1; rc=$?
          cat /tmp/diario-antes.out
          [ "$rc" = "0" ] || falha DIARIO_D1_ESQUEMA_INESPERADO "$(grep -E '=FAIL' /tmp/diario-antes.out | tr '\n' ' ' | cut -c1-700)"
          echo "antes=$(sed -n 's/^RESUMO=//p' /tmp/diario-antes.out | tail -1)" >> "$GITHUB_OUTPUT"
          echo "state=certificado_pre" >> "$GITHUB_OUTPUT"
          echo "::notice title=DIARIO_D1_PRE_PROMOCAO::PASS (diario_d1=$modo): 3 migrações, objetos esperados, diario_head=1, abandono_*=0; o binding DIARIO segue no candidato"
      - name: Deploy repaired production worker
        id: deployworker
        if: steps.auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          # Omitting --keep-vars removes only obsolete dashboard plain-text vars;
          # Wrangler guarantees that deployments never delete secret bindings.
          deploy() { npx --yes wrangler@4.143.0 deploy "$@" --config wrangler.central-fix.jsonc --tag="$TARGET_RUNTIME_SHA" --message="ZEVANORY-public-owner-exact-SHA-$TARGET_RUNTIME_SHA" 2>&1 | tee /tmp/central-deploy.log; }
          fail() { tail -15 /tmp/central-deploy.log | tr '\n' ' ' | cut -c1-1800 | sed 's/^/::error title=CENTRAL_DEPLOY_FAILED::/'; echo; exit 1; }
          if ! deploy --strict; then
            # --strict aborts only when the Worker was last changed outside this pipeline
            # (e.g. `wrangler secret put` or dashboard settings). Secrets survive a deploy
            # and --keep-vars keeps dashboard vars, so retry once without --strict for that
            # exact condition only; any other failure stays fatal.
            grep -q "Aborting the upload operation because of conflicts" /tmp/central-deploy.log || fail
            echo "::notice title=CENTRAL_DEPLOY_STRICT_DRIFT::Worker was last updated via the script API; redeploying without --strict"
            deploy || fail
          fi
      - name: Verify live UTF-8 asset and safety
        if: steps.auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          WORKERS_DEV="https://zevanory.zevanory.workers.dev"
          # Legacy route is strictly diagnostic: it is not the current owner release.
          legacy_http="$(curl -sS -o /tmp/legacy-workers-dev.js -w '%{http_code}' https://zevanory.girolocal-rb.workers.dev/control-plane-vnext.js || true)"
          echo "LEGACY_WORKERS_DEV_DIAGNOSTIC_HTTP=$legacy_http"
          curl -fsS "$WORKERS_DEV/control-plane-vnext.js" -o /tmp/workers-dev.js || echo "::error title=VERIFY_WORKERS_DEV_FETCH::workers.dev control-plane-vnext.js fetch failed"
          cmp -s /tmp/workers-dev.js worker/live-recovered/control-plane-vnext.js || { echo "::error title=VERIFY_WORKERS_DEV_CMP::workers.dev asset differs from canonical ($(wc -c </tmp/workers-dev.js 2>/dev/null) vs $(wc -c <worker/live-recovered/control-plane-vnext.js) bytes)"; exit 1; }
          echo "WORKERS_DEV_CANONICAL_PASS"
          for i in $(seq 1 30); do
            curl -fsS https://zevanory.api.br/control-plane-vnext.js -o /tmp/live.js || true
            if cmp -s /tmp/live.js worker/live-recovered/control-plane-vnext.js; then break; fi
            sleep 5
          done
          cmp -s /tmp/live.js worker/live-recovered/control-plane-vnext.js || { echo "::error title=VERIFY_APEX_ASSET_CMP::zevanory.api.br asset differs from canonical after 150s"; exit 1; }
          python3 scripts/deploy/verify-live-asset.py || { echo "::error title=VERIFY_LIVE_ASSET::UTF-8/marker assertions failed"; exit 1; }
          # Cloudflare edge propagation can lag behind the successful Worker upload.
          # Sales open: the financial proof is bound to the release SHA, so every deploy
          # invalidates it and /api/status falls back to globally-blocked. Renew it for the
          # new release (signed GET-only audit) before the exact-release poll.
          # Decide on the OWNER'S authorized request, not on the effective state: a new
          # release SHA has, by design, no proof yet, so "open" is already false here and
          # the renewal was skipped -> exact-release poll mismatch -> automatic rollback.
          if curl -fsS https://zevanory.api.br/api/sales/status | python3 -c 'import json,sys;j=json.load(sys.stdin);sys.exit(0 if (j.get("open") is True or j.get("requested") is True) else 1)'; then
            for i in $(seq 1 30); do
              rel="$(curl -fsS https://zevanory.api.br/api/release | python3 -c 'import json,sys;print((json.load(sys.stdin).get("deployment") or {}).get("commit_sha",""))' || true)"
              [ "$rel" = "$TARGET_RUNTIME_SHA" ] && break
              sleep 5
            done
            python3 scripts/financial_proof_renewal.py || { sleep 15; python3 scripts/financial_proof_renewal.py; } || echo "::warning title=DEPLOY_PROOF_RENEWAL::not accepted yet; exact-release poll decides"
          fi
          # Poll the canonical, non-query API until it serves this exact release SHA.
          exact_sha=0
          for i in $(seq 1 30); do
            curl -fsS https://zevanory.api.br/api/status -o /tmp/status.json || true
            curl -fsS https://zevanory.api.br/api/sales/status -o /tmp/sales.json || true
            curl -fsS https://zevanory.api.br/api/health -o /tmp/health.json || true
            curl -fsS https://zevanory.api.br/api/control-plane -o /tmp/control.json || true
            curl -fsS https://zevanory.api.br/api/core/v1/snapshot -o /tmp/core.json || true
            curl -fsS https://zevanory.api.br/api/core/v1/evaluation/zea10 -o /tmp/zea10.json || true
            if GITHUB_SHA="$GITHUB_SHA" python3 scripts/deploy/verify-exact-release-poll.py;
            then
              exact_sha=1
              break
            fi
            sleep 5
          done
          if [ "$exact_sha" != "1" ]; then
            GITHUB_SHA="$GITHUB_SHA" VERIFY_DIAG=1 python3 scripts/deploy/verify-exact-release-poll.py || true
            exit 1
          fi
          python3 scripts/deploy/verify-exact-release-final.py
          python3 scripts/deploy/verify-brand-assets-live.py
      - name: Verify production API legal surfaces and parity after deploy
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-production-surfaces.py > /tmp/surfaces.log 2>&1 || { tail -5 /tmp/surfaces.log | tr '\n' ' ' | cut -c1-900 | sed 's/^/::error title=VERIFY_SURFACES::/'; echo; cat /tmp/surfaces.log; exit 1; }
          cat /tmp/surfaces.log
      - name: Verify live HSTS CSP and Mercado Pago navigation
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -D /tmp/live-security-headers.txt -o /tmp/live-solutions.html https://zevanory.api.br/solucoes
          python3 scripts/verify-live-headers.py /tmp/live-security-headers.txt > /tmp/headers.log 2>&1 || { tail -5 /tmp/headers.log | tr '\n' ' ' | cut -c1-900 | sed 's/^/::error title=VERIFY_HEADERS::/'; echo; exit 1; }
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node scripts/deploy/mercadopago-csp-smoke.mjs > /tmp/mpsmoke.log 2>&1 || { tail -5 /tmp/mpsmoke.log | tr '\n' ' ' | cut -c1-900 | sed 's/^/::error title=VERIFY_MP_SMOKE::/'; echo; exit 1; }
          cat /tmp/mpsmoke.log
      - name: P20 diário D1 - binding efetivo no Worker publicado (conferência)
        # NC-P2b-DEP-01/02: lê na Cloudflare a configuração EFETIVA da versão ativa (deployment a 100%, tag = este SHA,
        # bindings da versão e de /settings) com o token do DEPLOY deste job, que já lê /settings e /deployments
        # (Workers Scripts Read no zevanory). O token CF_TOKEN_D1_DIARIO_READ é só D1 Read e não lê Worker.
        # certificar/manter: DIARIO presente com o UUID certo nas DUAS fontes (/settings E a lista de bindings de
        # /versions/<id>; sem a lista de /versions é NAO_COMPROVADO, fail-closed: NC-1017-01). off/rollback: DIARIO
        # ausente. FAIL reprova (e dispara o rollback automático abaixo). NAO_COMPROVADO reprova em certificar, manter e
        # rollback; em off vira aviso explícito de "não comprovado", nunca PASS.
        id: diariobinding
        if: steps.auth.outputs.available == 'true' && steps.deployworker.outcome == 'success'
        shell: bash
        run: |
          set -uo pipefail
          modo="${DIARIO_D1_MODO:-}"; [ -n "$modo" ] || modo="off"
          case "$modo" in
            certificar|manter) esperado="presente"; fontes="--duas-fontes" ;;
            off|rollback) esperado="ausente"; fontes="" ;;
            *) echo "::error title=DIARIO_D1_MODO_INVALIDO::diario_d1=$modo"; exit 1 ;;
          esac
          python3 scripts/deploy/diario_d1_certify.py binding --expect "$esperado" --candidate "$TARGET_RUNTIME_SHA" $fontes > /tmp/diario-binding.out 2>&1; rc=$?
          cat /tmp/diario-binding.out
          case "$rc" in
            0)
              echo "state=PASS" >> "$GITHUB_OUTPUT"
              echo "::notice title=DIARIO_D1_BINDING_EFETIVO::PASS: binding DIARIO $esperado na versão ativa $TARGET_RUNTIME_SHA (diario_d1=$modo)"
              ;;
            3)
              echo "state=NAO_COMPROVADO" >> "$GITHUB_OUTPUT"
              if [ "$modo" = "off" ]; then
                echo "::warning title=DIARIO_D1_BINDING_EFETIVO::NAO_COMPROVADO (não é PASS): API da Cloudflare inalcançável; ausência do DIARIO não conferida neste deploy rotineiro"
                exit 0
              fi
              echo "::error title=DIARIO_D1_BINDING_EFETIVO::NAO_COMPROVADO em diario_d1=$modo: sem prova da configuração efetiva, o deploy reprova"
              exit 1
              ;;
            *)
              echo "state=FAIL" >> "$GITHUB_OUTPUT"
              echo "::error title=DIARIO_D1_BINDING_EFETIVO::FAIL: binding DIARIO não está $esperado na versão ativa (diario_d1=$modo); ver DIARIO_D1_BINDING_EFETIVO no log"
              exit 1
              ;;
          esac
      - name: P20 diário D1 - readback obrigatório da certificação (certificar e manter; reprova o job)
        # DEC-P20-D1-01: leitura com credencial PRÓPRIA (CF_TOKEN_D1_DIARIO_READ, só D1 Read), entregue só a este passo;
        # sem ela a certificação reprova (nunca cai para o token de migração nem para o compartilhado do deploy).
        # NC-P2b-DEP-02: em certificar, prova diario_head = 1, as 3 migrações, os objetos, abandono_* = 0 e iguais aos
        # de antes da promoção, e exige o binding efetivo PASS do passo anterior. Falha reprova o job e o rollback
        # automático abaixo volta à versão anterior. manter: a mesma prova, com o resumo da conferência pré-promoção.
        # off/rollback: não se aplica, nenhuma chamada D1.
        if: steps.auth.outputs.available == 'true' && steps.deployworker.outcome == 'success'
        env:
          DIARIO_MIG_STATE: ${{ steps.diariomig.outputs.state }}
          DIARIO_ANTES: ${{ steps.diariomig.outputs.antes }}
          DIARIO_BINDING_STATE: ${{ steps.diariobinding.outputs.state }}
          # Só em certificar e manter o segredo chega ao processo; em off/rollback o valor é vazio.
          CF_TOKEN_D1_DIARIO_READ: ${{ (needs.guard.outputs.diario_d1 == 'certificar' || needs.guard.outputs.diario_d1 == 'manter') && secrets.CF_TOKEN_D1_DIARIO_READ || '' }}
          CLOUDFLARE_API_TOKEN: ""
          CLOUDFLARE_PUBLIC_OWNER_API_TOKEN: ""
          CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
        shell: bash
        run: |
          set -uo pipefail
          modo="${DIARIO_D1_MODO:-}"; [ -n "$modo" ] || modo="off"
          if [ "$modo" != "certificar" ] && [ "$modo" != "manter" ]; then
            echo "::notice title=DIARIO_D1_READBACK::diario_d1=$modo: readback D1 não se aplica (sem binding DIARIO, nenhuma chamada D1)"
            exit 0
          fi
          reprova() { echo "::error title=DIARIO_D1_READBACK::$1 Certificação NÃO comprovada: o job reprova e o rollback automático volta à versão sem DIARIO."; exit 1; }
          [ "${DIARIO_MIG_STATE:-}" = "certificado_pre" ] || reprova "pré-promoção não certificada (estado=${DIARIO_MIG_STATE:-?})."
          [ "${DIARIO_BINDING_STATE:-}" = "PASS" ] || reprova "binding efetivo não comprovado (estado=${DIARIO_BINDING_STATE:-?})."
          [ -n "${CF_TOKEN_D1_DIARIO_READ:-}" ] || reprova "segredo CF_TOKEN_D1_DIARIO_READ ausente no environment producao-critica."
          SQL="$(python3 scripts/deploy/diario_d1_certify.py sql)" || reprova "migrations/d1 diverge das migrações revisadas."
          if ! CLOUDFLARE_API_TOKEN="$CF_TOKEN_D1_DIARIO_READ" npx --yes wrangler@4.143.0 d1 execute zevanory-diario-p20 --remote --config wrangler.central-fix.jsonc --json --command "$SQL" > /tmp/diario-depois.json 2>/tmp/diario-depois.err; then
            reprova "leitura falhou (token de leitura sem D1 Read ou banco inacessível): $(tail -3 /tmp/diario-depois.err | tr '\n' ' ' | cut -c1-400)"
          fi
          printf '%s' "${DIARIO_ANTES:-}" > /tmp/diario-antes-resumo.json
          python3 scripts/deploy/diario_d1_certify.py check --fase depois --antes /tmp/diario-antes-resumo.json /tmp/diario-depois.json > /tmp/diario-depois.out 2>&1; rc=$?
          cat /tmp/diario-depois.out
          [ "$rc" = "0" ] || reprova "$(grep -E '=FAIL' /tmp/diario-depois.out | tr '\n' ' ' | cut -c1-700)"
          echo "::notice title=DIARIO_D1_CERTIFICACAO::PASS (diario_d1=$modo): binding DIARIO efetivo nas duas fontes (UUID 1b1bfa19), d1_migrations com as 3, objetos esperados, diario_head=1, abandono_* = 0 antes e depois"
      - name: Post-promotion effective version (T1)
        id: postpromo
        if: steps.auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          # FAIL (positive evidence) fails this step -> automatic rollback below.
          # NAO_COMPROVADO (observer unreachable) does NOT roll back: --unproven-exit 0 and the
          # certification gate after the rollback step fails the run instead.
          # Exceção D1 (NC-1017-01) no passo seguinte, só em diario_d1=certificar.
          python3 scripts/deploy/promotion_guard.py --verify-promoted --unproven-exit 0 --service zevanory \
            --candidate "$TARGET_RUNTIME_SHA" \
            --readback-url https://zevanory.api.br/api/release --readback-path deployment.commit_sha \
            --cloudflare-script zevanory
      - name: P20 diário D1 - pós-promoção NAO_COMPROVADO em certificar ou manter dispara o rollback (NC-1017-01)
        # A regra geral (T1) continua: um observador inalcançável não desfaz uma versão boa (--unproven-exit 0 acima; o
        # Certification gate reprova depois). Exceção explícita e estreita para os deploys que ligam o DIARIO:
        #  - certificar: a promoção só troca a configuração do D1 do MESMO SHA já vivo (motivo=d1-config); o rollback volta
        #    ao mesmo código sem DIARIO, conferindo --expect ausente nas duas fontes;
        #  - manter (NC-1018-01): um deploy com o D1 ligado não fica no ar sem prova da versão efetiva; o rollback volta à
        #    versão anterior (o código anterior também), conferindo que a configuração do DIARIO ficou coerente.
        if: steps.auth.outputs.available == 'true' && (needs.guard.outputs.diario_d1 == 'certificar' || needs.guard.outputs.diario_d1 == 'manter') && steps.postpromo.outputs.state == 'NAO_COMPROVADO'
        env:
          POST_REASON: ${{ steps.postpromo.outputs.reason }}
        run: |
          echo "::error title=DIARIO_D1_POS_PROMOCAO_NAO_COMPROVADO::diario_d1=${DIARIO_D1_MODO:-?}: pós-promoção NAO_COMPROVADO ($POST_REASON); sem prova da versão efetiva a certificação não fica no ar: rollback automático a seguir (NC-1017-01)"
          exit 1
      - name: Automatic rollback after failed post-deploy smoke
        if: failure() && steps.auth.outputs.available == 'true' && steps.deployworker.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "POSTDEPLOY_SMOKE_FAILED=1"
          npx --yes wrangler@4.143.0 rollback --name zevanory --config wrangler.central-fix.jsonc --message "Automatic rollback after failed production smoke for $TARGET_RUNTIME_SHA"
          for i in $(seq 1 20); do
            code="$(curl -sS -o /tmp/rollback-health.json -w '%{http_code}' https://zevanory.api.br/api/health || true)"
            if [ "$code" = "200" ] && python3 scripts/deploy/verify-rollback-health.py /tmp/rollback-health.json;
            then
              echo "AUTO_ROLLBACK_HEALTH=PASS"
              # Never renew on an unhealthy rollback. Dispatch the existing
              # signed, GET-only financial proof workflow after health is proven.
              gh workflow run order12a-financial-proof-renewal.yml --repo "$GITHUB_REPOSITORY" --ref gh-pages
              echo "AUTO_ROLLBACK_FINANCIAL_PROOF_RENEWAL_DISPATCH=PASS"
              case "${DIARIO_D1_MODO:-off}" in
                certificar)
                  # NC-P2b-DEP-01/NC-1017-01: depois do rollback de uma certificação, confere nas DUAS fontes que a versão
                  # ativa está SEM o binding DIARIO (as tabelas nunca são apagadas; este workflow não tem DROP).
                  python3 scripts/deploy/diario_d1_certify.py binding --expect ausente --duas-fontes || { echo "::error title=DIARIO_D1_ROLLBACK_AUTOMATICO::versão ativa depois do rollback ainda com DIARIO ou não comprovada. Recuperação: dispatch diario_d1=rollback motivo=d1-config no mesmo SHA (docs/p20/diario-d1.md, Riscos residuais)"; exit 1; }
                  echo "::notice title=DIARIO_D1_ROLLBACK_AUTOMATICO::versão ativa sem o binding DIARIO"
                  ;;
                manter)
                  # NC-1018-04: a versão anterior pode ter o DIARIO (deploy manter anterior) ou não (antes da troca do
                  # padrão). Confere nas duas fontes que a configuração ficou COERENTE (DIARIO ausente, ou presente com o
                  # UUID certo); qualquer outra coisa reprova com o procedimento.
                  python3 scripts/deploy/diario_d1_certify.py binding --expect coerente --duas-fontes || { echo "::error title=DIARIO_D1_ROLLBACK_AUTOMATICO::versão ativa depois do rollback de um manter com DIARIO incoerente ou não comprovado. Recuperação: dispatch diario_d1=off (rotina) ou rollback + d1-config (docs/p20/diario-d1.md, Riscos residuais)"; exit 1; }
                  echo "::notice title=DIARIO_D1_ROLLBACK_AUTOMATICO::versão ativa com a configuração do DIARIO coerente (diario_d1=manter)"
                  ;;
                rollback)
                  # Risco residual documentado: o rollback automático de um diario_d1=rollback volta à versão ANTERIOR, que
                  # tinha o DIARIO. A saúde vem primeiro (a sombra tolera o binding); o D1 continua ligado e o job reprova.
                  echo "::error title=DIARIO_D1_ROLLBACK_NAO_CONCLUIDO::o smoke do redeploy sem DIARIO falhou e o rollback automático restaurou a versão anterior (COM o binding DIARIO). Recuperação: corrigir a causa do smoke e repetir diario_d1=rollback motivo=d1-config (docs/p20/diario-d1.md, Riscos residuais)"
                  ;;
              esac
              exit 0
            fi
            sleep 5
          done
          echo "AUTO_ROLLBACK_HEALTH=FAIL"
          echo "::error title=AUTO_ROLLBACK_HEALTH_FAIL::health não voltou depois do rollback automático (diario_d1=${DIARIO_D1_MODO:-off}). Recuperação determinística: docs/p20/diario-d1.md, seção Riscos residuais (health depois do rollback)."
          exit 1
      - name: Certification gate (T1, after rollback decision)
        if: always() && steps.postpromo.outputs.state == 'NAO_COMPROVADO'
        env:
          POST_REASON: ${{ steps.postpromo.outputs.reason }}
        run: |
          case "${DIARIO_D1_MODO:-off}" in
            certificar|manter)
              echo "::error title=CERTIFICATION_NAO_COMPROVADO::diario_d1=$DIARIO_D1_MODO: pós-promoção NAO_COMPROVADO ($POST_REASON) disparou o rollback automático (NC-1017-01); ver DIARIO_D1_ROLLBACK_AUTOMATICO."
              exit 1
              ;;
          esac
          echo "::error title=CERTIFICATION_NAO_COMPROVADO::release $TARGET_RUNTIME_SHA kept live (smokes passed, no contrary evidence) but NOT certified: $POST_REASON. No rollback without independent evidence; re-check with t1-publisher-guard (workflow_dispatch: recheck_service=zevanory)."
          exit 1
      - name: R9 credential identity readback (names and categories only)
        # Depois da decisão de rollback de propósito: uma chave Stripe de TESTE ligada à produção reprova o run sem
        # desfazer o deploy (o defeito é do segredo, não do código).
        if: steps.auth.outputs.available == 'true' && steps.deployworker.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/credential_identity_readback.py https://zevanory.api.br
      - name: Dispatch exact-production ZEES-16 provider evidence
        if: steps.auth.outputs.available == 'true' && steps.deployworker.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/deploy/dispatch-exact-production-evidence.sh "$TARGET_RUNTIME_SHA"
      - name: Fail-closed deployment status
        if: steps.auth.outputs.available != 'true'
        run: |
          echo "Deployment blocked: GitHub Actions does not currently hold authenticated authority for the Cloudflare account that owns the public ZEVANORY domains."
          echo "Production is unchanged. No alternate account is permitted to masquerade as production."
          exit 1
