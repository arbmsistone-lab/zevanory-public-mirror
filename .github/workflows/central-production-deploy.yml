name: ZEVANORY central production deploy
on:
  workflow_dispatch:
    inputs:
      # P20 diário D1, NO-GO do GPT-6 (NC-P2b-DEP-01/02/03 e NC-1017-01). docs/p20/diario-d1.md, seção "Primeiro deploy
      # com D1". Push e dispatch sem input usam o padrão VERSIONADO em .github/diario-d1-modo.json ("off" até o
      # proprietário e o GPT-6 trocarem para "manter" por PR, depois de uma certificação PASS).
      diario_d1:
        description: "D1 do diário: padrao (o de .github/diario-d1-modo.json); off (sem binding), manter (religa só se o banco já está certificado), certificar (fail-closed) ou rollback (redeploy sem binding)"
        required: false
        type: choice
        options: ["padrao", "off", "manter", "certificar", "rollback"]
        default: "padrao"
      motivo:
        description: "rotina (padrão) ou d1-config: promove só o MESMO SHA já vivo (mudança só de configuração); exigido por certificar e rollback"
        required: false
        type: choice
        options: ["rotina", "d1-config"]
        default: "rotina"
  push:
    branches: [gh-pages]
    paths:
      - "worker/live-recovered/control-plane-vnext.js"
      - "worker/control-plane-vnext-source.mjs"
      - "worker/cloudflare-worker.compat.mjs"
      # Modules bundled into the Worker that used to merge without a deploy (12/10: the KV write
      # budget fix in data-backup.mjs did not reach production).
      - "worker/*.mjs"
      - "worker/cloudflare-worker.recovered.mjs"
      - "worker/data-backup.mjs"
      - "worker/voice-eval.mjs"
      - "worker/commercial-metrics-projection.mjs"
      - "worker/internal-financial-audit.mjs"
      - "worker/whatsapp-*.mjs"
      - "worker/live-runtime-status.mjs"
      - "worker/creative-autonomy.mjs"
      - "tests/creative-offer-containment.test.mjs"
      - "worker/multichannel-autonomy.mjs"
      - "worker/blog-editorial.mjs"
      - "worker/acquisition-engine.mjs"
      - "worker/brand-kit.mjs"
      - "worker/brand-profiles.mjs"
      - "tests/brand-profiles.test.mjs"
      - "worker/brand-approved.mjs"
      - "sales-public/brand/export/**"
      - "assets/brand/export/**"
      - "scripts/deploy/copy-brand-export.py"
      - "scripts/deploy/verify-brand-assets-live.py"
      - "worker/bluesky-publisher.mjs"
      - "tests/acquisition-engine.test.mjs"
      - "tests/instant-status-sales-coherence.test.mjs"
      - "tests/bluesky-publisher.test.mjs"
      - "worker/inbound-autonomy.mjs"
      - "worker/affiliate-program.mjs"
      - "worker/autonomy-health.mjs"
      - "worker/support-knowledge.mjs"
      - "worker/cloudflare-worker.recovered.mjs"
      - "worker/mercadopago-webhook-safety.mjs"
      - "worker/sandbox-proof-v2.mjs"
      - "worker/refund-flow.mjs"
      - "worker/lead-magnet.mjs"
      - "worker/reviews.mjs"
      - "worker/owner-alerts.mjs"
      - "worker/operational-activity-sync.mjs"
      - "worker/activity-ledger.mjs"
      - "worker/whatsapp-conversation.mjs"
      - "worker/post-sale.mjs"
      - "worker/funnel.mjs"
      - "worker/sales-control.mjs"
      - "worker/internal-financial-audit.mjs"
      - "worker/commercial-metrics-projection.mjs"
      - "tests/commercial-metrics-projection.test.mjs"
      - "worker/commercial-checkout-guard.mjs"
      - "worker/signed-audit-probe.mjs"
      - "tests/internal-financial-audit.test.mjs"
      - "tests/commercial-checkout-guard.test.mjs"
      - "tests/signed-audit-probe.test.mjs"
      - "worker/whatsapp-onboarding.mjs"
      - "tests/order7-whatsapp-commercial.test.mjs"
      - "worker/whatsapp-inbound-safety.mjs"
      - "worker/voice-provider-router.mjs"
      - "worker/voice-chunks.mjs"
      - "worker/voice-operational-audit.mjs"
      - "scripts/deploy/prepare-central-candidate.py"
      - "scripts/deploy/verify-financial-boundary.py"
      - "scripts/deploy/check-binding-budget.py"
      - "worker/voice-pcm.mjs"
      - "worker/whatsapp-e2e-evidence.mjs"
      - "worker/whatsapp-neon-store.mjs"
      - "tests/whatsapp-neon-store.test.mjs"
      - "tests/mercadopago-webhook-safety.test.mjs"
      - "worker/evidence-control-plane.mjs"
      - "tests/live-runtime-status.test.mjs"
      - "tests/creative-autonomy.test.mjs"
      - "tests/multichannel-autonomy.test.mjs"
      - "tests/inbound-autonomy.test.mjs"
      - "tests/affiliate-program.test.mjs"
      - "tests/autonomy-health.test.mjs"
      - "tests/owner-alert-policy.test.mjs"
      - ".github/workflows/autonomy-live-evidence.yml"
      - "worker/zevanory-control-core.mjs"
      - "worker/production-health-safety.mjs"
      - "tests/production-staging-health.test.mjs"
      - "tests/core-snapshot-memo.test.mjs"
      - "worker/core-command-executor.mjs"
      - "worker/zea10-autonomy.mjs"
      - "worker/zea10-evaluator.mjs"
      - "worker/admin-console.mjs"
      - "admin.css"
      - "evidence/admin-control-center.json"
      - ".github/workflows/central-production-deploy.yml"
      # Keep the owner-operated sales switch deploy-gated on the exact branch SHA.
      - ".github/workflows/zevanory-open-sales.yml"
      - ".github/workflows/zevanory-close-sales.yml"
      - "scripts/sales_switch_workflow.py"
      - ".github/workflows/financial-e2e-closure.yml"
      - ".github/workflows/financial-e2e-stripe.yml"
      - "scripts/financial_e2e_stripe.py"
      - "scripts/financial_e2e_closure.py"
      - ".github/workflows/zpc-cloudflare-route-discovery.yml"
      # P20 diário D1: uma migração nova chega ao banco pelo passo de migração deste deploy.
      - "migrations/d1/**"
      - "scripts/deploy/diario_d1_certify.py"
      # Trocar o padrão (off <-> manter) entra em vigor no próprio merge.
      - ".github/diario-d1-modo.json"
concurrency:
  group: deploy-zevanory
  cancel-in-progress: false
  queue: max

jobs:
  p21_token:
    # P21 / R18: interruptor versionado ops/token-cutover.json lido no SHA deste run (sem segredos);
    # os jobs com credencial dependem dele. docs/p21/tokens-por-worker.md
    uses: ./.github/workflows/p21-token-cutover.yml
    permissions:
      contents: read
    with:
      service: zevanory

  guard:
    environment: producao-critica  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    # T1 (plan 3.1): runs inside the serialized deploy-zevanory group, right before promotion.
    # An older queued run (candidate is an ancestor of what is live) does nothing; diverged
    # history, a mismatch between the Cloudflare effective version and /api/release, or an
    # unreadable production with a candidate that is not the branch tip refuse the promotion.
    runs-on: ubuntu-latest
    needs: p21_token
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.guard.outputs.decision }}
      diario_d1: ${{ steps.modo.outputs.diario_d1 }}
      motivo: ${{ steps.modo.outputs.motivo }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ needs.p21_token.outputs.cutover == 'true' && secrets.CF_TOKEN_ZEVANORY || needs.p21_token.outputs.cutover == 'false' && (secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN) || '' }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
    steps:
      - name: P21 credencial Cloudflare dedicada (interruptor ops/token-cutover.json)
        shell: bash
        env:
          P21_SERVICE: zevanory
          P21_SECRET: CF_TOKEN_ZEVANORY
          P21_SECRET_ESPERADO: ${{ needs.p21_token.outputs.secret }}
          P21_CUTOVER: ${{ needs.p21_token.outputs.cutover }}
          P21_TOKEN_ID: ${{ needs.p21_token.outputs.token_id }}
          P21_ACCOUNT: ${{ needs.p21_token.outputs.account }}
          P21_DEDICADO_PRESENTE: ${{ secrets.CF_TOKEN_ZEVANORY != '' }}
        run: |
          set -euo pipefail
          case "${P21_CUTOVER:-}" in
            false)
              echo "::warning title=TOKEN_LEGADO_EM_USO::serviço $P21_SERVICE com cutover=false em ops/token-cutover.json: este job usa o token legado (CLOUDFLARE_PUBLIC_OWNER_API_TOKEN/CLOUDFLARE_API_TOKEN, alcance da conta). Transição P21: docs/p21/tokens-por-worker.md"
              ;;
            true)
              # Mesmo saneamento do #851: um token salvo com quebra de linha não pode quebrar a chamada.
              CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
              if [ "${P21_SECRET_ESPERADO:-}" != "$P21_SECRET" ]; then
                echo "::error title=TOKEN_CUTOVER_DIVERGENTE::o workflow declara $P21_SECRET mas ops/token-cutover.json registra ${P21_SECRET_ESPERADO:-nada} para $P21_SERVICE"
                exit 1
              fi
              if [ "${P21_DEDICADO_PRESENTE:-}" != "true" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
                echo "::error title=TOKEN_DEDICADO_AUSENTE::serviço $P21_SERVICE com cutover=true exige o segredo $P21_SECRET no environment deste job; o token legado nunca é usado. Cadastre o segredo ou volte cutover=false por PR (docs/p21/tokens-por-worker.md)."
                exit 1
              fi
              verify="$(curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$P21_ACCOUNT/tokens/verify" || true)"
              got="$(printf '%s' "$verify" | python3 -c 'import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              d = {}
          r = d.get("result") if isinstance(d, dict) else None
          ok = isinstance(d, dict) and d.get("success") is True and isinstance(r, dict) and r.get("status") == "active"
          print(r.get("id", "") if ok else "")' || true)"
              if [ -z "$got" ] || [ "$got" != "${P21_TOKEN_ID:-}" ]; then
                echo "::error title=TOKEN_ID_DIVERGENTE::o segredo $P21_SECRET não é o token ativo ${P21_TOKEN_ID:-sem-id} registrado em ops/token-cutover.json para $P21_SERVICE (verify na conta $P21_ACCOUNT: ${got:-falhou})"
                exit 1
              fi
              echo "::notice title=TOKEN_DEDICADO_EM_USO::serviço $P21_SERVICE usa $P21_SECRET (token $got, conta $P21_ACCOUNT); o legado está vazio neste job"
              ;;
            *)
              echo "::error title=TOKEN_CUTOVER_ILEGIVEL::interruptor de $P21_SERVICE ilegível (${P21_CUTOVER:-vazio}); nenhum token é entregue"
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: P20 diário D1 - modo e motivo do dispatch (validação, fail-closed)
        # NC-P2b-DEP-02/03 e NC-1017-01 (docs/p20/diario-d1.md, "Primeiro deploy com D1"). Sem input (push, dispatch
        # sem escolha): o padrão versionado de .github/diario-d1-modo.json ("off" ou "manter"), lido neste SHA.
        # certificar e rollback só com motivo=d1-config (mesmo SHA já vivo, só configuração); d1-config só com eles.
        id: modo
        shell: bash
        env:
          DIARIO_D1_INPUT: ${{ inputs.diario_d1 }}
          MOTIVO_INPUT: ${{ inputs.motivo }}
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          padrao="$(python3 -c 'import json;d=json.load(open(".github/diario-d1-modo.json"));p=d.get("padrao");print(p if p in ("off","manter") else "INVALIDO")' 2>/dev/null || echo INVALIDO)"
          if [ "$padrao" = "INVALIDO" ]; then
            echo "::error title=DIARIO_D1_PADRAO_INVALIDO::.github/diario-d1-modo.json ausente ou com padrao fora de off|manter"; exit 1
          fi
          modo="${DIARIO_D1_INPUT:-}"; motivo="${MOTIVO_INPUT:-}"
          if [ "$EVENTO" != "workflow_dispatch" ] && { [ -n "$modo" ] || [ -n "$motivo" ]; }; then
            echo "::error title=DIARIO_D1_MODO_INVALIDO::evento $EVENTO não aceita input de modo ou motivo"; exit 1
          fi
          if [ -z "$modo" ] || [ "$modo" = "padrao" ]; then modo="$padrao"; fi
          [ -n "$motivo" ] || motivo="rotina"
          case "$modo" in off|manter|certificar|rollback) ;; *) echo "::error title=DIARIO_D1_MODO_INVALIDO::diario_d1=$modo (aceitos: off, manter, certificar, rollback)"; exit 1 ;; esac
          case "$motivo" in rotina|d1-config) ;; *) echo "::error title=MOTIVO_INVALIDO::motivo=$motivo (aceitos: rotina, d1-config)"; exit 1 ;; esac
          if [ "$modo" = "manter" ] && [ "$padrao" != "manter" ]; then
            # NC-1018-01: manter só com o padrão versionado em manter (decisão do proprietário/GPT-6 no arquivo protegido);
            # um dispatch manter com o padrão em off ligaria o D1 junto com código novo por fora do arquivo.
            echo "::error title=DIARIO_D1_MODO_INVALIDO::diario_d1=manter só com .github/diario-d1-modo.json em \"padrao\": \"manter\" (hoje: $padrao). Para ligar o D1 use certificar + d1-config."; exit 1
          fi
          case "$modo" in
            certificar|rollback)
              if [ "$motivo" != "d1-config" ]; then
                echo "::error title=DIARIO_D1_MODO_INVALIDO::diario_d1=$modo exige motivo=d1-config (promove só o MESMO SHA já vivo; a mudança de D1 nunca viaja junto com código)"; exit 1
              fi
              ;;
            *)
              if [ "$motivo" = "d1-config" ]; then
                echo "::error title=MOTIVO_INVALIDO::motivo=d1-config só com diario_d1=certificar ou rollback"; exit 1
              fi
              ;;
          esac
          echo "diario_d1=$modo" >> "$GITHUB_OUTPUT"
          echo "motivo=$motivo" >> "$GITHUB_OUTPUT"
          echo "::notice title=DIARIO_D1_MODO::diario_d1=$modo motivo=$motivo evento=$EVENTO padrao=$padrao"
      - name: Pre-promotion guard
        id: guard
        env:
          # NC-P2b-DEP-03: d1-config promove só o MESMO SHA já vivo (as duas fontes); SHA antigo continua bloqueado.
          PROMOTION_MOTIVO: ${{ steps.modo.outputs.motivo }}
        run: |
          set -euo pipefail
          python3 scripts/deploy/promotion_guard.py --service zevanory \
            --candidate "$GITHUB_SHA" --motivo "${PROMOTION_MOTIVO:-rotina}" \
            --readback-url https://zevanory.api.br/api/release --readback-path deployment.commit_sha \
            --cloudflare-script zevanory
  deploy:
    environment: producao-critica  # B01 M1: segredos só no Environment (gh-pages)
    needs: [guard, p21_token]
    if: ${{ github.ref == 'refs/heads/gh-pages' && (needs.guard.outputs.decision == 'promote') }}  # B01 patch 05b
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # P21: com cutover=false os dois valores são exatamente os de antes; com true o legado fica vazio (sem queda).
      CLOUDFLARE_PUBLIC_OWNER_API_TOKEN: ${{ needs.p21_token.outputs.cutover == 'false' && secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || '' }}
      CLOUDFLARE_API_TOKEN: ${{ needs.p21_token.outputs.cutover == 'true' && secrets.CF_TOKEN_ZEVANORY || needs.p21_token.outputs.cutover == 'false' && (secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN) || '' }}
      PUBLIC_OWNER_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '1b26415802588185a86c1d4d3ebf5bdb' }}
      MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
      MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
      # F2 item 9: MERCADOPAGO_TEST_* removidos do deploy de produção (nenhum passo os lia; sandbox só no Worker de certificação).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
      # R9 (Sol 164 §4): credencial de operador da produção com nome próprio; queda para o nome antigo só na transição.
      ZEVANORY_OPERATOR_TOKEN: ${{ secrets.ZEVANORY_OPERATOR_TOKEN || secrets.CERTIFICATION_E2E_TOKEN }}
      # Deploy the exact merged source SHA; sales remain fail-closed by configuration.
      TARGET_RUNTIME_SHA: ${{ github.sha }}
      # P20 diário D1 (NC-P2b-DEP-01/02): off | certificar | rollback, validado no job guard. Lido pelo gerador
      # (binding DIARIO só em certificar) e pelos passos D1. Vazio vale off.
      DIARIO_D1_MODO: ${{ needs.guard.outputs.diario_d1 }}
    steps:
      - name: P21 credencial Cloudflare dedicada (interruptor ops/token-cutover.json)
        shell: bash
        env:
          P21_SERVICE: zevanory
          P21_SECRET: CF_TOKEN_ZEVANORY
          P21_SECRET_ESPERADO: ${{ needs.p21_token.outputs.secret }}
          P21_CUTOVER: ${{ needs.p21_token.outputs.cutover }}
          P21_TOKEN_ID: ${{ needs.p21_token.outputs.token_id }}
          P21_ACCOUNT: ${{ needs.p21_token.outputs.account }}
          P21_DEDICADO_PRESENTE: ${{ secrets.CF_TOKEN_ZEVANORY != '' }}
        run: |
          set -euo pipefail
          case "${P21_CUTOVER:-}" in
            false)
              echo "::warning title=TOKEN_LEGADO_EM_USO::serviço $P21_SERVICE com cutover=false em ops/token-cutover.json: este job usa o token legado (CLOUDFLARE_PUBLIC_OWNER_API_TOKEN/CLOUDFLARE_API_TOKEN, alcance da conta). Transição P21: docs/p21/tokens-por-worker.md"
              ;;
            true)
              # Mesmo saneamento do #851: um token salvo com quebra de linha não pode quebrar a chamada.
              CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
              if [ "${P21_SECRET_ESPERADO:-}" != "$P21_SECRET" ]; then
                echo "::error title=TOKEN_CUTOVER_DIVERGENTE::o workflow declara $P21_SECRET mas ops/token-cutover.json registra ${P21_SECRET_ESPERADO:-nada} para $P21_SERVICE"
                exit 1
              fi
              if [ "${P21_DEDICADO_PRESENTE:-}" != "true" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
                echo "::error title=TOKEN_DEDICADO_AUSENTE::serviço $P21_SERVICE com cutover=true exige o segredo $P21_SECRET no environment deste job; o token legado nunca é usado. Cadastre o segredo ou volte cutover=false por PR (docs/p21/tokens-por-worker.md)."
                exit 1
              fi
              verify="$(curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$P21_ACCOUNT/tokens/verify" || true)"
              got="$(printf '%s' "$verify" | python3 -c 'import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              d = {}
          r = d.get("result") if isinstance(d, dict) else None
          ok = isinstance(d, dict) and d.get("success") is True and isinstance(r, dict) and r.get("status") == "active"
          print(r.get("id", "") if ok else "")' || true)"
              if [ -z "$got" ] || [ "$got" != "${P21_TOKEN_ID:-}" ]; then
                echo "::error title=TOKEN_ID_DIVERGENTE::o segredo $P21_SECRET não é o token ativo ${P21_TOKEN_ID:-sem-id} registrado em ops/token-cutover.json para $P21_SERVICE (verify na conta $P21_ACCOUNT: ${got:-falhou})"
                exit 1
              fi
              echo "::notice title=TOKEN_DEDICADO_EM_USO::serviço $P21_SERVICE usa $P21_SECRET (token $got, conta $P21_ACCOUNT); o legado está vazio neste job"
              ;;
            *)
              echo "::error title=TOKEN_CUTOVER_ILEGIVEL::interruptor de $P21_SERVICE ilegível (${P21_CUTOVER:-vazio}); nenhum token é entregue"
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Materialize exact canonical runtime sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_RUNTIME_SHA"
          git checkout "$TARGET_RUNTIME_SHA" -- worker admin.css
          echo "CANONICAL_RUNTIME_SOURCE=$TARGET_RUNTIME_SHA"

      - name: Determine authenticated public-owner deployment authority
        id: auth
        shell: bash
        env:
          P21_CUTOVER: ${{ needs.p21_token.outputs.cutover }}
        run: |
          set -euo pipefail
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_AUTH_ROUTE=ABSENT_FAIL_CLOSED"
            exit 0
          fi
          if [ "${P21_CUTOVER:-}" = "true" ]; then
            echo "CLOUDFLARE_AUTH_SOURCE=P21_DEDICATED_TOKEN_CF_TOKEN_ZEVANORY"
          elif [ -n "${CLOUDFLARE_PUBLIC_OWNER_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_AUTH_SOURCE=PUBLIC_OWNER_DEDICATED_TOKEN"
          else
            echo "CLOUDFLARE_AUTH_SOURCE=LEGACY_FALLBACK_TOKEN"
          fi
          if [ "${CLOUDFLARE_ACCOUNT_ID:-}" != "$PUBLIC_OWNER_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_MISMATCH=FAIL_CLOSED"
            echo "EXPECTED_ACCOUNT=$PUBLIC_OWNER_ACCOUNT_ID"
            echo "CONFIGURED_ACCOUNT=${CLOUDFLARE_ACCOUNT_ID:-unset}"
            exit 0
          fi
          code="$(curl -sS -o /tmp/public-owner.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$PUBLIC_OWNER_ACCOUNT_ID" || true)"
          if [ "$code" != "200" ] || ! python3 -c "import json; d=json.load(open('/tmp/public-owner.json')); raise SystemExit(0 if d.get('success') is True else 1)"; then
            echo "CLOUDFLARE_PUBLIC_OWNER_AUTHORITY=UNAVAILABLE_FAIL_CLOSED"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "CLOUDFLARE_PUBLIC_OWNER_AUTHORITY=PASS"
          echo "CLOUDFLARE_ACCOUNT_ID=$PUBLIC_OWNER_ACCOUNT_ID"
      - name: Zero-cost guard (owner rule, fail closed before any deploy)
        run: python3 scripts/zero_cost_guard.py
      - name: Reconstruct exact production candidate
        if: steps.auth.outputs.available == 'true'
        env:
          ZEVANORY_LAUNCH_AUTHORIZATION: ${{ vars.ZEVANORY_LAUNCH_AUTHORIZATION }}
          MERCADOPAGO_PRODUCTION_ACCOUNT_HASH16: ${{ vars.MERCADOPAGO_PRODUCTION_ACCOUNT_HASH16 }}
          MERCADOPAGO_PRODUCTION_WEBHOOK_VERIFIED: ${{ vars.MERCADOPAGO_PRODUCTION_WEBHOOK_VERIFIED }}
