name: ZEVANORY central production deploy
on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - "worker/live-recovered/control-plane-vnext.js"
      - "worker/control-plane-vnext-source.mjs"
      - "worker/cloudflare-worker.compat.mjs"
      - "worker/cloudflare-worker.recovered.mjs"
      - "worker/whatsapp-onboarding.mjs"
      - "worker/whatsapp-e2e-evidence.mjs"
      - "worker/evidence-control-plane.mjs"
      - "worker/zevanory-control-core.mjs"
      - "worker/core-command-executor.mjs"
      - "worker/zea10-autonomy.mjs"
      - "worker/zea10-evaluator.mjs"
      - "worker/admin-console.mjs"
      - "admin.css"
      - "evidence/admin-control-center.json"
      - ".github/workflows/central-production-deploy.yml"
      - ".github/workflows/financial-e2e-closure.yml"
      - ".github/workflows/financial-e2e-stripe.yml"
      - "scripts/financial_e2e_stripe.py"
      - "scripts/financial_e2e_closure.py"
      - ".github/workflows/zpc-cloudflare-route-discovery.yml"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_PUBLIC_OWNER_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      PUBLIC_OWNER_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '1b26415802588185a86c1d4d3ebf5bdb' }}
      MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN || secrets.MERCADOPAGO_TEST_ACCESS_TOKEN }}
      MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET || secrets.MERCADOPAGO_TEST_WEBHOOK_SECRET }}
      MERCADOPAGO_TEST_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_TEST_ACCESS_TOKEN || secrets.MERCADOPAGO_ACCESS_TOKEN }}
      MERCADOPAGO_TEST_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_TEST_WEBHOOK_SECRET || secrets.MERCADOPAGO_WEBHOOK_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
      CERTIFICATION_E2E_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN }}
      # Deploy the exact merged source SHA; sales remain fail-closed by configuration.
      TARGET_RUNTIME_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Materialize exact canonical runtime sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_RUNTIME_SHA"
          git checkout "$TARGET_RUNTIME_SHA" -- worker admin.css
          echo "CANONICAL_RUNTIME_SOURCE=$TARGET_RUNTIME_SHA"

      - name: Determine authenticated public-owner deployment authority
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_AUTH_ROUTE=ABSENT_FAIL_CLOSED"
            exit 0
          fi
          if [ -n "${CLOUDFLARE_PUBLIC_OWNER_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_AUTH_SOURCE=PUBLIC_OWNER_DEDICATED_TOKEN"
          else
            echo "CLOUDFLARE_AUTH_SOURCE=LEGACY_FALLBACK_TOKEN"
          fi
          if [ "${CLOUDFLARE_ACCOUNT_ID:-}" != "$PUBLIC_OWNER_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_MISMATCH=FAIL_CLOSED"
            echo "EXPECTED_ACCOUNT=$PUBLIC_OWNER_ACCOUNT_ID"
            echo "CONFIGURED_ACCOUNT=${CLOUDFLARE_ACCOUNT_ID:-unset}"
            exit 0
          fi
          code="$(curl -sS -o /tmp/public-owner.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$PUBLIC_OWNER_ACCOUNT_ID" || true)"
          if [ "$code" != "200" ] || ! python3 -c "import json; d=json.load(open('/tmp/public-owner.json')); raise SystemExit(0 if d.get('success') is True else 1)"; then
            echo "CLOUDFLARE_PUBLIC_OWNER_AUTHORITY=UNAVAILABLE_FAIL_CLOSED"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "CLOUDFLARE_PUBLIC_OWNER_AUTHORITY=PASS"
          echo "CLOUDFLARE_ACCOUNT_ID=$PUBLIC_OWNER_ACCOUNT_ID"
      - name: Reconstruct exact production candidate
        if: steps.auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          git fetch origin final-83620c6
          rm -rf public
          git archive 83620c680958d726fc4b0fd16e2574cdcc362a6d public | tar -x
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { CONTROL_PLANE_VNEXT_JS } from "./worker/control-plane-vnext-source.mjs";
          await writeFile("worker/live-recovered/control-plane-vnext.js", CONTROL_PLANE_VNEXT_JS, "utf8");
          await writeFile("public/control-plane-vnext.js", CONTROL_PLANE_VNEXT_JS, "utf8");
          NODE
          cmp -s worker/live-recovered/control-plane-vnext.js public/control-plane-vnext.js
          cp admin.css public/admin.css
          python3 - <<'PY'
          import json,os
          with open("public/build-info.json","w",encoding="utf-8") as f:
              json.dump({"sha":os.environ["TARGET_RUNTIME_SHA"],"source":"github-actions-cloudflare","repository":os.environ["GITHUB_REPOSITORY"]},f,indent=2)
              f.write("\n")
          PY
          git show 83620c680958d726fc4b0fd16e2574cdcc362a6d:wrangler.jsonc > wrangler.central-fix.jsonc
          python3 <<'PY'
          import json,os,re
          from pathlib import Path
          p="wrangler.central-fix.jsonc"
          c=json.load(open(p))
          c["account_id"]=os.environ["PUBLIC_OWNER_ACCOUNT_ID"]
          c["main"]="worker/cloudflare-worker.compat.mjs"
          c.pop("secrets",None)
          c.pop("services",None)
          c.pop("ai",None)
          c.pop("routes",None)
          c["workers_dev"]=True
          kv=c.setdefault("kv_namespaces",[])
          found_private=False
          for ns in kv:
              if ns.get("binding") in ("ZEVANORY_PRIVATE_ARTIFACTS","ZEVANORY_ARTEFATOS_PRIVADOS"):
                  ns["binding"]="ZEVANORY_PRIVATE_ARTIFACTS"
                  ns["id"]="728a45738e4047f29bcb89934fd533c1"
                  found_private=True
          if not found_private:
              kv.append({"binding":"ZEVANORY_PRIVATE_ARTIFACTS","id":"728a45738e4047f29bcb89934fd533c1"})
          c.setdefault("vars",{})["ZEVANORY_RELEASE_SHA"]=os.environ["TARGET_RUNTIME_SHA"]
          c["vars"]["ZEVANORY_RELEASE_REF"]="gh-pages"
          c["vars"]["ZEVANORY_DEPLOYMENT_ENV"]="production"
          c["vars"]["CERTIFICATION_PILOT_ENV"]="sandbox"
          c["vars"]["CERTIFICATION_PILOT_APPROVER"]="zevanory-certification-e2e"
          c["vars"]["MERCADOPAGO_ENV"]="sandbox"
          c["vars"]["PAYMENT_PROVIDER"]="mercadopago"
          c["vars"]["CHECKOUT_ENABLED"]="true"
          c["vars"]["FINANCIAL_EVENTS_ENABLED"]="true"
          c["vars"]["SALE_GLOBALLY_ENABLED"]="false"
          c["vars"]["PRE_SALE_GATES_APPROVED"]="false"
          c["vars"]["WHATSAPP_SALES_ENABLED"]="false"
          c["vars"]["ZEVANORY_WHATSAPP_DISPLAY"]="+55 88 99254-5413"
          c["vars"]["SUPPORT_CHANNEL"]="WhatsApp +55 88 99254-5413"
          runtime=c["vars"].setdefault("ZEVANORY_RUNTIME_CONFIG",{})
          if not isinstance(runtime,dict):
              runtime={}
              c["vars"]["ZEVANORY_RUNTIME_CONFIG"]=runtime
          for key in (
              "CLOUDFLARE_AI_FREE_ONLY",
              "CLOUDFLARE_AI_DAILY_CALL_LIMIT",
              "VOICE_TTS_PROVIDER",
              "VOICE_TTS_PROVIDER_CHAIN",
              "VOICE_TTS_FAILOVER_ENABLED",
              "GEMINI_FREE_TIER_CONFIRMED",
          ):
              if key in c["vars"]:
                  runtime[key]=c["vars"].pop(key)
          c["vars"].pop("ZEVANORY_WHATSAPP_E164",None)
          c["vars"].pop("ZEVANORY_WHATSAPP_COUNTRY",None)
          
          # Preserve compacted values through normalizeEnv.
          aliases=Path("worker/binding-aliases.mjs")
          alias_src=aliases.read_text(encoding="utf-8")
          alias_src=alias_src.replace(
              '      return Reflect.get(target, prop, receiver);',
              '      const direct = Reflect.get(target, prop, receiver);\n'
              '      if (direct !== undefined) return direct;\n'
              '      const runtime = Reflect.get(target, "ZEVANORY_RUNTIME_CONFIG", receiver);\n'
              '      if (runtime && typeof runtime === "object" && prop in runtime) return runtime[prop];\n'
              '      return undefined;'
          )
          alias_src=alias_src.replace(
              '      return Reflect.has(target, prop);',
              '      if (Reflect.has(target, prop)) return true;\n'
              '      const runtime = Reflect.get(target, "ZEVANORY_RUNTIME_CONFIG");\n'
              '      return Boolean(runtime && typeof runtime === "object" && prop in runtime);'
          )
          aliases.write_text(alias_src,encoding="utf-8")

          # Repair Mercado Pago certification sandbox to use the already-mounted sandbox credentials.
          recovered=Path("worker/cloudflare-worker.recovered.mjs")
          recovered_src=recovered.read_text(encoding="utf-8")
          recovered_src=recovered_src.replace(
              'if (!String(env.MERCADOPAGO_TEST_ACCESS_TOKEN || "").trim() || !String(env.MERCADOPAGO_TEST_WEBHOOK_SECRET || "").trim()) blockers.push("mercadopago_sandbox_credentials_missing");',
              'if (!String(env.MERCADOPAGO_ACCESS_TOKEN || "").trim() || !String(env.MERCADOPAGO_WEBHOOK_SECRET || "").trim()) blockers.push("mercadopago_sandbox_credentials_missing");'
          )
          recovered_src=recovered_src.replace(
              '    }\n    if (provider === "stripe") {\n',
              '    } else if (provider === "stripe") {\n',
              1
          )
          recovered_src=recovered_src.replace(
              'const pilotSandbox = Boolean(pilot?.authorized) && String(process.env.CERTIFICATION_PILOT_PAYMENT_MODE || "").toLowerCase() === "sandbox";',
              'const pilotSandbox = Boolean(pilot?.authorized) && String(process.env.CERTIFICATION_PILOT_ENV || "").toLowerCase() === "sandbox";'
          )
          recovered_src=recovered_src.replace(
              'const providerToken = pilotSandbox ? String(process.env.MERCADOPAGO_TEST_ACCESS_TOKEN || "") : String(process.env.MERCADOPAGO_ACCESS_TOKEN || "");',
              'const providerToken = String(process.env.MERCADOPAGO_ACCESS_TOKEN || "");'
          )
          recovered_src=recovered_src.replace(
              'if (provider === "mercadopago_test") return handleMercadoPagoWebhook(req, res, { accessToken: process.env.MERCADOPAGO_TEST_ACCESS_TOKEN, webhookSecret: process.env.MERCADOPAGO_TEST_WEBHOOK_SECRET, certificationOnly: true, source: "mercadopago-test" });',
              'if (provider === "mercadopago_test") return handleMercadoPagoWebhook(req, res, { accessToken: process.env.MERCADOPAGO_ACCESS_TOKEN, webhookSecret: process.env.MERCADOPAGO_WEBHOOK_SECRET, certificationOnly: true, source: "mercadopago-test" });'
          )
          recovered.write_text(recovered_src,encoding="utf-8")
          # Replace every legacy public contact reference in the reconstructed production snapshot.
          replacements = {
              "+55 88 9234-0423": "+55 88 99254-5413",
              "558892340423": "5588992545413",
          }
          changed = []
          for asset in Path("public").rglob("*"):
              if not asset.is_file():
                  continue
              try:
                  raw = asset.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              new = raw
              for old, value in replacements.items():
                  new = new.replace(old, value)
              if new != raw:
                  asset.write_text(new, encoding="utf-8")
                  changed.append(str(asset))
          if not changed:
              print("WHATSAPP_NUMBER_CUTOVER_FILES none_needed")
          else:
              print("WHATSAPP_NUMBER_CUTOVER_FILES", *changed)

          retired_slugs=("zevanory-one","arbm-sist")
          for retired_asset in ("public/zevanory-one.html","public/arbm-one.html","public/arbm-sist.html"):
              Path(retired_asset).unlink(missing_ok=True)

          solutions_path=Path("public/solucoes.html")
          solutions=solutions_path.read_text(encoding="utf-8")
          solutions=re.sub(r'<a class="legacy-contract" href="/zevanory-one">ZEVANORY ONE</a>\s*',"",solutions)
          for slug in retired_slugs:
              solutions=re.sub(rf'<a class="catalog-card" href="/{re.escape(slug)}">.*?</a>\s*',"",solutions,flags=re.S)
          solutions=solutions.replace("ZEVANORY ONE, ARBM SIST, ","")
          solutions_path.write_text(solutions,encoding="utf-8")

          sitemap_path=Path("public/sitemap.xml")
          sitemap=sitemap_path.read_text(encoding="utf-8")
          for slug in retired_slugs:
              sitemap=re.sub(rf'\s*<url><loc>https://zevanory\.api\.br/{re.escape(slug)}</loc>.*?</url>',"",sitemap,flags=re.S)
          sitemap_path.write_text(sitemap,encoding="utf-8")

          assert "ZEVANORY ONE" not in solutions
          assert "ARBM SIST" not in solutions
          for slug in retired_slugs:
              assert f"https://zevanory.api.br/{slug}" not in sitemap
          for retired_asset in ("public/zevanory-one.html","public/arbm-one.html","public/arbm-sist.html"):
              assert not Path(retired_asset).exists()
          print("COMMERCIAL_RETIREMENT_OVERLAY=PASS")

          c["vars"]["VOICE_TTS_PROVIDER"]="piper-relay"
          c["vars"]["VOICE_TTS_PROVIDER_CHAIN"]="speechify,azure,piper-relay,gemini"
          c["vars"]["VOICE_TTS_FAILOVER_ENABLED"]="true"
          c["vars"]["GEMINI_FREE_TIER_CONFIRMED"]="false"
          c["vars"]["SPEECHIFY_FREE_TIER_CONFIRMED"]="false"
          c["vars"]["AZURE_SPEECH_FREE_TIER_CONFIRMED"]="false"
          c["vars"]["VOICE_TTS_RELAY_URL"]="https://tts.167-172-146-60.sslip.io"
          for unused in ("KNOWLEDGE_SEED_ALLOWED","SPEECHIFY_FREE_TIER_CONFIRMED","AZURE_SPEECH_FREE_TIER_CONFIRMED"):
              c["vars"].pop(unused,None)
          open(p,"w").write(json.dumps(c,indent=2)+"\n")
          PY
          node --check worker/cloudflare-worker.compat.mjs
          node --check worker/voice-naturality-study.mjs
          node --check worker/whatsapp-onboarding.mjs
          node --check worker/whatsapp-e2e-evidence.mjs
          node --check worker/voice-final-closure.mjs
          node --check public/control-plane-vnext.js
          npx --yes wrangler@4.143.0 deploy --dry-run --strict --keep-vars --config wrangler.central-fix.jsonc --outdir /tmp/central-final
      - name: Authenticate Cloudflare
        if: steps.auth.outputs.available == 'true'
        run: npx --yes wrangler@4.135.0 whoami
      - name: Verify legacy production bridge route
        if: steps.auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/predeploy-health.json -w '%{http_code}' https://zevanory.api.br/api/health || true)"
          if [ "$code" = "200" ]; then
            python3 <<'PY'
          import json
          h=json.load(open("/tmp/predeploy-health.json"))
          assert h.get("live") is True and h.get("ready") is True, h
          print("LEGACY_PRODUCTION_BRIDGE_ROUTE_REACHABLE")
          PY
          elif [ "$code" = "503" ]; then
            echo "LEGACY_PRODUCTION_BRIDGE_ROUTE=DEGRADED_RECOVERY_ALLOWED"
            echo "RECOVERY_REASON=HTTP_503_PREEXISTING"
          else
            echo "LEGACY_PRODUCTION_BRIDGE_ROUTE_UNEXPECTED_HTTP=$code"
            exit 22
          fi
      - name: Discover production KV namespaces
        if: steps.auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" -o /tmp/kv.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/kv.json"))
          assert d.get("success") is True, d.get("errors")
          for x in d.get("result",[]): print("KV_NAMESPACE",x.get("title"),x.get("id"))
          PY
      - name: Discover Worker service bindings
        if: steps.auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" -o /tmp/scripts.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/scripts.json"))
          assert d.get("success") is True, d.get("errors")
          for x in d.get("result",[]): print("WORKER_SCRIPT",x.get("id"))
          PY
      - name: Inspect current zevanory bindings
        if: steps.auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory/settings" -o /tmp/settings.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/settings.json"))
          assert d.get("success") is True, d.get("errors")
          for b in d.get("result",{}).get("bindings",[]):
              print("CURRENT_BINDING",b.get("name"),b.get("type"),b.get("service",""),b.get("namespace_id",""))
          PY
      - name: Verify financial safety boundary without mutating secrets
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # This workflow repairs/proves the Control Core only. Financial credential provisioning
          # belongs to the financial closure workflow and must not block a fail-closed Core deploy.
          # Sales remain globally disabled by the candidate configuration.
          python3 - <<'PY'
          import json
          c=json.load(open("wrangler.central-fix.jsonc",encoding="utf-8"))
          v=c.get("vars",{})
          assert str(v.get("SALE_GLOBALLY_ENABLED","")).lower()=="false"
          assert str(v.get("PRE_SALE_GATES_APPROVED","")).lower()=="false"
          assert str(v.get("WHATSAPP_SALES_ENABLED","")).lower()=="false"
          print("CORE_DEPLOY_FINANCIAL_BOUNDARY=PASS")
          print("FINANCIAL_SECRETS_MUTATION=DECOUPLED")
          PY

      - name: Require certification secret before production deploy
        if: steps.auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          npx --yes wrangler@4.143.0 secret list --name zevanory --format json > /tmp/zevanory-secrets.json
          jq -e 'map(.name) | index("CERTIFICATION_E2E_TOKEN") != null' /tmp/zevanory-secrets.json >/dev/null
          echo "CERTIFICATION_E2E_TOKEN_PRESENT=PASS"

      - name: Deploy repaired production worker
        if: steps.auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          npx --yes wrangler@4.143.0 deploy --strict --keep-vars --config wrangler.central-fix.jsonc --tag="$TARGET_RUNTIME_SHA" --message="ZEVANORY-public-owner-exact-SHA-$TARGET_RUNTIME_SHA"
      - name: Verify live UTF-8 asset and safety
        if: steps.auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          WORKERS_DEV="https://zevanory.girolocal-rb.workers.dev"
          curl -fsS "$WORKERS_DEV/control-plane-vnext.js" -o /tmp/workers-dev.js
          cmp -s /tmp/workers-dev.js worker/live-recovered/control-plane-vnext.js
          echo "WORKERS_DEV_CANONICAL_PASS"
          for i in $(seq 1 30); do
            curl -fsS https://zevanory.api.br/control-plane-vnext.js -o /tmp/live.js || true
            if cmp -s /tmp/live.js worker/live-recovered/control-plane-vnext.js; then break; fi
            sleep 5
          done
          cmp -s /tmp/live.js worker/live-recovered/control-plane-vnext.js
          python3 <<'PY'
          from pathlib import Path
          import re
          s=Path("/tmp/live.js").read_text(encoding="utf-8")
          bad=[r"Ã[\x80-\xBF]",r"Â[\x80-\xBF ]",r"â€”",r"â€“",r"â€™",r"â€œ",r"â€",r"â†",r"\ufffd"]
          assert sum(len(re.findall(p,s)) for p in bad)==0
          assert "QUORUM & TRUST CHAIN" in s
          assert "Decisão executiva baseada em evidência." in s
          PY
          # Cloudflare edge propagation can lag behind the successful Worker upload.
          # Poll the canonical, non-query API until it serves this exact release SHA.
          exact_sha=0
          for i in $(seq 1 30); do
            curl -fsS https://zevanory.api.br/api/status -o /tmp/status.json || true
            curl -fsS https://zevanory.api.br/api/health -o /tmp/health.json || true
            curl -fsS https://zevanory.api.br/api/control-plane -o /tmp/control.json || true
            curl -fsS https://zevanory.api.br/api/core/v1/snapshot -o /tmp/core.json || true
            curl -fsS https://zevanory.api.br/api/core/v1/evaluation/zea10 -o /tmp/zea10.json || true
            if GITHUB_SHA="$GITHUB_SHA" python3 - <<'PY'
          import json, os, pathlib, sys
          try:
              status=json.load(open("/tmp/status.json"))
              health=json.load(open("/tmp/health.json"))
              control=json.load(open("/tmp/control.json"))
          except Exception:
              raise SystemExit(1)
          try:
              core=json.load(open("/tmp/core.json"))
              zea10=json.load(open("/tmp/zea10.json"))
          except Exception:
              raise SystemExit(1)
          ok=(
              status.get("runtime",{}).get("sales")=="globally-blocked"
              and health.get("ready") is True
              and control.get("global_state")=="operational_commercial_blocked"
              and control.get("root_blocker")=="global_sale_disabled"
              and control.get("release",{}).get("deployment",{}).get("commit_sha")==os.environ["TARGET_RUNTIME_SHA"]
              and core.get("release_sha")==os.environ["TARGET_RUNTIME_SHA"]
              and core.get("architecture",{}).get("circular_dependency") is False
              and core.get("architecture",{}).get("flow")==["runtime-ci","ZEES-16","ZEA-10","ZEVANORY Control Core","Admin"]
              and core.get("invariants",{}).get("evidence_to_evaluation_unidirectional") is True
              and zea10.get("source_layer")=="ZEES-16"
              and zea10.get("authority") is False
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              exact_sha=1
              break
            fi
            sleep 5
          done
          test "$exact_sha" = "1"
          python3 <<'PY'
          import json,os
          status=json.load(open("/tmp/status.json"))
          health=json.load(open("/tmp/health.json"))
          control=json.load(open("/tmp/control.json"))
          core=json.load(open("/tmp/core.json"))
          zea10=json.load(open("/tmp/zea10.json"))
          assert status["runtime"]["sales"]=="globally-blocked"
          assert health["ready"] is True
          assert control["global_state"]=="operational_commercial_blocked"
          assert control["root_blocker"]=="global_sale_disabled"
          assert control["release"]["deployment"]["commit_sha"]==os.environ["TARGET_RUNTIME_SHA"], (control["release"]["deployment"]["commit_sha"],os.environ["TARGET_RUNTIME_SHA"])
          assert core["release_sha"]==os.environ["TARGET_RUNTIME_SHA"]
          assert core["architecture"]["flow"]==["runtime-ci","ZEES-16","ZEA-10","ZEVANORY Control Core","Admin"]
          assert core["architecture"]["circular_dependency"] is False
          assert core["invariants"]["evidence_to_evaluation_unidirectional"] is True
          assert zea10["source_layer"]=="ZEES-16" and zea10["authority"] is False
          print("PRODUCTION_EXACT_SHA_PASS",os.environ["TARGET_RUNTIME_SHA"])
          print("PRODUCTION_ZEES_ZEA_CORE_ADMIN_ARCHITECTURE_PASS")
          print("PRODUCTION_CENTRAL_UTF8_AND_SAFETY_PASS")
          PY
      - name: Verify live HSTS CSP and Mercado Pago navigation
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -D /tmp/live-security-headers.txt -o /tmp/live-solutions.html https://zevanory.api.br/solucoes
          python3 scripts/verify-live-headers.py /tmp/live-security-headers.txt
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > /tmp/mp-csp-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const checkout='https://www.mercadopago.com.br/checkout/v1/redirect?pref_id=3670768257-f4236a66-96f6-49fc-ba1c-2587780b36e2';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const csp=[];
          page.on('console',m=>{const t=m.text();if(/content security policy|refused to (load|connect|frame|execute)|csp/i.test(t))csp.push(t)});
          await page.goto('https://zevanory.api.br/solucoes',{waitUntil:'domcontentloaded',timeout:30000});
          await page.evaluate(url=>{location.href=url},checkout);
          await page.waitForLoadState('domcontentloaded',{timeout:30000});
          if(!/mercadopago\.com(?:\.br)?$/i.test(new URL(page.url()).hostname)) throw new Error('mercadopago_navigation_failed:'+page.url());
          if(/\/fatal(?:\?|$)/i.test(new URL(page.url()).pathname)) throw new Error('mercadopago_fatal:'+page.url());
          if(csp.length) throw new Error('csp_console_block:'+JSON.stringify(csp.slice(0,10)));
          console.log('MERCADOPAGO_CHECKOUT_CSP_SMOKE=PASS '+page.url());
          await browser.close();
          JS
          node /tmp/mp-csp-smoke.mjs
      - name: Fail-closed deployment status
        if: steps.auth.outputs.available != 'true'
        run: |
          echo "Deployment blocked: GitHub Actions does not currently hold authenticated authority for the Cloudflare account that owns the public ZEVANORY domains."
          echo "Production is unchanged. No alternate account is permitted to masquerade as production."
          exit 1
