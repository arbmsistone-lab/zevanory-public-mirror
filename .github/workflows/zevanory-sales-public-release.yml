name: ZEVANORY SALES public release

on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "zevanory-sales/**"
      - "solucoes/**"
      - "quem-criou/**"
      - "assets/renan-bitu.webp"
      - "assets/fonts/**"
      - "assets/previews/**"
      - "docs/evidence/sales-ux/previews-manifest.json"
      - "ia-na-pratica/**"
      - "vendas-na-pratica/**"
      - "lucro-e-caixa/**"
      - "combo-ia-vendas/**"
      - "negocio-completo/**"
      - "termos/**"
      - "privacidade/**"
      - "reembolso/**"
      - "sales-overlay/**"
      - "sitemap.xml"
      - "product.css"
      - "brand/**"
      - "assets/brand/export/**"
      - "sales-worker.mjs"
      - "worker/sales-public-worker.mjs"
      - "tests/automation-traffic-guard.test.mjs"
      - "tests/sales-asset-cache.test.mjs"
      - "tests/contato-publico-whatsapp.test.mjs"
      - "wrangler.sales.toml"
      - "scripts/ci/materialize_sales_configs.py"
      - "sales-public/**"
      - "scripts/build_sales_public.py"
      - "scripts/sales_policy.py"
      - "data/politica-unica.json"
      - "tests/p13-politica-nogo.test.mjs"
      - "scripts/premerge_product_audit.py"
      - ".github/workflows/zevanory-sales-public-release.yml"
  push:
    branches: [gh-pages]
    paths:
      - "zevanory-sales/**"
      - "solucoes/**"
      - "quem-criou/**"
      - "assets/renan-bitu.webp"
      - "assets/fonts/**"
      - "assets/previews/**"
      - "docs/evidence/sales-ux/previews-manifest.json"
      - "ia-na-pratica/**"
      - "vendas-na-pratica/**"
      - "lucro-e-caixa/**"
      - "combo-ia-vendas/**"
      - "negocio-completo/**"
      - "termos/**"
      - "privacidade/**"
      - "reembolso/**"
      - "sales-overlay/**"
      - "sitemap.xml"
      - "product.css"
      - "brand/**"
      - "assets/brand/export/**"
      - "sales-worker.mjs"
      - "worker/sales-public-worker.mjs"
      - "tests/automation-traffic-guard.test.mjs"
      - "tests/sales-asset-cache.test.mjs"
      - "tests/contato-publico-whatsapp.test.mjs"
      - "wrangler.sales.toml"
      - "scripts/ci/materialize_sales_configs.py"
      - "sales-public/**"
      - "scripts/build_sales_public.py"
      - "scripts/sales_policy.py"
      - "data/politica-unica.json"
      - "tests/p13-politica-nogo.test.mjs"
      - "scripts/premerge_product_audit.py"
      - ".github/workflows/zevanory-sales-public-release.yml"
  workflow_dispatch:

permissions:
  contents: read

# P13 (NO-GO): o HTML estático é sempre publicado fechado (sem link de checkout, sem Offer InStock).
# A reabertura acontece só em tempo de execução, pelo interruptor do proprietário ("LIBERAR VENDAS",
# KV sales:open:v1 lido via /api/sales/status) — nunca por este build.
env:
  ZEVANORY_SALES_PUBLIC_MODE: closed

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.ref) || 'deploy-zevanory-sales-public' }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: "22"

      - name: Build exact sales-domain assets
        run: python3 scripts/build_sales_public.py

      - name: P13 NO-GO grep-gate (closed build has no checkout/subscription link nor InStock)
        run: |
          set -euo pipefail
          test "$ZEVANORY_SALES_PUBLIC_MODE" = closed
          if grep -RIlE "href[[:space:]]*=[[:space:]]*[\"']?[^\"' >]*(/comprar/|/assinar/|/hotmart/|pay\.hotmart\.com)" sales-public --include='*.html'; then echo "::error::checkout/subscription href in closed build"; exit 1; fi
          if grep -RIl 'schema.org/InStock' sales-public --include='*.html'; then echo "::error::InStock in closed build"; exit 1; fi
          python3 scripts/sales_policy.py --audit sales-public --mode closed
          echo "P13_NOGO_GREP_GATE=PASS"

      - name: Validate product contract
        run: python3 scripts/premerge_product_audit.py

      - name: Validate worker syntax
        run: |
          node --check sales-worker.mjs
          node --check worker/sales-public-worker.mjs
          node --test tests/automation-traffic-guard.test.mjs tests/attribution.test.mjs tests/p13-politica-nogo.test.mjs tests/product-consistency.test.mjs tests/hotmart-pages.test.mjs tests/sales-asset-cache.test.mjs tests/contato-publico-whatsapp.test.mjs

      - name: Cloudflare dry-run
        run: npx --yes wrangler@4.143.0 deploy --dry-run --strict --config wrangler.sales.toml --outdir /tmp/zevanory-sales-public

      - name: Cloudflare dry-run of the exact canonical deploy config (no routes)
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_sales_configs.py
          # Sem "!": em bash, set -e ignora comando negado com "!". Falha explícita.
          if grep -Eq '^[[:space:]]*routes?[[:space:]]*=' wrangler.sales.deploy.toml; then echo "::error::canonical config manages routes"; exit 1; fi
          grep -qx 'workers_dev = false' wrangler.sales.deploy.toml
          npx --yes wrangler@4.143.0 deploy --dry-run --strict --config wrangler.sales.deploy.toml --outdir /tmp/zevanory-sales-canonical | tee /tmp/canonical-dry-run.txt
          if grep -Eiq 'vendas\.zevanory\.api\.br|custom domain' /tmp/canonical-dry-run.txt; then echo "::error::dry-run touches the custom domain"; exit 1; fi
          echo "CANONICAL_DEPLOY_CONFIG_DRY_RUN=PASS"

      - name: Verify generated surface
        run: |
          test -f sales-public/zevanory-sales.html
          test -f sales-public/solucoes.html
          test -f sales-public/quem-criou.html
          test -s sales-public/assets/renan-bitu.webp
          test -f sales-public/product.css
          test -f sales-public/brand/zevanory-logo-dark.svg
          grep -Fq "ZEVANORY SALES" sales-public/zevanory-sales.html
          # E2: pages load the content-hashed stylesheet; /product.css stays only for Worker info pages.
          grep -Eq 'href="/assets/product\.[0-9a-f]{10}\.css"' sales-public/zevanory-sales.html
          if grep -RIl 'whatsapp-contact' sales-public; then echo "::error::retired contact script referenced"; exit 1; fi
          ! grep -Fq "/zevanory-public-mirror/" sales-public/zevanory-sales.html
          echo "ZEVANORY_SALES_PUBLIC_VERIFY=PASS"

  deploy:
    environment: producao-critica  # B01 M1: efeito em produção comprovado no conteúdo do job; revisor obrigatório
    if: ${{ github.ref == 'refs/heads/gh-pages' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}  # B01 patch 05b
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_PUBLIC_OWNER_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '1b26415802588185a86c1d4d3ebf5bdb' }}
      PUBLIC_OWNER_ACCOUNT_ID: "1b26415802588185a86c1d4d3ebf5bdb"
      SCRIPT_NAME: "zevanory-sales-public"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: "22"

      - name: Require authenticated deployment authority
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_AUTH=ABSENT_FAIL_CLOSED"; exit 21; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "$PUBLIC_OWNER_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT=WRONG_FAIL_CLOSED"; exit 22; }
          curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$PUBLIC_OWNER_ACCOUNT_ID"             -o /tmp/cloudflare-account.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/cloudflare-account.json"))
          assert d.get("success") is True, d.get("errors")
          print("CLOUDFLARE_PUBLIC_OWNER_AUTHORITY=PASS")
          PY

      - name: Build exact release assets
        run: python3 scripts/build_sales_public.py

      - name: P13 NO-GO grep-gate (closed build has no checkout/subscription link nor InStock)
        run: |
          set -euo pipefail
          test "$ZEVANORY_SALES_PUBLIC_MODE" = closed
          if grep -RIlE "href[[:space:]]*=[[:space:]]*[\"']?[^\"' >]*(/comprar/|/assinar/|/hotmart/|pay\.hotmart\.com)" sales-public --include='*.html'; then echo "::error::checkout/subscription href in closed build"; exit 1; fi
          if grep -RIl 'schema.org/InStock' sales-public --include='*.html'; then echo "::error::InStock in closed build"; exit 1; fi
          python3 scripts/sales_policy.py --audit sales-public --mode closed
          echo "P13_NOGO_GREP_GATE=PASS"

      - name: Materialize release configs
        run: python3 scripts/ci/materialize_sales_configs.py

      - name: Snapshot active canonical deployment
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/previous-deployments.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$PUBLIC_OWNER_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments" || true)"
          python3 - "$code" <<'PY'
          import json,sys
          from pathlib import Path
          code=sys.argv[1]
          previous=None
          if code=="200":
              d=json.load(open("/tmp/previous-deployments.json"))
              result=d.get("result")
              if isinstance(result,dict):
                  deps=result.get("deployments") or []
              elif isinstance(result,list):
                  deps=result
              else:
                  deps=[]
              if deps:
                  previous=deps[0]
          if previous and previous.get("versions"):
              body={
                  "strategy":"percentage",
                  "versions":[
                      {"version_id":str(v["version_id"]),"percentage":float(v["percentage"])}
                      for v in previous["versions"]
                  ],
                  "annotations":{
                      "workers/message":"automatic ZEVANORY SALES rollback snapshot"
                  }
              }
              Path("/tmp/rollback-deployment.json").write_text(json.dumps(body),encoding="utf-8")
              print("PREVIOUS_DEPLOYMENT_SNAPSHOT=PASS")
              print("PREVIOUS_DEPLOYMENT_ID="+str(previous.get("id","")))
          else:
              Path("/tmp/rollback-deployment.json").write_text("",encoding="utf-8")
              print("PREVIOUS_DEPLOYMENT_SNAPSHOT=NONE_FIRST_RELEASE")
          PY

      - name: Deploy isolated candidate
        run: npx --yes wrangler@4.143.0 deploy --config wrangler.sales.preview.toml

      - name: Resolve candidate URL and smoke test
        run: |
          set -euo pipefail
          CANDIDATE="$(cat /tmp/candidate-name)"
          curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$PUBLIC_OWNER_ACCOUNT_ID/workers/subdomain"             -o /tmp/workers-subdomain.json
          SUBDOMAIN="$(python3 - <<'PY'
          import json
          d=json.load(open("/tmp/workers-subdomain.json"))
          assert d.get("success") is True, d.get("errors")
          print(d["result"]["subdomain"])
          PY
          )"
          BASE="https://$CANDIDATE.$SUBDOMAIN.workers.dev"
          echo "$BASE" > /tmp/candidate-base
          for i in $(seq 1 12); do
            if curl -fsS "$BASE/health" -o /tmp/candidate-health.json               && curl -fsS "$BASE/zevanory-sales" -o /tmp/candidate-sales.html; then
              break
            fi
            sleep 5
          done
          python3 - <<'PY'
          import json,os
          h=json.load(open("/tmp/candidate-health.json"))
          assert h.get("ok") is True, h
          assert h.get("service")=="zevanory-sales-public", h
          assert h.get("release")==os.environ["GITHUB_SHA"], h
          page=open("/tmp/candidate-sales.html",encoding="utf-8").read()
          assert "ZEVANORY SALES" in page
          assert "SALES ASSIST" in page and "SALES AUTOPILOT" in page and "SALES AUTONOMOUS" in page
          assert "/zevanory-public-mirror/" not in page
          print("ZEVANORY_SALES_CANDIDATE_SMOKE=PASS")
          PY

      - name: Pre-promotion guard (T1, inside the serialized deploy group)
        id: guard
        run: |
          set -euo pipefail
          python3 scripts/deploy/promotion_guard.py --service zevanory-sales-public \
            --candidate "$GITHUB_SHA" \
            --readback-url https://vendas.zevanory.api.br/health --readback-path release \
            --cloudflare-script "$SCRIPT_NAME"

      - name: Promote exact candidate source to canonical domain
        id: promote
        if: steps.guard.outputs.decision == 'promote'
        run: |
          set -euo pipefail
          npx --yes wrangler@4.143.0 deploy --config wrangler.sales.deploy.toml --tag="$GITHUB_SHA" --message="ZEVANORY-sales-exact-SHA-$GITHUB_SHA"
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      - name: Verify canonical production readback
        id: readback
        if: steps.promote.outputs.promoted == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE="https://vendas.zevanory.api.br"
          ok=false
          for i in $(seq 1 18); do
            if curl -fsS "$BASE/health" -o /tmp/canonical-health.json               && curl -fsS "$BASE/zevanory-sales" -o /tmp/canonical-sales.html; then
              if python3 - <<'PY'
          import json,os
          h=json.load(open("/tmp/canonical-health.json"))
          page=open("/tmp/canonical-sales.html",encoding="utf-8").read()
          assert h.get("ok") is True, h
          assert h.get("service")=="zevanory-sales-public", h
          assert h.get("release")==os.environ["GITHUB_SHA"], h
          assert "ZEVANORY SALES" in page
          assert "/zevanory-public-mirror/" not in page
          PY
              then
                ok=true
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = "true"
          bash scripts/ci/verify-founder-and-products.sh
          # Legal seller text readback (moved here from sales-legal-publish.yml, now validation-only).
          curl -fsS "$BASE/termos" -o /tmp/termos.html
          grep -Fq 'inscrita no CNPJ sob o nº 69.077.233/0001-99' /tmp/termos.html
          echo "PUBLIC_LEGAL_READBACK=PASS"
          # T1: the effective version (Cloudflare tag + /health) must be exactly this SHA.
          # FAIL fails this step -> rollback. NAO_COMPROVADO (observer unreachable) does not roll back:
          # exit 0 here, then the certification gate after the rollback step fails the run.
          python3 scripts/deploy/promotion_guard.py --verify-promoted --unproven-exit 0 --service zevanory-sales-public --candidate "$GITHUB_SHA" --readback-url "$BASE/health" --readback-path release --cloudflare-script "$SCRIPT_NAME"
          echo "ZEVANORY_SALES_CANONICAL_READBACK=DONE"

      - name: Roll back canonical deployment on failed readback
        if: steps.promote.outputs.promoted == 'true' && steps.readback.outcome != 'success'
        run: |
          set -euo pipefail
          if [ -s /tmp/rollback-deployment.json ]; then
            curl -fsS -X POST               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data-binary @/tmp/rollback-deployment.json               "https://api.cloudflare.com/client/v4/accounts/$PUBLIC_OWNER_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments"               -o /tmp/rollback-result.json
            python3 - <<'PY'
          import json
          d=json.load(open("/tmp/rollback-result.json"))
          assert d.get("success") is True, d.get("errors")
          print("ZEVANORY_SALES_CANONICAL_ROLLBACK=PASS")
          PY
          else
            # T1 audit 13/10: the canonical production script is NEVER deleted by automation.
            # Without a rollback snapshot the failed release stays as is and the run fails loudly
            # for explicit, owner-authorised recovery.
            echo "::error title=SALES_NO_ROLLBACK_SNAPSHOT::readback failed and no previous deployment snapshot; production script left untouched (not deleted) — manual recovery required"
          fi
          exit 1

      - name: Certification gate (T1, after rollback decision)
        if: always() && steps.readback.outcome == 'success' && steps.readback.outputs.state != 'PASS'
        env:
          POST_STATE: ${{ steps.readback.outputs.state }}
          POST_REASON: ${{ steps.readback.outputs.reason }}
        run: |
          echo "::error title=CERTIFICATION_NAO_COMPROVADO::release $GITHUB_SHA kept live (readbacks passed, no contrary evidence) but NOT certified: state=${POST_STATE:-missing} $POST_REASON. No rollback without independent evidence; re-check with t1-publisher-guard (workflow_dispatch: recheck_service=zevanory-sales-public)."
          exit 1

      - name: Delete isolated candidate
        if: always()
        run: |
          set -euo pipefail
          if [ -f /tmp/candidate-name ]; then
            CANDIDATE="$(cat /tmp/candidate-name)"
            curl -sS -X DELETE               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$PUBLIC_OWNER_ACCOUNT_ID/workers/scripts/$CANDIDATE"               >/tmp/delete-candidate.json || true
          fi

      - name: Certify public release
        if: steps.readback.outcome == 'success' && steps.readback.outputs.state == 'PASS'
        run: |
          echo "ZEVANORY_SALES_PUBLIC_RELEASE=PASS"
          echo "RELEASE_SHA=$GITHUB_SHA"
          echo "CANONICAL_DOMAIN=vendas.zevanory.api.br"
