name: ZEVANORY WhatsApp closure probe
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - ".github/workflows/whatsapp-closure-probe.yml"
      - "worker/whatsapp-credential-broker.mjs"
      - ".github/workflows/whatsapp-zero-spend-broker.yml"
      - "worker/whatsapp-onboarding.mjs"
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/whatsapp-closure-probe.yml"
      - "worker/whatsapp-credential-broker.mjs"
      - ".github/workflows/whatsapp-zero-spend-broker.yml"
      - "worker/whatsapp-onboarding.mjs"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe canonical WhatsApp identity and runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://zevanory.api.br/api/config?view=channel_identity_health" -o /tmp/identity.json
          curl -fsS "https://zevanory.api.br/api/config?view=closure_status" -o /tmp/closure.json
          python3 - <<'PY'
          import json
          identity=json.load(open("/tmp/identity.json"))
          closure=json.load(open("/tmp/closure.json"))
          wa=identity.get("whatsapp",{})
          ch=closure.get("channels",{}).get("whatsapp",{})
          safe={
            "attempted":bool(wa.get("attempted")),
            "verified":bool(wa.get("verified")),
            "reason":str(wa.get("reason") or ""),
            "provider_id":str(wa.get("provider_id") or ""),
            "display_phone_number":str(wa.get("display_phone_number") or ""),
            "number_verified":bool(wa.get("number_verified")),
            "verified_name":str(wa.get("verified_name") or ""),
            "brand_name_verified":bool(wa.get("brand_name_verified")),
            "name_status":str(wa.get("name_status") or ""),
            "code_verification_status":str(wa.get("code_verification_status") or ""),
            "verification_mode":str(wa.get("verification_mode") or ""),
            "operational_ready":bool(ch.get("operational_ready")),
            "operational_mode":str(ch.get("operational_mode") or "")
          }
          print("WHATSAPP_SAFE_IDENTITY="+json.dumps(safe,separators=(",",":")))
          print("WHATSAPP_OFFICIAL_NUMBER="+("PASS" if safe["display_phone_number"]=="5588992545413" and safe["number_verified"] else "BLOCKED"))
          print("WHATSAPP_IDENTITY="+("PASS" if safe["verified"] else "BLOCKED"))
          print("WHATSAPP_RUNTIME="+("PASS" if safe["operational_ready"] else "BLOCKED"))
          PY
      - name: Validate OAuth launcher source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'brokerJson(env,"/broker/oauth/start"' worker/whatsapp-onboarding.mjs
          grep -Fq 'brokerJson(env,"/broker/oauth/consume-state"' worker/whatsapp-onboarding.mjs
          grep -Fq 'zevanory_whatsapp_broker_oauth_state' worker/whatsapp-credential-broker.mjs
          echo "WHATSAPP_OAUTH_STATE_BACKEND=BROKER_D1_PASS"
      - name: Probe public OAuth launcher after canonical deploy
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -D /tmp/oauth.headers -w '%{http_code}' 'https://zevanory.api.br/admin/whatsapp-onboard/start')"
          test "$code" = "302"
          location="$(tr -d '\r' </tmp/oauth.headers | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); print; exit}')"
          test -n "$location"
          python3 - "$location" <<'PY'
          import sys,urllib.parse
          u=urllib.parse.urlparse(sys.argv[1])
          q=urllib.parse.parse_qs(u.query)
          assert u.scheme=="https" and u.netloc=="www.facebook.com"
          assert u.path.endswith("/dialog/oauth")
          assert q.get("client_id")==["1071149631917061"]
          assert q.get("redirect_uri")==["https://zevanory.api.br/admin/whatsapp-onboard/callback"]
          assert q.get("state") and len(q["state"][0]) >= 24
          scopes=set((q.get("scope") or [""])[0].split(","))
          assert {"business_management","whatsapp_business_management","whatsapp_business_messaging"}.issubset(scopes)
          print("WHATSAPP_OAUTH_LAUNCHER=PASS")
          print("WHATSAPP_OAUTH_STATE=PASS")
          PY
      - name: Probe broker runtime provenance after canonical deploy
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://giro-whatsapp-bridge.girolocal-rb.workers.dev/__zevanory/runtime" -o /tmp/runtime.json
          python3 - <<'PY'
          import json,os
          x=json.load(open("/tmp/runtime.json"))
          assert x.get("ok") is True
          assert x.get("runtime_sha")==os.environ["GITHUB_SHA"], (x.get("runtime_sha"),os.environ["GITHUB_SHA"])
          assert x.get("runtime_version")
          assert x.get("zero_spend") is True
          assert x.get("legacy_route_bypass")==0
          print("BROKER_RUNTIME_SHA=PASS")
          print("BROKER_RUNTIME_VERSION=PASS")
          print("SHA_CONSISTENCY=PASS")
          print("ZERO_SPEND=PASS")
          print("WHATSAPP_SAFE_RUNTIME_IDENTITY="+json.dumps(x.get("whatsapp",{}),separators=(",",":")))
          PY
