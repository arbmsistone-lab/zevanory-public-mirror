name: p18-second-monitor-tests

# P18 segunda via independente (Supabase pg_cron + pg_net, ops/p18-segunda-via/supabase): testes num PostgreSQL
# efêmero com imitações de pg_net/pg_cron/Vault e relógio simulado. Só pull_request: nunca dispara no merge, nenhum
# segredo, nenhuma requisição à produção ou ao Supabase. (1) 15 testes, inclusive o tempo até o alerta (<= 600 s) em
# queda 503, queda sem resposta e ensaio; (2) mutantes causais do SQL (todos precisam morrer).
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - ".github/workflows/p18-second-monitor-tests.yml"
      - "ops/p18-segunda-via/**"
      - "tests/test_p18_segunda_via.py"
      - "tests/fixtures/p18-segunda-via/**"
      - "scripts/ci/mutants_p18_segunda_via.py"
      - "scripts/ci/mutants_p18_segunda_via_allow.json"

permissions:
  contents: read

jobs:
  tests:
    name: p18-second-monitor / tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: p18sv-ci-local-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: p18sv-ci-local-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes da segunda via (contagem exata 16, zero pulados, tempos medidos)
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client > /dev/null
          python -m unittest -v tests/test_p18_segunda_via.py 2>&1 | tee /tmp/t.txt
          grep -qE '^Ran 16 tests' /tmp/t.txt && grep -qx 'OK' /tmp/t.txt || { echo "::error::esperados 16 testes OK"; exit 1; }
          if grep -q 'skipped' /tmp/t.txt; then echo "::error::teste pulado"; exit 1; fi
          grep -o 'P18SV_MEASURE.*' /tmp/t.txt | while read -r l; do echo "::notice title=P18SV_TEMPO_ATE_ALERTA::$l"; done
      - name: Mutantes causais do SQL (todos precisam morrer)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/mutants_p18_segunda_via.py < /dev/null | tee /tmp/mut.txt
          echo "::notice title=P18SV_MUTANTS::$(grep -E '^MUTANTS ' /tmp/mut.txt)"
          grep -qx "MUTANTS total=13 killed=13 survived=0 inconclusive=0" /tmp/mut.txt || { echo "::error::mutante sobreviveu ou contagem mudou"; exit 1; }
      - name: Sem bytecode rastreado
        shell: bash
        run: test -z "$(git ls-files '*.pyc' '**/__pycache__/**')"
