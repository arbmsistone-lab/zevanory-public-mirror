name: B0 baseline collector (read-only)

# Roteiro Mestre v4.7, seção 8 item 1 (fase B0): linha de base diária de P03, P06, P08, P15, P18, P19, P20 e P22.
# Somente leitura em produção (GET público; nenhum segredo de produção; nenhuma chamada de checkout/pagamento).
# Lê, pela API REST com o GITHUB_TOKEN, as anotações públicas já emitidas pelos workflows agendados
# command-center-snapshot e data-backup. Grava SÓ no ramo evidence/b0-baseline (nunca gh-pages):
# b0/baseline-v1.jsonl (append-only) e b0/register-v1.json. Fonte ausente = NOT_AVAILABLE explícito.
# Horário 01:41 UTC: o dia coletado é o dia UTC anterior (inclui o command-center das 23:17).
on:
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:

permissions:
  contents: write   # só o ramo evidence/b0-baseline (scripts/b0/evidence-branch.sh recusa qualquer outro)
  actions: read     # runs dos workflows command-center-snapshot e data-backup
  checks: read      # anotações desses runs

concurrency:
  group: b0-baseline-collector
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.ref == 'refs/heads/gh-pages' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_BRANCH: evidence/b0-baseline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes do coletor (fail-closed)
        run: node --test tests/b0-baseline.test.mjs
      - name: P03 pa11y nas páginas de venda ao vivo (falha aqui vira NOT_AVAILABLE, nunca 0 erros)
        continue-on-error: true
        env:
          PA11Y_VERSION: "9.0.1"
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pa11y" --no-save --no-audit --no-fund "pa11y@$PA11Y_VERSION" >/dev/null
          NODE_PATH="$RUNNER_TEMP/pa11y/node_modules" node scripts/b0/p03-a11y.cjs "$RUNNER_TEMP/p03-a11y.json"
      - name: Preparar o ramo de evidência
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "EVIDENCE_DIR=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          EVIDENCE_DIR="$RUNNER_TEMP/evidence" bash scripts/b0/evidence-branch.sh prepare
      - name: Coletar o dia anterior (UTC)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          A11Y_FILE: ${{ runner.temp }}/p03-a11y.json
          TARGETS_FILE: docs/b0/metas-propostas.json
        run: node scripts/b0/b0-collector.mjs
      - name: Publicar no ramo de evidência
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/b0/evidence-branch.sh publish "B0 baseline - coleta do run ${GITHUB_RUN_ID} (sha ${GITHUB_SHA})"
