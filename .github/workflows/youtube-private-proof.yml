name: YouTube private proof upload (one video, stops for review)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite ENVIAR_PROVA_PRIVADA para enviar um único vídeo privado"
        required: true
concurrency:
  group: youtube-private-proof
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  proof:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' && (inputs.confirm == 'ENVIAR_PROVA_PRIVADA') }}  # B01 patch 05b
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      # Free-tier Gemini key as a GitHub secret (zero-cost rule: no Cloud billing / Secret Manager).
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate YouTube OAuth and exact channel identity (read-only)
        run: node scripts/channels/youtube-identity.mjs
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Validate identity, F1 gate, TTS and final MP4 without uploading
        run: node scripts/channels/youtube-preflight.mjs
      - name: Upload ONE private proof, poll until processed, then stop
        run: node scripts/channels/youtube-private-proof.mjs
