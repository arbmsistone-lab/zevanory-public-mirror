name: product-pages-premerge

on:
  pull_request:
    branches:
      - gh-pages
    paths:
      - 'arbm-one/**'
      - 'arbm-sist/**'
      - 'ia-na-pratica/**'
      - 'vendas-na-pratica/**'
      - 'lucro-e-caixa/**'
      - 'combo-ia-vendas/**'
      - 'negocio-completo/**'
      - 'solucoes/**'
      - 'product.css'
      - 'sitemap.xml'
      - 'scripts/premerge_product_audit.py'
      - 'scripts/zevanory_10p_excellence_gate.py'
      - 'scripts/zevanory_crown_gate.py'
      - 'scripts/test_crown_negative.py'
      - 'compliance/**'
      - 'evidence/approvals/**'
      - 'evidence/certificates/**'
      - '.github/workflows/product-pages-premerge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-pages-premerge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: product-pages / static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Show exact revision
        run: |
          set -euo pipefail
          git rev-parse HEAD

      - name: Compile audit scripts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/premerge_product_audit.py
          python3 -m py_compile scripts/zevanory_10p_excellence_gate.py
          python3 -m py_compile scripts/zevanory_crown_gate.py
          python3 -m py_compile scripts/test_crown_negative.py

      - name: Run fail-closed product audit
        run: |
          set -euo pipefail
          python3 scripts/premerge_product_audit.py

      - name: Run ZEVANORY 10P excellence gate
        run: |
          set -euo pipefail
          python3 scripts/zevanory_10p_excellence_gate.py

      - name: Run CROWN negative policy tests
        run: |
          set -euo pipefail
          python3 scripts/test_crown_negative.py

      - name: Run ZEVANORY CROWN gate
        run: |
          set -euo pipefail
          python3 scripts/zevanory_crown_gate.py
