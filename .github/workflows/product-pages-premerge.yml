name: product-pages-premerge

on:
  pull_request:
    branches:
      - gh-pages
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-pages-premerge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: product-pages / static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Show exact revision
        run: |
          set -euo pipefail
          git rev-parse HEAD

      - name: Compile audit scripts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/premerge_product_audit.py
          python3 -m py_compile scripts/zevanory_10p_excellence_gate.py
          python3 -m py_compile scripts/zevanory_crown_gate.py
          python3 -m py_compile scripts/test_crown_negative.py

      - name: Sales promises match the delivered material (P24)
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/sales_promise_consistency.py
          python3 scripts/ci/sales_promise_consistency.py
          python3 scripts/ci/sales_promise_consistency.py --self-test

      - name: Public copy without internal jargon or known typos (site audit S-01, S-06, S-07, S-08)
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/public_copy_gate.py
          # The committed sales site and a fresh build of the sources must both pass.
          python3 scripts/ci/public_copy_gate.py
          ZEVANORY_SALES_PUBLIC_OUT="$RUNNER_TEMP/sales-public-fresh" python3 scripts/build_sales_public.py >/dev/null
          python3 scripts/ci/public_copy_gate.py --dir "$RUNNER_TEMP/sales-public-fresh"
          python3 scripts/ci/public_copy_gate.py --self-test

      - name: Run fail-closed product audit
        run: |
          set -euo pipefail
          python3 scripts/premerge_product_audit.py

      - name: Run ZEVANORY 10P excellence gate
        run: |
          set -euo pipefail
          python3 scripts/zevanory_10p_excellence_gate.py

      - name: Run CROWN negative policy tests
        run: |
          set -euo pipefail
          python3 scripts/test_crown_negative.py

      - name: Run ZEVANORY CROWN gate
        run: |
          set -euo pipefail
          python3 scripts/zevanory_crown_gate.py

      - name: Release 2 matrix bound to this exact SHA
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/release2" --no-audit --no-fund playwright@1.55.0 axe-core@4.10.3 >/dev/null
          "$RUNNER_TEMP/release2/node_modules/.bin/playwright" install chromium >/dev/null
          node scripts/audit/sales-local-server.mjs 8791 sales-public >"$RUNNER_TEMP/release2-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/audit/sales-scroll-gate.mjs http://127.0.0.1:8791 "$RUNNER_TEMP/release-2-matrix.json" "$RUNNER_TEMP/release2/node_modules" "" "$GITHUB_SHA"
          node -e 'const m=require(process.argv[1]); if(!m.pass||m.checked!==180||m.release_sha!==process.env.GITHUB_SHA) process.exit(1)' "$RUNNER_TEMP/release-2-matrix.json"
          cp "$RUNNER_TEMP/release-2-matrix.json" docs/evidence/release-2/matrix.json
          RELEASE_SHA="$GITHUB_SHA" node scripts/audit/release-2-evidence-manifest.mjs
          node -e 'const m=require(process.argv[1]); if(m.release_sha!==process.env.GITHUB_SHA||m.matrix.checked!==180) process.exit(1)' docs/evidence/release-2/manifest.json
