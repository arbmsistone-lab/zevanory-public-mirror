name: ZEVANORY one-shot financial secret sync

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e3caca88f4343c3cdfcf66eebe6ac124
      ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY || secrets.ASAAS_SANDBOX_API_KEY }}
      ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
      OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
      CERTIFICATION_E2E_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN }}
      CANONICAL_SHA: 9d384ecec56e05758d27fcf27f7c36f1fa526d72
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate one-shot inputs
        shell: bash
        run: |
          set -euo pipefail
          for k in CLOUDFLARE_API_TOKEN ASAAS_API_KEY ASAAS_WEBHOOK_TOKEN OPERATOR_TOKEN CERTIFICATION_E2E_TOKEN; do
            test -n "${!k:-}" || { echo "MISSING_REQUIRED_SECRET=$k"; exit 2; }
          done
          test "${#ASAAS_WEBHOOK_TOKEN}" -ge 32
          echo "FINANCIAL_SECRET_INPUTS=PASS"

      - name: Synchronize only required financial secrets to canonical Worker
        shell: bash
        run: |
          set -euo pipefail
          for k in ASAAS_API_KEY ASAAS_WEBHOOK_TOKEN OPERATOR_TOKEN CERTIFICATION_E2E_TOKEN; do
            printf '%s' "${!k}" | npx --yes wrangler@4.135.0 secret put "$k" --name zevanory >/tmp/wrangler-${k}.log
            grep -Eq 'secret|Success|Uploaded' /tmp/wrangler-${k}.log || true
            echo "WORKER_SECRET_SET=$k"
          done

      - name: Verify canonical runtime remains exact SHA and fail-closed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://zevanory.api.br/api/release -o /tmp/release.json
          CANONICAL_SHA="$CANONICAL_SHA" python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/release.json'))
          assert r.get('deployment',{}).get('commit_sha')==os.environ['CANONICAL_SHA'],r
          assert r.get('sales_mode')=='globally-blocked',r
          assert r.get('checkout_mode')=='enabled',r
          assert r.get('financial_mode')=='enabled',r
          print('CANONICAL_SHA_PRESERVED=PASS')
          print('SALE_GLOBALLY_ENABLED=false')
          PY

      - name: Dispatch exact-SHA financial E2E
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run financial-e2e-closure.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref gh-pages \
            -f expected_sha="$CANONICAL_SHA"
          echo "FINANCIAL_E2E_DISPATCHED_FOR=$CANONICAL_SHA"
