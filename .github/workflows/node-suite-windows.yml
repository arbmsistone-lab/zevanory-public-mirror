name: node-suite-windows

# Evidência de portabilidade (auditoria Sol #865, AVAL 081): a suíte Node completa (mesmo comando do gate
# Linux trava-vendas-integracao-postgres) roda também em host Windows.
#
# Escopo exato desta prova: "Windows host + Git Bash". O runner é windows-latest, o Node é o nativo do
# Windows (caminhos com "\", checkout com core.autocrlf=true => CRLF), mas os passos rodam no Git Bash
# (shell: bash explícito): o glob tests/*.test.mjs, grep/tee/tr e os testes que chamam bash/jq dependem
# dele. NÃO prova execução em PowerShell/cmd puro nem em host sem Git Bash; nesses hosts os testes que
# precisam de bash, jq ou python3 falham com "TOOL_MISSING: <tool>" (tests/helpers/toolchain.mjs).
#
# Só pull_request: nunca dispara no merge, sem segredos, sem rede além do checkout e da instalação do Node.
# Contagem literal 573 = a mesma do gate Linux; ao rebasear sobre o #874 (manifesto tests/node-suite.manifest)
# este literal passa a ser derivado do manifesto. O guarda de portabilidade (tests/guards) tem contagem própria.
on:
  pull_request:
    paths:
      - "tests/*.test.mjs"
      - "tests/helpers/**"
      - "tests/guards/**"
      - "worker/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".gitattributes"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  node-suite:
    name: node-suite (Windows host + Git Bash)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ambiente (Windows host + Git Bash)
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tools=""
          for t in bash jq python3; do
            if v="$("$t" --version 2>&1 | head -1)" && [ -n "$v" ]; then tools="$tools $t=[$v]"; else tools="$tools $t=AUSENTE"; fi
          done
          echo "::notice title=AMBIENTE (Windows host + Git Bash)::RUNNER_OS=$RUNNER_OS shell=$BASH ($BASH_VERSION) node=$(node --version) autocrlf=$(git config --get core.autocrlf || echo unset) ferramentas:$tools"
          echo "::notice title=SHA_TESTADO (Windows host + Git Bash)::ref=$GITHUB_REF tested=$(git rev-parse HEAD) pr.head=$PR_HEAD_SHA"
      - name: Suíte Node completa (Windows host + Git Bash, contagem exata 573)
        shell: bash
        run: |
          set -eo pipefail
          node --test tests/*.test.mjs 2>&1 | tr -d '\r' | tee all.txt || true
          echo "::notice title=COUNTS_ALL (Windows host + Git Bash, esperado 573)::$(grep -E '^# (tests|pass|fail|skipped|cancelled|todo) ' all.txt | paste -sd' ' -)"
          # Sem falhas o grep sai 1; com pipefail isso derrubaria o passo antes da verificação de contagem.
          { grep -E '^not ok ' all.txt || true; } | while IFS= read -r l; do echo "::error title=FAIL (Windows host + Git Bash)::$l"; done
          { grep -oE 'TOOL_MISSING: [^ ]+' all.txt || true; } | sort -u | while IFS= read -r l; do echo "::error title=TOOL_MISSING (Windows host + Git Bash)::$l"; done
          grep -qx "# tests 573" all.txt && grep -qx "# pass 573" all.txt && grep -qx "# skipped 0" all.txt && grep -qx "# fail 0" all.txt && grep -qx "# cancelled 0" all.txt
      - name: Guarda de portabilidade (Windows host + Git Bash, contagem exata 3)
        shell: bash
        run: |
          set -eo pipefail
          node --test tests/guards/*.test.mjs 2>&1 | tr -d '\r' | tee guards.txt
          echo "::notice title=COUNTS_GUARDS (Windows host + Git Bash, esperado 3)::$(grep -E '^# (tests|pass|fail|skipped|cancelled|todo) ' guards.txt | paste -sd' ' -)"
          grep -qx "# tests 3" guards.txt && grep -qx "# pass 3" guards.txt && grep -qx "# skipped 0" guards.txt && grep -qx "# fail 0" guards.txt && grep -qx "# cancelled 0" guards.txt
