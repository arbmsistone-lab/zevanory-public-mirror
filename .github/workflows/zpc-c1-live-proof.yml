name: ZEVANORY C1 live runtime proof read only
on:
  pull_request:
    branches: [gh-pages]
    paths: [".github/workflows/zpc-c1-live-proof.yml"]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CERTIFICATION_E2E_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN }}
      MERCADOPAGO_PROD_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_PROD_ACCESS_TOKEN }}
    steps:
      - name: Verify exact released SHA and worker production account with GET only
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,hashlib,urllib.request,urllib.error,time,datetime
          from pathlib import Path
          expected="e2713acb8810ce4181b30f6ead62a946b0560bcb"
          root="https://zevanory.api.br"
          report={"schema":"zevanory.c1.live.proof/v1","sha_expected":expected,"checks":{},"commercial_release_allowed":False}
          token=os.environ.get("CERTIFICATION_E2E_TOKEN","").strip()
          prod=os.environ.get("MERCADOPAGO_PROD_ACCESS_TOKEN","").strip()
          def get(url,headers=None):
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"ZEVANORY-AuditReadOnly/1.0",**(headers or {})},method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=25) as x:return x.status,json.loads(x.read(200000))
              except urllib.error.HTTPError as e:
                  try:return e.code,json.loads(e.read(200000))
                  except:return e.code,{}
              except Exception:return 0,{}
          def notice(k,v):print("::notice title=C1_"+k+"::"+str(v),flush=True)
          def stop(code):
              report["state"]="NO_GO"
              Path("c1-live-proof-sanitized.json").write_text(json.dumps(report,indent=2)+"\n")
              print("::error title=C1_LIVE_PROOF::"+code,flush=True)
              raise SystemExit(2)
          if not token or not prod:stop("AUDIT_OR_PRODUCTION_TOKEN_MISSING")
          release_ok=False
          for _ in range(8):
              code,release=get(root+"/api/control-plane")
              current=(release.get("release") or {}).get("deployment") or {}
              if code==200 and current.get("commit_sha")==expected:release_ok=True;break
              time.sleep(12)
          report["checks"]["release_probe_http"]=code
          notice("RELEASE_PROBE_HTTP",code)
          report["checks"]["exact_release"]=release_ok
          notice("EXACT_RELEASE",release_ok)
          if not release_ok:stop("RELEASE_SHA_NOT_VERIFIED")
          headers={"x-certification-e2e-token":token}
          for path in ["/api/internal/audit/runtime-identity","/api/internal/audit/financial-classification"]:
              plain,body=get(root+path)
              report["checks"]["anonymous_"+path.rsplit("/",1)[-1]]=plain
              notice("ANONYMOUS_"+path.rsplit("/",1)[-1]+"_HTTP",plain)
              if plain!=401:stop("ANONYMOUS_NOT_DENIED")
              code,data=get(root+path,headers)
              kind=path.rsplit("/",1)[-1]
              report["checks"][kind+"_http"]=code
              notice(kind.upper()+"_HTTP",code)
              safe=json.dumps(data)
              if any(field in safe.lower() for field in ['database_url','access_token','password','payer_email','authorization']):
                  stop("SENSITIVE_RESPONSE_FIELD")
              if kind=="runtime-identity":
                  identity=data.get("identity") or {};db=data.get("database") or {}
                  report["checks"]["worker_env"]=identity.get("environment")
                  report["checks"]["db_suffix"]=db.get("provider_host_suffix")
                  report["checks"]["db_size_known"]=isinstance(db.get("size_bytes"),int)
                  notice("WORKER_ENV",identity.get("environment"))
                  notice("DB_HOST_SUFFIX",db.get("provider_host_suffix"))
                  notice("DB_SIZE_KNOWN",report["checks"]["db_size_known"])
                  gcode,ghuser=get("https://api.mercadopago.com/users/me",{"Authorization":"Bearer "+prod})
                  gh_hash=hashlib.sha256(str(ghuser.get("id") or "").encode()).hexdigest()[:16] if gcode==200 else ""
                  same=bool(gh_hash) and gh_hash==identity.get("user_id_sha256_16")
                  report["checks"]["same_mp_account_hash"]=same
                  notice("SAME_ACCOUNT_HASH",same)
              else:
                  report["checks"]["financial_ambiguous"]=data.get("ambiguous")
                  report["checks"]["production_confirmed"]=data.get("production_confirmed")
                  notice("FINANCIAL_AMBIGUOUS",data.get("ambiguous"))
                  notice("FINANCIAL_PRODUCTION_CONFIRMED",data.get("production_confirmed"))
                  report["checks"]["financial_test_pilot"]=data.get("certification_events")
                  report["checks"]["financial_not_in_production"]=data.get("not_in_production")
                  report["checks"]["orders_aggregates"]=data.get("orders") if isinstance(data.get("orders"),dict) else {}
                  notice("FINANCIAL_TEST_PILOT",data.get("certification_events"))
                  notice("FINANCIAL_NOT_IN_PRODUCTION",data.get("not_in_production"))
                  for item in data.get("evidence_reasons") or []:
                      reason=str(item.get("reason") or "")
                      count=item.get("count")
                      if not reason or len(reason)>95 or not all(c.islower() or c.isdigit() or c in ":_" for c in reason) or type(count) is not int:stop("UNSAFE_EVIDENCE_REASON")
                      notice("AGGREGATE_REASON",reason+" count="+str(count))
                      report.setdefault("sanitized_reasons",[]).append({"reason":reason,"count":count})
              if code!=200:stop(kind.upper()+"_NOT_PROVEN")
          if not report["checks"].get("same_mp_account_hash"):stop("COLLECTOR_ACCOUNT_MISMATCH")
          if report["checks"].get("financial_ambiguous")!=0:stop("AMBIGUOUS_PAYMENT_RECORDS")
          report["state"]="CLASSIFICATION_PROVEN_NOT_COMMERCIAL_GO"
          Path("c1-live-proof-sanitized.json").write_text(json.dumps(report,indent=2)+"\n")
          notice("STATE",report["state"])
          PY
      - name: Preserve summarized proof for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-live-proof-sanitized
          path: c1-live-proof-sanitized.json
          retention-days: 1
          if-no-files-found: warn
