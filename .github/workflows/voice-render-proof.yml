name: Render voice synthesis and cache proof
# RETIRED (2026-10-23). The former "proof" job built app-secret-signed fake inbound WhatsApp
# webhooks (via /api/admin/whatsapp-onboard/delivery-proof, now 410 Gone) and posted them to the
# production Meta webhook, so the live bot sent real automated replies to a real number, outside the
# 24h window (runs of 4–8 Oct 2026). Meta permanently disabled WABA 4019600665012911 on 2026-10-10.
# The job is DELETED, not parked behind `if: false`. The file and its triggers stay only because the
# frozen merge-impact replay (tests/ci/gabarito_833_real.json) counts this workflow; the remaining
# job is skipped on every automatic trigger and, on manual dispatch, only prints this notice.
# No secret, no environment, no network call. tests/whatsapp-retirement.test.mjs pins this shape.
on:
  workflow_run:
    workflows: ['ZEVANORY central production deploy']
    types: [completed]
    branches: [gh-pages]
  workflow_dispatch:
permissions: {}
jobs:
  retired:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo "::notice title=WHATSAPP_RETIRED::voice WhatsApp delivery proof removed (meta_account_permanently_disabled); nothing to run."
