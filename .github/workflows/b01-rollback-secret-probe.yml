{
  "name": "B01 rollback secret value probe",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "b01-rollback-secret-probe",
    "cancel-in-progress": false
  },
  "jobs": {
    "probe": {
      "if": "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/gh-pages' && github.run_attempt == 1",
      "environment": {
        "name": "sandbox-financial-approved"
      },
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "env": {
        "CLOUDFLARE_SANDBOX_PROBE_TOKEN": "${{ secrets.CLOUDFLARE_SANDBOX_PROBE_TOKEN }}",
        "CLOUDFLARE_ACCOUNT_ID": "1b26415802588185a86c1d4d3ebf5bdb"
      },
      "steps": [
        {
          "uses": "actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Single-run guard (global, consumes the owner's authorization)",
          "shell": "bash",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "run": "bash sandbox/rollback-secret-probe/single-run-guard.sh"
        },
        {
          "name": "Prove rollback value on the pre-created probe Worker, then remove the probe secret",
          "id": "probe",
          "shell": "bash",
          "run": "bash sandbox/rollback-secret-probe/run-probe.sh"
        },
        {
          "name": "Always retry cleanup if the probe did not finish it",
          "if": "${{ always() }}",
          "shell": "bash",
          "run": "bash sandbox/rollback-secret-probe/cleanup-only.sh"
        }
      ]
    }
  }
}
