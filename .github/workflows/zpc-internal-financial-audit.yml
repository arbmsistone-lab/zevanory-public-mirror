name: ZEVANORY internal financial audit safety
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "worker/internal-financial-audit.mjs"
      - "worker/cloudflare-worker.compat.mjs"
      - "tests/internal-financial-audit.test.mjs"
      - ".github/workflows/zpc-internal-financial-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate module and worker syntax
        run: |
          node --check worker/internal-financial-audit.mjs
          node --check worker/cloudflare-worker.compat.mjs
      - name: Negative audit authorization and classification tests
        run: node --test tests/internal-financial-audit.test.mjs tests/commercial-metrics-projection.test.mjs
