name: Voice attendant end-to-end evaluation (weekly)

# Real production models: customer audio -> Whisper -> attendant -> production voice -> Whisper,
# plus the free fallback voice. Zero cost (free tiers). Scores only, no conversation data.
on:
  schedule:
    - cron: "30 12 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZEVANORY_OPERATOR_TOKEN: ${{ secrets.ZEVANORY_OPERATOR_TOKEN || secrets.CERTIFICATION_E2E_TOKEN }}  # R9: nome novo; queda para o antigo só na transição
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/voice-eval.test.mjs
      - run: node scripts/ops/voice-eval.mjs
