name: T2 Workers AI creative factory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate five grounded 1080x1080 creatives
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "1b26415802588185a86c1d4d3ebf5bdb"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          mkdir -p t2-output
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { SUPPORT_PRODUCTS } from './worker/support-knowledge.mjs';
          import { validateReply } from './worker/whatsapp-conversation.mjs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const salesOrigin = 'https://vendas.zevanory.api.br';
          const model = '@cf/black-forest-labs/flux-2-klein-4b';
          const results = [];

          const brl = n => 'R$ ' + Number(n).toFixed(2).replace('.', ',');

          for (const [slug, product] of Object.entries(SUPPORT_PRODUCTS)) {
            const caption = [
              product.name + ': ' + product.content,
              '',
              'Preço de tabela: ' + brl(product.price_brl) + '.',
              salesOrigin + '/' + slug,
            ].join('\n');
            const validation = validateReply(caption);
            if (!validation.ok) throw new Error('CAPTION_VALIDATION_FAILED_' + slug + '_' + validation.issues.join(','));

            const prompt = [
              'Professional premium square social media creative for a Brazilian digital education brand named ZEVANORY.',
              'Product theme: ' + product.name + '.',
              'Concept: ' + product.content,
              'Elegant dark navy and electric blue visual language, cinematic studio lighting, polished commercial design.',
              'No logos from other brands, no people making claims, no testimonial, no discount, no price text, no written text in the image.',
              'Leave visual breathing room for later approved copy overlay.',
            ].join(' ');

            const form = new FormData();
            form.append('prompt', prompt);
            form.append('width', '1080');
            form.append('height', '1080');
            form.append('seed', String(1000 + results.length));

            const response = await fetch(
              'https://api.cloudflare.com/client/v4/accounts/' + account + '/ai/run/' + model,
              { method: 'POST', headers: { authorization: 'Bearer ' + token }, body: form },
            );
            const raw = await response.text();
            if (!response.ok) throw new Error('WORKERS_AI_' + slug + '_HTTP_' + response.status + '_' + raw.slice(0,300));
            const parsed = JSON.parse(raw);
            const image = parsed?.result?.image || parsed?.image || '';
            if (!image || image.length < 1000) throw new Error('WORKERS_AI_' + slug + '_IMAGE_MISSING');

            results.push({
              slug,
              name: product.name,
              price_brl: product.price_brl,
              product_url: salesOrigin + '/' + slug,
              caption,
              validation,
              model,
              width: 1080,
              height: 1080,
              image_data_url: 'data:image/jpeg;base64,' + image,
            });
            console.log('T2_CREATIVE_GENERATED=' + slug + ' validateReply=PASS dimensions=1080x1080');
          }

          if (results.length !== 5) throw new Error('T2_EXPECTED_5_CREATIVES');
          fs.writeFileSync('t2-output/creatives.json', JSON.stringify(results));
          console.log('T2_CREATIVES=5/5_PASS');
          NODE

      - name: Upload private workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: t2-workers-ai-creatives
          path: t2-output/creatives.json
          retention-days: 3
          if-no-files-found: error
