name: T2 Workers AI creative factory

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/t2-workers-ai-creative-factory.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate five grounded 1080x1080 creatives inside Worker
        env:
          CERTIFICATION_E2E_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CERTIFICATION_E2E_TOKEN:-}"
          mkdir -p t2-output
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHmac, randomUUID } from 'node:crypto';

          const secret = process.env.CERTIFICATION_E2E_TOKEN || '';
          if (secret.length < 32) throw new Error('T2_CERTIFICATION_TOKEN_UNAVAILABLE');

          const calls = [];
          for (let call = 1; call <= 5; call += 1) {
            const timestamp = String(Date.now());
            const nonce = randomUUID();
            const message = ['zevanory-commercial-creative-factory-v1', timestamp, nonce].join('\n');
            const signature = createHmac('sha256', secret).update(message).digest('hex');

            const response = await fetch('https://controle.zevanory.api.br/api/commercial/creative/factory/tick', {
              method: 'POST',
              headers: {
                'x-commercial-timestamp': timestamp,
                'x-commercial-nonce': nonce,
                'x-commercial-signature': signature,
                'cache-control': 'no-store',
              },
              signal: AbortSignal.timeout(180_000),
            });

            const raw = await response.text();
            console.log('T2_FACTORY_CALL=' + call);
            console.log('T2_FACTORY_HTTP=' + response.status);
            console.log('T2_FACTORY_RESPONSE=' + raw);
            if (!response.ok) {
              fs.writeFileSync('t2-output/factory-calls.json', JSON.stringify(calls, null, 2));
              throw new Error('T2_FACTORY_CALL_' + call + '_HTTP_' + response.status + '_' + raw.slice(0, 800));
            }

            const result = JSON.parse(raw);
            calls.push({ call, http: response.status, result });
            fs.writeFileSync('t2-output/factory-calls.json', JSON.stringify(calls, null, 2));
            if (result?.ok !== true) throw new Error('T2_FACTORY_CALL_' + call + '_NOT_OK');
          }

          const final = calls.at(-1)?.result || {};
          if (Number(final?.approvals) !== 5) throw new Error('T2_APPROVAL_COUNT_' + String(final?.approvals));
          if (Number(final?.archivedBriefs) !== 31) throw new Error('T2_ARCHIVED_BRIEFS_' + String(final?.archivedBriefs));
          if (!Array.isArray(final?.creativeProof) || final.creativeProof.length !== 5) throw new Error('T2_CREATIVE_PROOF_COUNT');

          fs.writeFileSync('t2-output/factory.json', JSON.stringify(final, null, 2));
          console.log('T2_CREATIVES=5/5_PASS');
          console.log('T2_ARCHIVED_BRIEFS=31_PASS');
          NODE

      - name: Capture support artifact integrity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2             https://controle.zevanory.api.br/api/support/artifacts-status             -o t2-output/artifacts-status.json
          cat t2-output/artifacts-status.json
          jq -e '[.products[]? | select(.integrity == true)] | length >= 5' t2-output/artifacts-status.json >/dev/null

      - name: Upload private workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: t2-worker-factory-result
          path: t2-output/
          retention-days: 3
          if-no-files-found: error
