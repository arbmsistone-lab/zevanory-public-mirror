name: T2 Workers AI creative factory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate five grounded 1080x1080 creatives inside Worker
        env:
          CERTIFICATION_E2E_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CERTIFICATION_E2E_TOKEN:-}"
          mkdir -p t2-output
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHmac, randomUUID } from 'node:crypto';

          const secret = process.env.CERTIFICATION_E2E_TOKEN || '';
          if (secret.length < 32) throw new Error('T2_CERTIFICATION_TOKEN_UNAVAILABLE');

          const timestamp = String(Date.now());
          const nonce = randomUUID();
          const message = ['zevanory-commercial-creative-factory-v1', timestamp, nonce].join('\n');
          const signature = createHmac('sha256', secret).update(message).digest('hex');

          const response = await fetch('https://controle.zevanory.api.br/api/commercial/creative/factory/tick', {
            method: 'POST',
            headers: {
              'x-commercial-timestamp': timestamp,
              'x-commercial-nonce': nonce,
              'x-commercial-signature': signature,
              'cache-control': 'no-store',
            },
            signal: AbortSignal.timeout(180_000),
          });

          const raw = await response.text();
          console.log('T2_FACTORY_HTTP=' + response.status);
          console.log('T2_FACTORY_RESPONSE=' + raw.slice(0, 2000));
          if (!response.ok) throw new Error('T2_FACTORY_HTTP_' + response.status + '_' + raw.slice(0, 400));

          const result = JSON.parse(raw);
          if (result?.ok !== true) throw new Error('T2_FACTORY_NOT_OK');
          if (Number(result?.approvals) !== 5) throw new Error('T2_APPROVAL_COUNT_' + String(result?.approvals));
          if (Number(result?.archivedBriefs) !== 31) throw new Error('T2_ARCHIVED_BRIEFS_' + String(result?.archivedBriefs));

          fs.writeFileSync('t2-output/factory.json', JSON.stringify(result, null, 2));
          console.log('T2_CREATIVES=5/5_PASS');
          console.log('T2_ARCHIVED_BRIEFS=31_PASS');
          NODE

      - name: Upload private workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: t2-worker-factory-result
          path: t2-output/factory.json
          retention-days: 3
          if-no-files-found: error
