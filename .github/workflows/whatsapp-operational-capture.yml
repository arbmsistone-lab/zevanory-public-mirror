name: WhatsApp real owner final evidence
on:
  pull_request:
    branches: [gh-pages]
    paths: ['.github/workflows/whatsapp-operational-capture.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPERATOR_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN || secrets.OPERATOR_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '1b26415802588185a86c1d4d3ebf5bdb'
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Capture current real messages and delivery receipt
        run: |
          mkdir -p /tmp/real-evidence
          npm install --prefix /tmp/real-tools --no-save wrangler@4.143.0 >/dev/null 2>&1
          timeout 90s /tmp/real-tools/node_modules/.bin/wrangler tail zevanory --format json > /tmp/real-tail.json 2>/tmp/real-tail.err &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const origin='https://zevanory.api.br';
          async function op(input){
           const r=await fetch(origin+'/api/admin/whatsapp-onboard/delivery-proof',{method:'POST',headers:{authorization:'Bearer '+process.env.OPERATOR_TOKEN,'content-type':'application/json'},body:JSON.stringify(input),signal:AbortSignal.timeout(60000)});
           return {http:r.status,...await r.json()};
          }
          const observations=await op({operation:'audit-observe'});
          writeFileSync('/tmp/real-evidence/observations.json',JSON.stringify(observations,null,2));console.log(JSON.stringify({observations}));
          const audio=observations.observations?.find(o=>o.inbound_type==='audio'&&o.voice_sent);
          if(audio?.voice_media_id){
            const media=await op({operation:'audit-media',media_id:audio.voice_media_id});
            if(media.audio_base64){const quality=await op({operation:'audit-transcribe',audio_base64:media.audio_base64});console.log(JSON.stringify({real_voice_quality:{expected:audio.speech_text,...quality}}));writeFileSync('/tmp/real-evidence/quality.json',JSON.stringify({expected:audio.speech_text,...quality},null,2));}
          }
          let closure;
          for(let n=0;n<12;n++){closure=await fetch(origin+'/api/voice/final-closure').then(r=>r.json());if(closure.whatsapp_e2e)break;await new Promise(r=>setTimeout(r,5000));}
          console.log(JSON.stringify({final_closure:closure}));writeFileSync('/tmp/real-evidence/final-closure.json',JSON.stringify(closure,null,2));
          await new Promise(r=>setTimeout(r,15000));
          JS
      - name: Sanitize tail
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/real-tail.json')
          raw=p.read_text() if p.exists() else ''
          decoder=json.JSONDecoder();pos=0;events=[]
          while pos<len(raw):
              start=raw.find('{',pos)
              if start<0:break
              try:e,end=decoder.raw_decode(raw[start:]);pos=start+end
              except ValueError:pos=start+1;continue
              req=(e.get('event') or {}).get('request') or {}
              if '/api/webhooks/meta' not in str(req.get('url','')):continue
              events.append({'timestamp':e.get('eventTimestamp'),'outcome':e.get('outcome'),'cpuTime':e.get('cpuTime'),'wallTime':e.get('wallTime'),'path':'/api/webhooks/meta','exceptions':[x.get('name') for x in e.get('exceptions',[])]})
          pathlib.Path('/tmp/real-evidence/tail.json').write_text(json.dumps(events,indent=2));print(json.dumps(events,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-real-owner-final-evidence
          path: /tmp/real-evidence/
          retention-days: 7
