name: ZEVANORY No Scroll Baseline Audit

on:
  push:
    branches:
      - audit/no-scroll-baseline-20260929

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.62.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 > /tmp/zevanory-static.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/zevanory-static.log
          exit 1
      - name: Measure global overflow
        shell: bash
        run: |
          cat > audit.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const routes=['/','/arbm-sist/','/ia-na-pratica/','/vendas-na-pratica/','/combo-ia-vendas/','/lucro-e-caixa/','/negocio-completo/','/zevanory-one/','/zevanory-cfo/'];
          const views=[
            {name:'desktop',width:1440,height:900},
            {name:'laptop',width:1366,height:768},
            {name:'tablet',width:768,height:1024},
            {name:'mobile',width:390,height:844}
          ];
          const browser=await chromium.launch({headless:true});
          const rows=[];
          for(const v of views){
            const page=await browser.newPage({viewport:{width:v.width,height:v.height}});
            for(const route of routes){
              const response=await page.goto('http://127.0.0.1:4173'+route,{waitUntil:'load'});
              const m=await page.evaluate(()=>({
                sh:document.documentElement.scrollHeight,
                sw:document.documentElement.scrollWidth,
                ih:window.innerHeight,
                iw:window.innerWidth,
                bodySh:document.body.scrollHeight,
                overflowY:getComputedStyle(document.documentElement).overflowY,
                overflowX:getComputedStyle(document.documentElement).overflowX
              }));
              rows.push({view:v.name,route,http:response?.status()||0,...m,verticalOverflow:m.sh>m.ih+1,horizontalOverflow:m.sw>m.iw+1});
              await page.close();
            }
          }
          await browser.close();
          const result={schema:'zevanory.no-scroll-baseline.v1',rows,pass:rows.every(r=>!r.verticalOverflow&&!r.horizontalOverflow&&r.http===200)};
          fs.writeFileSync('no-scroll-baseline.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          if(result.pass) console.log('LAYOUT_NO_SCROLL=PASS');
          else console.log('LAYOUT_NO_SCROLL=FAIL');
          NODE
          node audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zevanory-no-scroll-baseline
          path: no-scroll-baseline.json
          retention-days: 30
