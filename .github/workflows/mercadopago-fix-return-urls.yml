name: Mercado Pago - corrigir retorno Checkout Pro

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/mercadopago-fix-return-urls.yml"

permissions:
  contents: read

jobs:
  fix-return:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MP_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_TEST_ACCESS_TOKEN }}
      PREF_ID: 3670768257-f4236a66-96f6-49fc-ba1c-2587780b36e2
    steps:
      - name: Configure real ZEVANORY return URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ["MP_ACCESS_TOKEN"].strip()
          pref=os.environ["PREF_ID"].strip()
          payload={
            "back_urls":{
              "success":"https://vendas.zevanory.api.br/solucoes?pagamento=aprovado",
              "failure":"https://vendas.zevanory.api.br/solucoes?pagamento=falhou",
              "pending":"https://vendas.zevanory.api.br/solucoes?pagamento=pendente"
            },
            "auto_return":"approved"
          }
          req=urllib.request.Request(
            "https://api.mercadopago.com/checkout/preferences/"+pref,
            method="PUT",
            headers={"Authorization":"Bearer "+token,"Content-Type":"application/json","Accept":"application/json"},
            data=json.dumps(payload).encode()
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              body=json.loads(r.read().decode())
          assert body.get("back_urls")==payload["back_urls"], body.get("back_urls")
          assert body.get("auto_return")=="approved", body.get("auto_return")
          print("BACK_URLS_REAL=PASS")
          print("AUTO_RETURN=approved")
          PY
