name: Engine dispatcher

# GitHub drops most cron firings in this busy repository. This dispatcher wakes up whenever
# a frequent workflow finishes (plus its own cron) and starts any engine that is due and not
# yet done today, via workflow_dispatch. Engines are idempotent; attempts are capped per day.
on:
  workflow_run:
    workflows:
      - "ZEVANORY ZEES-16 control reconciler"
      - "ZEVANORY Order 12-A financial proof renewal"
      - "ZEVANORY authenticated open-provider runtime quorum"
      - "ZEVANORY voice human certification reconciler"
      - "ZEVANORY voice final closure reconciler"
      - "ZEVANORY first order watch"
      - "zevanory-p12-continuous-slo"
      - "T2 exact control worker promotion"
      - "YouTube autonomous daily Short"
      - "Command center snapshot (read-only)"
    types: [completed]
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

concurrency:
  group: engine-dispatcher
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/engine-dispatcher.test.mjs
      - run: node scripts/ops/engine-dispatcher.mjs
