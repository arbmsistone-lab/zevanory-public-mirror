name: Sales lock publishers
# Trava de vendas nos publicadores de conteúdo: motor de aquisição (Telegram/Bluesky), Short do YouTube e adaptadores
# orgânicos do bundle. Com a trava fechada, ilegível ou incompleta nenhum texto publicado leva preço, /comprar,
# Hotmart/checkout ou chamada de compra. Testes comportamentais (exatamente 9) + mutantes (exatamente 34 KILLED pelo
# teste esperado). H = modo Hotmart (5 kits pela Hotmart com o interruptor completo fechado); P = pausa criativa. Só pull request: nunca dispara no merge. Offline, sem segredos, somente leitura.
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "worker/acquisition-engine.mjs"
      - "worker/bluesky-publisher.mjs"
      - "worker/sales-lock-content.mjs"
      - "worker/sales-control.mjs"
      - "worker/politica-unica.mjs"
      - "data/politica-unica.json"
      - "worker/cloudflare-worker.recovered.mjs"
      - "scripts/channels/youtube-daily-short.mjs"
      - "scripts/channels/short-crosspost.mjs"
      - "tests/sales-lock-publishers.test.mjs"
      - "scripts/ci/mutants_sales_lock_publishers.mjs"
      # Blog com publicação automática e gate de qualidade (Plano Mestre v1.2 §9; inclui a trava de vendas do blog).
      - "worker/blog-quality-gate.mjs"
      - "worker/blog-editorial.mjs"
      - "worker/multichannel-autonomy.mjs"
      - "worker/creative-autonomy.mjs"
      - "data/fontes-permitidas.json"
      - "tests/blog-autopublicacao.test.mjs"
      - "scripts/ci/mutants_blog_gate.mjs"
      - ".github/workflows/sales-lock-publishers.yml"
permissions:
  contents: read
concurrency:
  group: sales-lock-publishers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sales-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes (exatamente 9)
        run: |
          set -euo pipefail
          node --test tests/sales-lock-publishers.test.mjs < /dev/null | tee t.txt
          grep -qx '# tests 9' t.txt && grep -qx '# pass 9' t.txt && grep -qx '# fail 0' t.txt && grep -qx '# skipped 0' t.txt
      - name: Mutantes (exatamente 34 KILLED)
        run: |
          set -euo pipefail
          node scripts/ci/mutants_sales_lock_publishers.mjs < /dev/null | tee mut.txt
          grep -qx 'BASELINE PASS tests=9' mut.txt
          grep -qx 'MUTANTS PASS killed=34/34' mut.txt
          test "$(grep -c ' KILLED by=' mut.txt)" = "34"
          git diff --exit-code -- worker scripts tests
      - name: Blog com gate de qualidade (exatamente 10 testes)
        run: |
          set -euo pipefail
          node --test tests/blog-autopublicacao.test.mjs < /dev/null | tee b.txt
          grep -qx '# tests 10' b.txt && grep -qx '# pass 10' b.txt && grep -qx '# fail 0' b.txt && grep -qx '# skipped 0' b.txt
      - name: Mutantes do blog (exatamente 37 KILLED)
        run: |
          set -euo pipefail
          node scripts/ci/mutants_blog_gate.mjs < /dev/null | tee bmut.txt
          grep -qx 'BASELINE PASS tests=10' bmut.txt
          grep -qx 'MUTANTS PASS killed=37/37' bmut.txt
          test "$(grep -c ' KILLED by=' bmut.txt)" = "37"
          git diff --exit-code -- worker scripts tests
