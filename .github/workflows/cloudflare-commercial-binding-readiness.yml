name: ZEVANORY Cloudflare binding readiness
on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-commercial-binding-readiness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'e3caca88f4343c3cdfcf66eebe6ac124' }}
    steps:
      - name: Inspect binding names and types only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory/settings"             -o /tmp/settings.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/settings.json"))
          assert d.get("success") is True, d.get("errors")
          prefixes=("META_","WHATSAPP_","MERCADOPAGO_","ASAAS_","PAYMENT_","RESEND_","SALE_","PRE_SALE_","ABSOLUTE_","CHECKOUT_","FINANCIAL_","CERTIFICATION_","SUPPORT_")
          exact={"DATABASE_URL","ZEVANORY_PRIVATE_ARTIFACTS","INSTAGRAM_BUSINESS_ACCOUNT_ID"}
          found={}
          for b in d.get("result",{}).get("bindings",[]):
              name=str(b.get("name") or "")
              if name in exact or name.startswith(prefixes):
                  found[name]=str(b.get("type") or "unknown")
          for name in sorted(found):
              print(f"BINDING {name} TYPE={found[name]}")
          PY

      - name: Locate historical Asaas secret bindings without reading values
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$BASE/versions?per_page=100" -o /tmp/versions.json
          python3 - <<'PY' > /tmp/version_ids
          import json
          d=json.load(open("/tmp/versions.json"))
          r=d.get("result",[])
          if isinstance(r,dict):
              r=r.get("versions",[])
          for v in r:
              if isinstance(v,str):
                  print(v)
              elif isinstance(v,dict) and v.get("id"):
                  print(v["id"])
          PY
          found=0
          while read -r vid; do
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$BASE/versions/$vid" -o /tmp/version.json || continue
            if VID="$vid" python3 - <<'PY'
          import json,os
          d=json.load(open("/tmp/version.json"))
          r=d.get("result",{})
          bindings=[]
          if isinstance(r,dict):
              resources=r.get("resources",{})
              if isinstance(resources,dict):
                  bindings=resources.get("bindings",[]) or []
              if not bindings:
                  bindings=r.get("bindings",[]) or []
          names={str(b.get("name") or "") for b in bindings if isinstance(b,dict) and str(b.get("type") or "")=="secret_text"}
          hit={"ASAAS_API_KEY","ASAAS_WEBHOOK_TOKEN"} & names
          if hit:
              print("HISTORICAL_ASAAS_SECRET_VERSION",os.environ["VID"],"NAMES",",".join(sorted(hit)))
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            then found=1; break; fi
          done < /tmp/version_ids
          if [ "$found" = "0" ]; then echo "HISTORICAL_ASAAS_SECRET_VERSION=NOT_FOUND"; fi

      - name: Inspect Cloudflare versions response shape safely
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$BASE/versions?per_page=20" -o /tmp/versions-shape.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/versions-shape.json"))
          r=d.get("result")
          print("VERSIONS_RESULT_TYPE="+type(r).__name__)
          if isinstance(r,dict):
              print("VERSIONS_RESULT_KEYS="+",".join(sorted(r.keys())))
              for k,v in r.items():
                  print("KEY",k,"TYPE",type(v).__name__)
                  if isinstance(v,list):
                      print("LIST_LEN",len(v))
                      for item in v[:5]:
                          if isinstance(item,dict):
                              print("ITEM_KEYS",",".join(sorted(item.keys())))
                              print("ITEM_ID",item.get("id"),"NUMBER",item.get("number"),"CREATED",item.get("metadata",{}).get("created_on") if isinstance(item.get("metadata"),dict) else None)
                          else:
                              print("ITEM_VALUE_TYPE",type(item).__name__)
          elif isinstance(r,list):
              print("VERSIONS_LIST_LEN="+str(len(r)))
              for item in r[:5]:
                  if isinstance(item,dict):
                      print("ITEM_KEYS",",".join(sorted(item.keys())))
                      print("ITEM_ID",item.get("id"),"NUMBER",item.get("number"))
                  else:
                      print("ITEM_VALUE_TYPE",type(item).__name__)
          PY
