name: ZEVANORY Cloudflare binding readiness
# zero-spend Meta/WhatsApp binding inventory probe 2026-09-23
on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-commercial-binding-readiness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'e3caca88f4343c3cdfcf66eebe6ac124' }}
    steps:
      - name: Inspect binding names and types only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory/settings"             -o /tmp/settings.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/settings.json"))
          assert d.get("success") is True, d.get("errors")
          prefixes=("META_","WHATSAPP_","MERCADOPAGO_","PAYMENT_","RESEND_","SALE_","PRE_SALE_","ABSOLUTE_","CHECKOUT_","FINANCIAL_","CERTIFICATION_","SUPPORT_")
          exact={"DATABASE_URL","ZEVANORY_PRIVATE_ARTIFACTS","INSTAGRAM_BUSINESS_ACCOUNT_ID","ELITE_INTERNAL_TOKEN","OPERATOR_TOKEN","ZEVANORY_ADMIN_PASSWORD"}
          found={}
          for b in d.get("result",{}).get("bindings",[]):
              name=str(b.get("name") or "")
              if name in exact or name.startswith(prefixes):
                  found[name]=str(b.get("type") or "unknown")
          for name in sorted(found):
              print(f"BINDING {name} TYPE={found[name]}")
          PY

      - name: Discover zero-spend Meta WhatsApp worker routes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"             -o /tmp/scripts.json
          python3 - <<'PY'
          import json, re, subprocess
          d=json.load(open("/tmp/scripts.json"))
          assert d.get("success") is True, d.get("errors")
          names=[]
          for item in d.get("result",[]):
              name=str(item.get("id") or item.get("script_name") or item.get("name") or "")
              if name and re.search(r"(whatsapp|meta|zevanory|giro)", name, re.I):
                  names.append(name)
          print("MATCHING_WORKERS", len(names))
          for name in sorted(set(names)):
              print("WORKER", name)
          PY
          python3 - <<'PY'
          import json, re, subprocess, os, urllib.request
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          d=json.load(open("/tmp/scripts.json"))
          names=[]
          for item in d.get("result",[]):
              name=str(item.get("id") or item.get("script_name") or item.get("name") or "")
              if name and re.search(r"(whatsapp|meta|zevanory|giro)", name, re.I):
                  names.append(name)
          prefixes=("META_","WHATSAPP_")
          exact={"DATABASE_URL","INSTAGRAM_BUSINESS_ACCOUNT_ID"}
          for name in sorted(set(names)):
              req=urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{name}/settings",
                  headers={"Authorization":f"Bearer {token}"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data=json.load(r)
              except Exception as e:
                  print("WORKER_SETTINGS_UNAVAILABLE", name, type(e).__name__)
                  continue
              found=[]
              for b in data.get("result",{}).get("bindings",[]):
                  key=str(b.get("name") or "")
                  if key in exact or key.startswith(prefixes):
                      found.append((key,str(b.get("type") or "unknown")))
              for key,typ in sorted(found):
                  print(f"WORKER_BINDING {name} {key} TYPE={typ}")
          PY

      - name: Audit legacy WhatsApp bridge capability safely
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/giro-whatsapp-bridge/settings"             -o /tmp/wa-settings.json
          python3 - <<'PY'
          import json, hashlib
          d=json.load(open("/tmp/wa-settings.json"))
          assert d.get("success") is True, d.get("errors")
          for b in d.get("result",{}).get("bindings",[]):
              n=str(b.get("name") or "")
              print("WA_BINDING_NAME",n,"TYPE="+str(b.get("type") or "unknown"))
              if n=="WHATSAPP_PHONE_NUMBER_ID":
                  v=str(b.get("text") or b.get("value") or "")
                  print("WA_PHONE_ID_PRESENT", bool(v))
                  print("WA_PHONE_ID_FINGERPRINT", hashlib.sha256(v.encode()).hexdigest()[:12] if v else "none")
              elif n in {"META_APP_SECRET","WHATSAPP_ACCESS_TOKEN","WHATSAPP_VERIFY_TOKEN"}:
                  print(n+"_PRESENT", True)
          PY
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/giro-whatsapp-bridge"             -o /tmp/wa-worker.bin
          python3 - <<'PY'
          import re
          raw=open("/tmp/wa-worker.bin","rb").read().decode("utf-8","ignore")
          checks={
            "graph_api": bool(re.search(r"graph\.facebook\.com",raw,re.I)),
            "messages_api": bool(re.search(r"/messages",raw,re.I)),
            "webhook_verify": bool(re.search(r"hub\.verify_token|hub\.challenge",raw,re.I)),
            "signature_validation": bool(re.search(r"x-hub-signature|sha256",raw,re.I)),
            "phone_number_id": bool(re.search(r"WHATSAPP_PHONE_NUMBER_ID",raw)),
            "access_token": bool(re.search(r"WHATSAPP_ACCESS_TOKEN",raw)),
          }
          for k,v in checks.items():
              print("WA_BRIDGE_CAPABILITY",k,str(v).lower())
          routes=sorted(set(re.findall(r'["\'](/[^"\'\s]{1,80})["\']',raw)))
          for route in routes[:80]:
              if any(x in route.lower() for x in ("webhook","whatsapp","message","health","status")):
                  print("WA_BRIDGE_ROUTE",route)
          for needle in ("/admin/status","/webhook","/health","graph.facebook.com","WHATSAPP_PHONE_NUMBER_ID"):
              pos=raw.find(needle)
              if pos>=0:
                  snippet=raw[max(0,pos-700):min(len(raw),pos+2200)]
                  snippet=re.sub(r'(?i)(Bearer\\s+)[A-Za-z0-9._-]+',r'\\1[REDACTED]',snippet)
                  print("WA_BRIDGE_SNIPPET",needle,repr(snippet[:2600]))
          PY
