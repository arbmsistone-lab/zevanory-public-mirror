name: B02 sandbox route probe

# B02 — prova REAL do caminho de rotas do router (foto, mutação tripla, retorno + restauração, prova negativa sem
# Workers Routes Write, janela de roteamento errado), pedida pelo auditor Sol. SOMENTE na zona descartável
# girolocal.api.br (domínio sem uso do proprietário, conta ZEVANORY). zevanory.api.br é recusada no script da prova e
# em scripts/ops/router_routes.py (modo sandbox); tests/test_sandbox_route_probe.py prova as recusas.
# Só workflow_dispatch; environment próprio `sandbox-route-probe` (revisor obrigatório), execução ÚNICA global
# (single-run-guard, cota 0) e frase literal no input. Nunca dispara no merge.
# Tokens (AVAL 101) — permissões MÍNIMAS, TTL <= 24h, criados logo antes do disparo e revogados depois do cleanup:
#   CF_PROBE_TOKEN            Account > Workers Scripts > Edit (só a conta ZEVANORY) + Zone > Zone > Read +
#                             Zone > Workers Routes > Edit (só girolocal.api.br)
#   CF_PROBE_TOKEN_NO_ROUTES  Zone > Zone > Read + Zone > Workers Routes > Read (só girolocal.api.br); sem Workers
#                             Scripts e sem Workers Routes Edit
# Oráculo da prova negativa: LEITURA de rotas (snapshot) com sucesso E ESCRITA (preflight/restore) 403. Leitura 403 falha
# a prova com NEGATIVE_TOKEN_READ_DENIED_MISCONFIGURED; escrita aceita falha com NEGATIVE_TOKEN_TOO_BROAD.
on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Frase literal exigida: PROVA ROTAS GIROLOCAL UMA VEZ"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: sandbox-route-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/gh-pages' && github.run_attempt == 1 && inputs.confirmacao == 'PROVA ROTAS GIROLOCAL UMA VEZ'
    environment: sandbox-route-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: "22"
      - name: Single-run guard (global, consumes the owner's authorization)
        id: guard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash sandbox/rollback-secret-probe/single-run-guard.sh sandbox-route-probe.yml
      - name: Route probe on girolocal.api.br (snapshot, triple mutation, rollback + restore, negative proof read-OK/write-403)
        shell: bash
        env:
          CF_PROBE_TOKEN: ${{ secrets.CF_PROBE_TOKEN }}
          CF_PROBE_TOKEN_NO_ROUTES: ${{ secrets.CF_PROBE_TOKEN_NO_ROUTES }}
        run: python3 sandbox/route-probe/run_route_probe.py probe
      - name: Always clean up (delete probe routes and both Workers; re-read zero leftovers)
        if: ${{ always() && steps.guard.outcome == 'success' }}
        shell: bash
        env:
          CF_PROBE_TOKEN: ${{ secrets.CF_PROBE_TOKEN }}
        run: python3 sandbox/route-probe/run_route_probe.py cleanup
