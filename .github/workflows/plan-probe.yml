name: Zero-cost plan probe (weekly)

# Reads the real plan of each provider that exposes it by API; a paid subscription or a database
# near its free cap fails the run. Never changes a plan. Zero cost.
on:
  schedule:
    - cron: "40 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: "22"
      - run: node --test tests/plan-probe.test.mjs
      - run: npm install --no-save --no-audit --no-fund pg@8.16.3
      - run: node scripts/audit/plan-probe.mjs
