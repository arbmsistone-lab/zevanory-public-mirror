name: node-suite-manifest-portability

# AVAL Sol (C071-3, #874): o verificador do manifesto da suíte Node e seus mutantes têm de passar igual no
# Linux e no Windows (separador de caminho, resultado no nível do arquivo, codificação). Só pull_request:
# nunca dispara no merge, sem segredos, sem rede além do checkout e da instalação do Node/Python.
on:
  pull_request:
    paths:
      - "tests/test_node_suite_manifest.py"
      - "tests/node-suite.manifest"
      - "tests/*.test.mjs"
      - "scripts/ci/node_suite_check.py"
      - "scripts/ci/node-suite-reporter.mjs"
      - ".github/workflows/node-suite-manifest-portability.yml"
      - ".github/workflows/trava-vendas-integracao-postgres.yml"

permissions:
  contents: read

jobs:
  manifest-tests:
    name: manifest-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Verificador do manifesto e mutantes (contagem exata 14, zero pulados)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          set -euo pipefail
          echo "RUNNER_OS=$RUNNER_OS node=$(node --version) python=$(python --version 2>&1)"
          python -m unittest tests.test_node_suite_manifest -v < /dev/null 2>&1 | tr -d '\r' | tee nm.txt
          grep -qx "Ran 14 tests in .*" nm.txt || { echo "::error::contagem de testes diferente de 14"; exit 1; }
          if grep -q "skipped" nm.txt; then echo "::error::testes pulados"; exit 1; fi
          grep -qx "OK" nm.txt || { echo "::error::suíte não terminou em OK"; exit 1; }
          echo "::notice title=NODE_SUITE_MANIFEST_TESTS ($RUNNER_OS)::Ran 14, OK, skipped 0"
