name: ZEVANORY WhatsApp broker protocol v2 (retired)
# T1 E4: RETIRED publisher. The previous job patched giro-whatsapp-bridge through the Cloudflare API
# (version upload + deployments POST with automatic rollback) using the shared account token, outside any
# serialized group and without a promotion guard. The workflow was disabled_manually and the target Worker is
# absent from the account (workers list 13/10/2026). All write steps and credentials were removed; the patch
# script stays in scripts/patch_whatsapp_broker.py for reference. Listed under "retired" in ops/publishers.json;
# scripts/deploy/worker_write_paths.py fails if a write returns here.
# Triggers kept as before (the workflow is also disabled_manually) so the merge-impact replay of #833 stays exact;
# the only job is a notice.
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "scripts/patch_whatsapp_broker.py"
      - ".github/workflows/whatsapp-broker-protocol-v2.yml"
  push:
    branches: [gh-pages]
    paths:
      - "scripts/patch_whatsapp_broker.py"
      - ".github/workflows/whatsapp-broker-protocol-v2.yml"
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Retired
        run: echo "::notice title=RETIRED::whatsapp-broker-protocol-v2 no longer publishes (T1 E4)"
