name: Sandbox Worker credential names audit
on:
  push:
    branches: [fix/sandbox-secret-env-20261005]
    paths: [.github/workflows/sandbox-worker-secret-audit.yml]
permissions:
  contents: read
concurrency:
  group: deploy-zevanory
  cancel-in-progress: false
  queue: max

jobs:
  audit:
    environment: producao-critica  # B01 M1: efeito em produção comprovado no conteúdo do job; revisor obrigatório
    # Origem do incidente de 05/10 (run 37365806405): gravou MERCADOPAGO_TEST_* no Worker de PRODUÇÃO `zevanory`.
    # A gravação e as referências aos segredos de teste foram removidas; a limpeza é production-test-secret-cleanup.yml.
    if: ${{ false }} # Permanently retired: F2 item 9 (roteiro 3.1 seção 7): credenciais sandbox nunca em Environment de produção; fluxo sandbox = certification-isolated-deploy + mercadopago-combo-sandbox (sandbox-financial-approved)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: List Worker secret names and safe presence metadata
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.143.0 secret list --name zevanory --format json > /tmp/secret-names.json
          jq -r '.[].name' /tmp/secret-names.json | sort
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory/settings" -o /tmp/settings.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/settings.json'))
          assert data.get('success') is True
          for b in data.get('result',{}).get('bindings',[]):
              name=b.get('name','')
              if name.startswith('MERCADOPAGO'):
                  print('WORKER_BINDING '+name+' '+str(b.get('type','')))
              if name=='ZEVANORY_RUNTIME_CONFIG':
                  raw=b.get('json',b.get('text',{}))
                  if isinstance(raw,str):
                      try: raw=json.loads(raw)
                      except ValueError: raw={}
                  for key in sorted(raw if isinstance(raw,dict) else {}):
                      if key.startswith('MERCADOPAGO'): print('RUNTIME_CONFIG_KEY '+key)
          PY
      - uses: actions/checkout@v4
      - name: Compact existing non-secret voice settings within the free variable budget
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory/settings" -o /tmp/settings.json
          python3 scripts/deploy/compact-sandbox-bindings.py
          curl -fsS -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -F 'settings=@/tmp/compact-settings.json;type=application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory/settings" -o /tmp/compact-response.json
          jq -e '.success == true' /tmp/compact-response.json >/dev/null
          echo VOICE_SETTINGS_VALUES_PRESERVED=PASS
