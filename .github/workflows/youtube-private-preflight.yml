name: YouTube private preflight (no upload)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/781761447388/locations/global/workloadIdentityPools/github-actions/providers/zevanory-github
          service_account: zevanory-github-deployer@zevanory-gemini.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Fetch Gemini credential from Secret Manager (masked)
        shell: bash
        run: |
          set -euo pipefail
          key="$(gcloud secrets versions access latest --secret=ZEVANORY_GEMINI_API_KEY --project=zevanory-gemini)" || { echo "::error title=YOUTUBE_PREFLIGHT::gemini_secret_fetch_failed"; exit 1; }
          test -n "$key" || { echo "::error title=YOUTUBE_PREFLIGHT::gemini_secret_empty"; exit 1; }
          echo "::add-mask::$key"
          echo "GEMINI_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Validate identity, F1 gate, TTS and final MP4 without uploading
        run: node scripts/channels/youtube-preflight.mjs
