name: WhatsApp CPU and voice fidelity audit
run-name: cache-audit:${{ inputs.cycle || github.sha }}
on:
  workflow_dispatch:
    inputs:
      cycle: {description: One-time cycle identifier, required: false, type: string}
  pull_request:
    branches: [gh-pages]
    paths: ['worker/voice-operational-audit.mjs', 'scripts/whatsapp_cache_audit.mjs', 'scripts/voice_audit_quality.mjs', 'scripts/whatsapp_operational_audit_test.mjs', '.github/workflows/whatsapp-operational-audit.yml']
  workflow_run:
    workflows: ['ZEVANORY central production deploy']
    types: [completed]
    branches: [gh-pages]
permissions:
  contents: read
concurrency:
  group: whatsapp-operational-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/whatsapp_operational_audit_test.mjs
  audit:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_commit.message, '[cache-audit-cycle-20261005]'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPERATOR_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN || secrets.OPERATOR_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read cached catalog audio, Whisper round trip and Worker CPU below 50 ms
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=CACHE_AUDIT_STEP::Command failed at line $LINENO (exit $?)"' ERR
          mkdir -p /tmp/voice-audit
          npm install --prefix /tmp/audit-tools --no-save wrangler@4.143.0 >/dev/null 2>&1
          timeout 600s /tmp/audit-tools/node_modules/.bin/wrangler tail zevanory --format json > /tmp/audit-tail.json 2>/tmp/voice-audit/tail.err &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          sleep 8
          node scripts/whatsapp_cache_audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-cache-operational-audit
          path: /tmp/voice-audit/
          retention-days: 14
