name: ZEVANORY official brand gate
on:
  pull_request:
    paths:
      - 'assets/brand/**'
      - 'sales-public/brand/export/**'
      - 'worker/brand-kit.mjs'
      - 'worker/brand-profiles.mjs'
      - 'worker/brand-email.mjs'
      - 'tests/brand-email.test.mjs'
      - 'worker/lead-magnet.mjs'
      - 'worker/post-sale.mjs'
      - 'worker/sales-control.mjs'
      - 'worker/acquisition-engine.mjs'
      - 'tests/brand-profiles.test.mjs'
      - 'worker/brand-approved.mjs'
      - 'worker/multichannel-autonomy.mjs'
      - 'worker/activity-ledger.mjs'
      - 'tests/multichannel-autonomy.test.mjs'
      - 'tests/brand-kit.test.mjs'
      - 'scripts/build-brand-assets.py'
      - 'scripts/deploy/copy-brand-export.py'
      - 'scripts/deploy/verify-brand-assets-live.py'
      - '.github/workflows/brand-kit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brand:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: '22'
      - name: Install pinned renderer
        run: python3 -m pip install --user --disable-pip-version-check 'CairoSVG==2.8.2' 'Pillow==12.3.0'
      - name: Render from approved official logo only
        run: python3 scripts/build-brand-assets.py
      - name: Verify exact static assets in canonical Worker package
        run: python3 scripts/deploy/copy-brand-export.py
      - name: Brand source and negative image-gate tests
        run: node --test tests/brand-kit.test.mjs tests/multichannel-autonomy.test.mjs tests/brand-profiles.test.mjs tests/brand-email.test.mjs tests/acquisition-engine.test.mjs
      - name: Verify generated exports are committed exactly
        run: |
          set -euo pipefail
          git diff --exit-code -- worker/brand-approved.mjs assets/brand/export/ sales-public/brand/export/
          test "$(find assets/brand/export -maxdepth 1 -name '*.png' | wc -l)" -eq 13
      - name: Build and test GENERATED canonical sales sitemap
        run: python3 -m unittest discover -s tests -p 'test_sales_sitemap_generated.py' -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zevanory-official-brand-kit
          path: assets/brand/export/
          retention-days: 7
