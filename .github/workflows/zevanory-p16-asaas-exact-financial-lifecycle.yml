name: zevanory-p16-asaas-exact-financial-lifecycle

on:
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/zevanory-p16-asaas-exact-financial-lifecycle.yml"
  pull_request:
    branches: [gh-pages]
    paths:
      - ".github/workflows/zevanory-p16-asaas-exact-financial-lifecycle.yml"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed ZEVANORY SHA
        required: false
        default: c3845cf898acf60e84a06e51cf08db7cfd09bbe3
        type: string

permissions:
  contents: read

concurrency:
  group: zevanory-p16-asaas-exact
  cancel-in-progress: false

jobs:
  financial-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha || 'c3845cf898acf60e84a06e51cf08db7cfd09bbe3' }}
      ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY || secrets.ASAAS_SANDBOX_API_KEY }}
      ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
      ASAAS_WEBHOOK_EMAIL: ${{ secrets.ASAAS_WEBHOOK_EMAIL }}
      OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
      CERTIFICATION_E2E_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN }}
    steps:
      - name: Checkout exact immutable release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Validate fail-closed sandbox preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${#EXPECTED_SHA}" -eq 40
          for k in ASAAS_API_KEY ASAAS_WEBHOOK_TOKEN OPERATOR_TOKEN CERTIFICATION_E2E_TOKEN; do
            test -n "${!k:-}" || { echo "MISSING_REQUIRED_SECRET=$k"; exit 2; }
          done
          test "${#ASAAS_WEBHOOK_TOKEN}" -ge 32
          curl -fsS https://zevanory.api.br/api/release -o /tmp/release.json
          python3 - <<'PY'
          import json,os
          d=json.load(open("/tmp/release.json"))
          assert d.get("deployment",{}).get("commit_sha","").lower()==os.environ["EXPECTED_SHA"].lower(),d
          assert d.get("sales_mode")=="globally-blocked",d
          assert d.get("checkout_mode")=="enabled",d
          assert d.get("financial_mode")=="enabled",d
          print("RUNTIME_SHA_MATCH=PASS")
          print("SALE_GLOBALLY_ENABLED=false")
          PY
          echo "FINANCIAL_SECRET_READINESS=PASS"

      - name: Recover cancelled sandbox refund only when provider truth is still RECEIVED
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse
          base="https://api-sandbox.asaas.com/v3"
          key=os.environ["ASAAS_API_KEY"]
          prefix="ZEVANORY:EXP-0001:"
          def req(path,method="GET",body=None,ok=(200,201)):
            data=None if body is None else json.dumps(body).encode()
            r=urllib.request.Request(base+path,method=method,data=data,headers={"access_token":key,"accept":"application/json","content-type":"application/json","User-Agent":"ZEVANORY-P16-Recovery/1.0"})
            try:
              with urllib.request.urlopen(r,timeout=30) as x:
                raw=x.read().decode("utf-8","replace"); obj=json.loads(raw) if raw else {}
                assert x.status in ok,(path,x.status,obj)
                return x.status,obj
            except urllib.error.HTTPError as e:
              raw=e.read().decode("utf-8","replace")
              try: obj=json.loads(raw) if raw else {}
              except Exception: obj={"raw":raw[:1000]}
              if e.code in ok: return e.code,obj
              raise AssertionError((path,e.code,obj))
          _,p=req("/payments?limit=100&offset=0")
          candidates=[]
          for row in p.get("data",[]):
            ext=str(row.get("externalReference","") or "")
            pid=str(row.get("id","") or "")
            if not ext.startswith(prefix) or not pid.startswith("pay_"): continue
            try:
              _,rr=req("/payments/"+urllib.parse.quote(pid)+"/refunds")
              refunds=rr.get("data",[]) if isinstance(rr,dict) else []
              if not refunds: continue
              _,ps=req("/payments/"+urllib.parse.quote(pid)+"/status")
              candidates.append((str(row.get("dateCreated","") or ""),pid,str(ps.get("status","")).upper(),refunds))
            except Exception:
              continue
          if not candidates:
            print("REFUND_RECOVERY=NO_EXISTING_REFUND")
            raise SystemExit(0)
          candidates.sort(reverse=True)
          _,pid,status,refunds=candidates[0]
          states=[str(x.get("status","")).upper() for x in refunds]
          if status=="REFUNDED" and "DONE" in states:
            print("REFUND_RECOVERY=ALREADY_DONE")
            raise SystemExit(0)
          assert status=="RECEIVED",(status,states)
          assert "DONE" not in states,(status,states)
          assert states and all(x in ("CANCELLED","FAILED","DENIED") for x in states),(status,states)
          code,obj=req("/payments/"+urllib.parse.quote(pid)+"/refund","POST",{"description":"ZEVANORY exact-release sandbox refund recovery"},ok=(200,201))
          print("REFUND_RECOVERY_REISSUED=PASS")
          print("REFUND_RECOVERY_HTTP="+str(code))
          print("REFUND_RECOVERY_PROVIDER_STATE_BEFORE="+status)
          PY

      - name: Run real Asaas sandbox lifecycle
        run: python3 scripts/financial_e2e_closure.py

      - name: Verify terminal exact-release evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re
          p=json.load(open("evidence/financial-e2e-current.json",encoding="utf-8"))
          sha=os.environ["EXPECTED_SHA"].lower()
          assert re.fullmatch(r"[0-9a-f]{40}",sha)
          assert set(p["sha"].values())=={sha},p["sha"]
          assert p["provider"]=="asaas"
          assert p["provider_environment"]=="sandbox"
          assert p["sales_mode"]=="globally-blocked"
          assert p["checks"]["FINANCIAL_E2E"]=="GREEN"
          assert all(v in ("PASS","GREEN") for v in p["checks"].values()),p["checks"]
          assert p["final_order_status"]=="refunded"
          assert p["final_fulfillment_status"]=="canceled"
          assert p["payment_confirmation_count"]==1
          assert p["invariants"]["global_sales_remained_fail_closed"] is True
          assert p["invariants"]["exactly_once_payment_effect"] is True
          assert p["invariants"]["no_entitlement_after_full_refund"] is True
          assert p["invariants"]["provider_final_status"]=="REFUNDED"
          print("CHECKOUT=PASS")
          print("PAYMENT=PASS")
          print("WEBHOOK=PASS")
          print("PERSISTENCE_RECONCILIATION=PASS")
          print("ENTITLEMENT=PASS")
          print("REFUND=PASS")
          print("FINAL_FINANCIAL_E2E=GREEN")
          print("P16_LIFECYCLE=PROVED")
          print("FALSE_GREEN=0")
          PY

      - name: Upload exact-release P16 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zevanory-p16-financial-c3845cf898ac
          path: evidence/financial-e2e-current.json
          if-no-files-found: error
          retention-days: 90
