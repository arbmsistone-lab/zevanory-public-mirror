name: ZEVANORY first order watch

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  pull_request:
    branches: [gh-pages]
    paths:
      - ".github/workflows/zevanory-first-order-watch.yml"
      - "scripts/zevanory_first_order_watch.py"
      - "tests/test_zevanory_first_order_watch.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: zevanory-owner-sales-switch
  cancel-in-progress: false

jobs:
  contract:
    name: First order watch contract (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify workflow YAML and no-network tests
        run: |
          python3 -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
          python3 -m py_compile scripts/zevanory_first_order_watch.py
          python3 -m unittest discover -s tests -p 'test_zevanory_first_order_watch.py' -v
          node --test tests/first-order-watch-audit.test.mjs

  first-order-watch:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    name: Signed read-only audit; close only on proven delivery breach
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/gh-pages'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ZEVANORY_OPERATOR_TOKEN: ${{ secrets.ZEVANORY_OPERATOR_TOKEN || secrets.CERTIFICATION_E2E_TOKEN }}  # R9: nome novo; queda para o antigo só na transição
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      OWNER_ALERT_EMAIL: ${{ secrets.OWNER_ALERT_EMAIL }}
      RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Hourly watch (GET and read-only SQL; emergency close if proven breach)
        run: |
          set -euo pipefail
          python3 scripts/zevanory_first_order_watch.py
