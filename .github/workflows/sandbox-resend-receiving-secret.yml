name: Sandbox receiving key to worker (manual, approved)
# Grava RESEND_RECEIVING_KEY no KV privado do Worker SOMENTE se a chave provar que lê um e-mail recebido
# CONHECIDO da conta que recebe zevanory.api.br (GET /emails/receiving/{reference_email_id} == 200 e `to` com
# @zevanory.api.br), além da pré-condição de lista (GET /emails/receiving?limit=1 == 200). Sem referência,
# referência expirada/de outra conta (404) ou domínio diferente => NAO_COMPROVADO, sai != 0 e o KV fica intacto.
# Lógica e testes: scripts/ops/resend_receiving_key_certify.py, tests/test_resend_receiving_key_certify.py.
on:
  workflow_dispatch:
    inputs:
      reference_email_id:
        description: "ID de um e-mail RECEBIDO em suporte@zevanory.api.br (painel Resend > Emails > Receiving > ID)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sandbox-resend-receiving-secret
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/gh-pages' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: sandbox-financial-approved
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Certify receiving key, then store in private KV only
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
          RESEND_RECEIVING_KEY: ${{ secrets.RESEND_RECEIVING_KEY }}
          REFERENCE_EMAIL_ID: ${{ inputs.reference_email_id }}
        run: |
          set -euo pipefail
          python3 -I scripts/ops/resend_receiving_key_certify.py
