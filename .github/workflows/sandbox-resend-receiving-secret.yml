name: Sandbox receiving key to worker (manual, approved)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandbox-resend-receiving-secret
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/gh-pages' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: sandbox-financial-approved
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      RESEND_RECEIVING_KEY: ${{ secrets.RESEND_RECEIVING_KEY }}
    steps:
      - name: Store receiving key in private KV only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RESEND_RECEIVING_KEY"
          code="$(curl -sS -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer $RESEND_RECEIVING_KEY" 'https://api.resend.com/emails/receiving?limit=1')"
          echo "RESEND_RECEIVING_API_STATUS=$code"
          test "$code" = "200"
          umask 077; f="$(mktemp)"; printf '%s' "$RESEND_RECEIVING_KEY" > "$f"
          npx --yes wrangler@4.143.0 kv key put "sandbox-config:resend-receiving-key" --namespace-id 728a45738e4047f29bcb89934fd533c1 --path "$f" --remote
          rm -f "$f"
          echo "WORKER_KV_RESEND_RECEIVING_KEY=SET"
