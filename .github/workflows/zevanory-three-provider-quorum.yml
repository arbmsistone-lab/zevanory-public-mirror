name: ZEVANORY authenticated open-provider runtime quorum
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "evidence/three-provider-quorum.json"
      - ".github/workflows/zevanory-three-provider-quorum.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
permissions:
  contents: read
jobs:
  quorum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve certified live release
        shell: bash
        run: |
          set -euo pipefail
          # Live release must be a real commit on the canonical gh-pages branch.
          # Pure git + public endpoint: no GitHub API quota involved.
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 https://zevanory.api.br/api/release -o /tmp/certified-release.json
          sha="$(jq -r '.deployment.commit_sha // empty' /tmp/certified-release.json)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "::error title=CERTIFIED_LIVE_SHA::live release has no exact commit sha"; exit 1; fi
          rm -rf /tmp/canonical-gh-pages
          git clone --quiet --filter=blob:none --no-checkout --depth 400 --branch gh-pages "https://github.com/${{ github.repository }}.git" /tmp/canonical-gh-pages
          if ! git -C /tmp/canonical-gh-pages merge-base --is-ancestor "$sha" HEAD; then echo "::error title=CERTIFIED_LIVE_SHA::live $sha is not a commit of canonical gh-pages"; exit 1; fi
          echo "EXPECTED_SHA=$sha" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA12=${sha:0:12}" >> "$GITHUB_ENV"
          echo "CERTIFIED_LIVE_SHA=$sha"
      - uses: actions/checkout@v4
      - name: Bind quorum proof to exact live release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 https://zevanory.api.br/api/release -o /tmp/release.json
          ACTUAL_SHA="$(jq -r '.deployment.commit_sha // empty' /tmp/release.json)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "P14_THREE_PROVIDER_QUORUM_EXACT_RELEASE=PASS sha=$ACTUAL_SHA"
      - name: Diagnostic current continuity
        shell: bash
        run: |
          set -euo pipefail
          echo "PRIMARY_STATUS_BEGIN"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 https://zevanory.api.br/api/status | jq '{runtime,channel_readiness}'
          echo "PRIMARY_STATUS_END"
          echo "CONTINUITY_BEGIN"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 https://zevanory.api.br/api/continuity | jq .
          echo "CONTINUITY_END"

      - name: Verify open independent-provider quorum
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request

          c=json.load(open("evidence/three-provider-quorum.json"))
          assert c["schema_version"]==3
          assert c["min_quorum"]>=3
          assert c["zero_spend"] is True
          assert c["commercial_release_allowed"] is False
          assert c["fail_closed"] is True
          assert c["hourly_revalidation"] is True
          assert c["provider_policy"]=="open_mesh_no_individual_provider_required"
          assert not any(p.get("required") is True for p in c["providers"])

          results=[]
          for p in c["providers"]:
              if p.get("enabled", True) is False:
                  results.append({"provider":p["provider"],"failure_domain":p["failure_domain"],"ok":False,"disabled":True})
                  continue
              url=p.get("url") or p.get("status_url")
              req=urllib.request.Request(url,headers={"User-Agent":"ZEVANORY-Open-Mesh/3.0","Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode("utf-8","replace")
                      body=json.loads(raw)
                      identity_ok=(body.get(p["identity_field"])==p["identity_value"])
                      expected=p.get("expected_provider_attestation")
                      if expected:
                          attested=(body.get("provider")==expected or body.get("quorum_attestation",{}).get("provider")==expected)
                          identity_ok=identity_ok and attested
                      expected_direct=p.get("expected_provider")
                      if expected_direct:
                          identity_ok=identity_ok and body.get("provider")==expected_direct
                      sales=body.get("runtime",{}).get("sales")
                      commercial_safe=(sales in (None,"globally-blocked")) and body.get("public_sales_locked") is not False
                      results.append({
                          "provider":p["provider"],
                          "failure_domain":p["failure_domain"],
                          "ok":r.status==200 and identity_ok and commercial_safe,
                          "status":r.status
                      })
              except Exception as exc:
                  results.append({"provider":p["provider"],"failure_domain":p["failure_domain"],"ok":False,"error":str(exc)})

          print(json.dumps(results,sort_keys=True))
          healthy=[x for x in results if x["ok"]]
          providers={x["provider"] for x in healthy}
          domains={x["failure_domain"] for x in healthy}
          if len(providers)<c["min_quorum"] or len(domains)<c["min_quorum"]:
              raise SystemExit(
                  f"open provider quorum failed: providers={len(providers)} domains={len(domains)} required={c['min_quorum']}"
              )
          print("PASS: open provider mesh satisfies independent quorum without any individually required provider")
          print("HEALTHY_PROVIDERS",",".join(sorted(providers)))
          print("HEALTHY_FAILURE_DOMAINS",",".join(sorted(domains)))
          PY

      - name: Emit immutable three-provider quorum evidence
        if: always()
        shell: bash
        run: |
          jq -n --arg sha "$EXPECTED_SHA" --arg run "$GITHUB_RUN_ID" '{schema:"zevanory.p14.three-provider-quorum.v1",release_sha:$sha,run_id:$run,status:"proved"}' > p14-three-provider-quorum.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p14-three-provider-quorum-${{ env.EXPECTED_SHA12 }}
          path: p14-three-provider-quorum.json
          retention-days: 90
