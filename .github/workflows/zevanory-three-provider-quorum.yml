name: ZEVANORY three-provider runtime quorum
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "evidence/three-provider-quorum.json"
      - ".github/workflows/zevanory-three-provider-quorum.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quorum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify three independent providers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request

          c=json.load(open("evidence/three-provider-quorum.json"))
          assert c["min_quorum"]==3
          assert c["zero_spend"] is True
          assert c["commercial_release_allowed"] is False
          assert c["fail_closed"] is True

          results=[]
          for p in c["providers"]:
              url=p.get("url") or p.get("status_url")
              req=urllib.request.Request(url,headers={"User-Agent":"ZEVANORY-3P-Quorum/1.0","Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read().decode("utf-8","replace")
                      body=json.loads(raw)
                      ok=(r.status==200 and body.get("project")=="ZEVANORY")
                      sales=body.get("runtime",{}).get("sales")
                      if sales is not None:
                          ok=ok and sales=="globally-blocked"
                      results.append({"provider":p["provider"],"ok":ok,"status":r.status})
              except Exception as exc:
                  results.append({"provider":p["provider"],"ok":False,"error":str(exc)})

          print(json.dumps(results,sort_keys=True))
          healthy=[x for x in results if x["ok"]]
          if len(healthy)<c["min_quorum"]:
              raise SystemExit(f"provider quorum failed: {len(healthy)}/{c['min_quorum']}")
          if len({x["provider"] for x in healthy})<3:
              raise SystemExit("providers are not independent")
          print("PASS: three independent runtime providers are healthy and commercial release remains fail-closed")
          PY
