name: ZEVANORY production Worker test-secret readback (names only)

# F2 item 9 (roteiro 3.1 seção 7): readback operacional, SOMENTE LEITURA, dos NOMES de segredos e bindings do Worker
# de produção `zevanory`. FALHA se algum nome contém _TEST_ ou CERTIFICATION, exceto os 5 nomes CERTIFICATION* que o
# código/contrato de produção ainda lê (ops/r9-debt.json; relatados como
# aviso). strict_certification=true reprova também esses 5 E reprova enquanto ops/r9-debt.json tiver item pendente
# (inclui o Stripe), que é a condição de fechamento do item 9.
# Nunca imprime valores: `wrangler secret list` só devolve [{name,type}] e o script imprime só nomes/tipos.
# Manual (workflow_dispatch), Environment producao-critica (revisor obrigatório); nenhuma escrita.
# Pré-inventário da remoção (Sol 187 C1 + Sol 189 A2): imprime TODO (nome, tipo, origem), a versão efetiva
# (deployments + versions da Cloudflare, só GET), o commit publicado (GET público /api/release), os conjuntos
# DELETE/KEEP planejados, o documento canônico zev-inventory/v1 e o INVENTORY_DIGEST que o proprietário passa à
# remoção (expected_inventory_digest) depois da revisão do auditor.
# Evidência (run 40142599036 falhou sem nenhuma linha de log): cada coleta que falha emite
# ::error title=WORKER_STATE::<etapa> failed (http=...) com o diagnóstico só leitura de scripts/ci/production-worker-state.sh.
# O histórico de versões/deployments (premissas do Sol sobre `secret delete`) é coletado e sanitizado (sem valores) e,
# junto com a saída completa do readback e do diagnóstico, sobe como artefato (7 dias), legível pela API REST de
# artefatos. Arquivos crus da Cloudflare (que contêm textos de var) nunca entram no artefato (allowlist de 4 arquivos).
# D0 (INVENTORY_DIGEST) e V0 (EFFECTIVE_VERSION_ID) só são emitidos com todas as fontes completas (Sol 221); faltando
# qualquer uma, o readback imprime NOT_EMITTED e falha. A autorização de um run anterior não vale para esta versão do
# workflow: ela exige auditoria própria e nova autorização do proprietário antes de rodar. Antes da remoção este readback FALHA por desenho
# (os 2 segredos de teste estão presentes); o inventário e o digest saem no log e no resumo do mesmo jeito.
on:
  workflow_dispatch:
    inputs:
      strict_certification:
        description: "Também reprovar os 5 nomes CERTIFICATION* de dívida conhecida (alvo final do item 9)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-test-secret-readback
  cancel-in-progress: false

jobs:
  readback:
    environment: producao-critica  # lê nomes do Worker de produção; revisor obrigatório
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TOKEN_SOURCE: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN != '' && 'CLOUDFLARE_PUBLIC_OWNER_API_TOKEN' || (secrets.CLOUDFLARE_API_TOKEN != '' && 'CLOUDFLARE_API_TOKEN' || 'nenhum') }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      STRICT_CERTIFICATION: ${{ inputs.strict_certification }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read the full inventory of zevanory (read-only), print version, commit, plan and digest; fail on test/certification names
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zevanory-state"; ev="$RUNNER_TEMP/zevanory-evidence"
          mkdir -p "$ev"
          trap 'rm -rf "$d"' EXIT
          source scripts/ci/production-worker-state.sh
          rc=0
          zev_fetch_state "$d" > "$ev/collect.txt" 2>&1 || rc=$?
          cat "$ev/collect.txt"
          if [ "$rc" != 0 ]; then echo "::error title=WORKER_STATE::coleta falhou (código $rc); diagnóstico acima e no artefato"; exit 1; fi
          strict=""; if [ "$STRICT_CERTIFICATION" = "true" ]; then strict="--strict"; fi
          node scripts/ci/production-secret-names.mjs readback --secrets "$d/secrets.json" --settings "$d/settings.json" \
            --deployments "$d/deployments.json" --version-detail "$d/version.json" --release "$d/release.json" $strict > "$ev/readback.txt" || rc=$?
          cat "$ev/readback.txt"
          grep -E '^(SECTION_D0|SECTION_PRIVATE|PRODUCTION_TEST_SECRET_READBACK|INVENTORY_DIGEST|INVENTORY_SCHEMA|EFFECTIVE_VERSION_ID|DEPLOYED_COMMIT_SHA|PLANNED_DELETE|PLANNED_KEEP)' "$ev/readback.txt" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"
      - name: Version and deployment history (read-only, sanitized) for the secret-delete premises
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/zevanory-history-raw"; ev="$RUNNER_TEMP/zevanory-evidence"
          mkdir -p "$ev"
          trap 'rm -rf "$d"' EXIT
          source scripts/ci/production-worker-state.sh
          rc=0
          zev_fetch_history "$d" "$ev/version-history.json" 50 > "$ev/history.txt" 2>&1 || rc=$?
          cat "$ev/history.txt"
          grep -E '^(VERSION_HISTORY|VERSION_TRIGGERS|SOL_PREMISE)' "$ev/history.txt" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"
      - name: Upload readback evidence (names, codes and sanitized history only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zevanory-readback-evidence-${{ github.run_id }}
          # Allowlist explícita (Sol 221): só saídas filtradas; nunca settings/versions crus.
          path: |
            ${{ runner.temp }}/zevanory-evidence/collect.txt
            ${{ runner.temp }}/zevanory-evidence/readback.txt
            ${{ runner.temp }}/zevanory-evidence/history.txt
            ${{ runner.temp }}/zevanory-evidence/version-history.json
          retention-days: 7
          if-no-files-found: warn
