name: support-email-forward-contract

# suporte@/contato@ (Resend inbound -> encaminhamento ao dono): contrato offline com Resend e PostgreSQL falsos,
# contagem exata e mutantes impressos no log. Só pull_request: nunca dispara no merge, nunca usa segredo, sem rede
# além do checkout.
on:
  pull_request:
    paths:
      - ".github/workflows/support-email-forward-contract.yml"
      - "worker/support-email-forward.mjs"
      - "worker/cloudflare-worker.compat.mjs"
      - "worker/sandbox-proof-v2.mjs"
      - "worker/politica-unica.mjs"
      - "data/politica-unica.json"
      - "tests/support-email-forward.test.mjs"
      - "tests/helpers/text.mjs"
      - "scripts/ci/mutants_support_email.py"
      - "scripts/ci/mutant_classifier.py"
      - "scripts/ci/mutants_support_email_allow.json"
      - "scripts/ci/mutants_support_email_pg_allow.json"
      - "docs/evidence/support-email-mutant-causality.md"
      - "tests/integration/support-outbox-postgres.test.mjs"
      - "tests/test_mutants_support_email_classifier.py"
      - "docs/ops/EMAIL_SUPORTE.md"
      - "scripts/deploy/prepare-central-candidate.py"
      - "tests/support-drain-scheduled.test.mjs"
      - "tests/helpers/support-drain-scheduled-probe.mjs"
      - "tests/t4_sim/**"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Contrato suporte@ (offline, contagem exata)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/support-email-forward.test.mjs | tee /tmp/support.txt
          grep -qx "# tests 37" /tmp/support.txt || { echo "::error::contagem de testes diferente de 37"; exit 1; }
          grep -qx "# fail 0" /tmp/support.txt || { echo "::error::falha na suíte"; exit 1; }
      - name: Entrada scheduled real despacha o dreno (contagem exata)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/support-drain-scheduled.test.mjs | tee /tmp/sched.txt
          grep -qx "# tests 2" /tmp/sched.txt && grep -qx "# pass 2" /tmp/sched.txt && grep -qx "# skipped 0" /tmp/sched.txt
      - name: Contraprovas do runner sobre o classificador compartilhado (contagem exata)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_mutants_support_email_classifier -v < /dev/null 2>&1 | tee /tmp/meta.txt
          grep -qE "^Ran 13 tests in " /tmp/meta.txt && grep -qx "OK" /tmp/meta.txt || { echo "::error::meta-testes do classificador"; exit 1; }
      - name: Mutantes (todos precisam morrer)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 scripts/ci/mutants_support_email.py < /dev/null | tee /tmp/mut.txt
          echo "::notice title=SUPPORT_EMAIL_MUTANTS::$(grep -E '^MUTANTS ' /tmp/mut.txt)"
          grep -qx "MUTANTS suite=unit total=104 killed=104 survived=0 inconclusive=0" /tmp/mut.txt || { echo "::error::mutante sobreviveu ou contagem mudou"; exit 1; }
