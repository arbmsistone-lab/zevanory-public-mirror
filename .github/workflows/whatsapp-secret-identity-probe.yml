name: ZEVANORY WhatsApp secret identity probe

on:
  push:
    branches:
      - probe/whatsapp-secret-identity-20260923
    paths:
      - '.github/workflows/whatsapp-secret-identity-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WA_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WA_PHONE: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      META_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
    steps:
      - name: Presence only
        shell: bash
        run: |
          set -euo pipefail
          present(){ if [ -n "$2" ]; then echo "$1=PRESENT"; else echo "$1=ABSENT"; fi; }
          present WHATSAPP_ACCESS_TOKEN "${WA_TOKEN:-}"
          present WHATSAPP_PHONE_NUMBER_ID "${WA_PHONE:-}"
          present META_ACCESS_TOKEN "${META_TOKEN:-}"
          present META_APP_SECRET "${META_APP_SECRET:-}"

      - name: Verify WhatsApp secret identity without exposing credentials
        if: ${{ env.WA_TOKEN != '' && env.WA_PHONE != '' }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://graph.facebook.com/v26.0/$WA_PHONE?fields=id,display_phone_number,verified_name,name_status,new_name_status,quality_rating,code_verification_status"
          code=$(curl -sS -o /tmp/phone.json -w '%{http_code}' -H "Authorization: Bearer $WA_TOKEN" "$url")
          echo "GRAPH_HTTP=$code"
          python3 - <<'PY'
          import json, re, os
          d=json.load(open('/tmp/phone.json'))
          if 'error' in d:
              e=d['error']
              print('GRAPH_ERROR_CODE='+str(e.get('code','')))
              print('GRAPH_ERROR_SUBCODE='+str(e.get('error_subcode','')))
              print('GRAPH_ERROR_TYPE='+str(e.get('type',''))[:80])
              raise SystemExit(2)
          digits=lambda v: re.sub(r'\D','',str(v or ''))
          target='5588992545413'
          actual=digits(d.get('display_phone_number'))
          print('OFFICIAL_NUMBER_MATCH='+('PASS' if actual==target else 'FAIL'))
          print('VERIFIED_NAME_MATCH='+('PASS' if str(d.get('verified_name','')).strip().upper()=='ZEVANORY' else 'FAIL'))
          print('NAME_STATUS='+str(d.get('name_status','')))
          print('QUALITY_RATING='+str(d.get('quality_rating','')))
          print('CODE_VERIFICATION_STATUS='+str(d.get('code_verification_status','')))
          print('PHONE_NUMBER_ID_MATCHES_SECRET='+('PASS' if str(d.get('id',''))==os.environ.get('WA_PHONE','') else 'FAIL'))
          raise SystemExit(0 if actual==target else 3)
          PY
