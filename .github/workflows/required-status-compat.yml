name: required-status-compat

on:
  pull_request:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-status:
    name: product-pages / static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile product audits
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/premerge_product_audit.py
          python3 -m py_compile scripts/zevanory_10p_excellence_gate.py
          python3 -m py_compile scripts/zevanory_crown_gate.py
          python3 -m py_compile scripts/test_crown_negative.py
      - name: Run product fail-closed gates
        run: |
          set -euo pipefail
          python3 scripts/premerge_product_audit.py
          python3 scripts/zevanory_10p_excellence_gate.py
          python3 scripts/test_crown_negative.py
          python3 scripts/zevanory_crown_gate.py
      - name: Setup Node for LIA manifest gate (AVAL 099)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check LIA manifest in sync (worker/fase-a-lia.generated.mjs = docs/lgpd/LIA-fase-a.md) + negative self-test
        run: |
          set -euo pipefail
          node scripts/fase_a/lia_manifest.mjs --check
          node scripts/fase_a/lia_manifest.mjs --self-test

  zees-status:
    name: zees16-evidence / fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate ZEES-16 evidence registry
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/zees16_evidence_gate.py
          python3 scripts/zees16_evidence_gate.py
