name: Required status compatibility bridge
on:
  pull_request:
    branches: [gh-pages]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify candidate syntax and commercial fail-closed invariants
        run: |
          set -euo pipefail
          node --check worker/cloudflare-worker.compat.mjs
          node --check worker/zevanory-control-core.mjs
          python3 scripts/premerge_product_audit.py
          grep -q 'SALE_GLOBALLY_ENABLED.*false' .github/workflows/central-production-deploy.yml
          grep -q 'PRE_SALE_GATES_APPROVED.*false' .github/workflows/central-production-deploy.yml
          grep -q 'WHATSAPP_SALES_ENABLED.*false' .github/workflows/central-production-deploy.yml
          echo "REQUIRED_BUILD_COMPAT=PASS"

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prove deployability without mutating production
        run: |
          set -euo pipefail
          node --check worker/cloudflare-worker.compat.mjs
          node --check worker/zevanory-control-core.mjs
          curl -fsS https://zevanory.api.br/api/health -o /tmp/health.json
          curl -fsS https://zevanory.api.br/api/status -o /tmp/status.json
          python3 - <<'PY'
import json
h=json.load(open('/tmp/health.json'))
s=json.load(open('/tmp/status.json'))
assert h.get('live') is True and h.get('ready') is True, h
assert s.get('runtime',{}).get('sales') == 'globally-blocked', s
assert s.get('runtime',{}).get('financial') == 'disabled', s
print('REQUIRED_DEPLOY_COMPAT=PASS_DRY_RUN_ONLY')
PY

  report-build-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, deploy]
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical safety contract
        run: |
          set -euo pipefail
          curl -fsS https://zevanory.api.br/api/control-plane -o /tmp/control.json
          curl -fsS https://edge.zevanory.api.br/api/status -o /tmp/edge.json
          python3 - <<'PY'
import json
c=json.load(open('/tmp/control.json'))
e=json.load(open('/tmp/edge.json'))
assert c.get('global_state') == 'operational_commercial_blocked', c
assert c.get('root_blocker') == 'global_sale_disabled', c
assert e.get('runtime',{}).get('sales') == 'globally-blocked', e
print('REQUIRED_REPORT_BUILD_STATUS_COMPAT=PASS')
PY
