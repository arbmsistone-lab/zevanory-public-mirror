name: Security headers candidate preview gate

on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "worker/cloudflare-worker.recovered.mjs"
      - ".github/workflows/security-headers-candidate-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "1b26415802588185a86c1d4d3ebf5bdb"
    steps:
      - uses: actions/checkout@v4
      - name: Verify candidate syntax and headers
        shell: bash
        run: |
          set -euo pipefail
          node --check "$GITHUB_WORKSPACE/worker/cloudflare-worker.recovered.mjs"
          rm -rf "$GITHUB_WORKSPACE/.preview-public"
          mkdir -p "$GITHUB_WORKSPACE/.preview-public"
          cp "$GITHUB_WORKSPACE/solucoes/index.html" "$GITHUB_WORKSPACE/.preview-public/solucoes.html"
          cat > "$GITHUB_WORKSPACE/wrangler.preview.tmp.toml" <<'EOF'
          name = "zevanory"
          main = "worker/cloudflare-worker.recovered.mjs"
          compatibility_date = "2026-09-19"
          account_id = "1b26415802588185a86c1d4d3ebf5bdb"
          [assets]
          directory = ".preview-public"
          binding = "ASSETS"
          run_worker_first = true
          [previews]
          [previews.vars]
          SALE_GLOBALLY_ENABLED = "false"
          PRE_SALE_GATES_APPROVED = "false"
          CHECKOUT_ENABLED = "true"
          FINANCIAL_EVENTS_ENABLED = "false"
          MERCADOPAGO_ENV = "sandbox"
          EOF
          cd "$GITHUB_WORKSPACE"
          npx --yes wrangler@4.143.0 preview --config "$GITHUB_WORKSPACE/wrangler.preview.tmp.toml" --name "security-pr-${{ github.event.pull_request.number || 'manual' }}" 2>&1 | tee /tmp/preview.log
          PREVIEW_URL="$(python3 - <<'PY'
          import re
          s=open('/tmp/preview.log',encoding='utf-8',errors='replace').read()
          u=re.findall(r'https://[^\s]+workers\.dev',s)
          if not u: raise SystemExit('preview_url_missing')
          print(u[-1].rstrip('/'))
          PY
          )"
          curl -fsS -D /tmp/h.txt -o /tmp/b.html "$PREVIEW_URL/solucoes"
          python3 - <<'PY'
          import re
          h=open('/tmp/h.txt',encoding='utf-8',errors='replace').read().lower()
          st=re.search(r'^strict-transport-security:\s*([^\r\n]+)',h,re.M); assert st,st
          ma=re.search(r'max-age=(\d+)',st.group(1)); assert ma and int(ma.group(1))>=31536000,st.group(1)
          assert 'includesubdomains' in st.group(1),st.group(1)
          cp=re.search(r'^content-security-policy:\s*([^\r\n]+)',h,re.M); assert cp,cp
          csp=cp.group(1)
          for token in ('script-src','frame-src','connect-src','sdk.mercadopago.com','api.mercadopago.com','www.mercadopago.com'):
              assert token in csp,(token,csp)
          assert re.search(r'^x-content-type-options:\s*nosniff\s*$',h,re.M),h
          print("SECURITY_HEADERS_CANDIDATE_PREVIEW=PASS")
          PY
