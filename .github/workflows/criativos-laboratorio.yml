name: Laboratório de Criativos (pesquisa + calibração real do avaliador, sem publicação)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"
permissions:
  contents: read
concurrency:
  group: criativos-laboratorio
  cancel-in-progress: false
jobs:
  laboratorio:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pesquisa os Shorts que mais performam (confirmados como Shorts) e calcula os fatos do padrão
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/criativos/rodar-pesquisa.mjs "$RUNNER_TEMP/laboratorio"
      - name: Ferramentas de medição (OCR por, numpy, Pillow)
        if: always()
        run: |
          sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-por fonts-inter
          python3 -m pip install --user numpy==2.2.6 Pillow==12.0.0
      - name: Calibra o avaliador com referência positiva e negativos (OCR real, oferta publicada, júri Gemini)
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/laboratorio/padrao-10.json"; [ -f "$P" ] || { echo "::warning title=CALIBRACAO::sem padrão pesquisado nesta execução; usa só a base fixa"; P=-; }
          node scripts/criativos/rodar-calibracao.mjs "$P" "$RUNNER_TEMP/laboratorio/calibracao"
      - name: Guarda padrão, evidências e avaliações (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criativos-laboratorio
          path: ${{ runner.temp }}/laboratorio/
          if-no-files-found: warn
          retention-days: 90
