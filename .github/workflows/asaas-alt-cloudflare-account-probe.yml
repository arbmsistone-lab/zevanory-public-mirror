name: Asaas alternate Cloudflare account probe

on:
  pull_request:
    paths:
      - ".github/workflows/asaas-alt-cloudflare-account-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Probe known Cloudflare accounts by metadata only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          for ACCOUNT in e3caca88f4343c3cdfcf66eebe6ac124 1b26415802588185a86c1d4d3ebf5bdb; do
            echo "ACCOUNT=$ACCOUNT"
            CODE="$(curl -sS -o /tmp/scripts.json -w '%{http_code}'               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts")"
            echo "SCRIPTS_HTTP=$CODE"
            if [ "$CODE" != "200" ]; then
              continue
            fi
            python3 - <<'PY'
import json
d=json.load(open('/tmp/scripts.json'))
r=d.get('result',[])
if isinstance(r,dict):
    r=r.get('items',[]) or r.get('scripts',[]) or []
names=[]
for x in r:
    if isinstance(x,dict):
        n=x.get('id') or x.get('name')
        if n: names.append(n)
    elif isinstance(x,str):
        names.append(x)
print('SCRIPTS='+','.join(sorted(names)[:100]))
PY
            for SCRIPT in zevanory zevanory-production; do
              CODE2="$(curl -sS -o /tmp/settings.json -w '%{http_code}'                 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"                 "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/$SCRIPT/settings")"
              echo "SCRIPT=$SCRIPT SETTINGS_HTTP=$CODE2"
              if [ "$CODE2" != "200" ]; then
                continue
              fi
              ACCOUNT="$ACCOUNT" SCRIPT="$SCRIPT" python3 - <<'PY'
import json,os
d=json.load(open('/tmp/settings.json'))
r=d.get('result',{})
bs=r.get('bindings',[]) if isinstance(r,dict) else []
hits=[]
for b in bs:
    if not isinstance(b,dict): continue
    n=str(b.get('name') or '')
    t=str(b.get('type') or '')
    if n.startswith('ASAAS_') or n in {'DATABASE_URL','OPERATOR_TOKEN','CERTIFICATION_PILOT_ENABLED','CERTIFICATION_PILOT_ENV'}:
        hits.append(f'{n}:{t}')
print('ACCOUNT_BINDINGS',os.environ['ACCOUNT'],os.environ['SCRIPT'],','.join(sorted(hits)))
PY
            done
          done
