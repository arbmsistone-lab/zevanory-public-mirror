name: ZEVANORY voice human certification reconciler

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Read live blinded human study on canonical production SHA
        id: study
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://zevanory.api.br/api/voice-study/status -o /tmp/voice-study.json
          curl -fsS https://zevanory.api.br/api/control-plane -o /tmp/control.json
          python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/voice-study.json'))
          c=json.load(open('/tmp/control.json'))
          release=str(c.get('release',{}).get('deployment',{}).get('commit_sha') or '')
          assert len(release)==40, release
          assert d.get('release_sha')==release,(d.get('release_sha'),release)
          assert d.get('blinded') is True
          assert d.get('provider_disclosed') is False
          assert d.get('real_tts_audio') is True
          assert d.get('pt_br') is True
          certified = d.get('certified') is True
          print('VOICE_STUDY_RELEASE_SHA='+release)
          print('VOICE_STUDY_UNIQUE_EVALUATORS='+str(d.get('unique_evaluators',0)))
          print('VOICE_STUDY_CLIPS_COVERED='+str(d.get('clips_covered',0)))
          print('VOICE_STUDY_NATURAL_ACCEPTANCE='+str(d.get('natural_acceptance_pct',0)))
          print('VOICE_STUDY_INTELLIGIBILITY='+str(d.get('intelligibility_pct',0)))
          print('VOICE_STUDY_MEAN_NATURALNESS_5='+str(d.get('mean_naturalness_5',0)))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('certified='+('true' if certified else 'false')+'\n')
          PY

      - name: Keep fail-closed while immutable thresholds are incomplete
        if: steps.study.outputs.certified != 'true'
        run: |
          echo "VOICE_NATURALITY_CERTIFIED=false"
          echo "No code, evidence file, policy, score or gate is mutated."

      - name: Prove certification thresholds without changing SHA
        if: steps.study.outputs.certified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/voice-study.json'))
          required={
            'clips>=20': d.get('clips',0) >= 20,
            'clips_covered>=20': d.get('clips_covered',0) >= 20,
            'unique_evaluators>=100': d.get('unique_evaluators',0) >= 100,
            'blind_ratings>=100': d.get('blind_ratings',0) >= 100,
            'blinded': d.get('blinded') is True and d.get('provider_disclosed') is False,
            'real_tts_audio': d.get('real_tts_audio') is True,
            'pt_br': d.get('pt_br') is True,
            'natural_acceptance>=99': float(d.get('natural_acceptance_pct',0)) >= 99.0,
            'intelligibility>=99': float(d.get('intelligibility_pct',0)) >= 99.0,
            'mean_naturalness>=4.8': float(d.get('mean_naturalness_5',0)) >= 4.8,
          }
          assert all(required.values()), required
          print('VOICE_PERCEPTUAL_BLINDING=PASS')
          print('VOICE_PERCEPTUAL_SAMPLE_COUNT='+str(d['unique_evaluators']))
          print('VOICE_PERCEPTUAL_SCORE='+str(d['natural_acceptance_pct']))
          print('VOICE_NATURALITY_CERTIFIED=true')
          print('CERTIFICATION_SHA='+str(d['release_sha']))
          PY
