name: zevanory-p12-continuous-slo
on:
  pull_request:
    branches: [gh-pages]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve certified live release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Certified live SHA = head of the latest successful central production deploy,
          # which only succeeds after proving that exact SHA is serving production.
          api="https://api.github.com/repos/${{ github.repository }}/actions/workflows/central-production-deploy.yml/runs?branch=gh-pages&status=success&per_page=1"
          code="$(curl -sS -o /tmp/certified-live.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api" || true)"
          sha="$(jq -r '.workflow_runs[0].head_sha // empty' /tmp/certified-live.json 2>/dev/null || true)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "::error title=CERTIFIED_LIVE_SHA::http=$code body=$(head -c 300 /tmp/certified-live.json 2>/dev/null | tr '\n' ' ')"; exit 1; fi
          echo "EXPECTED_SHA=$sha" >> "$GITHUB_ENV"
          echo "CERTIFIED_LIVE_SHA=$sha"
      - name: Bind audit to exact live release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 https://zevanory.api.br/api/release -o /tmp/release.json
          ACTUAL_SHA="$(jq -r '.deployment.commit_sha // empty' /tmp/release.json)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_RELEASE_BINDING=PASS sha=$ACTUAL_SHA"
      - name: Probe independent production endpoints
        env:
          URLS: "https://zevanory.api.br/solucoes https://edge.zevanory.api.br/solucoes https://zevanory.api.br/api/control-plane"
        run: |
          python3 - <<'PY'
          import os,json,time,urllib.request,datetime,hashlib
          rows=[]
          for url in os.environ["URLS"].split():
              t=time.monotonic()
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"ZEVANORY-SLO-Probe/1.0","Accept":"text/html,application/json"})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read(65536); code=r.status
                  ok=200 <= code < 400; err=""
              except Exception as e:
                  code=getattr(e,"code",0) or 0; body=b""; ok=False; err=type(e).__name__
              rows.append({"url":url,"ok":ok,"status":code,"latency_ms":round((time.monotonic()-t)*1000,1),"body_sha256":hashlib.sha256(body).hexdigest(),"error":err})
          doc={"schema":"zevanory.p12.slo.v1","observed_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"rows":rows,"all_ok":all(x["ok"] for x in rows)}
          open("p12-slo-observation.json","w").write(json.dumps(doc,sort_keys=True,indent=2))
          print(json.dumps(doc))
          if not doc["all_ok"]: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p12-slo-observation-37e695127af0
          path: p12-slo-observation.json
          retention-days: 90
