name: WhatsApp delivery recovery and real proofs (retired channel; static validation only)
on:
  pull_request:
    branches: [gh-pages]
    paths: ['worker/**', 'scripts/whatsapp*', '.github/workflows/whatsapp-delivery-recovery.yml']
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/central-production-deploy.yml', 'worker/whatsapp-onboarding.mjs', 'worker/whatsapp-inbound-safety.mjs', 'worker/cloudflare-worker.compat.mjs', 'worker/cloudflare-worker.recovered.mjs', 'worker/voice-provider-router.mjs', '.github/workflows/whatsapp-delivery-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whatsapp-delivery-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify webhook, stages and authenticated proof boundary
        run: |
          node scripts/voice_chunks_test.mjs
          node scripts/whatsapp_operational_audit_test.mjs
          node scripts/whatsapp_delivery_proof_test.mjs
          node scripts/whatsapp_audio_runtime_test.mjs
          node scripts/whatsapp_conversation_test.mjs
          python3 scripts/voice_support_gate.py
          node --check worker/cloudflare-worker.compat.mjs
          node --check worker/cloudflare-worker.recovered.mjs
          node --check worker/whatsapp-onboarding.mjs
          node --check worker/voice-provider-router.mjs
  # production-proof job DELETED (2026-10-23): it forged app-secret-signed inbound webhooks so the
  # live bot sent real WhatsApp messages; Meta permanently disabled WABA 4019600665012911 on 2026-10-10.
  # The forging endpoint is gone (410) and tests/whatsapp-retirement.test.mjs forbids any generator.
