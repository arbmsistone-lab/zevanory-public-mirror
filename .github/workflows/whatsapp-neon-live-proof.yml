name: WhatsApp Neon live proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-edge-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove deployed control worker and revoked-token gate
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -I https://controle.zevanory.api.br/ | sed 's/\r$//'
          code_body="$(curl -sS -o /tmp/body-token.json -w '%{http_code}' \
            -X POST https://controle.zevanory.api.br/api/admin/overview \
            -H 'content-type: application/json' \
            --data '{"sessionToken":"zpc1.x.y"}')"
          echo "BODY_TOKEN_HTTP=$code_body"
          jq -c . /tmp/body-token.json
          test "$code_body" = "401"
          jq -e '.error == "session_revoked_or_invalid"' /tmp/body-token.json >/dev/null

          code_header="$(curl -sS -o /tmp/header-token.json -w '%{http_code}' \
            -X POST https://controle.zevanory.api.br/api/admin/overview \
            -H 'content-type: application/json' \
            -H 'Authorization: Bearer zpc1.x.y' \
            --data '{}')"
          echo "BEARER_TOKEN_HTTP=$code_header"
          jq -c . /tmp/header-token.json
          test "$code_header" = "401"
          jq -e '.error == "session_revoked_or_invalid"' /tmp/header-token.json >/dev/null

          instant_code="$(curl -sS -o /tmp/instant-status.json -w '%{http_code}' \
            https://zevanory.api.br/api/support/instant-status)"
          echo "INSTANT_STATUS_HTTP=$instant_code"
          test "$instant_code" = "200"
          jq -e 'type == "object" and (.error | not)' /tmp/instant-status.json >/dev/null
          echo "INSTANT_STATUS_ERROR=none"

  whatsapp-neon-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
      CERTIFICATION_E2E_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN }}
    steps:
      - name: Print Worker-authoritative counts and newest timestamps only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CERTIFICATION_E2E_TOKEN:-}"
          refresh_code="$(curl -sS -o /tmp/whatsapp-ops-refresh.json -w '%{http_code}' \
            -X POST https://zevanory.api.br/api/internal/whatsapp/stats-refresh \
            -H "x-certification-e2e-token: $CERTIFICATION_E2E_TOKEN")"
          test "$refresh_code" = "200"
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE_ID/values/zpc-whatsapp-ops:v1:stats"
          code="$(curl -sS -o /tmp/whatsapp-ops-stats.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$endpoint")"
          test "$code" = "200"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('/tmp/whatsapp-ops-stats.json','utf8'));
          const expected=['whatsapp_stage_events','whatsapp_history','whatsapp_observations','whatsapp_evidence'];
          if(!raw?.generatedAt||!raw?.tables)throw new Error('whatsapp_ops_stats_unavailable');
          console.log(JSON.stringify({generatedAt:String(raw.generatedAt)}));
          for(const table of expected){
            const row=raw.tables[table];
            if(!row||!Number.isFinite(Number(row.count)))throw new Error('whatsapp_ops_stats_invalid:'+table);
            console.log(JSON.stringify({table,count:Number(row.count),max_updated_at:row.max_updated_at==null?null:String(row.max_updated_at)}));
          }
          NODE
