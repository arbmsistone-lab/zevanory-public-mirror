name: WhatsApp Neon live proof

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/whatsapp-neon-live-proof.yml"

permissions:
  contents: read

jobs:
  live-edge-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove deployed control worker and revoked-token gate
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -I https://controle.zevanory.api.br/ | sed 's/\r$//'
          code_body="$(curl -sS -o /tmp/body-token.json -w '%{http_code}' \
            -X POST https://controle.zevanory.api.br/api/admin/overview \
            -H 'content-type: application/json' \
            --data '{"sessionToken":"zpc1.x.y"}')"
          echo "BODY_TOKEN_HTTP=$code_body"
          jq -c . /tmp/body-token.json
          test "$code_body" = "401"
          jq -e '.error == "session_revoked_or_invalid"' /tmp/body-token.json >/dev/null

          code_header="$(curl -sS -o /tmp/header-token.json -w '%{http_code}' \
            -X POST https://controle.zevanory.api.br/api/admin/overview \
            -H 'content-type: application/json' \
            -H 'Authorization: Bearer zpc1.x.y' \
            --data '{}')"
          echo "BEARER_TOKEN_HTTP=$code_header"
          jq -c . /tmp/header-token.json
          test "$code_header" = "401"
          jq -e '.error == "session_revoked_or_invalid"' /tmp/header-token.json >/dev/null

          instant_code="$(curl -sS -o /tmp/instant-status.json -w '%{http_code}' \
            https://zevanory.api.br/api/support/instant-status)"
          echo "INSTANT_STATUS_HTTP=$instant_code"
          test "$instant_code" = "200"
          jq -e 'type == "object" and (.error | not)' /tmp/instant-status.json >/dev/null
          echo "INSTANT_STATUS_ERROR=none"

  whatsapp-neon-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGCONNECT_TIMEOUT: "10"
    steps:
      - name: Print counts and newest timestamps only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -At -F '|' <<'SQL'
          SELECT 'whatsapp_stage_events', count(*), coalesce(max(updated_at)::text, 'null') FROM whatsapp_stage_events
          UNION ALL
          SELECT 'whatsapp_history', count(*), coalesce(max(updated_at)::text, 'null') FROM whatsapp_history
          UNION ALL
          SELECT 'whatsapp_observations', count(*), coalesce(max(updated_at)::text, 'null') FROM whatsapp_observations
          UNION ALL
          SELECT 'whatsapp_evidence', count(*), coalesce(max(updated_at)::text, 'null') FROM whatsapp_evidence
          ORDER BY 1;
          SQL
