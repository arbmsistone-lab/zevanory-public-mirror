name: Lead privacy secret to the production Worker (T3, owner-authorized)

# Plan 3.1, T3 (PR #801): the lead-magnet links and pseudonymous references use ONLY the dedicated
# key LEAD_PRIVACY_SECRET. Order: (1) the owner creates the GitHub secret LEAD_PRIVACY_SECRET
# (random, >= 32 chars, from a password manager; never pasted in chat/PR); (2) "copy" writes it to
# the Worker "zevanory" inside the serialized deploy-zevanory queue; (3) "verify" certifies;
# (4) only then PR #801 merges. Logic in scripts/deploy/worker_secret_rotate.py:
#   * ONE new version with every key at once (`wrangler versions secret bulk`), tagged with the live
#     SHA: no intermediate key state, and the monotonic guard keeps both version sources;
#   * pre-check (both sources agree, newest version = active) and post-check (same SHA by both
#     sources, /api/health live+ready, binding names); FAIL -> previous version redeployed at 100%;
#     NAO_COMPROVADO -> no rollback, run fails for the read-only verify.
# Rotation: GitHub LEAD_PRIVACY_SECRET_PREVIOUS = old value, LEAD_PRIVACY_SECRET = new one, "copy"
# (both in the same version). End of rotation: delete the GitHub PREVIOUS, run "drop-previous".
on:
  workflow_dispatch:
    inputs:
      action:
        description: "verify = read-only; copy = write the key ring; drop-previous = end a rotation"
        required: true
        default: verify
        type: choice
        options: [verify, copy, drop-previous]

permissions:
  contents: read

concurrency:
  group: deploy-zevanory
  cancel-in-progress: false
  queue: max

jobs:
  secret:
    environment: producao-critica  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
        if: inputs.action != 'verify'
        with:
          node-version: "22"
      - name: Write the key ring as one tagged version (values never printed)
        if: inputs.action == 'copy'
        env:
          LEAD_PRIVACY_SECRET: ${{ secrets.LEAD_PRIVACY_SECRET }}
          LEAD_PRIVACY_SECRET_PREVIOUS: ${{ secrets.LEAD_PRIVACY_SECRET_PREVIOUS }}
        run: python3 scripts/deploy/worker_secret_rotate.py --apply
      - name: End of rotation (remove LEAD_PRIVACY_SECRET_PREVIOUS only)
        if: inputs.action == 'drop-previous'
        run: python3 scripts/deploy/worker_secret_rotate.py --apply --drop-previous
      - name: Verify (read-only)
        if: inputs.action == 'verify'
        run: python3 scripts/deploy/worker_secret_rotate.py --verify
