name: Lead privacy secret to the production Worker (T3, owner-authorized)

# Plan 3.1, T3 (PR #801): the lead-magnet links and pseudonymous references use ONLY the dedicated
# key LEAD_PRIVACY_SECRET. Activation order: (1) the owner creates the GitHub secret
# LEAD_PRIVACY_SECRET (random, >= 32 chars, from a password manager; never pasted in chat/PR);
# (2) this workflow copies it to the Worker "zevanory" inside the serialized deploy-zevanory queue;
# (3) "verify" certifies the binding exists (names only, read-only); (4) only then PR #801 merges.
# Rotation: set LEAD_PRIVACY_SECRET_PREVIOUS (GitHub) to the old value and LEAD_PRIVACY_SECRET to the
# new one, then run "copy" (writes both). The value is never printed. Manual dispatch only.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "verify = read-only check of the Worker binding; copy = write the secret(s)"
        required: true
        default: verify
        type: choice
        options: [verify, copy]

permissions:
  contents: read

concurrency:
  group: deploy-zevanory
  cancel-in-progress: false
  queue: max

jobs:
  secret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      LEAD_PRIVACY_SECRET: ${{ secrets.LEAD_PRIVACY_SECRET }}
      LEAD_PRIVACY_SECRET_PREVIOUS: ${{ secrets.LEAD_PRIVACY_SECRET_PREVIOUS }}
    steps:
      - uses: actions/setup-node@v4
        if: inputs.action == 'copy'
        with:
          node-version: "22"
      - name: Copy (value never printed)
        if: inputs.action == 'copy'
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error title=LEAD_PRIVACY_SECRET::cloudflare_token_missing"; exit 1; }
          [ "${#LEAD_PRIVACY_SECRET}" -ge 32 ] || { echo "::error title=LEAD_PRIVACY_SECRET::github_secret_missing_or_shorter_than_32"; exit 1; }
          put() { printf '%s' "$2" | npx --yes wrangler@4.143.0 secret put "$1" --name zevanory > /tmp/out.txt 2>&1 || { sed -E 's/[A-Za-z0-9_-]{24,}/[redacted]/g' /tmp/out.txt | tail -5; echo "::error title=LEAD_PRIVACY_SECRET::secret_put_failed:$1"; exit 1; }; }
          put LEAD_PRIVACY_SECRET "$LEAD_PRIVACY_SECRET"
          if [ -n "${LEAD_PRIVACY_SECRET_PREVIOUS:-}" ]; then
            [ "${#LEAD_PRIVACY_SECRET_PREVIOUS}" -ge 32 ] || { echo "::error title=LEAD_PRIVACY_SECRET::previous_shorter_than_32"; exit 1; }
            [ "$LEAD_PRIVACY_SECRET_PREVIOUS" != "$LEAD_PRIVACY_SECRET" ] || { echo "::error title=LEAD_PRIVACY_SECRET::previous_equals_current"; exit 1; }
            put LEAD_PRIVACY_SECRET_PREVIOUS "$LEAD_PRIVACY_SECRET_PREVIOUS"
          fi
          echo "::notice title=LEAD_PRIVACY_SECRET::written to Worker zevanory (previous: $([ -n "${LEAD_PRIVACY_SECRET_PREVIOUS:-}" ] && echo yes || echo no))"
      - name: Verify the binding (read-only, names only)
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/secrets.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory/secrets")"
          [ "$code" = 200 ] || { echo "::error title=LEAD_PRIVACY_SECRET_VERIFY::http_$code"; exit 1; }
          names="$(jq -r '[.result[]?.name] | map(select(startswith("LEAD_PRIVACY_SECRET"))) | sort | join(",")' /tmp/secrets.json)"
          echo "LEAD_PRIVACY_BINDINGS=${names:-none}"
          case ",$names," in
            *,LEAD_PRIVACY_SECRET,*) echo "::notice title=LEAD_PRIVACY_SECRET_VERIFY::PASS binding present on Worker zevanory ($names)";;
            *) echo "::error title=LEAD_PRIVACY_SECRET_VERIFY::binding absent on Worker zevanory"; exit 1;;
          esac
          [ "${#LEAD_PRIVACY_SECRET}" -ge 32 ] && echo "GITHUB_SOURCE_SECRET=present_ge_32" || echo "::warning title=LEAD_PRIVACY_SECRET_VERIFY::GitHub source secret missing or short: rotation/recopy would fail"
