name: Full History Gitleaks Audit
on:
  push:
    branches:
      - audit/full-history-gitleaks-20261002
permissions:
  contents: read
  security-events: write
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks Action
        id: gitleaks_action
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: Prove checkout contains complete history
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(git rev-list --all --count)"
          ROOTS="$(git rev-list --max-parents=0 --all | wc -l | tr -d ' ')"
          test "$COUNT" -gt 1
          echo "GIT_HISTORY_COMMIT_COUNT=$COUNT"
          echo "GIT_HISTORY_ROOT_COUNT=$ROOTS"
      - name: Full-history scan independent of event range
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact=100 --report-format=json --report-path=/tmp/gitleaks-full-history.json .
          COUNT="$(jq 'length' /tmp/gitleaks-full-history.json 2>/dev/null || echo 0)"
          echo "GITLEAKS_FULL_HISTORY_FINDINGS=$COUNT"
          test "$COUNT" -eq 0
      - name: Audit route summary
        if: always()
        shell: bash
        run: |
          echo "GITLEAKS_ACTION_OUTCOME=${{ steps.gitleaks_action.outcome }}"
