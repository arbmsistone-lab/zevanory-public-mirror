name: R9 production credential identity (names and categories only)

# R9 (roteiro v4.7; auditoria Sol 164 §4): prova, sem revelar valores, (a) qual nome de credencial de operador o Worker de
# produção usa (ZEVANORY_OPERATOR_TOKEN x queda para CERTIFICATION_E2E_TOKEN), (b) que as duas fontes do GitHub têm o
# mesmo valor durante a transição (só um booleano), e (c) que a STRIPE_SECRET_KEY da produção não é chave de teste.
# Só workflow_dispatch e só gh-pages: nunca dispara no merge. Cada job roda no Environment do qual lê segredos
# (producao-critica exige revisor). Saídas permitidas: nomes, present|absent, live|test|absent|unrecognized, true|false.
on:
  workflow_dispatch:
    inputs:
      require_primary:
        description: "Reprovar se a produção ainda usar o nome antigo (pré-condição para retirar a queda)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  worker-binding:
    environment: producao-critica
    if: ${{ github.ref == 'refs/heads/gh-pages' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      R9_NEW: ${{ secrets.ZEVANORY_OPERATOR_TOKEN }}
      R9_LEGACY: ${{ secrets.CERTIFICATION_E2E_TOKEN }}
      ZEVANORY_OPERATOR_TOKEN: ${{ secrets.ZEVANORY_OPERATOR_TOKEN || secrets.CERTIFICATION_E2E_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: GitHub Environment producao-critica (presence and equality only)
        shell: bash
        env:
          REQUIRE_PRIMARY: ${{ inputs.require_primary }}
        run: |
          set -euo pipefail
          bash scripts/ci/operator-token-github-presence.sh producao-critica
      - name: Worker zevanory binding names (Cloudflare settings API, names only)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory/settings" -o /tmp/settings.json
          python3 - <<'PY'
          import json
          rows=(json.load(open("/tmp/settings.json")).get("result") or {}).get("bindings") or []
          names={r.get("name") for r in rows}
          for n in ("ZEVANORY_OPERATOR_TOKEN","CERTIFICATION_E2E_TOKEN","STRIPE_SECRET_KEY"):
              print(f"WORKER_BINDING_{n}={'present' if n in names else 'absent'}")
          pilot=sorted(n for n in names if isinstance(n,str) and n.startswith("CERTIFICATION_PILOT_"))
          print("WORKER_BINDING_CERTIFICATION_PILOT=" + (",".join(pilot) if pilot else "none"))
          PY
          rm -f /tmp/settings.json
      - name: Worker readback (operator token source and Stripe key mode)
        shell: bash
        env:
          REQUIRE_PRIMARY: ${{ inputs.require_primary }}
        run: |
          set -euo pipefail
          extra=""; [ "${REQUIRE_PRIMARY:-false}" = "true" ] && extra="--require-primary"
          python3 scripts/ci/credential_identity_readback.py https://zevanory.api.br $extra

  automation-environment:
    environment: gh-pages-automacao
    if: ${{ github.ref == 'refs/heads/gh-pages' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      R9_NEW: ${{ secrets.ZEVANORY_OPERATOR_TOKEN }}
      R9_LEGACY: ${{ secrets.CERTIFICATION_E2E_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: GitHub Environment gh-pages-automacao (presence and equality only)
        shell: bash
        env:
          REQUIRE_PRIMARY: ${{ inputs.require_primary }}
        run: |
          set -euo pipefail
          bash scripts/ci/operator-token-github-presence.sh gh-pages-automacao

  github-stripe-key:
    environment: producao-critica
    if: ${{ github.ref == 'refs/heads/gh-pages' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - name: STRIPE_SECRET_KEY visible to producao-critica (prefix category only)
        shell: bash
        run: |
          set -euo pipefail
          # Prefixos documentados: https://docs.stripe.com/api/authentication (sk_test_, sk_live_, rk_live_).
          case "${STRIPE_SECRET_KEY:-}" in
            "") mode=absent ;;
            sk_live_*|rk_live_*) mode=live ;;
            sk_test_*|rk_test_*) mode=test ;;
            *) mode=unrecognized ;;
          esac
          unset STRIPE_SECRET_KEY
          echo "GITHUB_PRODUCAO_CRITICA_STRIPE_KEY_MODE=$mode"
          case "$mode" in
            live|absent) echo "R9_GITHUB_STRIPE_KEY=PASS" ;;
            *) echo "::error title=R9_GITHUB_STRIPE_KEY::chave Stripe '$mode' sob o nome de produção no Environment producao-critica"; exit 1 ;;
          esac
