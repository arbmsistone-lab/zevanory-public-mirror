name: Workflow YAML validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-yaml:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all workflow YAML with safe_load
        run: |
          python -m pip install --quiet "PyYAML==6.0.2"
          python scripts/validate_workflows_yaml.py
