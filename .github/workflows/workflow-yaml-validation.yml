name: Workflow YAML validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all workflow YAML with safe_load
        run: |
          python -m pip install --quiet "PyYAML==6.0.2"
          python scripts/validate_workflows_yaml.py
      - name: Validate all workflows with actionlint
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.7"
          arch="x86_64"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_${arch}.tar.gz" -o /tmp/actionlint.tgz
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null || /tmp/actionlint .github/workflows
