name: Workflow YAML validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-yaml:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all workflow YAML with safe_load
        run: |
          python -m pip install --quiet "PyYAML==6.0.2"
          python scripts/validate_workflows_yaml.py
