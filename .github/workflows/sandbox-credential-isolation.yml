name: Sandbox credential isolation gate
on:
  pull_request:
    branches: [gh-pages]
  push:
    branches: [gh-pages]
permissions:
  contents: read
jobs:
  credential-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
        with: {node-version: '22'}
      - run: node --test tests/sandbox_credential_isolation.test.mjs tests/sandbox_proof_v2.test.mjs
