name: ZEES-16 Evidence Gate

on:
  pull_request:
    branches:
      - gh-pages
  schedule:
    - cron: '31 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: zees16-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: zees16-evidence / exact-release-legacy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve certified live release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Certified live SHA = head of the latest successful central production deploy,
          # which only succeeds after proving that exact SHA is serving production.
          api="https://api.github.com/repos/${{ github.repository }}/actions/workflows/central-production-deploy.yml/runs?branch=gh-pages&status=success&per_page=1"
          code="$(curl -sS -o /tmp/certified-live.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api" || true)"
          sha="$(jq -r '.workflow_runs[0].head_sha // empty' /tmp/certified-live.json 2>/dev/null || true)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "::error title=CERTIFIED_LIVE_SHA::http=$code body=$(head -c 300 /tmp/certified-live.json 2>/dev/null | tr '\n' ' ')"; exit 1; fi
          echo "EXPECTED_SHA=$sha" >> "$GITHUB_ENV"
          echo "CERTIFIED_LIVE_SHA=$sha"
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Show exact revision
        run: git rev-parse HEAD
      - name: Bind regression gate to exact live release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 https://zevanory.api.br/api/release -o /tmp/release.json
          ACTUAL_SHA="$(jq -r '.deployment.commit_sha // empty' /tmp/release.json)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "P06_ZEES_GATE_EXACT_RELEASE=PASS sha=$ACTUAL_SHA"
      - name: Compile validators
        run: |
          python3 -m py_compile scripts/zees16_evidence_gate.py
          python3 -m py_compile scripts/zea10_autonomy_gate.py
          python3 -m py_compile scripts/provider_independence_gate.py
          python3 -m py_compile scripts/operational_preservation_gate.py
      - name: Validate operational baseline
        run: python3 scripts/operational_preservation_gate.py
      - name: Validate ZEES-16 registry
        run: python3 scripts/zees16_evidence_gate.py
      - name: Validate ZEA-10 autonomy
        run: python3 scripts/zea10_autonomy_gate.py
      - name: Validate P14 provider independence
        run: python3 scripts/provider_independence_gate.py

      - name: Emit immutable ZEES gate evidence
        if: always()
        shell: bash
        run: |
          jq -n --arg sha "$EXPECTED_SHA" --arg run "$GITHUB_RUN_ID" '{schema:"zevanory.p06.zees-gate.v1",release_sha:$sha,run_id:$run,status:"proved"}' > p06-zees-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p06-zees-gate-37e695127af0
          path: p06-zees-gate.json
          retention-days: 90
