name: b0-baseline-tests

# Testes da lógica do coletor B0 e do monitor P18 (evidência SINTETICA). Só pull_request: nunca dispara no merge,
# sem segredos, sem rede além do checkout e da instalação do Node. Os testes usam rede falsa e diretório temporário.
on:
  pull_request:
    # Sem filtro de base: também roda em PR empilhado (ex.: base claude/b0-baseline-p18-monitor). Só leitura.
    paths:
      - "scripts/b0/**"
      - "tests/b0-baseline.test.mjs"
      - "tests/test_sparse_checkout_imports.py"
      - "scripts/ci/mutants_p18.py"
      - "scripts/audit/workers-usage.mjs"
      - "scripts/audit/command-center-snapshot.mjs"
      - "scripts/ci/mutants_p19_capacity.py"
      - "scripts/ci/mutants_p19_capacity_allow.json"
      - "scripts/ci/mutant_classifier.py"
      - "tests/helpers/p20-backup-fixture.mjs"
      - "scripts/p20/**"
      - "docs/b0/**"
      - ".github/workflows/b0-baseline-collector.yml"
      - ".github/workflows/p18-external-monitor.yml"
      - ".github/workflows/p18-monitor-watchdog.yml"
      - ".github/workflows/b0-baseline-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    name: b0-baseline / tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Checkout esparso cobre o grafo de imports (P18 monitor/vigia)
        run: python3 -m unittest -v tests/test_sparse_checkout_imports.py
      - name: Sintaxe
        run: |
          set -euo pipefail
          for f in scripts/b0/*.mjs scripts/b0/*.cjs; do node --check "$f"; done
          bash -n scripts/b0/evidence-branch.sh
      - name: Testes (fail-closed, NOT_AVAILABLE nunca é dia completo, estados, alerta, latência, confirmação, vigia)
        run: node --test tests/b0-baseline.test.mjs
      - name: Mutantes P18 (latência, confirmação, vigia, NOT_PROVEN em lacunas; classificador compartilhado R5)
        run: python3 scripts/ci/mutants_p18.py
      - name: Mutantes causais P19 (Workers/Neon; todos precisam morrer)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 scripts/ci/mutants_p19_capacity.py < /dev/null | tee /tmp/mut.txt
          echo "::notice title=P19_CAPACITY_MUTANTS::$(grep -E '^MUTANTS ' /tmp/mut.txt)"
          grep -qx "MUTANTS total=20 killed=20 survived=0 inconclusive=0" /tmp/mut.txt || { echo "::error::mutante sobreviveu ou contagem mudou"; exit 1; }
