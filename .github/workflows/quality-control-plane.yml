name: ZEVANORY Quality Control Plane

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zevanory-qcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Core tests
        run: npm test
      - name: UI-12 design-system assurance
        run: node --test test/ui-12-assurance.test.mjs test/control-plane-vnext.test.mjs
      - name: Supply-chain scan
        run: npm run supplychain:scan
      - name: Observability audit
        run: npm run audit:obs:10x
      - name: Live action plan audit
        run: npm run audit:live-plan:3x
      - name: Security audit
        run: npm run audit:security:10x
      - name: NPM audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install Trivy 0.74.0 with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  trivy_0.74.0_Linux-64bit.tar.gz" | sha256sum -c -
          tar -xzf trivy_0.74.0_Linux-64bit.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Trivy security gate
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules .
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start commit-local server
        shell: bash
        run: |
          npm start > zevanory-server.log 2>&1 &
          echo $! > zevanory-server.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/api/live && exit 0; sleep 1; done
          cat zevanory-server.log
          exit 1
      - name: Visual and E2E gate
        run: npm run test:e2e
        env:
          ZEVANORY_BASE_URL: http://127.0.0.1:4173
      - name: Commercial distribution audit
        run: npm run audit:distribution:10x
      - name: Commercial engine V2 audit
        run: npm run audit:commercial-engine-v2:10x
      - name: Certification pilot audit
        run: npm run audit:pilot:10x
      - name: Lifecycle canonical audit
        run: npm run audit:lifecycle:10x
      - name: Lifecycle evidence audit
        run: npm run audit:lifecycle:evidence:10x
      - name: Final closure audit
        run: npm run audit:closure:10x
      - name: Generate SBOM
        shell: bash
        run: |
          mkdir -p quality-evidence
          npm sbom --sbom-format cyclonedx > quality-evidence/sbom.cdx.json
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zevanory-quality-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            quality-evidence/
            zevanory-server.log
          if-no-files-found: ignore
          retention-days: 30
