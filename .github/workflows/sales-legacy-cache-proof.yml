name: sales-legacy-cache-proof
# Sol 170 counterproof for PR #911 (retired contact script vs. the browser HTTP cache). One localhost
# origin, a persistent Chromium profile, and three builds served through their own Worker, switched
# in place: the last build whose contact script injected wa.me links (parent of #892), #892 (pages
# still reference the old path) and the PR build. Measures reload, fresh navigation, other pages,
# back, and expiry (simulated with the Age header on the OLD responses; Cache-Control untouched).
# Evidence: docs/evidence/sales-ux/legacy-cache.md. Read-only: no secrets, no deploy, localhost only.
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "worker/sales-public-worker.mjs"
      - "sales-public/**"
      - "scripts/build_sales_public.py"
      - "scripts/audit/sales-legacy-cache-proof.mjs"
      - "tests/sales-asset-cache.test.mjs"
      - ".github/workflows/sales-legacy-cache-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sales-legacy-cache-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    name: sales-legacy-cache / browser-cache-counterproof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QUALITY_MODULES: /tmp/q/node_modules
      # Pinned old builds (committed sales-public/ + worker/ of each commit; nothing is rebuilt).
      INJECTOR_SHA: 36f4e2d6b1d7bb3b272ad8e57ef1276a3e08506b # parent of #892: script injected wa.me links
      BASE892_SHA: 6f2f0378b1a9acd70f8ab50dae81dc6e7be244a9 # #892 live: e-mail-only bytes, pages reference the path
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Asset/cache contract (Worker headers, Clear-Site-Data scope, no reference in the build)
        run: node --test tests/sales-asset-cache.test.mjs
      - name: Check out the pinned old builds
        run: |
          set -euo pipefail
          git worktree add /tmp/injector "$INJECTOR_SHA"
          git worktree add /tmp/base892 "$BASE892_SHA"
          # The old pages must really reference the retired path, or the counterproof is vacuous.
          n=$(grep -l 'src="/whatsapp''-contact.js"' /tmp/base892/sales-public/*.html | wc -l)
          echo "BASE892_PAGES_REFERENCING_OLD_SCRIPT=$n"; test "$n" -gt 50
      - name: Install Playwright 1.55.0 + Chromium
        run: |
          set -euo pipefail
          mkdir -p /tmp/q && echo '{"private":true}' > /tmp/q/package.json
          npm install --prefix /tmp/q --no-audit --no-fund playwright@1.55.0 >/dev/null
          /tmp/q/node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Counterproof (old -> #892 -> PR, persistent profile)
        run: node scripts/audit/sales-legacy-cache-proof.mjs /tmp/injector /tmp/base892 . /tmp/legacy-cache | tee /tmp/legacy-cache.log
      - name: Summary
        if: always()
        run: |
          grep -E '^LEGACY_CACHE_(RESIDUAL|TOMBSTONE|PROOF|FAIL)' /tmp/legacy-cache.log | while read -r l; do echo "::notice title=legacy-cache::$l"; done
          cat /tmp/legacy-cache/legacy-cache-observations.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-legacy-cache-evidence
          path: |
            /tmp/legacy-cache
            /tmp/legacy-cache.log
          retention-days: 30
