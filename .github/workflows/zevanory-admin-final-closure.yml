name: ZEVANORY admin final closure proof
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "worker/admin-render-server.mjs"
      - ".github/workflows/zevanory-admin-final-closure.yml"
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: "22"
      - name: Verify startup fail-closed and health proof contract
        run: |
          set -euo pipefail
          node --check worker/admin-render-server.mjs
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const s=fs.readFileSync("worker/admin-render-server.mjs","utf8");
          for(const token of ["AUTH_SELF_TEST","fatal_admin_auth_configuration_invalid","auth_configured","auth_self_test","per_client_lockout","RENDER_GIT_COMMIT"]){
            if(!s.includes(token)) throw new Error("missing closure invariant: "+token);
          }
          console.log("PASS: final admin closure invariants present");
          JS
