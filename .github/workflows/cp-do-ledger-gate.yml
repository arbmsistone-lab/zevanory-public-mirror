name: NC-007 Conteudo Pronto Durable Object ledger (offline)
on:
  pull_request:
    branches: [gh-pages, "claude/conteudo-pronto-campanha-v3"]
    paths:
      - "worker/cp-durable-ledger.mjs"
      - "worker/content-service.mjs"
      - "scripts/cp-durable-ledger.test.mjs"
      - "worker/cp-do-identity.mjs"
      - "worker/cp-g03-g04-candidate.mjs"
      - "worker/cp-nc011-routing.mjs"
      - "worker/cp-nc012-digital-hotmart.mjs"
      - "worker/cp-nc012-fulfillment.mjs"
      - "scripts/cp-nc012-fulfillment.test.mjs"
      - "scripts/cp-nc013-regression.test.mjs"
      - "worker/cloudflare-worker.compat.mjs"
      - "scripts/cp-nc011-routes.test.mjs"
      - "scripts/cp-g03-g04-candidate.test.mjs"
      - "worker/kit-hotmart-identity.mjs"
      - "worker/kit-release-192h.mjs"
      - "scripts/cp-kv-writers-lint.mjs"
      - "scripts/cp-kv-writers-lint.test.mjs"
      - "scripts/cp-do-identity.test.mjs"
      - "scripts/cp-alarm-g02.test.mjs"
      - "scripts/kit-192h-release.test.mjs"
      - "scripts/kit-192h-mutants.mjs"
      - "scripts/kit-192h-fixes.test.mjs"
      - "scripts/kit-192h-fixes-mutants.mjs"
      - "docs/ops/cp-kv-allowlist-NC009.json"
      - "docs/ops/cp-do-cutover-NC007.md"
      - ".github/workflows/cp-do-ledger-gate.yml"
permissions:
  contents: read
jobs:
  do-sqlite-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Nine independent SQLite transitions with no credentials
        run: |
          set -euo pipefail
          node --test --test-reporter=tap scripts/cp-durable-ledger.test.mjs 2>&1 | tee cp-do.txt
          grep -qx '# tests 9' <(grep '# tests ' cp-do.txt)
          grep -qx '# pass 9' <(grep '# pass ' cp-do.txt)
          grep -qx '# fail 0' <(grep '# fail ' cp-do.txt)
  nc009-g00-g02-n3-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: G00 allowlist and three static mutants
        run: |
          set -euo pipefail
          node scripts/cp-kv-writers-lint.mjs | tee lint.txt
          grep -q '"G00_KV_LINT":"PASS"' lint.txt
          node --test --test-reporter=tap scripts/cp-kv-writers-lint.test.mjs | tee g00.txt
          grep -qx '# tests 3' <(grep '^# tests ' g00.txt)
          grep -qx '# pass 3' <(grep '^# pass ' g00.txt)
      - name: G01 signed identity and G02 per-subscriber alarm queue
        run: |
          set -euo pipefail
          node --test --test-reporter=tap scripts/cp-do-identity.test.mjs scripts/cp-alarm-g02.test.mjs | tee g01-g02.txt
          grep -qx '# tests 11' <(grep '^# tests ' g01-g02.txt)
          grep -qx '# pass 11' <(grep '^# pass ' g01-g02.txt)
      - name: N3 exact-192h offline boundary, refunds, replay and signed links
        run: |
          set -euo pipefail
          node --test --test-reporter=tap scripts/kit-192h-release.test.mjs | tee kit192.txt
          grep -qx '# tests 12' <(grep '^# tests ' kit192.txt)
          grep -qx '# pass 12' <(grep '^# pass ' kit192.txt)
      - name: NC-010 F1-F3 regression cases and three mutation kills
        run: |
          set -euo pipefail
          node --test --test-reporter=tap scripts/kit-192h-fixes.test.mjs 2>&1 | tee nc010-fixes.txt
          grep -qx '# tests 5' <(grep '^# tests ' nc010-fixes.txt)
          grep -qx '# pass 5' <(grep '^# pass ' nc010-fixes.txt)
          node scripts/kit-192h-fixes-mutants.mjs | tee nc010-mutants.txt
          grep -qx 'NC010_F1_F2_F3_MUTANTS=PASS killed=3/3' nc010-mutants.txt
      - name: NC-010 G03/G04 authenticated DO webhook and token candidate tests
        run: |
          set -euo pipefail
          node --test --test-reporter=tap scripts/cp-g03-g04-candidate.test.mjs | tee g03-g04.txt
          grep -qx '# tests 6' <(grep '^# tests ' g03-g04.txt)
          grep -qx '# pass 6' <(grep '^# pass ' g03-g04.txt)
      - name: NC-011 effective CP HTTP paths through SQLite DO (offline)
        run: |
          set -euo pipefail
          node --test --test-reporter=tap scripts/cp-nc011-routes.test.mjs | tee nc011-routes.txt
          grep -qx '# tests 5' <(grep '^# tests ' nc011-routes.txt)
          grep -qx '# pass 5' <(grep '^# pass ' nc011-routes.txt)
      - name: NC-012 per-subscriber DO fulfillment and held Resend outbox
        run: |
          set -euo pipefail
          node --test --test-reporter=tap scripts/cp-nc012-fulfillment.test.mjs | tee nc012-fulfillment.txt
          grep -qx '# tests 8' <(grep '^# tests ' nc012-fulfillment.txt)
          grep -qx '# pass 8' <(grep '^# pass ' nc012-fulfillment.txt)
      - name: NC-013 digital webhook and DO replacements regression
        run: |
          set -euo pipefail
          node --test --test-reporter=tap scripts/cp-nc013-regression.test.mjs | tee nc013-regression.txt
          grep -qx '# tests 5' nc013-regression.txt
          grep -qx '# pass 5' nc013-regression.txt
          grep -qx '# fail 0' nc013-regression.txt
      - name: N3 mutation tests (5/5 killed)
        run: |
          set -euo pipefail
          node scripts/kit-192h-mutants.mjs | tee mutant192.txt
          grep -qx 'NC009_KIT_MUTANTS=PASS killed=5/5' mutant192.txt
  production-cutover-invariant:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: N4 fail closed until G00 remaining writers equals zero
        run: |
          set -euo pipefail
          node scripts/cp-kv-writers-lint.mjs | tee /tmp/g00.json
          node --input-type=module -e '
            import fs from "node:fs";
            const r=JSON.parse(fs.readFileSync("/tmp/g00.json","utf8"));
            if(r.G00_KV_LINT!=="PASS" || r.actual!==0){
              console.error("CUTOVER_NO_GO actual="+r.actual+" expected=0");
              process.exit(1);
            }
            console.log("CUTOVER_PASS actual=0");
          '
