name: Mercado Pago - root cause e antifraude gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "worker/cloudflare-worker.recovered.mjs"
      - "scripts/mercadopago_reconciliation_regression.py"
      - ".github/workflows/mercadopago-rootcause-antifraud.yml"

permissions:
  contents: read

concurrency:
  group: mp-rootcause-antifraud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check patched runtime
        run: node --check worker/cloudflare-worker.recovered.mjs

      - name: Regression - canonical price and mismatch rejection
        run: python scripts/mercadopago_reconciliation_regression.py

      - name: Confirm historical fixture retirement and current fail-closed evidence
        shell: bash
        run: |
          set -euo pipefail
          output="$(python scripts/mercadopago_reconciliation_regression.py)"
          printf '%s\n' "$output"
          grep -Fx 'PAYMENT_AMOUNT_MISMATCH_REJECTED=PASS' <<<"$output"
          grep -Fx 'ANTIFRAUD_AMOUNT_GUARD_PRESENT=PASS' <<<"$output"
          echo 'HISTORICAL_FIXED_PROVIDER_OBJECTS=RETIRED'
          echo 'NO_LIVE_CHARGE_OR_PROVIDER_MUTATION=PASS'
