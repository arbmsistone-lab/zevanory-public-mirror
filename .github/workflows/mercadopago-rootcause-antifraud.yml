name: Mercado Pago - root cause e antifraude gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "worker/cloudflare-worker.recovered.mjs"
      - "scripts/mercadopago_reconciliation_regression.py"
      - ".github/workflows/mercadopago-rootcause-antifraud.yml"

permissions:
  contents: read

concurrency:
  group: mp-rootcause-antifraud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      APP: https://zevanory.api.br
      MP_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_TEST_ACCESS_TOKEN }}
      CERTIFICATION_E2E_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN }}
      OLD_ORDER_ID: 4a615149-7dac-4c36-93a3-b7f895d2c9ca
      OLD_APPROVED_PAYMENT_ID: "182085091992"
      OLD_PREF_ID: 3670768257-f4236a66-96f6-49fc-ba1c-2587780b36e2
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check patched runtime
        run: node --check worker/cloudflare-worker.recovered.mjs

      - name: Regression - canonical price and mismatch rejection
        run: python scripts/mercadopago_reconciliation_regression.py

      - name: Confirm root cause read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          app=os.environ["APP"].rstrip("/")
          tok=os.environ["MP_ACCESS_TOKEN"].strip()
          cert=os.environ["CERTIFICATION_E2E_TOKEN"].strip()
          oid=os.environ["OLD_ORDER_ID"]; pid=os.environ["OLD_APPROVED_PAYMENT_ID"]; prefid=os.environ["OLD_PREF_ID"]
          assert tok and cert

          def get(url,headers=None):
              h={"Accept":"application/json","User-Agent":"ZEVANORY-RootCause-Antifraud/1.0"}
              if headers: h.update(headers)
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read().decode())

          pref=get("https://api.mercadopago.com/checkout/preferences/"+prefid,{"Authorization":"Bearer "+tok})
          pay=get("https://api.mercadopago.com/v1/payments/"+pid,{"Authorization":"Bearer "+tok})
          state=get(app+"/api/internal/certification/e2e/status?order_id="+urllib.parse.quote(oid),
                    {"x-certification-e2e-token":cert})
          order=state.get("order") or {}

          assert pay.get("status")=="approved",pay
          assert abs(float(pay.get("transaction_amount") or 0)-197.0)<0.001,pay
          assert abs(float(order.get("amount") or 0)-5.0)<0.001,order
          assert str(order.get("status") or "")!="paid",order
          assert str(pref.get("external_reference") or "").endswith(oid),pref
          assert str(pay.get("external_reference") or "")==str(pref.get("external_reference") or ""),pay
          assert str(pref.get("notification_url") or "").startswith("https://"),pref
          assert not any(str(e.get("provider_payment_id"))==pid and e.get("normalized_event")=="payment_confirmed"
                         for e in state.get("financial_events",[])),state.get("financial_events")

          print("ROOT_CAUSE=TEST_ORDER_5_THEN_OUT_OF_BAND_PREFERENCE_197")
          print("OLD_PAYMENT_CLASSIFICATION=ORPHAN_DIVERGENT_REVIEW_REQUIRED")
          print("OLD_ORDER_UNCHANGED_NOT_PAID=PASS")
          print("ANTIFRAUD_AMOUNT_MISMATCH_REJECTION=PASS")
          print("NO_COMPENSATING_ORDER_MUTATION=PASS")
          PY
