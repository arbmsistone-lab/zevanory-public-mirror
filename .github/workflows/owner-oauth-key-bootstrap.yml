name: Owner OAuth key bootstrap (one-time, fail-closed)

# Generates the two OAuth keys once, inside the runner, and writes them only as
# Cloudflare Worker secrets. Values are never echoed, committed, logged or stored
# as GitHub secrets. Existing keys are NEVER rotated: rotating the encryption key
# would orphan stored connections, rotating the bridge would desync L and P.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type BOOTSTRAP to generate keys only if all are absent
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: owner-oauth-key-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/gh-pages' && inputs.confirm == 'BOOTSTRAP'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "1b26415802588185a86c1d4d3ebf5bdb"
      L_WORKER: zevanory
      P_WORKER: zevanory-product-control-portable
    steps:
      - name: Inventory secret names and Free binding budget (names only)
        id: inv
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error title=OAUTH_BOOTSTRAP::CLOUDFLARE_TOKEN_MISSING"; exit 1; }
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          for w in "$L_WORKER" "$P_WORKER"; do
            code="$(curl -sS -o "/tmp/$w.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$w/settings")"
            [ "$code" = 200 ] || { echo "::error title=OAUTH_BOOTSTRAP::settings_http_${code}_worker_${w}"; exit 1; }
          done
          cp "/tmp/$L_WORKER.json" /tmp/l.json; cp "/tmp/$P_WORKER.json" /tmp/p.json
          python3 - <<'PY'
          import json,os,sys
          def fail(m):
              print("::error title=OAUTH_BOOTSTRAP::"+m); sys.exit(1)
          def names(p,types):
              rows=(json.load(open(p)).get("result") or {}).get("bindings") or []
              return {r.get("name") for r in rows if r.get("type") in types}
          sec={"secret_text","secret_key"}
          l=names("/tmp/l.json",sec); p=names("/tmp/p.json",sec)
          l_all=names("/tmp/l.json",sec|{"plain_text","json"})|{"CHANNEL_CREDENTIALS_JSON"}
          enc="OWNER_OAUTH_ENCRYPTION_KEY" in l; lb="OWNER_OAUTH_BRIDGE_SECRET" in l; pb="OWNER_OAUTH_BRIDGE_SECRET" in p
          present=[enc,lb,pb]
          print(f"L_ENCRYPTION_PRESENT={enc} L_BRIDGE_PRESENT={lb} P_BRIDGE_PRESENT={pb}")
          out=open(os.environ["GITHUB_OUTPUT"],"a")
          if all(present):
              print("OWNER_OAUTH_KEYS=ALREADY_COMPLETE (no rotation)"); out.write("action=none\n"); raise SystemExit(0)
          if any(present):
              fail(f"OWNER_OAUTH_KEYS_PARTIAL_FAIL_CLOSED L_ENC={enc} L_BRIDGE={lb} P_BRIDGE={pb}")
          planned=len(l_all)+2
          if planned>60: fail(f"OWNER_OAUTH_BINDING_BUDGET_EXCEEDED planned={planned} max=60")
          print(f"OWNER_OAUTH_BINDING_BUDGET_PASS planned={planned} max=60")
          out.write("action=generate\n")
          PY

      - uses: actions/setup-node@v4
        if: steps.inv.outputs.action == 'generate'
        with:
          node-version: '22'

      - name: Generate in memory and write only to Worker secrets
        if: steps.inv.outputs.action == 'generate'
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          BRIDGE="$(openssl rand -base64 48 | tr -d '\n=' | tr '+/' '-_')"
          ENCKEY="$(openssl rand -base64 48 | tr -d '\n=' | tr '+/' '-_')"
          echo "::add-mask::$BRIDGE"; echo "::add-mask::$ENCKEY"
          [ "${#BRIDGE}" -ge 32 ] && [ "${#ENCKEY}" -ge 32 ]
          W="npx --yes wrangler@4.143.0"
          # Panel first: if it fails nothing in L changes.
          printf '%s' "$BRIDGE" | $W secret put OWNER_OAUTH_BRIDGE_SECRET --name "$P_WORKER" >/dev/null
          printf '%s' "$BRIDGE" | $W secret put OWNER_OAUTH_BRIDGE_SECRET --name "$L_WORKER" >/dev/null
          printf '%s' "$ENCKEY" | $W secret put OWNER_OAUTH_ENCRYPTION_KEY --name "$L_WORKER" >/dev/null
          unset BRIDGE ENCKEY
          echo "::notice title=OAUTH_BOOTSTRAP::OWNER_OAUTH_KEYS_WRITTEN=PASS (values never printed)"

      - name: Read back names only
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$L_WORKER/settings" -o /tmp/l.json
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$P_WORKER/settings" -o /tmp/p.json
          python3 - <<'PY'
          import json
          def names(p):
              rows=(json.load(open(p)).get("result") or {}).get("bindings") or []
              return {r.get("name") for r in rows if r.get("type") in {"secret_text","secret_key"}}
          l=names("/tmp/l.json"); p=names("/tmp/p.json")
          ok={"OWNER_OAUTH_ENCRYPTION_KEY","OWNER_OAUTH_BRIDGE_SECRET"}<=l and "OWNER_OAUTH_BRIDGE_SECRET" in p
          print("OWNER_OAUTH_KEYS_READBACK="+("PASS" if ok else "FAIL"))
          if not ok: print("::error title=OAUTH_BOOTSTRAP::readback_fail")
          raise SystemExit(0 if ok else 1)
          PY
