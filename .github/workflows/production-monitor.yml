name: ZEVANORY Production Monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zevanory-production-monitor
  cancel-in-progress: true
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run probe:production
      - run: npm run contract:smoke
      - run: npm run activation:check
      - run: npm run audit:offer:20x
      - run: npm run supplychain:scan
