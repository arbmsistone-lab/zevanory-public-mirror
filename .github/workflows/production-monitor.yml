name: ZEVANORY Production Monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zevanory-production-monitor
  cancel-in-progress: true
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run probe:production
      - run: npm run contract:smoke
      - run: npm run activation:check
      - run: npm run audit:offer:20x
      - run: npm run supplychain:scan
      - run: npm run security:lifecycle
      - run: npm run dast:safe
