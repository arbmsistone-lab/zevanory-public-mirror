# its own config and no promotion guard, in parallel with the canonical publisher. The panel is
# published only by zpc-control-worker-deploy.yml (monotonic guard and authorised rollback,
# #796/#797) and reconciled by t2-exact-control-worker-promotion.yml in the same queue.
# Kept as a stub, without credentials or publish commands, so the history stays traceable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error title=RETIRED_PUBLISHER::use zpc-control-worker-deploy.yml"
          exit 1
