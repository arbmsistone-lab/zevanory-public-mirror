name: ZPC Cloudflare exact release
on:
  pull_request:
    branches: [gh-pages]
permissions:
  contents: read
jobs:
  credential-alias-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      T1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      T2: ${{ secrets.CF_API_TOKEN }}
      T3: ${{ secrets.CLOUDFLARE_TOKEN }}
      T4: ${{ secrets.CF_WORKERS_TOKEN }}
      K1: ${{ secrets.CLOUDFLARE_API_KEY }}
      E1: ${{ secrets.CLOUDFLARE_EMAIL }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe token aliases without disclosure
        shell: bash
        run: |
          set -euo pipefail
          for n in T1 T2 T3 T4; do
            v="${!n:-}"
            if [ -n "$v" ]; then
              echo "$n=PRESENT"
              CLOUDFLARE_API_TOKEN="$v" npx --yes wrangler@4.135.0 whoami
            else
              echo "$n=ABSENT"
            fi
          done
          if [ -n "${K1:-}" ]; then echo "GLOBAL_KEY=PRESENT"; else echo "GLOBAL_KEY=ABSENT"; fi
          if [ -n "${E1:-}" ]; then echo "GLOBAL_EMAIL=PRESENT"; else echo "GLOBAL_EMAIL=ABSENT"; fi
          echo "MUTATION=0"
