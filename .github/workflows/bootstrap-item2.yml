name: Bootstrap tested WhatsApp Neon patch
on:
  push:
    branches: [fix/whatsapp-neon-operational-store-v2-20261007]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-neon-operational-store-v2-20261007
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply patch
        run: cat scripts/bootstrap_item2_*.part > /tmp/item2.py && python3 /tmp/item2.py
      - name: Test before product commit
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/whatsapp-neon-store.mjs
          node --check worker/whatsapp-e2e-evidence.mjs
          node --check worker/cloudflare-worker.recovered.mjs
          node scripts/whatsapp-kv-write-budget.mjs
          python3 -m py_compile scripts/ped_versal_audit.py
          python3 scripts/ped_versal_audit.py
          if [ -f scripts/ped_versal_zero_debt_audit.py ]; then python3 scripts/ped_versal_zero_debt_audit.py; else echo "PED_ZERO_DEBT=NOT_PRESENT_IN_PUBLIC_MIRROR"; fi
      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/bootstrap_item2_*.part scripts/zpc-item2-bootstrap-probe.txt .github/workflows/bootstrap-item2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(whatsapp): move per-message operational writes to Neon"
          git push origin HEAD:fix/whatsapp-neon-operational-store-v2-20261007
