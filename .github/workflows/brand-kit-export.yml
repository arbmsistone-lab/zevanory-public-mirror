name: Build committed official brand exports (feature branch only)
on:
  push:
    branches: ['feat/brand-kit-unified-20261010', 'fix/brand-**']
    paths:
      - 'assets/brand/*.svg'
      - 'scripts/build-brand-assets.py'
      - '.github/workflows/brand-kit-export.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize-assets:
    # Never on gh-pages: renders official exports only on the brand feature/fix branch that changed the sources.
    if: github.repository == 'arbmsistone-lab/zevanory-public-mirror' && (github.ref == 'refs/heads/feat/brand-kit-unified-20261010' || startsWith(github.ref, 'refs/heads/fix/brand-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Dependencies pinned
        run: python3 -m pip install --user --disable-pip-version-check 'CairoSVG==2.8.2' 'Pillow==12.3.0'
      - name: Render and verify official artifacts
        run: python3 scripts/build-brand-assets.py
      - name: Commit generated PNGs and pinned digests only to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/export sales-public/brand/export worker/brand-approved.mjs
          if git diff --cached --quiet; then echo "BRAND_EXPORT_ALREADY_CURRENT=PASS"; exit 0; fi
          git commit -m "build(brand): pin exact exported PNG hashes and publishable copies"
          git push origin HEAD:refs/heads/${{ github.ref_name }}
