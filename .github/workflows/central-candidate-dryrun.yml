name: ZEVANORY central candidate dry-run (PR)
# Pre-merge twin of the "Reconstruct exact production candidate" step of
# central-production-deploy.yml: same pinned base (83620c68), same scripts, then
# `wrangler deploy --dry-run --strict`. No secrets, no Cloudflare authentication, no
# publication: the dry-run only bundles and validates the configuration (crons included).
# The canonical publisher is untouched and still runs its own dry-run before deploying.
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "worker/**"
      - "scripts/deploy/**"
      - "public/**"
      - "admin.css"
      - "assets/brand/**"
      - "sales-public/brand/**"
      - ".github/workflows/central-production-deploy.yml"
      - ".github/workflows/central-candidate-dryrun.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: central-candidate-dryrun-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Reconstruct the candidate exactly like the publisher (placeholders, sales closed)
        env:
          PUBLIC_OWNER_ACCOUNT_ID: "00000000000000000000000000000000"
          TARGET_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ZEVANORY_LAUNCH_AUTHORIZATION: ""
          MERCADOPAGO_PRODUCTION_ACCOUNT_HASH16: ""
          MERCADOPAGO_PRODUCTION_WEBHOOK_VERIFIED: ""
        run: |
          set -euo pipefail
          git fetch origin final-83620c6 || true
          mv public public.checkout-original 2>/dev/null || true
          git archive 83620c680958d726fc4b0fd16e2574cdcc362a6d public | tar -x
          node scripts/deploy/materialize-control-plane.mjs
          cmp -s worker/live-recovered/control-plane-vnext.js public/control-plane-vnext.js
          cp admin.css public/admin.css
          python3 scripts/deploy/write-build-info.py
          git show 83620c680958d726fc4b0fd16e2574cdcc362a6d:wrangler.jsonc > wrangler.central-fix.jsonc
          python3 scripts/deploy/prepare-central-candidate.py
          python3 scripts/deploy/copy-brand-export.py
          node --check worker/cloudflare-worker.compat.mjs
      - name: No WhatsApp alias in the generated candidate (real pinned base 83620c6; PR #896)
        # The pinned base wrangler.jsonc still carries SUPPORT_CHANNEL with the legacy number; the generator
        # must strip it. Same banned set as tests/whatsapp-config-absence.test.mjs.
        run: |
          set -euo pipefail
          if grep -nEi 'SUPPORT_CHANNEL|ZEVANORY_WHATSAPP_|wa\.me|9?9254-?5413|9234-?0423' wrangler.central-fix.jsonc; then
            echo "::error title=WHATSAPP_ALIAS_IN_CANDIDATE::generated wrangler.central-fix.jsonc carries a retired WhatsApp alias"; exit 1
          fi
          echo "::notice title=WHATSAPP_ALIAS_IN_CANDIDATE::absent"
      - name: No WhatsApp contact in the built public assets (frozen 83620c6 snapshot + overlays; PR #896)
        # Strict from #896 on: the apex public/ tree is the frozen snapshot, not the page sources #892 cleans,
        # and the generator already neutralized it. Re-scans the FINAL tree (after copy-brand-export.py).
        run: python3 -B scripts/deploy/public_whatsapp_scan.py public
      - name: Retired contact script absent from the built public assets (frozen 83620c6 snapshot + overlays)
        # The generator stops publishing it and strips the 19 page references (fails closed itself); this
        # re-checks the FINAL tree after copy-brand-export.py. The central Worker serves the old path as a tombstone.
        run: |
          set -euo pipefail
          name="whatsapp""-contact"
          test ! -e "public/$name.js" || { echo "::error::public/$name.js still generated"; exit 1; }
          if grep -RIl -- "$name" public; then echo "::error::a public asset still references the retired script"; exit 1; fi
          echo "::notice title=RETIRED_CONTACT_SCRIPT::absent from $(find public -type f | wc -l) public files"
      - name: Crons of the candidate (declared list, at most 5 per account)
        run: |
          python3 - <<'PY'
          import json, re, pathlib
          crons = json.load(open("wrangler.central-fix.jsonc")).get("triggers", {}).get("crons", [])
          print("CENTRAL_CANDIDATE_CRONS=" + json.dumps(crons))
          src = pathlib.Path("scripts/deploy/prepare-central-candidate.py").read_text(encoding="utf-8")
          m = re.search(r"CENTRAL_CRONS=(\[[^\]]+\])", src)
          if m: assert crons == json.loads(m.group(1)), ("candidate crons differ from CENTRAL_CRONS", crons)
          assert 0 < len(crons) <= 5, crons
          assert len(set(crons)) == len(crons), ("duplicate cron", crons)
          assert all(len(c.split()) == 5 for c in crons), ("cron must have 5 fields", crons)
          open("central-crons.json", "w").write(json.dumps(crons))
          PY
      - name: Wrangler dry-run (strict, no authentication, no publication)
        run: npx --yes wrangler@4.143.0 deploy --dry-run --strict --keep-vars --config wrangler.central-fix.jsonc --outdir "$RUNNER_TEMP/central-dryrun"
      - name: Final binding set WITHOUT --keep-vars (what the real deploy publishes; PR #896, AVAL Sol 125)
        # central-production-deploy.yml deploys WITHOUT --keep-vars, so the Worker ends with exactly the vars of
        # wrangler.central-fix.jsonc. Bundle that exact set and inspect it: WHATSAPP_SALES_ENABLED must be "false"
        # and no SUPPORT_CHANNEL / ZEVANORY_WHATSAPP_* binding may exist (top level or compact runtime config).
        # The three retired WhatsApp Cloud API settings the base ships in ZEVANORY_RUNTIME_CONFIG
        # (WHATSAPP_PHONE_NUMBER_ID, META_WHATSAPP_IDENTITY_VERIFIED, WHATSAPP_BRAND_IDENTITY_VERIFIED) must be absent;
        # META_GRAPH_VERSION and every META_/FACEBOOK_/INSTAGRAM_ key of the base must survive. META_VERIFY_TOKEN (shared
        # Instagram/Facebook verify token) is a Worker SECRET, not a var of the pinned base, so the real candidate cannot
        # show it; the pinned base seeded with a placeholder META_VERIFY_TOKEN (vars + runtime config) goes through the
        # same generator and the token must come out PRESENT (no over-stripping), bundled again without --keep-vars.
        env:
          PUBLIC_OWNER_ACCOUNT_ID: "00000000000000000000000000000000"
          TARGET_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ZEVANORY_LAUNCH_AUTHORIZATION: ""
          MERCADOPAGO_PRODUCTION_ACCOUNT_HASH16: ""
          MERCADOPAGO_PRODUCTION_WEBHOOK_VERIFIED: ""
        run: |
          set -euo pipefail
          npx --yes wrangler@4.143.0 deploy --dry-run --strict --config wrangler.central-fix.jsonc --outdir "$RUNNER_TEMP/central-dryrun-nokeep" 2>&1 | tee bindings.txt
          line="$(grep -E 'WHATSAPP_SALES_ENABLED' bindings.txt || true)"
          echo "WHATSAPP_SALES_ENABLED binding: ${line:-<absent>}"
          [ -n "$line" ] || { echo "::error title=FINAL_BINDINGS::WHATSAPP_SALES_ENABLED absent from the final binding set"; exit 1; }
          echo "$line" | grep -q 'false' && ! echo "$line" | grep -qi 'true' || { echo "::error title=FINAL_BINDINGS::WHATSAPP_SALES_ENABLED is not \"false\": $line"; exit 1; }
          if grep -nE 'SUPPORT_CHANNEL|ZEVANORY_WHATSAPP_' bindings.txt; then echo "::error title=FINAL_BINDINGS::retired WhatsApp alias in the final binding set"; exit 1; fi
          python3 - <<'PY'
          import json
          v = json.load(open("wrangler.central-fix.jsonc"))["vars"]
          rt = v.get("ZEVANORY_RUNTIME_CONFIG") or {}
          assert v.get("WHATSAPP_SALES_ENABLED") == "false", ("WHATSAPP_SALES_ENABLED", v.get("WHATSAPP_SALES_ENABLED"))
          assert "WHATSAPP_SALES_ENABLED" not in rt, "WHATSAPP_SALES_ENABLED must not hide in the runtime config"
          bad = [k for bag in (v, rt) for k in bag if k == "SUPPORT_CHANNEL" or k.startswith("ZEVANORY_WHATSAPP_")]
          assert not bad, ("retired WhatsApp alias in final vars", bad)
          print("FINAL_BINDINGS_WHATSAPP=PASS WHATSAPP_SALES_ENABLED=false aliases=none")
          PY
          retired='WHATSAPP_PHONE_NUMBER_ID|META_WHATSAPP_IDENTITY_VERIFIED|WHATSAPP_BRAND_IDENTITY_VERIFIED'
          if grep -nE "$retired" bindings.txt wrangler.central-fix.jsonc; then echo "::error title=FINAL_BINDINGS::retired WhatsApp Cloud API setting in the final binding set"; exit 1; fi
          git show 83620c680958d726fc4b0fd16e2574cdcc362a6d:wrangler.jsonc > "$RUNNER_TEMP/base-83620c6.jsonc"
          python3 - "$RUNNER_TEMP/base-83620c6.jsonc" <<'PY'
          import json, re, sys
          RETIRED = ("WHATSAPP_PHONE_NUMBER_ID", "META_WHATSAPP_IDENTITY_VERIFIED", "WHATSAPP_BRAND_IDENTITY_VERIFIED")
          KEEP = re.compile(r"^(META_|FACEBOOK_|INSTAGRAM_)")
          base = json.load(open(sys.argv[1]))["vars"]; brt = base.get("ZEVANORY_RUNTIME_CONFIG") or {}
          v = json.load(open("wrangler.central-fix.jsonc"))["vars"]; rt = v.get("ZEVANORY_RUNTIME_CONFIG") or {}
          assert all(k in brt for k in RETIRED), ("the pinned base no longer carries the retired settings; revisit this check", [k for k in RETIRED if k not in brt])
          leaked = [k for bag in (v, rt) for k in bag if k in RETIRED]
          assert not leaked, ("retired WhatsApp Cloud API setting in final vars", leaked)
          keep = [(n, k, b[k]) for n, b in (("vars", base), ("runtime", brt)) for k in b if KEEP.match(k) and k not in RETIRED]
          assert any(k == "META_GRAPH_VERSION" for _, k, _ in keep), "META_GRAPH_VERSION expected in the base"
          lost = [n + ":" + k for n, k, val in keep if (v if n == "vars" else rt).get(k) != val]
          assert not lost, ("over-stripped META_/FACEBOOK_/INSTAGRAM_ keys", lost)
          print("FINAL_BINDINGS_RETIRED_META=PASS absent=" + ",".join(RETIRED) + " kept=" + ",".join(n + ":" + k for n, k, _ in keep))
          PY
          seed="$RUNNER_TEMP/seeded-verify-token"
          rm -rf "$seed" && mkdir -p "$seed"
          git archive HEAD worker | tar -x -C "$seed"
          git archive 83620c680958d726fc4b0fd16e2574cdcc362a6d public | tar -x -C "$seed"
          python3 - "$RUNNER_TEMP/base-83620c6.jsonc" "$seed/wrangler.central-fix.jsonc" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1]))
          c["vars"]["META_VERIFY_TOKEN"] = "dryrun-placeholder-verify-token"
          c["vars"].setdefault("ZEVANORY_RUNTIME_CONFIG", {})["META_VERIFY_TOKEN"] = "dryrun-placeholder-verify-token"
          open(sys.argv[2], "w").write(json.dumps(c, indent=2) + "\n")
          PY
          (cd "$seed" && python3 -B "$GITHUB_WORKSPACE/scripts/deploy/prepare-central-candidate.py" >/dev/null)
          python3 - "$seed/wrangler.central-fix.jsonc" <<'PY'
          import json, sys
          v = json.load(open(sys.argv[1]))["vars"]; rt = v.get("ZEVANORY_RUNTIME_CONFIG") or {}
          assert v.get("META_VERIFY_TOKEN") == "dryrun-placeholder-verify-token", "META_VERIFY_TOKEN stripped from vars"
          assert rt.get("META_VERIFY_TOKEN") == "dryrun-placeholder-verify-token", "META_VERIFY_TOKEN stripped from ZEVANORY_RUNTIME_CONFIG"
          assert not [k for bag in (v, rt) for k in bag if k in ("WHATSAPP_PHONE_NUMBER_ID", "META_WHATSAPP_IDENTITY_VERIFIED", "WHATSAPP_BRAND_IDENTITY_VERIFIED")]
          PY
          # Same candidate config + seeded token, bundled WITHOUT --keep-vars: the token must be in the final binding set.
          python3 - "$seed/wrangler.central-fix.jsonc" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))["vars"]
          c = json.load(open("wrangler.central-fix.jsonc"))
          c["vars"]["META_VERIFY_TOKEN"] = s["META_VERIFY_TOKEN"]
          c["vars"]["ZEVANORY_RUNTIME_CONFIG"]["META_VERIFY_TOKEN"] = s["ZEVANORY_RUNTIME_CONFIG"]["META_VERIFY_TOKEN"]
          open("wrangler.verify-token-probe.jsonc", "w").write(json.dumps(c, indent=2) + "\n")
          PY
          npx --yes wrangler@4.143.0 deploy --dry-run --strict --config wrangler.verify-token-probe.jsonc --outdir "$RUNNER_TEMP/central-dryrun-verify" 2>&1 | tee bindings-verify.txt
          grep -nE '(^|[^A-Z_])META_VERIFY_TOKEN([^A-Z_]|$)' bindings-verify.txt || { echo "::error title=FINAL_BINDINGS::META_VERIFY_TOKEN absent from the final binding set (over-stripping)"; exit 1; }
          if grep -nE "$retired" bindings-verify.txt; then echo "::error title=FINAL_BINDINGS::retired WhatsApp Cloud API setting in the probe binding set"; exit 1; fi
          rm -f wrangler.verify-token-probe.jsonc
          echo "FINAL_BINDINGS_META_VERIFY_TOKEN=PASS present (seeded pinned base, generator + dry-run without --keep-vars)"
      - name: Evidence of the bundled candidate (fails if nothing was built)
        run: |
          set -euo pipefail
          bundle="$(find "$RUNNER_TEMP/central-dryrun" -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \) -printf '%s %p\n' | sort -nr | head -1)"
          test -n "$bundle"
          bytes="${bundle%% *}"
          test "$bytes" -gt 100000
          echo "::notice title=CENTRAL_DRYRUN::{\"sha\":\"${{ github.event.pull_request.head.sha || github.sha }}\",\"crons\":$(cat central-crons.json),\"bundleBytes\":$bytes,\"bundle\":\"$(basename "${bundle#* }")\"}"
