name: ZEVANORY central candidate dry-run (PR)
# Pre-merge twin of the "Reconstruct exact production candidate" step of
# central-production-deploy.yml: same pinned base (83620c68), same scripts, then
# `wrangler deploy --dry-run --strict`. No secrets, no Cloudflare authentication, no
# publication: the dry-run only bundles and validates the configuration (crons included).
# The canonical publisher is untouched and still runs its own dry-run before deploying.
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "worker/**"
      - "scripts/deploy/**"
      - "public/**"
      - "admin.css"
      - "assets/brand/**"
      - "sales-public/brand/**"
      - ".github/workflows/central-production-deploy.yml"
      - ".github/workflows/central-candidate-dryrun.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: central-candidate-dryrun-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct the candidate exactly like the publisher (placeholders, sales closed)
        env:
          PUBLIC_OWNER_ACCOUNT_ID: "00000000000000000000000000000000"
          TARGET_RUNTIME_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ZEVANORY_LAUNCH_AUTHORIZATION: ""
          MERCADOPAGO_PRODUCTION_ACCOUNT_HASH16: ""
          MERCADOPAGO_PRODUCTION_WEBHOOK_VERIFIED: ""
        run: |
          set -euo pipefail
          git fetch origin final-83620c6 || true
          mv public public.checkout-original 2>/dev/null || true
          git archive 83620c680958d726fc4b0fd16e2574cdcc362a6d public | tar -x
          node scripts/deploy/materialize-control-plane.mjs
          cmp -s worker/live-recovered/control-plane-vnext.js public/control-plane-vnext.js
          cp admin.css public/admin.css
          python3 scripts/deploy/write-build-info.py
          git show 83620c680958d726fc4b0fd16e2574cdcc362a6d:wrangler.jsonc > wrangler.central-fix.jsonc
          python3 scripts/deploy/prepare-central-candidate.py
          python3 scripts/deploy/copy-brand-export.py
          node --check worker/cloudflare-worker.compat.mjs
      - name: No WhatsApp alias in the generated candidate (real pinned base 83620c6; PR #896)
        # The pinned base wrangler.jsonc still carries SUPPORT_CHANNEL with the legacy number; the generator
        # must strip it. Same banned set as tests/whatsapp-config-absence.test.mjs.
        run: |
          set -euo pipefail
          if grep -nEi 'SUPPORT_CHANNEL|ZEVANORY_WHATSAPP_|wa\.me|9?9254-?5413|9234-?0423' wrangler.central-fix.jsonc; then
            echo "::error title=WHATSAPP_ALIAS_IN_CANDIDATE::generated wrangler.central-fix.jsonc carries a retired WhatsApp alias"; exit 1
          fi
          echo "::notice title=WHATSAPP_ALIAS_IN_CANDIDATE::absent"
      - name: No WhatsApp contact in the built public assets (frozen 83620c6 snapshot + overlays; PR #896)
        # Strict from #896 on: the apex public/ tree is the frozen snapshot, not the page sources #892 cleans,
        # and the generator already neutralized it. Re-scans the FINAL tree (after copy-brand-export.py).
        run: python3 -B scripts/deploy/public_whatsapp_scan.py public
      - name: Crons of the candidate (declared list, at most 5 per account)
        run: |
          python3 - <<'PY'
          import json, re, pathlib
          crons = json.load(open("wrangler.central-fix.jsonc")).get("triggers", {}).get("crons", [])
          print("CENTRAL_CANDIDATE_CRONS=" + json.dumps(crons))
          src = pathlib.Path("scripts/deploy/prepare-central-candidate.py").read_text(encoding="utf-8")
          m = re.search(r"CENTRAL_CRONS=(\[[^\]]+\])", src)
          if m: assert crons == json.loads(m.group(1)), ("candidate crons differ from CENTRAL_CRONS", crons)
          assert 0 < len(crons) <= 5, crons
          assert len(set(crons)) == len(crons), ("duplicate cron", crons)
          assert all(len(c.split()) == 5 for c in crons), ("cron must have 5 fields", crons)
          open("central-crons.json", "w").write(json.dumps(crons))
          PY
      - name: Wrangler dry-run (strict, no authentication, no publication)
        run: npx --yes wrangler@4.143.0 deploy --dry-run --strict --keep-vars --config wrangler.central-fix.jsonc --outdir "$RUNNER_TEMP/central-dryrun"
      - name: Final binding set WITHOUT --keep-vars (what the real deploy publishes; PR #896, AVAL Sol 125)
        # central-production-deploy.yml deploys WITHOUT --keep-vars, so the Worker ends with exactly the vars of
        # wrangler.central-fix.jsonc. Bundle that exact set and inspect it: WHATSAPP_SALES_ENABLED must be "false"
        # and no SUPPORT_CHANNEL / ZEVANORY_WHATSAPP_* binding may exist (top level or compact runtime config).
        run: |
          set -euo pipefail
          npx --yes wrangler@4.143.0 deploy --dry-run --strict --config wrangler.central-fix.jsonc --outdir "$RUNNER_TEMP/central-dryrun-nokeep" 2>&1 | tee bindings.txt
          line="$(grep -E 'WHATSAPP_SALES_ENABLED' bindings.txt || true)"
          echo "WHATSAPP_SALES_ENABLED binding: ${line:-<absent>}"
          [ -n "$line" ] || { echo "::error title=FINAL_BINDINGS::WHATSAPP_SALES_ENABLED absent from the final binding set"; exit 1; }
          echo "$line" | grep -q 'false' && ! echo "$line" | grep -qi 'true' || { echo "::error title=FINAL_BINDINGS::WHATSAPP_SALES_ENABLED is not \"false\": $line"; exit 1; }
          if grep -nE 'SUPPORT_CHANNEL|ZEVANORY_WHATSAPP_' bindings.txt; then echo "::error title=FINAL_BINDINGS::retired WhatsApp alias in the final binding set"; exit 1; fi
          python3 - <<'PY'
          import json
          v = json.load(open("wrangler.central-fix.jsonc"))["vars"]
          rt = v.get("ZEVANORY_RUNTIME_CONFIG") or {}
          assert v.get("WHATSAPP_SALES_ENABLED") == "false", ("WHATSAPP_SALES_ENABLED", v.get("WHATSAPP_SALES_ENABLED"))
          assert "WHATSAPP_SALES_ENABLED" not in rt, "WHATSAPP_SALES_ENABLED must not hide in the runtime config"
          bad = [k for bag in (v, rt) for k in bag if k == "SUPPORT_CHANNEL" or k.startswith("ZEVANORY_WHATSAPP_")]
          assert not bad, ("retired WhatsApp alias in final vars", bad)
          print("FINAL_BINDINGS_WHATSAPP=PASS WHATSAPP_SALES_ENABLED=false aliases=none")
          PY
      - name: Evidence of the bundled candidate (fails if nothing was built)
        run: |
          set -euo pipefail
          bundle="$(find "$RUNNER_TEMP/central-dryrun" -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \) -printf '%s %p\n' | sort -nr | head -1)"
          test -n "$bundle"
          bytes="${bundle%% *}"
          test "$bytes" -gt 100000
          echo "::notice title=CENTRAL_DRYRUN::{\"sha\":\"${{ github.event.pull_request.head.sha || github.sha }}\",\"crons\":$(cat central-crons.json),\"bundleBytes\":$bytes,\"bundle\":\"$(basename "${bundle#* }")\"}"
