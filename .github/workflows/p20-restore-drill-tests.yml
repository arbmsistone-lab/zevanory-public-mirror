name: p20-restore-drill-tests

# P20 (Roteiro Mestre v4.7, seção 9.1): testes do ensaio mensal de restauração completa. Evidência SINTETICA.
# Só pull_request: nunca dispara no merge, nenhum segredo, nenhuma requisição à produção, nunca escreve no ramo de
# evidência. (1) lógica (node, rede falsa, 12 testes do ensaio + 11 da cifragem AES-256-GCM + 8 da cópia KV -> Neon +
# 9 do diário D1 no ensaio = 40);
# (2) ponta a ponta num PostgreSQL efêmero: o CÓDIGO REAL do Worker (worker/data-backup.mjs) grava o backup (em claro e
# cifrado, chave sintética) num KV em memória e o ensaio restaura TUDO num banco p20_drill* com contagem e hash de
# conteúdo por tabela, inclusive a cópia KV -> Neon (zevanory_kv_backup), relida do Postgres e conferida chave a chave
# com TTL e metadados num KV reconstruído, e os eventos posteriores à cópia reconstruídos a partir do diário D1 em
# p20_diario_reconstruido (10 + 3 = 13 testes); (3) mutantes causais pelo classificador compartilhado (61 da cópia KV e cifragem + 22 do diário D1 = 83, todos KILLED).
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - ".github/workflows/p20-restore-drill-tests.yml"
      - ".github/workflows/p20-monthly-restore-drill.yml"
      - "scripts/p20/**"
      - "scripts/b0/**"
      - "docs/p20/**"
      - "docs/b0/**"
      - "tests/p20-restore-drill.test.mjs"
      - "tests/p20-backup-encryption.test.mjs"
      - "tests/p20-kv-copy-drill.test.mjs"
      - "tests/p20-diario-ensaio.test.mjs"
      - "tests/helpers/p20_diario_fixture.mjs"
      - "tests/helpers/d1-sqlite.mjs"
      - "worker/diario-p20.mjs"
      - "worker/diario-sombra.mjs"
      - "worker/diario-reconcilia.mjs"
      - "migrations/d1/**"
      - "tests/test_p20_restore_drill.py"
      - "tests/b0-baseline.test.mjs"
      - "tests/helpers/p20-backup-fixture.mjs"
      - "tests/helpers/p20_worker_backup_fixture.mjs"
      - "scripts/ci/mutants_p20_restore_drill.py"
      - "scripts/ci/mutants_p20_restore_drill_allow.json"
      - "scripts/ci/mutant_classifier.py"
      - "scripts/ops/restore_new_database.py"
      - "scripts/ops/backup_preserve_archive.py"
      - "worker/data-backup.mjs"
      - "worker/diario-p20.mjs"
      - "worker/diario-sombra.mjs"
      - "worker/diario-reconcilia.mjs"
      - "worker/backup-crypto.mjs"
      - "db/migrations/**"

permissions:
  contents: read

jobs:
  tests:
    name: p20-restore-drill / tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: p20-ci-local-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lógica do ensaio, da cifragem, da cópia KV -> Neon e do diário D1 (contagem exata 40, zero pulados)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/p20-restore-drill.test.mjs tests/p20-backup-encryption.test.mjs tests/p20-kv-copy-drill.test.mjs tests/p20-diario-ensaio.test.mjs | tee /tmp/t.txt
          for l in "# tests 40" "# pass 40" "# fail 0" "# skipped 0" "# todo 0" "# cancelled 0"; do grep -qx "$l" /tmp/t.txt || { echo "::error::esperado '$l'"; exit 1; }; done
      - name: Ponta a ponta no PostgreSQL efêmero (código real do Worker -> ensaio completo)
        shell: bash
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: p20-ci-local-only
        run: |
          set -euo pipefail
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client > /dev/null
          python -m unittest -v tests/test_p20_restore_drill.py 2>&1 | tee /tmp/py.txt
          grep -qE '^Ran 13 tests' /tmp/py.txt && grep -qx 'OK' /tmp/py.txt || { echo "::error::esperados 13 testes OK sem pulos"; exit 1; }
          if grep -q 'skipped' /tmp/py.txt; then echo "::error::teste pulado"; exit 1; fi
      - name: Mutantes causais (todos precisam morrer)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/mutants_p20_restore_drill.py < /dev/null | tee /tmp/mut.txt
          echo "::notice title=P20_RESTORE_DRILL_MUTANTS::$(grep -E '^MUTANTS ' /tmp/mut.txt)"
          grep -qx "MUTANTS total=83 killed=83 survived=0 inconclusive=0" /tmp/mut.txt || { echo "::error::mutante sobreviveu ou contagem mudou"; exit 1; }
      - name: Sem bytecode rastreado
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files '*.pyc' '**/__pycache__/**')"
