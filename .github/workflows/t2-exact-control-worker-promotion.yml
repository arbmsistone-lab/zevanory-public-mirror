name: T2 exact control worker promotion

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: write   # only to REQUEST the canonical publisher (workflow_dispatch); no Cloudflare credential here

# T1 (plan 3.1): this scheduled reconciler is a REQUESTER, not a publisher. It never builds,
# never writes secrets and never deploys. When the panel's runtime source on main is ahead of
# production it dispatches the single canonical publisher (zpc-control-worker-deploy.yml), which
# re-runs the guard inside the panel queue, publishes and certifies by both sources.
concurrency:
  group: deploy-zevanory-product-control-portable
  cancel-in-progress: false
  queue: max

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether the canonical publisher must be requested
        id: source
        shell: bash
        env:
          ZPC_ROLLBACK_HOLD: ${{ vars.ZPC_ROLLBACK_HOLD }}
        run: |
          set -euo pipefail
          rm -rf /tmp/zpc-source
          git clone --quiet --filter=blob:none https://github.com/arbmsistone-lab/zevanory-product-control-edge.git /tmp/zpc-source
          git -C /tmp/zpc-source fetch --quiet origin main
          git -C /tmp/zpc-source checkout --quiet --detach origin/main
          SOURCE_SHA="$(git -C /tmp/zpc-source log -1 --format=%H -- cf-worker src public index.html package.json package-lock.json scripts/cloudflare-authoritative-repair.mjs)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          NEEDS=false
          if [ -n "$ZPC_ROLLBACK_HOLD" ]; then
            echo "::notice title=ZPC_ROLLBACK_HOLD::reconciler paused: ${ZPC_ROLLBACK_HOLD:0:120}"
          else
            # Read-only pre-check from version.json; this job holds NO Cloudflare credential. The
            # canonical publisher decides again inside the queue with BOTH sources and refuses a mismatch.
            python3 scripts/deploy/promotion_guard.py --service zevanory-product-control-portable \
              --candidate "$SOURCE_SHA" --repo /tmp/zpc-source \
              --readback-url https://controle.zevanory.api.br/version.json --readback-path sha > /tmp/guard.txt || { cat /tmp/guard.txt; exit 1; }
            cat /tmp/guard.txt
            decision="$(sed -n 's/^PROMOTION_GUARD=//p' /tmp/guard.txt | jq -r .decision)"
            reason="$(sed -n 's/^PROMOTION_GUARD=//p' /tmp/guard.txt | jq -r .reason)"
            if [ "$decision" = promote ] && [ "$reason" = forward_of_live ]; then NEEDS=true; fi
          fi
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "needs_promotion=$NEEDS" >> "$GITHUB_OUTPUT"
          echo "ZPC_RECONCILE source=$SOURCE_SHA needs_promotion=$NEEDS"
      - name: Already synchronized
        if: steps.source.outputs.needs_promotion != 'true'
        run: echo "ZPC_PUBLIC_OWNER_RECONCILER=PASS already_synced=$SOURCE_SHA"
      - name: Request the canonical publisher
        if: steps.source.outputs.needs_promotion == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One request at a time: if a canonical run is already queued or running, it will publish
          # (or the next tick re-evaluates). skip_if_live makes a duplicate request a no-op.
          pending="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow zpc-control-worker-deploy.yml --limit 20 \
            --json status --jq '[.[] | select(.status != "completed")] | length')"
          if [ "$pending" != "0" ]; then
            echo "::notice title=ZPC_REQUEST_PENDING::$pending canonical run(s) not completed; not requesting again"
            exit 0
          fi
          gh workflow run zpc-control-worker-deploy.yml --repo "$GITHUB_REPOSITORY" --ref gh-pages \
            -f source_sha="$SOURCE_SHA" -f skip_if_live=true
          echo "::notice title=ZPC_PUBLISH_REQUESTED::canonical publisher requested for ${SOURCE_SHA:0:12}"
