name: Manual catalog voice cache warm
run-name: voice-warm:${{ inputs.cycle || github.sha }}
on:
  workflow_dispatch:
    inputs:
      cycle: {description: One-time cycle identifier, required: false, type: string}
      max_voices:
        description: 'Maximum new voices (1–10); stops at first quota'
        default: '10'
        required: true
permissions:
  contents: read
concurrency:
  group: voice-cache-warm
  cancel-in-progress: false
jobs:
  warm:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' && (github.run_attempt == 1) }}  # B01 patch 05b
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPERATOR_TOKEN: ${{ secrets.ZEVANORY_OPERATOR_TOKEN || secrets.CERTIFICATION_E2E_TOKEN || secrets.OPERATOR_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '1b26415802588185a86c1d4d3ebf5bdb'
      VOICE_WARM_MAX: ${{ inputs.max_voices }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
        with: {node-version: '22'}
      - name: Warm once, resume from existing KV entries
        shell: bash
        run: |
          set -euo pipefail
          node scripts/voice_cache_warm.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: voice-cache-warm-evidence
          path: /tmp/voice-warm/summary.json
          retention-days: 30
