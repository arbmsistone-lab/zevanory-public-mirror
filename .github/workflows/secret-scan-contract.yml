name: secret-scan-contract

# T5: runs the secret-scan contract on the PR's own checkout. Tamper-evident only:
# the test file's SHA-256 is checked first, but a PR can change both. The
# authoritative check is secret-scan-contract-protected.yml (base contract judges
# the PR's files as data). No filters, no job-level if; never fires on merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Secret scan workflow contract (offline)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          echo "20063d13160afc7c8f6cb1caaf9831556b70207789990435ce2c0f98e1fd3b93  tests/test_secret_history_scan_workflow.py" | sha256sum -c -
          if ! python3 -c "import yaml" 2>/dev/null; then python3 -m pip install --quiet --user --break-system-packages "pyyaml==6.0.2"; fi
          python3 -m unittest discover -v -s tests -p test_secret_history_scan_workflow.py 2>&1 | tee /tmp/contract.txt
          grep -qx "Ran 19 tests in .*" /tmp/contract.txt
          grep -qx "OK" /tmp/contract.txt
