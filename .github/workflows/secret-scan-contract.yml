name: secret-scan-contract

# T5: guards the public full-history secret scan against regressions (unpinned
# :latest scanners, lost schedule/push triggers, undocumented ignore entries).
# Only pull_request: never fires on merge, uses no secret, no network beyond checkout.
on:
  pull_request:
    paths:
      - ".github/workflows/secret-history-scan.yml"
      - ".github/workflows/secret-scan-contract.yml"
      - ".gitleaksignore"
      - "docs/security/secret-scan-baseline.md"
      - "tests/test_secret_history_scan_workflow.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Secret scan workflow contract (offline)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --user --break-system-packages "pyyaml==6.0.2"
          python3 -m unittest tests.test_secret_history_scan_workflow -v 2>&1 | tee /tmp/contract.txt
          grep -qx "Ran 10 tests in .*" /tmp/contract.txt || { echo "::error::test count differs from 10"; exit 1; }
          if grep -q "skipped" /tmp/contract.txt; then echo "::error::skipped tests"; exit 1; fi
