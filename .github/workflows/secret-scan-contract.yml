name: secret-scan-contract

# T5: guards the public full-history secret scan against regressions (unpinned
# scanners, lost or narrowed triggers, soft-failing steps, repository gitleaks
# configuration, undocumented ignore entries). The same test also runs as the
# first step of the scan job itself, so deleting this file does not disable it.
# Only pull_request: never fires on merge, uses no secret, no network beyond checkout.
on:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Secret scan workflow contract (offline)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          if ! python3 -c "import yaml" 2>/dev/null; then python3 -m pip install --quiet --user --break-system-packages "pyyaml==6.0.2"; fi
          python3 -m unittest discover -v -s tests -p test_secret_history_scan_workflow.py 2>&1 | tee /tmp/contract.txt
          grep -qx "Ran 28 tests in .*" /tmp/contract.txt
          grep -qx "OK" /tmp/contract.txt
