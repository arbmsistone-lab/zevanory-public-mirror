name: R111 publisher secret names guard (offline)
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "scripts/deploy/worker_secret_name_guard.py"
      - "tests/test_worker_secret_name_guard.py"
      - ".github/workflows/zpc-control-worker-deploy.yml"
      - ".github/workflows/r111-worker-secret-names-gate.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Name-only guard unit tests (no Cloudflare token)
        run: python3 -m unittest discover -s tests -p test_worker_secret_name_guard.py -v
      - name: Confirm pre-deploy guard precedes Wrangler publish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/zpc-control-worker-deploy.yml').read_text()
          a=w.find('R111 fail closed on passphrase secret names before Wrangler deploy')
          b=w.find('Promote exact main SHA and verify production')
          c=w.find('R111 verify secret names survived Wrangler deploy')
          assert -1 not in (a,b,c) and a < b < c, 'R111 secret guard must surround publication'
          assert 'worker_secret_name_guard.py' in w
          print('R111_WORKFLOW_ORDER_PASS')
          PY
