name: ZEVANORY staged launch configuration safety
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "scripts/deploy/prepare-central-candidate.py"
      - "scripts/launch_config_contract.py"
      - ".github/workflows/staged-launch-config-safety.yml"
      - "worker/sales-control.mjs"
      - "worker/commercial-metrics-projection.mjs"
      - "worker/owner-alerts.mjs"
      - "worker/cloudflare-worker.compat.mjs"
      - ".github/workflows/zevanory-three-provider-quorum.yml"
permissions:
  contents: read
jobs:
  stage-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate future production configuration stays owner-gated
        run: python3 scripts/launch_config_contract.py
      - name: Launch transition behaviour (owner authorization, derived release, stale-proof alert)
        run: node --test tests/sales-control.test.mjs tests/live-runtime-status.test.mjs tests/commercial-metrics-projection.test.mjs tests/owner-alert-policy.test.mjs
      - name: Enforce zero paid dependencies
        run: python3 scripts/zero_cost_guard.py
