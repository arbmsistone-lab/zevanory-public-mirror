name: Cancel superseded WhatsApp proof
on:
  pull_request:
    branches: [gh-pages]
    paths: ['.github/workflows/whatsapp-owner-evidence.yml']
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Cancel only the proof awaiting the unpublished superseded SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const base='https://api.github.com/repos/arbmsistone-lab/zevanory-public-mirror/actions/runs/37240044513';
          const headers={authorization:'Bearer '+process.env.GH_TOKEN,'accept':'application/vnd.github+json'};
          const r=await fetch(base,{headers});if(!r.ok)throw Error('run_read_http_'+r.status);
          const run=await r.json();
          if(run.head_sha!=='2034f4e0eb320898db43bde4c9e024bca3ef957e'||run.name!=='WhatsApp delivery recovery and real proofs')throw Error('superseded_run_identity_mismatch');
          if(run.status!=='completed'){
           const c=await fetch(base+'/cancel',{method:'POST',headers});if(c.status!==202&&c.status!==409)throw Error('cancel_http_'+c.status);
           console.log(JSON.stringify({cancel_requested:true,run_id:run.id,status:c.status}));
          }else console.log(JSON.stringify({already_completed:true,run_id:run.id}));
          JS
