name: Support quality evaluation (weekly)

# The real attendant answers 15 real customer questions on the free Workers AI quota;
# accuracy, safety, forbidden promises and brevity are scored. Zero cost.
on:
  schedule:
    - cron: "50 9 * * 2"
  workflow_dispatch:
  pull_request:
    branches: [gh-pages]
    paths: ["worker/whatsapp-conversation.mjs", "worker/support-knowledge.mjs", "scripts/audit/support-eval.mjs"]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/support-eval.test.mjs
      - name: Evaluate with the real model (main branch only writes the result)
        if: github.event_name != 'pull_request'
        run: node scripts/audit/support-eval.mjs
