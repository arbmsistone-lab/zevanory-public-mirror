name: Support quality evaluation (weekly)

# Contract tests of the support evaluation. The real evaluation runs weekly inside the
# production Worker (Workers AI binding) and writes KV zpc:support:v1:eval.
on:
  schedule:
    - cron: "50 9 * * 2"
  workflow_dispatch:
  pull_request:
    branches: [gh-pages]
    paths: ["worker/whatsapp-conversation.mjs", "worker/support-knowledge.mjs", "scripts/audit/support-eval.mjs"]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/support-eval.test.mjs
