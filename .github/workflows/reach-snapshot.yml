name: Reach snapshot (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: "40 10 * * 1"
permissions:
  contents: read
jobs:
  snapshot:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: "22"
      - run: node scripts/audit/reach-snapshot.mjs
