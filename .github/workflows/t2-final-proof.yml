name: T2 final read-only proof
on:
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/t2-final-proof.yml"
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read artifacts status and one creative
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 2 https://zevanory.api.br/api/support/artifacts-status -o /tmp/artifacts.json
          echo 'T2_ARTIFACTS_STATUS_RAW<<JSON'
          cat /tmp/artifacts.json
          echo
          echo 'JSON'
          jq -e '.artifacts | length == 5 and all(.integrity == true)' /tmp/artifacts.json >/dev/null
          url='https://controle.zevanory.api.br/api/commercial/creative/assets/29e83a8a-9b24-4480-aefb-946396ebabe4.jpg'
          curl -fsS --retry 4 --retry-delay 2 "$url" -o /tmp/t2-creative.jpg
          file /tmp/t2-creative.jpg
          test -s /tmp/t2-creative.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: t2-final-proof-image
          path: /tmp/t2-creative.jpg
          retention-days: 1
          if-no-files-found: error
