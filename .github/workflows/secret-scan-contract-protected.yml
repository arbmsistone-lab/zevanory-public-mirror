name: secret-scan-contract-protected

# Base-controlled verdict for a pull request, end to end (GitHub Security Lab,
# "Preventing pwn requests": PR content is only ever inspected as data).
# - pull_request_target runs THIS workflow definition from the base branch.
# - Only base code runs: the base checkout's tests/test_secret_history_scan_workflow.py
#   (judges the PR's scan files) and scripts/ci/secret_scan.py (downloads the pinned
#   scanners, verifies tarball and binary SHA-256 before every invocation, and scans
#   the PR head's full history, commits, merges and binary blobs as text, with the
#   BASE .gitleaksignore; no TruffleHog verification calls driven by PR content).
# - Python runs isolated (-I/-P and -S): no site/sitecustomize, no PR paths on sys.path.
# - The PR head is fetched by SHA into a separate repository whose worktree is never
#   checked out (only an index is written for TruffleHog), and its tree is written to
#   ./pr with checkout-index for the contract to read as text/YAML. No hooks, filters,
#   submodules, LFS or actions/checkout of PR code (fork heads work).
# - No file under ./pr or the PR repository is executed, sourced, imported or used as
#   a local action; the contract test asserts this for future edits of this file.
# - permissions: contents: read; no secrets; no token persisted; no trigger filters
#   and no job-level if, so the check always reports a real result.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  protected-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted base (contract code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Fetch pull request head as data only
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init -q "$RUNNER_TEMP/pr-repo"
          git -C "$RUNNER_TEMP/pr-repo" fetch -q --no-tags "$REPO_URL" "+$HEAD_SHA:refs/heads/pr-head"
          test "$(git -C "$RUNNER_TEMP/pr-repo" rev-parse refs/heads/pr-head)" = "$HEAD_SHA"
          git -C "$RUNNER_TEMP/pr-repo" symbolic-ref HEAD refs/heads/pr-head
          git -C "$RUNNER_TEMP/pr-repo" read-tree refs/heads/pr-head
          mkdir "$GITHUB_WORKSPACE/pr"
          git --git-dir="$RUNNER_TEMP/pr-repo/.git" --work-tree="$GITHUB_WORKSPACE/pr" checkout-index -a
      - name: Validate PR secret-scan files with the base contract
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --target "$RUNNER_TEMP/pydeps" "pyyaml==6.0.2"
          cd base
          SCAN_CONTRACT_ROOT="$GITHUB_WORKSPACE/pr" PYTHONPATH="$RUNNER_TEMP/pydeps" python3 -P -S -m unittest discover -v -s tests -p test_secret_history_scan_workflow.py 2>&1 | tee "$RUNNER_TEMP/contract.txt"
          grep -qE "^Ran [0-9]+ tests in " "$RUNNER_TEMP/contract.txt"
          grep -qx "OK" "$RUNNER_TEMP/contract.txt"
      - name: Scan PR head history with base scanners
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 -I -S base/scripts/ci/secret_scan.py pr-head --repo "$RUNNER_TEMP/pr-repo" --rev "$HEAD_SHA" --ignore base/.gitleaksignore --out "$RUNNER_TEMP/verdict"
