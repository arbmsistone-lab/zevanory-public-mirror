name: secret-scan-contract-protected

# Validates a pull request's secret-scan files with the contract test taken from the
# BASE branch, so the PR under test cannot weaken the rules that judge it.
#
# Security design (pull_request_target WITHOUT executing PR code; GitHub Security Lab
# "Preventing pwn requests"):
# - pull_request_target runs THIS workflow definition from the base branch; a PR
#   cannot change these steps for its own run.
# - The contract code (tests/test_secret_history_scan_workflow.py) is checked out
#   from the base SHA and is the only code executed.
# - The PR head is NOT checked out with actions/checkout (which refuses fork PR heads
#   under pull_request_target). Its commit is fetched by SHA into a separate bare
#   repository and its tree is written with read-tree/checkout-index into ./pr as DATA only:
#   parsed as YAML (yaml.BaseLoader) or read as text. Nothing from ./pr is imported,
#   sourced, built, installed or executed, and ./pr is never on PYTHONPATH or the cwd.
#   No git hooks run (bare fetch + read-tree), no submodules, no LFS.
# - permissions: contents: read; no secrets referenced; no token persisted.
# - No trigger filters and no job-level if: the check always reports a real result.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  protected-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base (contract code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Fetch pull request head as data only
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init -q --bare "$RUNNER_TEMP/pr.git"
          git -C "$RUNNER_TEMP/pr.git" fetch -q --no-tags --depth=1 "$REPO_URL" "$HEAD_SHA"
          test "$(git -C "$RUNNER_TEMP/pr.git" rev-parse "$HEAD_SHA^{commit}")" = "$HEAD_SHA"
          mkdir "$GITHUB_WORKSPACE/pr"
          # read-tree + checkout-index: no hooks, no filters configured, no export-ignore/export-subst.
          git --git-dir="$RUNNER_TEMP/pr.git" --work-tree="$GITHUB_WORKSPACE/pr" read-tree "$HEAD_SHA"
          git --git-dir="$RUNNER_TEMP/pr.git" --work-tree="$GITHUB_WORKSPACE/pr" checkout-index -a
      - name: Validate PR secret-scan files with the base contract
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --target "$RUNNER_TEMP/pydeps" "pyyaml==6.0.2"
          cd base
          SCAN_CONTRACT_ROOT="$GITHUB_WORKSPACE/pr" PYTHONPATH="$RUNNER_TEMP/pydeps" python3 -P -m unittest discover -v -s tests -p test_secret_history_scan_workflow.py 2>&1 | tee "$RUNNER_TEMP/contract.txt"
          grep -qE "^Ran [0-9]+ tests in " "$RUNNER_TEMP/contract.txt"
          grep -qx "OK" "$RUNNER_TEMP/contract.txt"
