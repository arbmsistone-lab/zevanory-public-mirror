name: Cloudflare environment credential probe ZERO_SPEND

on:
  push:
    branches:
      - ops/cloudflare-env-probe-20260922
    paths:
      - ".github/workflows/cloudflare-env-credential-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      S1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      S2: ${{ secrets.CF_API_TOKEN }}
      S3: ${{ secrets.CLOUDFLARE_TOKEN }}
      V1: ${{ vars.CLOUDFLARE_API_TOKEN }}
      V2: ${{ vars.CF_API_TOKEN }}
      V3: ${{ vars.CLOUDFLARE_TOKEN }}
    steps:
      - name: Detect repository or organization credential route
        shell: bash
        run: |
          set -euo pipefail
          token="${S1:-}"
          [ -n "$token" ] || token="${S2:-}"
          [ -n "$token" ] || token="${S3:-}"
          [ -n "$token" ] || token="${V1:-}"
          [ -n "$token" ] || token="${V2:-}"
          [ -n "$token" ] || token="${V3:-}"
          if [ -z "$token" ]; then
            echo "CF_REPOSITORY_SCOPE_ROUTE=ABSENT"
            exit 23
          fi
          echo "::add-mask::$token"
          export CLOUDFLARE_API_TOKEN="$token"
          npx --yes wrangler@4.135.0 whoami
          echo "CF_REPOSITORY_SCOPE_ROUTE=AUTHENTICATED"

  production-environment:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      S1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      S2: ${{ secrets.CF_API_TOKEN }}
      S3: ${{ secrets.CLOUDFLARE_TOKEN }}
      V1: ${{ vars.CLOUDFLARE_API_TOKEN }}
      V2: ${{ vars.CF_API_TOKEN }}
      V3: ${{ vars.CLOUDFLARE_TOKEN }}
    steps:
      - name: Detect production environment credential route
        shell: bash
        run: |
          set -euo pipefail
          token="${S1:-}"
          [ -n "$token" ] || token="${S2:-}"
          [ -n "$token" ] || token="${S3:-}"
          [ -n "$token" ] || token="${V1:-}"
          [ -n "$token" ] || token="${V2:-}"
          [ -n "$token" ] || token="${V3:-}"
          if [ -z "$token" ]; then
            echo "CF_PRODUCTION_ENV_ROUTE=ABSENT"
            exit 24
          fi
          echo "::add-mask::$token"
          export CLOUDFLARE_API_TOKEN="$token"
          npx --yes wrangler@4.135.0 whoami
          echo "CF_PRODUCTION_ENV_ROUTE=AUTHENTICATED"
