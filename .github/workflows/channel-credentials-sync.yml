name: Channel credential bundle sync (no publishing)

# Rebuilds the single CHANNEL_CREDENTIALS_JSON binding from GitHub secrets
# (same builder as channel-production-bootstrap) WITHOUT publishing anything.
# Adds the Pinterest OAuth app id/secret used by the owner "Conectar" button.
# Values are never printed. Missing Telegram credentials abort (fail closed).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: channel-credentials-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
      PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
      PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Report presence by name only
        shell: bash
        run: |
          set -euo pipefail
          out=""
          for n in TELEGRAM_BOT_TOKEN TELEGRAM_CHANNEL_ID YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN PINTEREST_ACCESS_TOKEN PINTEREST_BOARD_ID PINTEREST_CLIENT_ID PINTEREST_CLIENT_SECRET; do
            if [ -n "${!n:-}" ]; then out="$out $n=set"; else out="$out $n=absent"; fi
          done
          echo "::notice title=CHANNEL_CREDENTIALS_PRESENCE::$out"
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${TELEGRAM_BOT_TOKEN:-}" && test -n "${TELEGRAM_CHANNEL_ID:-}"
      - name: Build and write the single binding
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/channels/build-credentials-json.mjs > /tmp/c.json
          trap 'rm -f /tmp/c.json' EXIT
          npx --yes wrangler@4.143.0 secret put CHANNEL_CREDENTIALS_JSON --name zevanory < /tmp/c.json >/dev/null
          echo "::notice title=CHANNEL_CREDENTIALS_SYNC::PASS (values never printed)"
