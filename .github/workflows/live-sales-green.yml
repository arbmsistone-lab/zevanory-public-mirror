name: ZEVANORY live sales green

on:
  pull_request:
    paths:
      - "scripts/live_sales_green_gate.py"
      - ".github/workflows/live-sales-green.yml"
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-sales-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate live sales readiness
        run: python scripts/live_sales_green_gate.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: live-sales-green-evidence
          path: evidence/live-sales-green-current.json
          if-no-files-found: error
