name: required-check-guard-selftest

# G4: reprodução da suíte do guarda (42 testes), dos autotestes do executor de mutantes e dos 38 mutantes, com
# classificação honesta (AVAL 090): baseline obrigatório; MORTO só por asserção em teste esperado; dependência ausente,
# import, sintaxe, timeout ou coleta -> INCONCLUSIVO (falha o job). INFORMATIVO: roda a versão do PR (pull_request),
# portanto não é evidência de controle. O controle é o job required-check-guard / protected-paths (pull_request_target).
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "scripts/ci/required_check_guard.py"
      - "scripts/ci/pr_files_to_lists.py"
      - "ops/owner-reserved-paths.json"
      - ".github/workflows/required-check-guard.yml"
      - ".github/workflows/required-check-guard-selftest.yml"
      - ".github/workflows/contra-auditoria-reavaliar.yml"
      - ".github/workflows/product-pages-premerge.yml"
      - ".github/workflows/required-status-compat.yml"
      - ".github/CODEOWNERS"
      - "tests/ci/test_required_check_guard.py"
      - "tests/ci/mutants_required_check_guard.py"
      - "tests/ci/test_mutants_runner.py"
      - "tests/ci/requirements-guard.txt"
      # NC-1006-02: T38 roda o gate de preço (node) sobre cópia do lead-magnet.mjs
      - "tests/governanca/**"
      - "worker/product-prices.mjs"
      - "worker/lead-magnet.mjs"
      - "data/products.json"
      - "data/affiliates.json"
      # contra-auditoria do #1008: T41 roda o gate de DDL (python + node) sobre cópia do affiliate-program.mjs
      - "scripts/ci/runtime_ddl_gate.py"
      - "scripts/ops/restore_new_database.py"
      - "worker/affiliate-program.mjs"
      - "worker/whatsapp-neon-store.mjs"

permissions:
  contents: read

jobs:
  selftest:
    name: required-check-guard / selftest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependências declaradas (tests/ci/requirements-guard.txt)
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet -r tests/ci/requirements-guard.txt
          python -I -c "import yaml; print('PyYAML', yaml.__version__)"
      - name: Suíte, autotestes do executor e mutantes
        run: |
          set -euo pipefail
          sha256sum scripts/ci/required_check_guard.py .github/workflows/required-check-guard.yml tests/ci/mutants_required_check_guard.py ops/owner-reserved-paths.json | tee -a "$GITHUB_STEP_SUMMARY"
          python -I -B tests/ci/test_required_check_guard.py . 2>&1 | tee /tmp/suite.txt
          grep -qE '^Ran 42 tests' /tmp/suite.txt || { echo "::error::suíte do guarda deveria rodar exatamente 42 testes"; exit 1; }
          python -I -B tests/ci/test_mutants_runner.py .
          python -I -B tests/ci/mutants_required_check_guard.py . | tee -a "$GITHUB_STEP_SUMMARY"
