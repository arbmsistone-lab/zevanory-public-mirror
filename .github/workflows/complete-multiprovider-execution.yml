name: ZEVANORY complete multiprovider execution gate
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "evidence/complete-multiprovider.json"
      - ".github/workflows/complete-multiprovider-execution.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed until three real administrative executors are proven
        run: |
          python3 - <<'PY'
          import json
          c=json.load(open("evidence/complete-multiprovider.json"))
          assert c["min_independent_executors"] == 3
          assert c["endpoint_health_does_not_count_as_execution"] is True
          xs=c["executors"]
          proven=[x for x in xs if x["status"]=="proven" and x["canary"]=="pass" and x["independent_control_plane"]]
          assert len(proven) >= 3, f"ADMIN_EXECUTION_QUORUM_NOT_PROVEN: {len(proven)}/3"
          assert c["final_green"] is True
          print("MULTI_PROVIDER_COMPLETE=GREEN")
          PY
