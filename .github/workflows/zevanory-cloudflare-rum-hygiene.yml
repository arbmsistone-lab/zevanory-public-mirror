name: ZEVANORY Cloudflare RUM hygiene
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - ".github/workflows/zevanory-cloudflare-rum-hygiene.yml"
      - ".github/workflows/zevanory-apex-engineering.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rum-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_ALT1: ${{ secrets.CF_API_TOKEN }}
      CF_TOKEN_ALT2: ${{ secrets.CLOUDFLARE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Disable automatic Cloudflare Web Analytics injection only for ZEVANORY
        run: |
          set -euo pipefail
          TOKEN="${CF_TOKEN_PRIMARY:-}"
          [ -n "$TOKEN" ] || TOKEN="${CF_TOKEN_ALT1:-}"
          [ -n "$TOKEN" ] || TOKEN="${CF_TOKEN_ALT2:-}"
          if [ -z "$TOKEN" ]; then
            echo "NO_CLOUDFLARE_TOKEN_AVAILABLE"
            exit 2
          fi
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse

          token=os.environ.get("CF_TOKEN_PRIMARY") or os.environ.get("CF_TOKEN_ALT1") or os.environ.get("CF_TOKEN_ALT2")
          base="https://api.cloudflare.com/client/v4"

          def call(path, method="GET", body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(
                  base+path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization":"Bearer "+token,
                      "Content-Type":"application/json",
                      "User-Agent":"ZEVANORY-RUM-Hygiene/1.0"
                  }
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  doc=json.loads(r.read().decode())
              if not doc.get("success",False):
                  raise SystemExit("Cloudflare API failure on "+path+": "+json.dumps(doc.get("errors",[])))
              return doc

          accounts=call("/accounts?per_page=50").get("result",[])
          if not accounts:
              raise SystemExit("No Cloudflare accounts visible to token")

          candidates=[]
          snapshots=[]
          for account in accounts:
              aid=account["id"]
              try:
                  sites=call(f"/accounts/{aid}/rum/site_info/list").get("result",[])
              except Exception as exc:
                  snapshots.append({"account_id":aid,"error":str(exc)})
                  continue
              for site in sites or []:
                  zone_name=((site.get("ruleset") or {}).get("zone_name") or "")
                  host=site.get("host") or ""
                  snippet=site.get("snippet") or ""
                  hay=" ".join([zone_name,host,snippet]).lower()
                  if "zevanory.api.br" in hay or zone_name.lower()=="api.br":
                      candidates.append((aid,site))
              snapshots.append({"account_id":aid,"sites":sites})

          open("cloudflare-rum-before.json","w").write(json.dumps(snapshots,indent=2,sort_keys=True))

          if not candidates:
              raise SystemExit("No ZEVANORY Web Analytics site found; refusing broad mutation")

          changed=[]
          for aid,site in candidates:
              sid=site.get("site_tag") or site.get("id")
              if not sid:
                  raise SystemExit("RUM site lacks stable identifier")
              before_auto=site.get("auto_install")
              if before_auto is False:
                  changed.append({"account_id":aid,"site_id":sid,"changed":False,"reason":"already_manual"})
                  continue
              body={"auto_install":False}
              if site.get("zone_tag"):
                  body["zone_tag"]=site["zone_tag"]
              if site.get("host"):
                  body["host"]=site["host"]
              updated=call(f"/accounts/{aid}/rum/site_info/{sid}","PUT",body).get("result",{})
              if updated.get("auto_install") is not False:
                  raise SystemExit("Cloudflare did not disable automatic RUM injection for "+sid)
              changed.append({"account_id":aid,"site_id":sid,"changed":True})

          open("cloudflare-rum-change.json","w").write(json.dumps(changed,indent=2,sort_keys=True))

          for attempt in range(12):
              req=urllib.request.Request(
                  "https://zevanory.api.br/solucoes?rum_hygiene_probe="+str(int(time.time())),
                  headers={"User-Agent":"ZEVANORY-RUM-Hygiene/1.0","Cache-Control":"no-cache"}
              )
              with urllib.request.urlopen(req,timeout=25) as r:
                  body=r.read().decode("utf-8","replace")
              if "static.cloudflareinsights.com/beacon" not in body:
                  print("PASS: Cloudflare automatic RUM injection absent")
                  break
              if attempt==11:
                  raise SystemExit("Cloudflare RUM injection still present after configuration change")
              time.sleep(5)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zevanory-cloudflare-rum-hygiene-evidence
          path: |
            cloudflare-rum-before.json
            cloudflare-rum-change.json
          retention-days: 90
