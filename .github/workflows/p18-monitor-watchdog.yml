name: P18 monitor watchdog (read-only)

# Auditoria Sol 246.09/246.14: vigia do monitor P18. Lê p18/heartbeat.json no ramo evidence/b0-baseline e acusa
# quando a última execução bem-sucedida do monitor tem mais de 15 min (ou o batimento falta/está malformado).
# Canal distinto do alerta de vendas: issue própria "[P18-VIGIA]" e o job termina com falha (notificação de falha
# de workflow agendado do GitHub). Não grava em ramo nenhum, não toca a produção, não usa segredo além do GITHUB_TOKEN.
# Limite: mesmo agendador do GitHub que o monitor; o gatilho independente fora do GitHub é passo do proprietário (PR).
#
# AVAL Sol 253/254: o vigia também lê p18/cf-dispatch.json (última execução pedida pelo cron da Cloudflare que
# INICIOU no runner). Com a variável de repositório P18_CF_DISPATCH_EXPECTED=true (passo do proprietário, só depois
# do deploy do Worker de controle com o token), > 15 min sem início pedido pela Cloudflare abre a issue própria
# "[P18-VIGIA] Gatilho Cloudflare parado" e falha o job. É assim que uma Cloudflare inteira parada é detectada,
# quando o GitHub roda o vigia; a Cloudflare, por sua vez, lê o batimento do monitor (os dois caminhos se cobrem).
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

permissions:
  contents: read    # ler p18/heartbeat.json do ramo de evidência
  issues: write     # a issue do vigia (título distinto da issue de vendas)

concurrency:
  group: p18-monitor-watchdog
  cancel-in-progress: false

jobs:
  watch:
    if: ${{ github.ref == 'refs/heads/gh-pages' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      EVIDENCE_BRANCH: evidence/b0-baseline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/b0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: "22"
      - name: Conferir o batimento do monitor P18 (falha o job quando velho > 15 min)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          P18_CF_DISPATCH_EXPECTED: ${{ vars.P18_CF_DISPATCH_EXPECTED }}
        run: node scripts/b0/p18-watchdog.mjs
