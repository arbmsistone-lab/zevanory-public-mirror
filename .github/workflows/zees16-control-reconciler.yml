name: ZEVANORY ZEES-16 control reconciler
on:
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/zees16-control-reconciler.yml"
  pull_request:
    branches: [gh-pages]
    paths:
      - "scripts/reconcile_zees16_control.mjs"
      - "worker/evidence-control-plane.mjs"
      - ".github/workflows/zees16-control-reconciler.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows:
      - "ZEVANORY central production deploy"
      - "ZEVANORY apex engineering gate"
      - "zevanory-remote-quality-gates"
      - "zevanory-p02-visual-regression"
      - "zevanory-p04-wcag"
      - "zevanory-p12-continuous-slo"
      - "zevanory-p15-provenance"
      - "ZEVANORY portable disaster recovery"
      - "ZEVANORY provider independence gate"
      - "ZEVANORY authenticated open-provider runtime quorum"
      - "ZEES-16 Evidence Gate"
      - "ZEA-10 external evidence pack"
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    concurrency:
      group: zees16-control-reconciler-${{ github.event.workflow_run.head_sha || github.sha }}
      cancel-in-progress: false
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'gh-pages') }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "1b26415802588185a86c1d4d3ebf5bdb"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve authoritative KV namespace
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory/settings" \
            -o /tmp/worker-settings.json
          test "$(jq -r '.success' /tmp/worker-settings.json)" = "true"
          KV_NAMESPACE_ID="$(jq -r '.result.bindings[] | select(.name=="ZEVANORY_PRIVATE_ARTIFACTS" and .type=="kv_namespace") | .namespace_id' /tmp/worker-settings.json | head -n1)"
          test -n "$KV_NAMESPACE_ID"
          test "$KV_NAMESPACE_ID" != "null"
          echo "KV_NAMESPACE_ID=$KV_NAMESPACE_ID" >> "$GITHUB_ENV"
          echo "KV_BINDING_RESOLUTION=PASS name=ZEVANORY_PRIVATE_ARTIFACTS"

      - name: Read previous materialized state
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "RECONCILE_PERSISTENCE_MODE=LOCAL_READ_ONLY"
            echo '{}' > previous-state.json
            exit 0
          fi
          echo "RECONCILE_PERSISTENCE_MODE=REMOTE_KV"
          npx --yes wrangler@4.135.0 kv key get "control:v2:state:zevanory" \
            --namespace-id "$KV_NAMESPACE_ID" --remote > previous-state.json 2>/dev/null || echo '{}' > previous-state.json
      - name: Wait for exact production SHA push workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(curl -fsS --max-time 20 https://zevanory.api.br/build-info.json | jq -r '.sha // empty')"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "RECONCILER_TARGET_SHA_INVALID"; exit 1; }
          echo "RECONCILER_TARGET_SHA=$TARGET_SHA"
          # Wait only for *push* runs on the SHA currently served in production.
          # An incomplete run is not interpreted as failed evidence.
          ready=0
          for attempt in $(seq 1 18); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=100")"
            total="$(jq --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .event=="push")] | length' <<< "$runs")"
            active="$(jq --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .event=="push" and .status!="completed")] | length' <<< "$runs")"
            echo "RECONCILER_PUSH_RUNS total=$total active=$active attempt=$attempt"
            if [ "$total" -gt 0 ] && [ "$active" -eq 0 ]; then ready=1; break; fi
            sleep 10
          done
          [ "$ready" = 1 ] || { echo "RECONCILER_EXACT_PUSH_RUNS_NOT_READY"; exit 1; }

      - name: Reconcile exact production evidence with one delayed retry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_STATE_PATH: previous-state.json
        shell: bash
        run: |
          set -euo pipefail
          # Reconciliation is fail-closed. A partial first observation is retried
          # ONCE after five minutes; it is never promoted as a 16/16 acceptance.
          first_ok=0
          if node scripts/reconcile_zees16_control.mjs; then
            if node --input-type=module -e '
              import fs from "node:fs";
              const s=JSON.parse(fs.readFileSync("zees16-state.json","utf8"));
              const c=s?.counts||{};
              process.exit(c.proven===16&&c.partial===0&&c.blocked===0&&c.na===0?0:1);
            '; then first_ok=1; fi
          fi
          if [ "$first_ok" = 1 ]; then
            echo "RECONCILER_FIRST_PASS=EXACT_16_OF_16"
          else
            echo "RECONCILER_FIRST_PASS=UNVERIFIED RETRY_AFTER_SECONDS=300"
            sleep 300
            # If evidence is still partial, the existing acceptance gate fails.
            node scripts/reconcile_zees16_control.mjs
            echo "RECONCILER_SECOND_ATTEMPT=COMPLETE_GATE_STILL_REQUIRED"
          fi
      - name: Persist KV cache
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          # KV write budget (Workers Free: 1,000 writes/day): skip both writes when the semantic
          # state (release, counts, pillars) is unchanged and the stored state is < 6 h old.
          UNCHANGED=$(node --input-type=module -e '
            import fs from "node:fs";
            const sem=s=>JSON.stringify({r:s?.release_sha||"",c:s?.counts||{},p:(s?.pillars||[]).map(x=>[x.id,x.state,(x.blockers||[]).join(",")])});
            let prev={};try{prev=JSON.parse(fs.readFileSync("previous-state.json","utf8"))}catch{}
            const next=JSON.parse(fs.readFileSync("zees16-state.json","utf8"));
            const age=Date.now()-Date.parse(prev?.observed_at||0);
            console.log(sem(prev)===sem(next)&&Number.isFinite(age)&&age<6*3600e3?"1":"0");')
          echo "ZEES16_SEMANTIC_UNCHANGED=$UNCHANGED" | tee -a "$GITHUB_ENV"
          if [ "$UNCHANGED" = "1" ]; then echo "KV_WRITES_SKIPPED=state_unchanged"; exit 0; fi
          EVENT_HASH=$(node -e "console.log(JSON.parse(require('fs').readFileSync('zees16-event.json','utf8')).event_hash)")
          OBSERVED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('zees16-event.json','utf8')).observed_at.replace(/[:.]/g,'-'))")
          EVENT_KEY="control:v2:ledger:zevanory:$OBSERVED:$EVENT_HASH"
          npx --yes wrangler@4.135.0 kv key put "$EVENT_KEY" --path zees16-event.json --namespace-id "$KV_NAMESPACE_ID" --remote
          npx --yes wrangler@4.135.0 kv key put "control:v2:state:zevanory" --path zees16-state.json --namespace-id "$KV_NAMESPACE_ID" --remote

      - name: Verify persisted KV state
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.135.0 kv key get "control:v2:state:zevanory" \
            --namespace-id "$KV_NAMESPACE_ID" --remote > persisted-state.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const expected=JSON.parse(fs.readFileSync("zees16-state.json","utf8"));
          const actual=JSON.parse(fs.readFileSync("persisted-state.json","utf8"));
          const unchanged = process.env.ZEES16_SEMANTIC_UNCHANGED === "1";
          if(!unchanged && actual?.decision_hash !== expected?.decision_hash) throw new Error("persisted decision hash mismatch");
          if(actual?.release_sha !== expected?.release_sha) throw new Error("persisted release SHA mismatch");
          const expectedCounts = {
            proven: Number(expected?.counts?.proven || 0),
            partial: Number(expected?.counts?.partial || 0),
            blocked: Number(expected?.counts?.blocked || 0),
            na: Number(expected?.counts?.na || 0),
          };
          const actualCounts = {
            proven: Number(actual?.counts?.proven || 0),
            partial: Number(actual?.counts?.partial || 0),
            blocked: Number(actual?.counts?.blocked || 0),
            na: Number(actual?.counts?.na || 0),
          };
          if(JSON.stringify(actualCounts) !== JSON.stringify(expectedCounts)) {
            throw new Error("persisted ZEES16 counts mismatch");
          }
          console.log("ZEES16_KV_PERSISTENCE=PASS", actualCounts, "SHA", actual.release_sha, "DECISION", actual.decision_hash);
          NODE
      - name: Preserve immutable reconciliation artifact
        uses: actions/upload-artifact@v4
        with:
          name: zees16-reconciliation-${{ github.run_id }}
          path: |
            zees16-event.json
            zees16-state.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail-closed acceptance
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const s=JSON.parse(fs.readFileSync("zees16-state.json","utf8"));
          const counts = {
            proven: Number(s?.counts?.proven || 0),
            partial: Number(s?.counts?.partial || 0),
            blocked: Number(s?.counts?.blocked || 0),
            na: Number(s?.counts?.na || 0),
          };
          const nonProven = s.pillars.filter(x=>x.state!=="PROVEN").map(x=>x.id+":"+x.state+":"+x.blockers.join(","));
          if(nonProven.length) console.error("ZEES16_NON_PROVEN_PILLARS", nonProven);
          if(!/^[0-9a-f]{64}$/.test(s.decision_hash)) throw new Error("decision hash invalid");
          if(!/^[0-9a-f]{40}$/.test(s.release_sha)) throw new Error("release SHA invalid");
          if(counts.proven!==16 || counts.partial!==0 || counts.blocked!==0 || counts.na!==0) {
            throw new Error("ZEES16 acceptance requires exact 16/16 GREEN");
          }
          console.log("ZEES16_STATE",counts,"SHA",s.release_sha,"DECISION",s.decision_hash);
          NODE
