name: ZEVANORY ZEES-16 control reconciler
on:
  push:
    branches: [gh-pages]
    paths:
      - ".github/workflows/zees16-control-reconciler.yml"
  pull_request:
    branches: [gh-pages]
    paths:
      - "scripts/reconcile_zees16_control.mjs"
      - "worker/evidence-control-plane.mjs"
      - ".github/workflows/zees16-control-reconciler.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows:
      - "ZEVANORY central production deploy"
      - "ZEVANORY apex engineering gate"
      - "zevanory-remote-quality-gates"
      - "zevanory-p02-visual-regression"
      - "zevanory-p04-wcag"
      - "zevanory-p12-continuous-slo"
      - "zevanory-p15-provenance"
      - "ZEVANORY portable disaster recovery"
      - "ZEVANORY provider independence gate"
      - "ZEVANORY authenticated three-provider runtime quorum"
      - "ZEES-16 Evidence Gate"
      - "ZEA-10 external evidence pack"
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: zees16-control-reconciler
  cancel-in-progress: true
jobs:
  reconcile:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "1b26415802588185a86c1d4d3ebf5bdb"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve authoritative KV namespace
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory/settings" \
            -o /tmp/worker-settings.json
          test "$(jq -r '.success' /tmp/worker-settings.json)" = "true"
          KV_NAMESPACE_ID="$(jq -r '.result.bindings[] | select(.name=="ZEVANORY_PRIVATE_ARTIFACTS" and .type=="kv_namespace") | .namespace_id' /tmp/worker-settings.json | head -n1)"
          test -n "$KV_NAMESPACE_ID"
          test "$KV_NAMESPACE_ID" != "null"
          echo "KV_NAMESPACE_ID=$KV_NAMESPACE_ID" >> "$GITHUB_ENV"
          echo "KV_BINDING_RESOLUTION=PASS name=ZEVANORY_PRIVATE_ARTIFACTS"

      - name: Read previous materialized state
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "RECONCILE_PERSISTENCE_MODE=LOCAL_READ_ONLY"
            echo '{}' > previous-state.json
            exit 0
          fi
          echo "RECONCILE_PERSISTENCE_MODE=REMOTE_KV"
          npx --yes wrangler@4.135.0 kv key get "control:v2:state:zevanory" \
            --namespace-id "$KV_NAMESPACE_ID" --remote > previous-state.json 2>/dev/null || echo '{}' > previous-state.json
      - name: Reconcile exact production evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_STATE_PATH: previous-state.json
        run: node scripts/reconcile_zees16_control.mjs
      - name: Persist KV cache
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          EVENT_HASH=$(node -e "console.log(JSON.parse(require('fs').readFileSync('zees16-event.json','utf8')).event_hash)")
          OBSERVED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('zees16-event.json','utf8')).observed_at.replace(/[:.]/g,'-'))")
          EVENT_KEY="control:v2:ledger:zevanory:$OBSERVED:$EVENT_HASH"
          npx --yes wrangler@4.135.0 kv key put "$EVENT_KEY" --path zees16-event.json --namespace-id "$KV_NAMESPACE_ID" --remote
          npx --yes wrangler@4.135.0 kv key put "control:v2:state:zevanory" --path zees16-state.json --namespace-id "$KV_NAMESPACE_ID" --remote

      - name: Verify persisted KV state
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.135.0 kv key get "control:v2:state:zevanory" \
            --namespace-id "$KV_NAMESPACE_ID" --remote > persisted-state.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const expected=JSON.parse(fs.readFileSync("zees16-state.json","utf8"));
          const actual=JSON.parse(fs.readFileSync("persisted-state.json","utf8"));
          if(actual?.decision_hash !== expected?.decision_hash) throw new Error("persisted decision hash mismatch");
          if(actual?.release_sha !== expected?.release_sha) throw new Error("persisted release SHA mismatch");
          if(Number(actual?.counts?.proven||0)!==16 || Number(actual?.counts?.partial||0)!==0 || Number(actual?.counts?.blocked||0)!==0) {
            throw new Error("persisted ZEES16 state is not 16/16 GREEN");
          }
          console.log("ZEES16_KV_PERSISTENCE=PASS", actual.counts, "SHA", actual.release_sha, "DECISION", actual.decision_hash);
          NODE
      - name: Preserve immutable reconciliation artifact
        uses: actions/upload-artifact@v4
        with:
          name: zees16-reconciliation-${{ github.run_id }}
          path: |
            zees16-event.json
            zees16-state.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail-closed acceptance
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const s=JSON.parse(fs.readFileSync("zees16-state.json","utf8"));
          if(s.counts.blocked>0) {
            console.error("ZEES16_BLOCKED_PILLARS",s.pillars.filter(x=>x.state==="BLOCKED").map(x=>x.id+":"+x.blockers.join(",")));
          }
          if(!/^[0-9a-f]{64}$/.test(s.decision_hash)) throw new Error("decision hash invalid");
          if(!/^[0-9a-f]{40}$/.test(s.release_sha)) throw new Error("release SHA invalid");
          console.log("ZEES16_STATE",s.counts,"SHA",s.release_sha,"DECISION",s.decision_hash);
          NODE
