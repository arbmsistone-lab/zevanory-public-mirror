name: ZEVANORY ZEES-16 control reconciler
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  final-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/final_public_readback.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zevanory-final-public-certification
          path: final-proof/**
          retention-days: 90
          if-no-files-found: error
