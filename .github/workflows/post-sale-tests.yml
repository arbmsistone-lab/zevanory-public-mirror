name: post-sale and funnel robot tests
on:
  pull_request:
    paths:
      - "worker/post-sale.mjs"
      - "worker/funnel.mjs"
      - "worker/sales-control.mjs"
      - "tests/sales-control.test.mjs"
      - "worker/sales-public-worker.mjs"
      - "tests/funnel.test.mjs"
      - "worker/lead-magnet.mjs"
      - "tests/lead-magnet.test.mjs"
      - "worker/reviews.mjs"
      - "tests/reviews.test.mjs"
      - "worker/cloudflare-worker.compat.mjs"
      - "tests/post-sale.test.mjs"
      - ".github/workflows/post-sale-tests.yml"
  push:
    branches: [gh-pages]
    paths:
      - "worker/post-sale.mjs"
      - "tests/post-sale.test.mjs"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check worker/post-sale.mjs
      - run: node --check worker/funnel.mjs
      - run: node --check worker/sales-public-worker.mjs
      - run: node --test tests/post-sale.test.mjs tests/funnel.test.mjs tests/lead-magnet.test.mjs tests/sales-control.test.mjs tests/reviews.test.mjs tests/sales-public-gzip.test.mjs
