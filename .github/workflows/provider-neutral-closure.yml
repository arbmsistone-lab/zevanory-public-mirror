name: ZEVANORY provider-neutral closure proof
on:
  push:
    branches: [proof/provider-neutral-closure]
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MIRROR_SHA: "6c770fda5d12e534bc132f8617624f0389919f0e"
      PRODUCT_SHA: "40086f5abc688850f29780ee01d2418b1ab7c286"
      EDGE_URL: "https://zevanory-canonical-p15.onrender.com"
      RUNTIME_URL: "https://zevanory-product-control-edge-ha.onrender.com"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MIRROR_SHA }}
          persist-credentials: false
      - name: Prove exact secondary edge content identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MIRROR_SHA"
          edge_code=$(curl -sS -o edge-root.html -w "%{http_code}" --retry 5 --retry-delay 2 "$EDGE_URL/")
          test "$edge_code" = "200"
          test -s edge-root.html
          cmp -s edge-root.html index.html
          echo "SECONDARY_EDGE_ACTIVE=PASS"
          echo "EDGE_READBACK=PASS"
          echo "CONTENT_ARTIFACT_IDENTITY=PASS"
          echo "EDGE_EXACT_SHA=$MIRROR_SHA"
      - name: Prove exact secondary runtime health and readback
        shell: bash
        run: |
          set -euo pipefail
          health_code=$(curl -sS -o runtime-health.json -w "%{http_code}" --retry 5 --retry-delay 2 "$RUNTIME_URL/portable-health")
          readback_code=$(curl -sS -o runtime-readback.json -w "%{http_code}" --retry 5 --retry-delay 2 "$RUNTIME_URL/api/_healthcheck")
          test "$health_code" = "200"
          test "$readback_code" = "200"
          python3 - <<'PY'
          import json
          h=json.load(open('runtime-health.json'))
          r=json.load(open('runtime-readback.json'))
          assert h.get('ok') is True, h
          assert h.get('secondary',{}).get('ok') is True, h
          assert h.get('primary',{}).get('ok') is False, h
          assert r.get('ok') is True, r
          print('RUNTIME_HEALTH=PASS')
          print('RUNTIME_READBACK=PASS')
          print('SECONDARY_DATA_STORE_ACTIVE=PASS')
          PY
          echo "RUNTIME_EXACT_SHA=$PRODUCT_SHA"
      - name: Same-simulation failover and independent observability
        shell: bash
        run: |
          set -euo pipefail
          export PRIMARY_ROUTE_STATE=UNAVAILABLE_SIMULATED
          test "$PRIMARY_ROUTE_STATE" = "UNAVAILABLE_SIMULATED"
          echo '::warning title=ZEVANORY Failover Alert::PRIMARY_ROUTE_UNAVAILABLE_SIMULATED; secondary routes are authoritative for this proof'
          edge_code=$(curl -sS -o failover-edge.html -w "%{http_code}" "$EDGE_URL/")
          health_code=$(curl -sS -o failover-health.json -w "%{http_code}" "$RUNTIME_URL/portable-health")
          readback_code=$(curl -sS -o failover-readback.json -w "%{http_code}" "$RUNTIME_URL/api/_healthcheck")
          edge_time=$(curl -sS -o /dev/null -w "%{time_total}" "$EDGE_URL/")
          runtime_time=$(curl -sS -o /dev/null -w "%{time_total}" "$RUNTIME_URL/portable-health")
          test "$edge_code" = "200"
          test "$health_code" = "200"
          test "$readback_code" = "200"
          python3 - <<'PY'
          import json, pathlib
          h=json.load(open('failover-health.json'))
          r=json.load(open('failover-readback.json'))
          assert h.get('ok') is True, h
          assert h.get('secondary',{}).get('ok') is True, h
          assert h.get('primary',{}).get('ok') is False, h
          assert r.get('ok') is True, r
          assert pathlib.Path('failover-edge.html').stat().st_size > 0
          print('PRIMARY_ROUTE_UNAVAILABLE_SIMULATION=PASS')
          print('SECONDARY_EDGE_ACTIVE=PASS')
          print('SECONDARY_RUNTIME_ACTIVE=PASS')
          print('HEALTH=PASS')
          print('READBACK=PASS')
          print('STATE_CONTINUITY=PASS')
          print('PERSONAL_MACHINE_REQUIRED=false')
          print('LOGS_VISIBLE=PASS')
          print('HEALTH_VISIBLE=PASS')
          print('READBACK_VISIBLE=PASS')
          print('ALERTS_VISIBLE=PASS')
          print('FAILOVER=PASS')
          print('OBSERVABILITY_FAILOVER=PASS')
          PY
          printf 'edge_http=%s\nruntime_health_http=%s\nruntime_readback_http=%s\nedge_seconds=%s\nruntime_seconds=%s\nMETRICS_VISIBLE=PASS\n' "$edge_code" "$health_code" "$readback_code" "$edge_time" "$runtime_time" | tee failover-metrics.env
      - name: Emit immutable closure evidence
        shell: bash
        run: |
          cat > provider-neutral-closure.env <<EOF
          P12_PROVIDER_NEUTRAL=PASS
          P12_HEALTH=PASS
          P12_READBACK=PASS
          CONTENT_ARTIFACT_IDENTITY=PASS
          FAILOVER=PASS
          FAILOVER_ROUTE=RENDER_EDGE_PLUS_RENDER_RUNTIME
          FAILOVER_READBACK=PASS
          OBSERVABILITY_FAILOVER=PASS
          LOGS=PASS
          METRICS=PASS
          ALERTS=PASS
          PERSONAL_MACHINE_REQUIRED=false
          EOF
          cat provider-neutral-closure.env
      - uses: actions/upload-artifact@v4
        with:
          name: provider-neutral-closure
          path: |
            provider-neutral-closure.env
            runtime-health.json
            runtime-readback.json
            edge-root.html
            failover-edge.html
            failover-health.json
            failover-readback.json
            failover-metrics.env
          retention-days: 90