name: Manual cached audio prefix repair
run-name: voice-repair:${{ inputs.cycle || github.sha }}
on:
  pull_request:
    branches: [gh-pages]
    paths: ['scripts/voice_cache_repair.mjs', '.github/workflows/voice-cache-repair.yml']
  workflow_dispatch:
    inputs:
      cycle: {description: One-time cycle identifier, required: false, type: string}
permissions:
  contents: read
  actions: write
concurrency:
  group: voice-cache-repair
  cancel-in-progress: false
jobs:
  warm:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' && (github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || (github.head_ref == 'fix/cache-leading-silence-20261005' && github.event.pull_request.head.repo.full_name == github.repository))) }}  # B01 patch 05b
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPERATOR_TOKEN: ${{ secrets.ZEVANORY_OPERATOR_TOKEN || secrets.CERTIFICATION_E2E_TOKEN || secrets.OPERATOR_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '1b26415802588185a86c1d4d3ebf5bdb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
        with: {node-version: '22'}
      - name: Validate and trim cached prefix without synthesis
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error title=CACHE_REPAIR_STEP::Command failed at line $LINENO (exit $?)"' ERR
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /tmp/ffmpeg-install.log 2>&1
          node scripts/voice_cache_repair.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: voice-cache-repair-evidence
          path: /tmp/voice-repair/
          retention-days: 30
      - name: Dispatch strict cache audit for current live release
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run whatsapp-operational-audit.yml --ref gh-pages -f cycle=repair-silence-${{ github.run_id }}
