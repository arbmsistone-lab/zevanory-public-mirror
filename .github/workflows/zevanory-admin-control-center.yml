name: ZEVANORY administrative control center gate
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "worker/admin-console.mjs"
      - "worker/cloudflare-worker.compat.mjs"
      - "worker/evidence-control-plane.mjs"
      - "worker/zea10-autonomy.mjs"
      - "worker/zevanory-control-core.mjs"
      - "worker/core-command-executor.mjs"
      - "worker/zea10-evaluator.mjs"
      - "admin.css"
      - "evidence/admin-control-center.json"
      - ".github/workflows/zevanory-admin-control-center.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-control:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify security contract
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync("evidence/admin-control-center.json","utf8"));
          if(c.auth.required!==true) throw new Error("auth must be required");
          if(c.auth.default_without_credentials!=="401 deny") throw new Error("missing-credential behavior must fail closed");
          if(c.destructive_actions!==false) throw new Error("destructive actions forbidden");
          if(c.architecture!=="event-sourced evidence control plane") throw new Error("control-plane architecture contract mismatch");
          if(c.ledger?.hash_chain!==true) throw new Error("ledger hash chain required");
          if(c.auto_reconciliation?.scheduled!==true) throw new Error("scheduled reconciliation required");
          if(c.public_indexing!==false) throw new Error("admin indexing must be disabled");
          const src=fs.readFileSync("worker/admin-console.mjs","utf8");
          for(const token of ["ZEVANORY_ADMIN_USERNAME","ZEVANORY_ADMIN_PASSWORD","cache-control","no-store","frame-ancestors 'none'","noindex,nofollow,noarchive"]){
            if(!src.includes(token)) throw new Error("missing security invariant: "+token);
          }
          if(/password\s*[:=]\s*["'][^"']+["']/i.test(src)) throw new Error("embedded password candidate");
          console.log("PASS: administrative security contract is fail-closed");
          JS
      - name: Exercise authentication and read-only snapshot
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { handleAdminRequest } from "./worker/admin-console.mjs";
          const status={
            project:"ZEVANORY",
            runtime:{sales:"globally-blocked",checkout:"enabled",financial:"enabled",whatsapp:"disabled"},
            channel_readiness:{zevanory:{scope_status:"active",release_gate:"globally-blocked",commercial_execution:"blocked"}}
          };
          const health={ready:true,checks:{database_reachable:true,schema_ready:true},schema:{required_tables:40,required_migrations:29,missing_tables_count:0,missing_migrations_count:0}};
          const control={global_state:"operational_commercial_blocked",root_blocker:"global_sale_disabled",policy:{claim_scope:"internal_engineering_alignment_not_external_certification",counts:{proven:0,partial:10},pillars:[]}};
          const continuity={quorum_ok:true,mode:"provider_independent",available_channels:["zevanory","email","instagram"],whatsapp_dependency_required:false};
          const core={
            schema:"zevanory-control-core/v1",
            authority:"server-side-core-only",
            fail_closed:true,
            ui_can_authorize:false,
            source_of_truth:true,
            generated_at:"2026-09-23T12:00:00Z",
            release_sha:"a".repeat(40),
            status,health,control,continuity,
            zees16:{counts:{proven:15,partial:1,blocked:0},pillars:[]},
            zea10:{counts:{proven:9,partial:1,blocked:0,unknown:0},pillars:[]},
            architecture:{flow:["runtime-ci","ZEES-16","ZEA-10","ZEVANORY Control Core","Admin"],circular_dependency:false},
            invariants:{exact_release_bound:true,health_ready:true,quorum_ok:true,sales_fail_closed:true,evidence_to_evaluation_unidirectional:true}
          };
          const fake={
            async fetch(req){
              const p=new URL(req.url).pathname;
              const body=p==="/api/core/v1/snapshot"?core:p==="/api/status"?status:p==="/api/health"?health:p==="/api/control-plane"?control:p==="/api/continuity"?continuity:null;
              return body?new Response(JSON.stringify(body),{status:200,headers:{"content-type":"application/json"}}):new Response("not found",{status:404});
            }
          };
          const env={ZEVANORY_ADMIN_USERNAME:"operator",ZEVANORY_ADMIN_PASSWORD:"A-very-strong-test-secret"};
          let r=await handleAdminRequest(new Request("https://example.test/admin"),env,{},fake);
          if(r.status!==401) throw new Error("unauthenticated request must be 401");
          r=await handleAdminRequest(new Request("https://example.test/admin",{headers:{authorization:"Basic "+Buffer.from("operator:wrong").toString("base64")}}),env,{},fake);
          if(r.status!==401) throw new Error("invalid credentials must be 401");
          const auth="Basic "+Buffer.from("operator:A-very-strong-test-secret").toString("base64");
          r=await handleAdminRequest(new Request("https://example.test/admin",{headers:{authorization:auth}}),env,{},fake);
          if(r.status!==200) throw new Error("valid admin page auth failed");
          const html=await r.text();
          if(!html.includes("Central Administrativa")||!html.includes("globally-blocked")) throw new Error("admin render incomplete");
          if(html.includes("A-very-strong-test-secret")) throw new Error("secret leaked into HTML");
          if(r.headers.get("cache-control")!=="no-store") throw new Error("admin HTML must not be cached");
          r=await handleAdminRequest(new Request("https://example.test/api/admin/snapshot",{headers:{authorization:auth}}),env,{},fake);
          if(r.status!==200) throw new Error("snapshot auth failed");
          const snap=await r.json();
          if(snap.health.schema.required_tables!==40||snap.status.runtime.sales!=="globally-blocked") throw new Error("snapshot mismatch");
          if(snap.core?.authority!=="server-side-core-only"||snap.core?.ui_can_authorize!==false||snap.core?.source_of_truth!==true) throw new Error("core authority contract mismatch");
          if(snap.core?.architecture?.circular_dependency!==false) throw new Error("circular dependency detected");
          if(!html.includes("ZEA-10 · Evaluation Plane")) throw new Error("admin must render canonical ZEA-10 evaluation plane");
          console.log("PASS: authentication, rendering and snapshot behavior verified");
          JS
      - name: Exercise ZEES-16 policy engine and immutable ledger
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { evaluatePolicy } from "./worker/evidence-control-plane.mjs";
          const okRun=name=>({name,conclusion:"success",id:1,html_url:"https://example.test/"+encodeURIComponent(name),updated_at:"2026-09-22T22:00:00Z"});
          const names=[
            "ZEVANORY apex engineering gate","zevanory-p02-visual-regression","zevanory-p04-wcag",
            "zevanory-p12-continuous-slo","zevanory-remote-quality-gates","ZEES-16 Evidence Gate",
            "zevanory-p15-provenance","ZEVANORY portable disaster recovery","ZEVANORY authenticated three-provider runtime quorum",
            "ZEVANORY provider independence gate","pages build and deployment",
            "ZEVANORY central production deploy"
          ];
          const workflows=new Map(names.map(n=>[n,okRun(n)]));
          const signals={
            "runtime:exact_sha":true,"runtime:health_ready":true,"runtime:telemetry_active":true,
            "runtime:quorum_ok":true,"runtime:sales_fail_closed":true,"runtime:commercial_release":false
          };
          const state=evaluatePolicy({signals,workflows,releaseSha:"a".repeat(40),observedAt:"2026-09-22T22:00:00Z"});
          if(state.counts.proven!==15||state.counts.partial!==1||state.counts.blocked!==0) throw new Error("unexpected ZEES state "+JSON.stringify(state.counts));
          const p16=state.pillars.find(x=>x.id==="P16");
          if(p16?.state!=="PARTIAL") throw new Error("P16 must stay fail-closed until commercial release");
          workflows.delete("zevanory-p04-wcag");
          const degraded=evaluatePolicy({signals,workflows,releaseSha:"a".repeat(40)});
          if(degraded.pillars.find(x=>x.id==="P04")?.state!=="BLOCKED") throw new Error("missing proof must downgrade P04");
          console.log("PASS: policy engine promotes and downgrades only from evidence");
          JS
      - name: Verify ZEES-16 to ZEA-10 unidirectional evaluation
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import { evaluateZea10FromZees16 } from "./worker/zea10-evaluator.mjs";
          const evidenceSource=fs.readFileSync("worker/evidence-control-plane.mjs","utf8");
          if(/zea10/i.test(evidenceSource)) throw new Error("ZEES-16 evidence layer must not depend on ZEA-10");
          const pillars=Array.from({length:16},(_,i)=>({id:"P"+String(i+1).padStart(2,"0"),state:"PROVADO",release_sha:"a".repeat(40)}));
          const zees={release_sha:"a".repeat(40),decision_hash:"deadbeef",pillars};
          const zea=evaluateZea10FromZees16(zees);
          if(zea.counts.proven!==10||zea.counts.partial!==0||zea.counts.blocked!==0||zea.counts.unknown!==0) throw new Error("full ZEES evidence must yield 10/10 ZEA evaluation");
          if(zea.authority!==false||zea.source_layer!=="ZEES-16") throw new Error("ZEA layer role contract mismatch");
          const degraded={...zees,pillars:pillars.map(p=>p.id==="P07"?{...p,state:"BLOCKED"}:p)};
          const degradedZea=evaluateZea10FromZees16(degraded);
          if(degradedZea.pillars.find(x=>x.id==="ZEA10-06")?.state!=="BLOCKED") throw new Error("blocked ZEES security proof must block ZEA10-06");
          console.log("PASS: ZEES-16 proof -> ZEA-10 evaluation is one-way and fail-closed");
          JS
      - name: Verify canonical Control Core authority
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { handleControlCoreRequest } from "./worker/zevanory-control-core.mjs";
          const coreState={
            schema:"zevanory-control-core/v1",
            core:"ZEVANORY-CONTROL-CORE/1.0",
            authority:"server-side-core-only",
            fail_closed:true,
            ui_can_authorize:false,
            source_of_truth:true,
            generated_at:"2026-09-23T12:00:00Z",
            release_sha:"a".repeat(40),
            status:{runtime:{sales:"globally-blocked"}},
            health:{ready:true,live:true},
            control:{global_state:"operational_commercial_blocked",policy:{counts:{proven:0}}},
            continuity:{quorum_ok:true},
            zees16:{counts:{proven:15,partial:1,blocked:0}},
            invariants:{exact_release_bound:true,health_ready:true,quorum_ok:true,sales_fail_closed:true}
          };
          const fake={
            async fetch(req){
              const p=new URL(req.url).pathname;
              if(p==="/api/status") return Response.json(coreState.status);
              if(p==="/api/health") return Response.json(coreState.health);
              if(p==="/api/control-plane") return Response.json(coreState.control);
              if(p==="/api/continuity") return Response.json(coreState.continuity);
              return new Response("not found",{status:404});
            }
          };
          const env={};
          let r=await handleControlCoreRequest(new Request("https://example.test/api/core/v1/authority"),env,{},fake);
          if(r.status!==200) throw new Error("authority endpoint failed");
          const authority=await r.json();
          if(authority.source_of_truth!==true||authority.ui_can_authorize!==false||authority.fail_closed!==true) throw new Error("authority contract mismatch");
          r=await handleControlCoreRequest(new Request("https://example.test/api/core/v1/commands"),env,{},fake);
          const commands=await r.json();
          if(commands.direct_ui_mutations!==false) throw new Error("UI mutation authority leaked");
          if(!commands.critical_mutations.every(x=>x.exposed===true)) throw new Error("critical commands must be exposed only through core policy");
          console.log("PASS: ZEVANORY Control Core is the sole critical state authority");
          JS
      - name: Verify canonical decision policy
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { evaluateCoreDecision } from "./worker/zevanory-control-core.mjs";
          const base={
            generated_at:"2026-09-23T13:00:00Z",
            release_sha:"a".repeat(40),
            invariants:{
              exact_release_bound:true,
              health_ready:true,
              quorum_ok:true,
              evidence_to_evaluation_unidirectional:true
            },
            zees16:{
              decision_hash:"deadbeef",
              counts:{proven:16,partial:0,blocked:0}
            },
            zea10:{
              evaluator:"ZEA-10/2026.09-evaluator-v1",
              counts:{proven:10,partial:0,blocked:0,unknown:0}
            }
          };
          let d=evaluateCoreDecision(base);
          if(d.decision!=="ALLOW"||d.eligible_for_critical_promotion!==true||d.blockers.length!==0) throw new Error("fully proven chain must be eligible");
          d=evaluateCoreDecision({...base,zea10:{...base.zea10,counts:{proven:9,partial:1,blocked:0,unknown:0}}});
          if(d.decision!=="DENY"||!d.blockers.includes("zea10_complete")) throw new Error("partial ZEA-10 must deny");
          d=evaluateCoreDecision({...base,zees16:{...base.zees16,counts:{proven:15,partial:1,blocked:0}}});
          if(d.decision!=="DENY"||!d.blockers.includes("zees16_complete")) throw new Error("partial ZEES-16 must deny");
          d=evaluateCoreDecision({...base,invariants:{...base.invariants,quorum_ok:false}});
          if(d.decision!=="DENY"||!d.blockers.includes("quorum_ok")) throw new Error("missing quorum must deny");
          console.log("PASS: Control Core authorizes only a complete one-way proof/evaluation chain");
          JS
      - name: Verify canonical UI source and critical command executor
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import { executeCoreCommand } from "./worker/core-command-executor.mjs";

          const ui=fs.readFileSync("worker/control-plane-vnext-source.mjs","utf8");
          if(!ui.includes("fetch('/api/core/v1/snapshot'")) throw new Error("control UI must consume canonical core snapshot");
          if(ui.includes("fetch('/api/control-plane'")) throw new Error("control UI must not consume legacy ZEA projection");
          if(!ui.includes("snapshot?.zea10")) throw new Error("control UI must render canonical ZEA-10 evaluation");

          class MemoryKV{
            constructor(){this.m=new Map();}
            async get(k){return this.m.has(k)?this.m.get(k):null;}
            async put(k,v){this.m.set(k,String(v));}
          }
          const kv=new MemoryKV();
          const env={ZEVANORY_PRIVATE_ARTIFACTS:kv};
          const snapshot={
            release_sha:"a".repeat(40),
            zees16:{decision_hash:"zees",counts:{proven:16,partial:0,blocked:0}},
            zea10:{source_decision_hash:"zea",counts:{proven:10,partial:0,blocked:0,unknown:0}}
          };
          const decision={decision:"ALLOW",eligible_for_critical_promotion:true,blockers:[]};

          let req=new Request("https://example.test/api/core/v1/commands/certification.promote",{
            method:"POST",
            headers:{"content-type":"application/json","idempotency-key":"certification-0001"},
            body:JSON.stringify({expected_release_sha:"a".repeat(40),reason:"verified evidence chain"})
          });
          let out=await executeCoreCommand({request:req,env,snapshot,decision,command:"certification.promote"});
          if(out.status!==200||out.body.applied!==true||out.body.state!=="CERTIFIED") throw new Error("certification promotion did not apply");

          req=new Request("https://example.test/api/core/v1/commands/certification.promote",{
            method:"POST",
            headers:{"content-type":"application/json","idempotency-key":"certification-0001"},
            body:JSON.stringify({expected_release_sha:"a".repeat(40)})
          });
          out=await executeCoreCommand({request:req,env,snapshot,decision,command:"certification.promote"});
          if(out.body.idempotent_replay!==true) throw new Error("critical command must be idempotent");

          req=new Request("https://example.test/api/core/v1/commands/commercial.enable",{
            method:"POST",
            headers:{"content-type":"application/json","idempotency-key":"commercial-enable-0001"},
            body:JSON.stringify({expected_release_sha:"a".repeat(40)})
          });
          out=await executeCoreCommand({request:req,env,snapshot,decision,command:"commercial.enable"});
          if(out.status!==503||out.body.decision!=="DENY"||out.body.error!=="runtime_command_executor_unavailable") throw new Error("commercial enable must fail closed without runtime adapter");

          const adapter={
            async fetch(){return Response.json({applied:true,provider:"test-runtime-adapter"});}
          };
          const envWithAdapter={...env,ZEVANORY_RUNTIME_COMMAND_EXECUTOR:adapter};
          req=new Request("https://example.test/api/core/v1/commands/commercial.enable",{
            method:"POST",
            headers:{"content-type":"application/json","idempotency-key":"commercial-enable-0002"},
            body:JSON.stringify({expected_release_sha:"a".repeat(40)})
          });
          out=await executeCoreCommand({request:req,env:envWithAdapter,snapshot,decision,command:"commercial.enable"});
          if(out.status!==200||out.body.applied!==true||out.body.execution?.runtime_effect!=="applied") throw new Error("commercial enable adapter path must apply only after ALLOW");

          console.log("PASS: canonical UI has no legacy ZEA source and critical commands are gated, idempotent and audited");
          JS
      - name: Remote Wrangler compile
        run: |
          set -euo pipefail
          cat > wrangler.admin-proof.jsonc <<'JSON'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "zevanory-admin-proof",
            "main": "worker/cloudflare-worker.compat.mjs",
            "compatibility_date": "2026-09-04",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "preview_urls": true
          }
          JSON
          rm -rf /tmp/zevanory-admin-proof
          npx --yes wrangler@4.135.0 deploy --dry-run --config wrangler.admin-proof.jsonc --outdir /tmp/zevanory-admin-proof
          test -n "$(find /tmp/zevanory-admin-proof -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \) -print -quit)"
          rm -f wrangler.admin-proof.jsonc
          echo "PASS: protected administrative control center compiles on clean remote runner"
      - name: Verify UI asset hygiene
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          css=Path("admin.css").read_text()
          assert "@media(max-width:900px)" in css
          assert "@media(max-width:620px)" in css
          assert "overflow:auto" in css
          assert "min-width:720px" in css
          assert len(css)<15000
          print("PASS: admin UI is compact, responsive and bounded")
          PY
