name: comprar-noindex-contract

# Auditor Sol (AVAL 100): /comprar/ em vendas.zevanory.api.br fica fora dos índices pela própria resposta
# (X-Robots-Tag "noindex, nofollow", Cache-Control "no-store", <meta name="robots" content="noindex,nofollow">),
# fora do sitemap e SEM Disallow no robots.txt (o Disallow impediria o rastreador de ver o noindex).
# Só pull_request: nunca dispara no merge, nunca usa segredo, sem rede além do checkout.
on:
  pull_request:
    paths:
      - ".github/workflows/comprar-noindex-contract.yml"
      - "tests/comprar-noindex.test.mjs"
      - "scripts/ci/mutants_comprar_noindex.py"
      - "tests/test_mutants_comprar_classifier.py"
      - "worker/sales-public-worker.mjs"
      - "worker/politica-unica.mjs"
      - "data/politica-unica.json"
      - "sales-worker.mjs"
      - "sales-public/**"
      - "sales-overlay/**"
      - "sitemap.xml"
      - "scripts/build_sales_public.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: /comprar/ noindex — contrato (offline)
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --test --test-reporter=tap tests/comprar-noindex.test.mjs 2>&1 | tee /tmp/comprar.txt
          # Contagem exata: teste removido, pulado ou pendente não pode passar despercebido.
          grep -qx "# tests 8" /tmp/comprar.txt || { echo "::error::contagem de testes diferente de 8"; exit 1; }
          grep -qx "# pass 8" /tmp/comprar.txt || { echo "::error::nem todos os 8 testes passaram"; exit 1; }
          grep -qx "# fail 0" /tmp/comprar.txt || { echo "::error::há testes falhando"; exit 1; }
          grep -qx "# skipped 0" /tmp/comprar.txt || { echo "::error::testes pulados"; exit 1; }
          grep -qx "# todo 0" /tmp/comprar.txt || { echo "::error::testes pendentes (todo)"; exit 1; }
          echo "::notice title=COMPRAR_NOINDEX_TESTS::$(grep -E '^# (tests|pass|fail|skipped|todo) ' /tmp/comprar.txt | paste -sd' ' -)"
      - name: Build de vendas reproduz o robots.txt e o sitemap versionados
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 scripts/build_sales_public.py
          git diff --exit-code -- sales-public/robots.txt sales-public/sitemap.xml || { echo "::error::sales-public/robots.txt ou sitemap.xml divergem do build"; exit 1; }

  # Cada mutante precisa ser morto pela asserção esperada (rótulo na saída), não por qualquer falha. Matriz Linux e
  # Windows (Git Bash, checkout com core.autocrlf=true => CRLF) em Node 22 e 24 (no 24 o reporter padrão é spec; o
  # script força TAP). Erro de infraestrutura sai como INCONCLUSIVE (exit 3), nunca KILLED nem SURVIVED.
  mutants:
    name: mutants (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Meta-testes do classificador de mutantes (AVAL Sol 125/128; exatamente 17)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_mutants_comprar_classifier.py < /dev/null 2>&1 | tr -d '\r' | tee meta.txt
          grep -qx 'Ran 17 tests in [0-9.]*s' meta.txt && grep -qx 'OK' meta.txt || { echo "::error::meta-testes do classificador: esperados 17 OK"; exit 1; }
          rm -f meta.txt
      - name: /comprar/ noindex — 18 mutantes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          set -euo pipefail
          echo "::notice title=AMBIENTE_MUTANTES::os=$RUNNER_OS node=$(node --version) python=$(python3 --version 2>&1) autocrlf=$(git config --get core.autocrlf || echo unset)"
          rc=0
          python3 scripts/ci/mutants_comprar_noindex.py < /dev/null > mutants.raw 2>&1 || rc=$?
          tr -d '\r' < mutants.raw | tee mutants.txt
          echo "::notice title=MUTANTS_COMPRAR_NOINDEX ($RUNNER_OS node ${{ matrix.node }})::$(grep '^MUTANT' mutants.txt | sed 's/ — .*//' | paste -sd'|' - | sed 's/|/%0A/g')%0Arc=$rc"
          if grep -q '^MUTANT .* INCONCLUSIVE' mutants.txt; then grep '^MUTANT .* INCONCLUSIVE' mutants.txt | while IFS= read -r l; do echo "::error title=INCONCLUSIVE::$l"; done; fi
          [ "$rc" = 0 ] || { echo "::error::script de mutantes saiu com $rc (1=sobrevivente, 2=baseline, 3=inconclusivo, 4=mapa recusado)"; exit 1; }
          n="$(grep -c '^MUTANT M[0-9]* KILLED' mutants.txt || true)"
          [ "$n" = "21" ] || { echo "::error::esperados 21 mutantes mortos, obtidos $n"; exit 1; }
          if grep -qE '^MUTANT M[0-9]* (SURVIVED|INCONCLUSIVE)' mutants.txt; then echo "::error::mutante sobrevivente ou inconclusivo"; exit 1; fi
          rm -f mutants.txt mutants.raw
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then echo "::error::arquivo versionado modificado pelos mutantes"; exit 1; fi
