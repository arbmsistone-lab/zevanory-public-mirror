name: ZEVANORY voice support engine gate
on:
  pull_request:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice-support:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate voice support invariants
        run: python scripts/voice_support_gate.py
      - name: Prove adversarial provider failover
        run: node scripts/voice_router_adversarial.mjs
