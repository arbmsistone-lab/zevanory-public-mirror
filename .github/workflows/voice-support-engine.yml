name: ZEVANORY voice support engine gate
on:
  pull_request:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate voice support invariants
        run: |
          python scripts/voice_support_gate.py
          python scripts/private_gemini_provisioning_gate.py
