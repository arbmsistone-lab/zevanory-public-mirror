name: Mercado Pago production token rotate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate-and-preflight:
    environment: producao-critica  # B01 M1: segredos só no Environment (gh-pages)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      # MP-01 (Sol, 21/10): fonte única. O nome antigo (PUBLIC_OWNER) não é mais lido aqui,
      # para que uma cópia antiga em algum escopo nunca tenha precedência sobre o token do Environment.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
      MERCADOPAGO_PROD_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_PROD_ACCESS_TOKEN }}
    steps:
      - name: Require and validate the production credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MERCADOPAGO_PROD_ACCESS_TOKEN:-}"
          code="$(curl -sS -o /tmp/mercadopago-user.json -w '%{http_code}' \
            -H "Authorization: Bearer $MERCADOPAGO_PROD_ACCESS_TOKEN" \
            -H 'accept: application/json' \
            https://api.mercadopago.com/users/me)"
          test "$code" = "200"
          jq -e '.site_id == "MLB" and ((.tags // []) | index("test_user") | not)' \
            /tmp/mercadopago-user.json >/dev/null
          echo "MERCADOPAGO_PRODUCTION_CREDENTIAL=PASS"
          # MP-02 (Sol, 21/10): além da identidade, provar leitura das operações financeiras que o Worker usa,
          # SEM criar nada: busca de pagamentos e meios de pagamento. Qualquer código diferente de 200 => para
          # antes de gravar o segredo (o Worker mantém o valor atual).
          for path in "/v1/payments/search?limit=1&sort=date_created&criteria=desc" "/v1/payment_methods"; do
            code="$(curl -sS -o /tmp/mp-check.json -w '%{http_code}' \
              -H "Authorization: Bearer $MERCADOPAGO_PROD_ACCESS_TOKEN" -H 'accept: application/json' \
              "https://api.mercadopago.com$path")"
            test "$code" = "200" || { echo "::error title=MP_OPERATIONAL_CHECK::$path http=$code"; exit 1; }
          done
          jq -e '(.results|type)=="array"' /tmp/mp-check.json >/dev/null 2>&1 || jq -e 'type=="array"' /tmp/mp-check.json >/dev/null
          echo "MERCADOPAGO_OPERATIONAL_READ=PASS"

      - name: Record the Worker version active before the rotation (rollback point)
        shell: bash
        run: |
          set -euo pipefail
          # Mesmo saneamento do #851: um token salvo com quebra de linha não pode quebrar a chamada.
          CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"; export CLOUDFLARE_API_TOKEN
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          # MP-03 (Sol, 21/10): ponto de retorno capturado ANTES do secret put.
          code="$(curl -sS -o /tmp/deployments.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory/deployments")"
          test "$code" = "200"
          prev="$(jq -r '[.result.deployments[0].versions[]?|select(.percentage==100)][0].version_id // empty' /tmp/deployments.json)"
          [[ "$prev" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error title=ROLLBACK_POINT::active version not resolvable"; exit 1; }
          echo "PREV_VERSION_ID=$prev" >> "$GITHUB_ENV"
          echo "ROLLBACK_POINT=$prev"

      - name: Rotate the exact production Worker secret
        shell: bash
        run: |
          set -euo pipefail
          # Mesmo saneamento do #851: um token salvo com quebra de linha não pode quebrar a chamada.
          CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"; export CLOUDFLARE_API_TOKEN
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          printf '%s' "$MERCADOPAGO_PROD_ACCESS_TOKEN" | \
            npx --yes wrangler@4.143.0 secret put MERCADOPAGO_ACCESS_TOKEN --name zevanory
          echo "ROTATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "WORKER_SECRET_ROTATION=PASS"
          echo "WORKER_SECRET_NAME=MERCADOPAGO_ACCESS_TOKEN"

      - name: Wait for the authoritative Worker preflight
        shell: bash
        run: |
          set -euo pipefail
          # Mesmo saneamento do #851: um token salvo com quebra de linha não pode quebrar a chamada.
          CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"; export CLOUDFLARE_API_TOKEN
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE_ID/values/zpc-sales-preflight:v1"
          deadline=$((SECONDS + 2400))
          fresh=0
          while (( SECONDS < deadline )); do
            code="$(curl -sS -o /tmp/zpc-sales-preflight.json -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$endpoint")"
            if [ "$code" = "200" ] && ROTATED_AT="$ROTATED_AT" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('/tmp/zpc-sales-preflight.json','utf8'));
          const generatedAt=String(raw?.generatedAt??raw?.generated_at??raw?.at??'');
          process.exit(Date.parse(generatedAt)>Date.parse(process.env.ROTATED_AT)?0:1);
          NODE
            then
              fresh=1
              break
            fi
            echo "PREFLIGHT_WAITING_FOR_WORKER=1"
            sleep 60
          done
          test "$fresh" = "1"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('/tmp/zpc-sales-preflight.json','utf8'));
          const generatedAt=String(raw?.generatedAt??raw?.generated_at??raw?.at??'');
          const rows=Array.isArray(raw?.checks)?raw.checks:[];
          console.log(JSON.stringify({generatedAt}));
          for(const row of rows)console.log(JSON.stringify({id:String(row?.id??''),ok:row?.ok===true,detail:String(row?.detail??'')}));
          const token=rows.find(row=>row?.id==='mercadopago_production_token');
          if(token?.ok!==true)throw new Error('mercadopago_production_token_not_ready');
          NODE

      - name: Automatic return to the previous Worker version after a post-write failure
        if: failure() && env.ROTATED_AT != '' && env.PREV_VERSION_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          # MP-03 (Sol, 21/10): falha DEPOIS do secret put => volta para a versão ativa antes da troca.
          # LIMITE DECLARADO: a documentação de rollbacks da Cloudflare não afirma se o valor do segredo volta
          # junto; por isso o resultado é NAO_COMPROVADO até o preflight confirmar e o proprietário recolocar o
          # token anterior, se ainda válido.
          # Mesmo saneamento do #851: um token salvo com quebra de linha não pode quebrar a chamada.
          CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"; export CLOUDFLARE_API_TOKEN
          npx --yes wrangler@4.143.0 rollback "$PREV_VERSION_ID" --name zevanory --message "MP rotation failed after secret put; return to $PREV_VERSION_ID" -y
          echo "::warning title=MP_ROTATION_ROLLED_BACK::worker returned to $PREV_VERSION_ID; secret value restoration NAO_COMPROVADO — check /api/health and the next preflight"

