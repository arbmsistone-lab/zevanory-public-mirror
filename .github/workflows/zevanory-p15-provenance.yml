name: zevanory-p15-provenance
on:
  pull_request:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve certified live release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Certified live SHA = head of the latest successful central production deploy,
          # which only succeeds after proving that exact SHA is serving production.
          sha="$(gh api "repos/${{ github.repository }}/actions/workflows/central-production-deploy.yml/runs?branch=gh-pages&status=success&per_page=1" --jq '.workflow_runs[0].head_sha')"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "::error title=CERTIFIED_LIVE_SHA::could not resolve certified live release"; exit 1; fi
          echo "EXPECTED_SHA=$sha" >> "$GITHUB_ENV"
          echo "CERTIFIED_LIVE_SHA=$sha"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build deterministic exact-production tree manifest
        run: |
          set -euo pipefail
          git cat-file -e "$EXPECTED_SHA^{commit}"
          python3 - <<'PY'
          import subprocess,hashlib,json,os
          sha=os.environ["EXPECTED_SHA"]
          raw=subprocess.check_output(["git","ls-tree","-r","-z",sha])
          entries=[x for x in raw.split(b"\0") if x]
          rows=[]
          for entry in entries:
              meta,path=entry.split(b"\t",1)
              mode,typ,obj=meta.decode().split()
              if typ!="blob": continue
              data=subprocess.check_output(["git","cat-file","blob",obj])
              rows.append({"path":path.decode(),"git_blob":obj,"sha256":hashlib.sha256(data).hexdigest()})
          tree=hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          doc={"schema":"zevanory.p15.provenance.v2","git_sha":sha,"tracked_tree_sha256":tree,"files":rows}
          open("p15-provenance.json","w").write(json.dumps(doc,sort_keys=True,indent=2))
          print(json.dumps({"git_sha":sha,"tracked_tree_sha256":tree,"file_count":len(rows)}))
          PY
      - name: Verify production release identity is a real Git commit
        run: |
          python3 - <<'PY'
          import urllib.request,json,subprocess,re,os
          req=urllib.request.Request("https://zevanory.api.br/build-info.json",headers={"User-Agent":"ZEVANORY-Provenance/1.0","Cache-Control":"no-cache"})
          d=json.load(urllib.request.urlopen(req,timeout=20))
          sha=str(d.get("sha","")).strip()
          expected=os.environ["EXPECTED_SHA"]
          if not re.fullmatch(r"[0-9a-fA-F]{40}",sha): raise SystemExit("production build-info sha is not an immutable 40-hex Git SHA")
          if sha!=expected: raise SystemExit(f"production SHA mismatch: {sha} != {expected}")
          subprocess.check_call(["git","cat-file","-e",sha+"^{commit}"])
          print("P13_P15_PROVENANCE_EXACT_RELEASE=PASS",sha)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p15-provenance-37e695127af0
          path: p15-provenance.json
          retention-days: 90
