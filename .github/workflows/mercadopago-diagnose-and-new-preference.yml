name: Mercado Pago - diagnosticar e recriar preferência

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/mercadopago-diagnose-and-new-preference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-and-create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MP_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_TEST_ACCESS_TOKEN }}
      MP_BUYER_EMAIL: ${{ secrets.MERCADOPAGO_TEST_BUYER_EMAIL }}
      ORDER_ID: 4a615149-7dac-4c36-93a3-b7f895d2c9ca
    steps:
      - name: Search payment and create fresh Checkout Pro preference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request, urllib.error
          token=os.environ["MP_ACCESS_TOKEN"].strip()
          buyer=os.environ["MP_BUYER_EMAIL"].strip()
          order=os.environ["ORDER_ID"].strip()
          assert token, "MERCADOPAGO_TEST_ACCESS_TOKEN_missing"
          assert buyer, "MERCADOPAGO_TEST_BUYER_EMAIL_missing"
          external="ZEVANORY:EXP-0001:"+order

          def call(url, method="GET", body=None):
              headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/json",
                  "User-Agent":"ZEVANORY-MP-Diagnose/1.0",
              }
              data=None
              if body is not None:
                  headers["Content-Type"]="application/json"
                  data=json.dumps(body).encode()
              req=urllib.request.Request(url,method=method,headers=headers,data=data)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode("utf-8","replace")
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8","replace")
                  raise RuntimeError(f"{method} {url} -> {e.code}: {raw[:2000]}")

          q=urllib.parse.urlencode({"external_reference":external,"sort":"date_created","criteria":"desc"})
          _, search=call("https://api.mercadopago.com/v1/payments/search?"+q)
          results=search.get("results") or []
          payment_summary=[{
              "id":p.get("id"),
              "status":p.get("status"),
              "status_detail":p.get("status_detail"),
              "payment_method_id":p.get("payment_method_id"),
              "payment_type_id":p.get("payment_type_id"),
              "external_reference":p.get("external_reference"),
              "date_created":p.get("date_created")
          } for p in results]
          print("PAYMENT_SEARCH_COUNT="+str(len(payment_summary)))
          if payment_summary:
              for p in payment_summary:
                  print("PAYMENT="+str(p["id"])+"|"+str(p["status"])+"|"+str(p["status_detail"])+"|"+str(p["payment_method_id"])+"|"+str(p["payment_type_id"]))
          else:
              print("PAYMENT_STATUS=NONE_CREATED")

          payload={
              "items":[{
                  "id":"ZEV-IA-NA-PRATICA",
                  "title":"ZEVANORY IA na Prática",
                  "description":"Produto digital ZEVANORY",
                  "quantity":1,
                  "currency_id":"BRL",
                  "unit_price":197.0
              }],
              "payer":{"email":buyer},
              "external_reference":external,
              "back_urls":{
                  "success":"https://vendas.zevanory.api.br/solucoes?checkout=success",
                  "failure":"https://vendas.zevanory.api.br/solucoes?checkout=failure",
                  "pending":"https://vendas.zevanory.api.br/solucoes?checkout=pending"
              },
              "auto_return":"approved",
              "notification_url":"https://zevanory.api.br/api/webhooks?provider=mercadopago_test",
              "payment_methods":{
                  "excluded_payment_methods":[],
                  "excluded_payment_types":[],
                  "installments":1
              },
              "metadata":{
                  "zevanory_order_id":order,
                  "certification":True,
                  "manual_checkout_pro":True
              }
          }
          _, pref=call("https://api.mercadopago.com/checkout/preferences","POST",payload)
          init_point=str(pref.get("init_point") or "")
          assert init_point.startswith("https://www.mercadopago.com"), init_point
          assert str(pref.get("external_reference") or "")==external, pref.get("external_reference")
          assert (pref.get("payer") or {}).get("email")==buyer, "buyer_email_mismatch"
          pm=pref.get("payment_methods") or {}
          assert (pm.get("excluded_payment_methods") or [])==[], pm
          assert (pm.get("excluded_payment_types") or [])==[], pm

          report={
              "order_id":order,
              "external_reference":external,
              "payment_search":payment_summary,
              "preference":{
                  "id":pref.get("id"),
                  "init_point":init_point,
                  "payer_email":"MERCADOPAGO_TEST_BUYER_EMAIL",
                  "items":pref.get("items"),
                  "back_urls":pref.get("back_urls"),
                  "auto_return":pref.get("auto_return"),
                  "notification_url":pref.get("notification_url"),
                  "payment_methods":pref.get("payment_methods"),
              }
          }
          pathlib.Path("evidence").mkdir(exist_ok=True)
          pathlib.Path("evidence/mp-diagnose-new-preference.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("PREFERENCE_ID="+str(pref.get("id")))
          print("INIT_POINT="+init_point)
          print("PAYER_EMAIL_SECRET=PASS")
          print("CREDIT_CARD_EXCLUSIONS=NONE")
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mp-diagnose-new-preference
          path: evidence/mp-diagnose-new-preference.json
          retention-days: 7
