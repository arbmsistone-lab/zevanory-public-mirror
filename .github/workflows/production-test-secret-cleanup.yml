name: ZEVANORY remove test secrets from production Worker

# F2 item 9 (roteiro 3.1 seção 7): remove do Worker de produção `zevanory` os segredos de TESTE gravados pelo run
# 37365806405 (05/10, sandbox-worker-secret-audit.yml). Remove SOMENTE a allowlist fixa
#   MERCADOPAGO_TEST_ACCESS_TOKEN, MERCADOPAGO_TEST_WEBHOOK_SECRET
# e só se confirm_names for exatamente "MERCADOPAGO_TEST_ACCESS_TOKEN,MERCADOPAGO_TEST_WEBHOOK_SECRET".
# Desenho (Sol): (1) alvo provado (conta fixa, script zevanory, ZEVANORY_DEPLOYMENT_ENV=production); (2) só nomes;
# (3) diff esperado impresso ANTES (DELETE x KEEP) e conjunto apagado ⊆ allowlist ∩ presentes; (4) confirmação exata;
# (5) readback: allowlist ausente E todo outro nome do pré-inventário presente; (6) qualquer divergência falha.
# Controles do auditor antes da execução (Sol 187 C1-C5, ajustes Sol 189 A1-A3; lógica em
# scripts/ci/production-secret-names.mjs, coleta só leitura em scripts/ci/production-worker-state.sh):
#   C2/A2 expected_inventory_digest = INVENTORY_DIGEST D0 (zev-inventory/v1: conta, script, commit, (name,type,origin),
#         DELETE, KEEP) e expected_version_id = EFFECTIVE_VERSION_ID do readback revisado (a versão fica fora do digest
#         porque cada DELETE publica uma nova); o plano recalcula e RECUSA se qualquer um mudou.
#   Sol 191 o plano calcula de S0, antes de qualquer DELETE, D1 (S0 − 1º nome) e D2 (S0 − os 2) e os imprime
#         (STATE_DIGEST); antes do DELETE k o inventário vivo tem de dar D(k-1), depois Dk; senão para.
#   C3/A1 antes do primeiro DELETE: nenhum run ativo de workflow da matriz docs/ops/zevanory-publisher-matrix.json (o grupo
#         deploy-zevanory serializa os publicadores do GitHub, menos o financeiro aposentado registrado como não
#         serializado, que é vigiado aqui) e a versão efetiva ainda = a do plano. Painel, Workers Builds e outros tokens não
#         entram na fila: antes e logo depois de CADA DELETE o estado é relido e o único movimento aceito é o nosso
#         DELETE (cadeia de deployments de um passo, código igual, configuração = antes − nome); senão CONCURRENT_CHANGE.
#   C4    um nome por vez; qualquer falha para e imprime CLEANUP_PARTIAL (presentes/ausentes, versão); nada é recriado.
#   C5/A3 verificação: ADDED_SINCE_PLAN e mudança de tipo falham; código (etag do script e runtime) preservado; diff de
#         configuração = exatamente os nomes apagados; /api/release (commit igual, sales globally-blocked) e
#         /api/sales/status (open=false) por GET público. Divergência falha e preserva o estado (sem recuperação).
# Os nomes CERTIFICATION_* da produção NÃO são removidos aqui (dívida que exige mudança de código/contrato; ver
# ops/r9-debt.json).
# Manual, Environment producao-critica (revisor obrigatório), na fila de deploy do zevanory (apagar um segredo publica
# nova versão do Worker; não pode correr junto com um deploy).
on:
  workflow_dispatch:
    inputs:
      confirm_names:
        description: "Digite exatamente: MERCADOPAGO_TEST_ACCESS_TOKEN,MERCADOPAGO_TEST_WEBHOOK_SECRET"
        required: true
        type: string
      expected_inventory_digest:
        description: "INVENTORY_DIGEST (sha256:...) do readback revisado pelo auditor; recusa se o estado mudou"
        required: true
        type: string
      expected_version_id:
        description: "EFFECTIVE_VERSION_ID do mesmo readback (fora do digest); recusa se a versão efetiva mudou"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-zevanory
  cancel-in-progress: false
  queue: max

jobs:
  remove-test-secrets:
    environment: producao-critica  # escreve no Worker de produção; revisor obrigatório
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/gh-pages' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TOKEN_SOURCE: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN != '' && 'CLOUDFLARE_PUBLIC_OWNER_API_TOKEN' || (secrets.CLOUDFLARE_API_TOKEN != '' && 'CLOUDFLARE_API_TOKEN' || 'nenhum') }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      CONFIRM_NAMES: ${{ inputs.confirm_names }}
      EXPECTED_INVENTORY_DIGEST: ${{ inputs.expected_inventory_digest }}
      EXPECTED_VERSION_ID: ${{ inputs.expected_version_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove target, recompute the inventory digest and print the expected diff (refuses unless digest and confirmation match)
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/cleanup"; mkdir -p "$d"
          # Sol 222/223: chave HMAC aleatória deste run para a comparação PRIVADA de valores (plano x antes x depois);
          # nunca impressa nem exportada; o arquivo some no passo final. Só o caminho vai para GITHUB_ENV.
          head -c 32 /dev/urandom > "$d/config-hmac.key"
          export ZEV_CONFIG_HMAC_KEY_FILE="$d/config-hmac.key"
          echo "ZEV_CONFIG_HMAC_KEY_FILE=$d/config-hmac.key" >> "$GITHUB_ENV"
          source scripts/ci/production-worker-state.sh
          zev_fetch_state "$d/before"
          node scripts/ci/production-secret-names.mjs plan --secrets "$d/before/secrets.json" --settings "$d/before/settings.json" \
            --deployments "$d/before/deployments.json" --version-detail "$d/before/version.json" --release "$d/before/release.json" \
            --confirmation "$CONFIRM_NAMES" --expected-digest "$EXPECTED_INVENTORY_DIGEST" --expected-version "$EXPECTED_VERSION_ID" \
            --out "$d/plan.json" | tee "$d/plan.txt"
          names="$(grep -E '^DELETE [A-Z0-9_]+$' "$d/plan.txt" | cut -d' ' -f2 | paste -sd' ' - || true)"
          version="$(grep -E '^EFFECTIVE_VERSION_ID=' "$d/plan.txt" | cut -d= -f2)"
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Serialization preflight (no active zevanory publisher run; effective version unchanged)
        if: steps.plan.outputs.names != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/cleanup"; mkdir -p "$d/runs"
          runs=()
          for s in queued in_progress waiting requested pending; do
            curl -fsS --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?status=$s&per_page=100" -o "$d/runs/$s.json"
            runs+=(--runs "$d/runs/$s.json")
          done
          source scripts/ci/production-worker-state.sh
          zev_cf_get deployments "$d/runs/deployments.json"
          node scripts/ci/production-secret-names.mjs preflight --plan "$d/plan.json" --deployments "$d/runs/deployments.json" \
            "${runs[@]}" --self-run-id "$GITHUB_RUN_ID"
      - name: Delete the planned allowlisted test secrets one at a time (state proven before and after each delete)
        if: steps.plan.outputs.names != ''
        shell: bash
        env:
          PLANNED: ${{ steps.plan.outputs.names }}
          PLAN_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/cleanup"
          source scripts/ci/production-worker-state.sh
          deleted=""
          expected="$PLAN_VERSION"
          fail() {
            zev_fetch_state "$d/fail" || true
            node scripts/ci/production-secret-names.mjs partial --plan "$d/plan.json" --secrets "$d/fail/secrets.json" \
              --settings "$d/fail/settings.json" --deployments "$d/fail/deployments.json" --reason "$1" || true
            exit 1
          }
          state_args() { echo --secrets "$1/secrets.json" --settings "$1/settings.json" --deployments "$1/deployments.json" --version-detail "$1/version.json" --release "$1/release.json"; }
          for name in $PLANNED; do
            case "$name" in
              MERCADOPAGO_TEST_ACCESS_TOKEN|MERCADOPAGO_TEST_WEBHOOK_SECRET) ;;
              *) echo "::error title=CLEANUP_REFUSED::nome fora da allowlist"; fail "outside_allowlist";;
            esac
            zev_fetch_state "$d/pre-$name" || fail "pre_relist_failed:$name"
            # shellcheck disable=SC2046
            node scripts/ci/production-secret-names.mjs step --phase pre --plan "$d/plan.json" --name "$name" --deleted "$deleted" \
              --expected-version "$expected" $(state_args "$d/pre-$name") || fail "pre_check_failed:$name"
            npx --yes wrangler@4.143.0 secret delete "$name" --name zevanory || fail "delete_failed:$name"
            zev_fetch_state "$d/post-$name" || fail "post_relist_failed:$name"
            # shellcheck disable=SC2046
            node scripts/ci/production-secret-names.mjs step --phase post --plan "$d/plan.json" --name "$name" --deleted "$deleted" \
              --expected-version "$expected" $(state_args "$d/post-$name") --out-version "$d/post-$name/confirmed-version" || fail "post_check_failed:$name"
            expected="$(cat "$d/post-$name/confirmed-version")"
            deleted="${deleted:+$deleted,}$name"
            echo "DELETED_CONFIRMED $name version=$expected"
          done
      - name: Read back and prove the result (inventory, code, config diff, public release and sales status)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/cleanup"
          source scripts/ci/production-worker-state.sh
          zev_fetch_state "$d/after"
          curl -fsS --connect-timeout 10 --max-time 20 https://zevanory.api.br/api/sales/status -o "$d/after/sales.json" || echo '{}' > "$d/after/sales.json"
          set +e
          node scripts/ci/production-secret-names.mjs verify --plan "$d/plan.json" --secrets "$d/after/secrets.json" --settings "$d/after/settings.json" \
            --deployments "$d/after/deployments.json" --version-detail "$d/after/version.json" --release "$d/after/release.json" > "$d/verify.txt"
          v=$?
          node scripts/ci/production-secret-names.mjs postcheck --plan "$d/plan.json" --release "$d/after/release.json" --sales "$d/after/sales.json" >> "$d/verify.txt"
          p=$?
          node scripts/ci/production-secret-names.mjs readback --secrets "$d/after/secrets.json" --settings "$d/after/settings.json" \
            --deployments "$d/after/deployments.json" --version-detail "$d/after/version.json" --release "$d/after/release.json" >> "$d/verify.txt"
          r=$?
          set -e
          cat "$d/verify.txt"
          grep -E '^(SECTION_D0|SECTION_PRIVATE|CONFIG_VALUES_UNCHANGED|CLEANUP_VERIFY|CLEANUP_POSTCHECK|PRODUCTION_TEST_SECRET_READBACK|EFFECTIVE_VERSION_ID|INVENTORY_DIGEST)' "$d/verify.txt" >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$v" != 0 ] || [ "$p" != 0 ] || [ "$r" != 0 ]; then echo "::error title=CLEANUP_VERIFY::verificação falhou; estado preservado, sem recuperação automática"; exit 1; fi
      - name: Remove temporary name lists
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/cleanup"
