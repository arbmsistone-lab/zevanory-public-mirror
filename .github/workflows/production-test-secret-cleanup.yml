name: ZEVANORY remove test secrets from production Worker

# F2 item 9 (roteiro 3.1 seção 7): remove do Worker de produção `zevanory` os segredos de TESTE gravados pelo run
# 37365806405 (05/10, sandbox-worker-secret-audit.yml). Remove SOMENTE a allowlist fixa
#   MERCADOPAGO_TEST_ACCESS_TOKEN, MERCADOPAGO_TEST_WEBHOOK_SECRET
# e só se confirm_names for exatamente "MERCADOPAGO_TEST_ACCESS_TOKEN,MERCADOPAGO_TEST_WEBHOOK_SECRET".
# Desenho (Sol): (1) alvo provado (conta fixa, script zevanory, ZEVANORY_DEPLOYMENT_ENV=production); (2) só nomes;
# (3) diff esperado impresso ANTES (DELETE x KEEP) e conjunto apagado ⊆ allowlist ∩ presentes; (4) confirmação exata;
# (5) readback: allowlist ausente E todo outro nome do pré-inventário presente; (6) qualquer divergência falha.
# Os nomes CERTIFICATION_* da produção NÃO são removidos aqui (dívida que exige mudança de código/contrato; ver
# ops/r9-debt.json).
# Manual, Environment producao-critica (revisor obrigatório), na fila de deploy do zevanory (apagar um segredo publica
# nova versão do Worker; não pode correr junto com um deploy).
on:
  workflow_dispatch:
    inputs:
      confirm_names:
        description: "Digite exatamente: MERCADOPAGO_TEST_ACCESS_TOKEN,MERCADOPAGO_TEST_WEBHOOK_SECRET"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-zevanory
  cancel-in-progress: false
  queue: max

jobs:
  remove-test-secrets:
    environment: producao-critica  # escreve no Worker de produção; revisor obrigatório
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/gh-pages' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      CONFIRM_NAMES: ${{ inputs.confirm_names }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove target, list names and print the expected diff (refuses unless the confirmation is exact)
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/cleanup"; mkdir -p "$d"
          npx --yes wrangler@4.143.0 secret list --name zevanory --format json > "$d/before.json"
          curl -fsS --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory/settings" -o "$d/settings-before.json"
          node scripts/ci/production-secret-names.mjs plan --secrets "$d/before.json" --settings "$d/settings-before.json" \
            --confirmation "$CONFIRM_NAMES" --out "$d/plan.json" | tee "$d/plan.txt"
          names="$(grep -E '^DELETE [A-Z0-9_]+$' "$d/plan.txt" | cut -d' ' -f2 | paste -sd' ' - || true)"
          echo "names=$names" >> "$GITHUB_OUTPUT"
      - name: Delete only the planned allowlisted test secrets
        if: steps.plan.outputs.names != ''
        shell: bash
        env:
          PLANNED: ${{ steps.plan.outputs.names }}
        run: |
          set -euo pipefail
          for name in $PLANNED; do
            case "$name" in
              MERCADOPAGO_TEST_ACCESS_TOKEN|MERCADOPAGO_TEST_WEBHOOK_SECRET) ;;
              *) echo "::error title=CLEANUP_REFUSED::nome fora da allowlist"; exit 1;;
            esac
            npx --yes wrangler@4.143.0 secret delete "$name" --name zevanory
            echo "DELETED $name"
          done
      - name: Read back (allowlist absent, every other pre-listed name still present)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/cleanup"
          npx --yes wrangler@4.143.0 secret list --name zevanory --format json > "$d/after.json"
          curl -fsS --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zevanory/settings" -o "$d/settings-after.json"
          node scripts/ci/production-secret-names.mjs verify --plan "$d/plan.json" --secrets "$d/after.json" --settings "$d/settings-after.json" | tee "$d/verify.txt"
          node scripts/ci/production-secret-names.mjs readback --secrets "$d/after.json" --settings "$d/settings-after.json" | tee -a "$d/verify.txt"
          grep -E '^(CLEANUP_VERIFY|PRODUCTION_TEST_SECRET_READBACK)=' "$d/verify.txt" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Remove temporary name lists
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/cleanup"
