name: Render fixed PCM stress without Gemini
on:
  pull_request:
    branches: [gh-pages]
    paths: ['worker/voice-render-client.mjs', 'worker/voice-provider-router.mjs', 'scripts/voice_render_client_test.mjs', '.github/workflows/voice-chunk-stress.yml']
  push:
    branches: [gh-pages]
    paths: ['worker/voice-render-client.mjs', 'worker/voice-provider-router.mjs', '.github/workflows/voice-chunk-stress.yml']
permissions:
  contents: read
concurrency:
  group: voice-fixed-pcm-stress-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check worker/voice-render-client.mjs
          python3 -m py_compile scripts/deploy/prepare-central-candidate.py
          node scripts/voice_render_client_test.mjs
          node scripts/whatsapp_audio_runtime_test.mjs
          node scripts/voice_router_adversarial.mjs
  stress:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPERATOR_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN || secrets.OPERATOR_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '1b26415802588185a86c1d4d3ebf5bdb'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare prerecorded fixed PCM without TTS
        run: |
          mkdir -p /tmp/stress
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          base64 -d scripts/fixtures/voice-fixed.pcm.gz.b64 | gzip -d > /tmp/stress/fixed.pcm
          cp scripts/fixtures/voice-fixed.txt /tmp/stress/fixed.txt
          ffmpeg -nostdin -v error -y -f s16le -ar 24000 -ac 1 -i /tmp/stress/fixed.pcm /tmp/stress/original.wav
      - name: Exact SHA fixed PCM stress and Whisper quality
        run: |
          npm install --prefix /tmp/stress-tools --no-save wrangler@4.143.0 >/dev/null 2>&1
          timeout 1100s /tmp/stress-tools/node_modules/.bin/wrangler tail zevanory --format json > /tmp/stress-tail.json 2>/tmp/stress-tail.err &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          const origin='https://zevanory.api.br',auth={authorization:'Bearer '+process.env.OPERATOR_TOKEN,'content-type':'application/json'};
          let live;
          for(let n=0;n<120;n++){live=await fetch(origin+'/api/support/instant-status').then(r=>r.json());if(live.release_sha===process.env.GITHUB_SHA)break;await new Promise(r=>setTimeout(r,5000));}
          if(live.release_sha!==process.env.GITHUB_SHA)throw Error('EXACT_SHA_NOT_LIVE');
          for(let n=0;n<40;n++){const r=await fetch('https://zevanory-product-control-edge.onrender.com/api/voice/synthesize',{method:'POST',signal:AbortSignal.timeout(45000)});await r.body?.cancel();if(r.status===401)break;if(n===39)throw Error('SYNTHESIS_ROUTE_NOT_READY');await new Promise(r=>setTimeout(r,10000));}
          await new Promise(r=>setTimeout(r,12000));
          const pcm=readFileSync('/tmp/stress/fixed.pcm'),digest=createHash('sha256').update(pcm).digest('hex'),matrix=[];
          for(let n=1;n<=20;n++){
           const at=Date.now();
           const r=await fetch(origin+'/api/admin/voice/encode-audit?audit_id=fixed-'+n,{method:'POST',headers:{authorization:auth.authorization,'content-type':'application/octet-stream','x-voice-sample-rate':'24000','x-voice-pcm-sha256':digest},body:pcm,signal:AbortSignal.timeout(90000)});
           const bytes=Buffer.from(await r.arrayBuffer()),path='/tmp/stress/result-'+n+'.mp3';writeFileSync(path,bytes);
           const decoded=spawnSync('ffmpeg',['-nostdin','-v','error','-y','-i',path,'-f','null','-']);
           const result={index:n,sha:live.release_sha,provider:r.headers.get('x-voice-provider'),http:r.status,valid_mp3:r.ok&&bytes[0]===255&&decoded.status===0,time_ms:Date.now()-at};
           matrix.push(result);console.log(JSON.stringify({execution:result}));writeFileSync('/tmp/stress/matrix.json',JSON.stringify(matrix,null,2));await new Promise(r=>setTimeout(r,2500));
          }
          async function transcribe(path){const r=await fetch(origin+'/api/admin/whatsapp-onboard/delivery-proof',{method:'POST',headers:auth,body:JSON.stringify({operation:'audit-transcribe',audio_base64:readFileSync(path).toString('base64')}),signal:AbortSignal.timeout(90000)});return {http:r.status,...await r.json()};}
          const written=readFileSync('/tmp/stress/fixed.txt','utf8').trim(),original=await transcribe('/tmp/stress/original.wav'),encoded=matrix[0].valid_mp3?await transcribe('/tmp/stress/result-1.mp3'):{ok:false};
          writeFileSync('/tmp/stress/whisper.json',JSON.stringify({written,original,encoded},null,2));console.log(JSON.stringify({whisper:{written,original,encoded}}));
          console.log(JSON.stringify({sha:live.release_sha,passed:matrix.filter(x=>x.valid_mp3).length,average_ms:matrix.reduce((s,x)=>s+x.time_ms,0)/20,worst_ms:Math.max(...matrix.map(x=>x.time_ms)),gemini_calls:0}));
          await new Promise(r=>setTimeout(r,10000));
          if(matrix.some(x=>!x.valid_mp3))process.exitCode=1;
          JS
      - name: Capture Worker CPU and calculate WER
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,json,re,unicodedata,urllib.parse
          p=pathlib.Path('/tmp/stress');raw=pathlib.Path('/tmp/stress-tail.json').read_text() if pathlib.Path('/tmp/stress-tail.json').exists() else ''
          events=[];pos=0;decoder=json.JSONDecoder()
          while pos<len(raw):
              at=raw.find('{',pos)
              if at<0:break
              try:e,end=decoder.raw_decode(raw[at:]);pos=at+end
              except ValueError:pos=at+1;continue
              request=(e.get('event') or {}).get('request') or {};u=urllib.parse.urlparse(request.get('url',''));q=urllib.parse.parse_qs(u.query)
              if u.path!='/api/admin/voice/encode-audit':continue
              events.append({'audit_id':q.get('audit_id',[None])[0],'cpuTime':e.get('cpuTime'),'wallTime':e.get('wallTime'),'outcome':e.get('outcome'),'exceptions':[x.get('name') for x in e.get('exceptions',[])]})
          (p/'tail.json').write_text(json.dumps(events,indent=2))
          matrix=json.loads((p/'matrix.json').read_text()) if (p/'matrix.json').exists() else []
          for x in matrix:
              matches=[e for e in events if e['audit_id']=='fixed-'+str(x['index'])]
              x['worker_cpu_ms']=[e['cpuTime'] for e in matches];x['worker_outcomes']=[e['outcome'] for e in matches]
          (p/'matrix.json').write_text(json.dumps(matrix,indent=2));print(json.dumps({'matrix':matrix,'tail':events}))
          def words(s):
              s=unicodedata.normalize('NFKD',s.lower());s=''.join(c for c in s if not unicodedata.combining(c))
              return re.findall(r'[a-z0-9]+',s)
          def wer(a,b):
              row=list(range(len(b)+1))
              for i,x in enumerate(a,1):
                  nextrow=[i]
                  for j,y in enumerate(b,1):nextrow.append(min(nextrow[-1]+1,row[j]+1,row[j-1]+(x!=y)))
                  row=nextrow
              return row[-1]/max(1,len(a))
          if (p/'whisper.json').exists():
              q=json.loads((p/'whisper.json').read_text());reference=q['written'];transcript=q['encoded'].get('transcript','')
              numeric=lambda s:re.findall(r'\d+(?:[.,]\d+)*',s)
              quality={'wer':wer(words(reference),words(transcript)),'numbers_expected':numeric(reference),'numbers_actual':numeric(transcript),'numbers_identical':numeric(reference)==numeric(transcript),'whisper_ok':q['encoded'].get('ok') is True}
              quality['pass']=quality['whisper_ok'] and quality['wer']<=0.10 and quality['numbers_identical']
              (p/'quality.json').write_text(json.dumps(quality,indent=2));print(json.dumps({'quality':quality}))
          proof={'twenty_mp3':len(matrix)==20 and all(x['valid_mp3'] for x in matrix),'cpu_complete':len(matrix)==20 and all(x['worker_cpu_ms'] for x in matrix),'exceeded_cpu':any(e['outcome']=='exceededCpu' for e in events),'max_cpu_ms':max([e['cpuTime'] for e in events if isinstance(e.get('cpuTime'),(int,float))],default=None),'gemini_calls':0}
          (p/'summary.json').write_text(json.dumps(proof,indent=2));print(json.dumps(proof))
          if not proof['twenty_mp3'] or not proof['cpu_complete'] or proof['exceeded_cpu']:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-render-fixed-twenty-proof
          path: /tmp/stress/
          retention-days: 30
