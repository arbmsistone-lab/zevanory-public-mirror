name: WhatsApp chunk CPU stress and final delivery
on:
  pull_request:
    branches: [gh-pages]
    paths: ['worker/voice-chunks.mjs', 'worker/voice-operational-audit.mjs', 'scripts/voice_chunks_test.mjs', '.github/workflows/voice-chunk-stress.yml']
  push:
    branches: [gh-pages]
    paths: ['worker/voice-chunks.mjs', 'worker/voice-operational-audit.mjs', '.github/workflows/voice-chunk-stress.yml']
permissions:
  contents: read
concurrency:
  group: voice-chunk-stress-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node scripts/voice_chunks_test.mjs
          node scripts/whatsapp_audio_runtime_test.mjs
      - name: Check MP3 seams on cloud runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -nostdin -v error -y -i /tmp/chunk-quality.mp3 -f s16le -ar 8000 /tmp/chunk-decoded.pcm
          python3 - <<'PY'
          import array,math
          p=array.array('h');p.frombytes(open('/tmp/chunk-decoded.pcm','rb').read())
          # Each interior seam must retain tone energy without an inserted silent frame.
          for index in [24*576,45*576,66*576]:
              values=p[index-200:index+200]
              rms=math.sqrt(sum(x*x for x in values)/len(values))
              assert rms>1000,('silent_mp3_seam',index,rms)
              assert max(abs(values[i]-values[i-1]) for i in range(1,len(values)))<6000,('mp3_seam_click',index)
          print('CHUNK_SEAM_ENERGY_AND_DISCONTINUITY=PASS')
          PY
  provision:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPERATOR_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN || secrets.OPERATOR_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Wrap derived reserve key for the authorized provisioner
        run: |
          node --input-type=module <<'JS'
          const origin='https://zevanory.api.br';let live;
          for(let n=0;n<120;n++){live=await fetch(origin+'/api/support/instant-status').then(r=>r.json());if(live.release_sha===process.env.GITHUB_SHA)break;await new Promise(r=>setTimeout(r,5000));}
          if(live.release_sha!==process.env.GITHUB_SHA)throw Error('exact_release_not_live');
          const r=await fetch(origin+'/api/admin/whatsapp-onboard/delivery-proof',{method:'POST',headers:{authorization:'Bearer '+process.env.OPERATOR_TOKEN,'content-type':'application/json'},body:JSON.stringify({operation:'audit-encoder-key',public_key:{"kty":"RSA","n":"764zRVVmFAlrJ5q3hyjZaHU8kctelnBuBNnxiu59Uo54MXi4aGsUC0fo4WHLH1Z531O1dBuXvgchE0SObwPmsDQn5nQNmP2a8sdRCH6sOnF179BqtKiIDYyHWC1K638K-e64Iw8iTafMBQypW1qe7zEIGYtNnf59FaQv9JAakrrCfVq_D34UJDcXnif3KUM1Zv3w61CVjGtqhS7Q7ZTr_l1jFbwCH1Vh89S916pxjMVbNYvIYhqqXCBx0BYj-rJ_ILjP4X1N6w8R1OTcP-2ZDsxwniMiR3dkOn0qvJ70B6931cof9W0u_RzOWELQXlior5U8KUYb91pg8FaL1TqgNw","e":"AQAB","alg":"RSA-OAEP-256","ext":true}})});
          const j=await r.json();if(!r.ok)throw Error('wrapped_key_http_'+r.status);
          console.log(JSON.stringify({wrapped_key:j.wrapped_key}));
          JS
  stress:
    if: github.event_name == 'push'
    needs: provision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPERATOR_TOKEN: ${{ secrets.CERTIFICATION_E2E_TOKEN || secrets.OPERATOR_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '1b26415802588185a86c1d4d3ebf5bdb'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare speech fixtures on cloud
        run: |
          mkdir -p /tmp/stress
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak >/dev/null
          python3 - <<'PY'
          import pathlib
          a='Olá! Nosso atendimento ajuda a escolher produtos digitais para organizar o seu negócio. Reúna as dúvidas dos clientes e confira os resultados toda semana. A inteligência artificial pode ajudar a preparar mensagens e propostas. Revise as informações antes de enviar. Os detalhes e os links estão na mensagem de texto.'
          b=a+' Para começar, identifique a principal dificuldade da empresa e defina um objetivo claro. Acompanhe os pedidos, organize as tarefas e mantenha os preços corretos. Use uma linguagem simples e responda de forma acolhedora. Se precisar de apoio, nossa equipe pode orientar o próximo passo.'
          for label,text in [('350',a),('600',b)]:pathlib.Path('/tmp/stress/'+label+'.txt').write_text(text)
          PY
          for size in 350 600; do
            espeak -v pt-br -s 155 -w /tmp/stress/$size.wav -f /tmp/stress/$size.txt
            ffmpeg -nostdin -v error -y -i /tmp/stress/$size.wav -ac 1 -ar 24000 -f s16le /tmp/stress/$size.pcm
          done
      - name: Wait for bounded reserve readiness and attach tail
        run: |
          for n in $(seq 1 80); do
            code=$(curl -sS --max-time 50 -o /tmp/reserve-readiness.json -w '%{http_code}' -X POST https://zevanory-product-control-edge.onrender.com/api/voice/encode || true)
            if [ "$code" = 401 ]; then exit 0; fi
            sleep 10
          done
          echo "RESERVE_NOT_READY"; exit 1
      - name: Twenty sequential conversions and final signed delivery
        run: |
          npm install --prefix /tmp/stress-tools --no-save wrangler@4.143.0 >/dev/null 2>&1
          timeout 1200s /tmp/stress-tools/node_modules/.bin/wrangler tail zevanory --format json > /tmp/stress-tail.json 2>/tmp/stress-tail.err &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const origin='https://zevanory.api.br',auth={authorization:'Bearer '+process.env.OPERATOR_TOKEN,'content-type':'application/json'};
          async function op(input){const r=await fetch(origin+'/api/admin/whatsapp-onboard/delivery-proof',{method:'POST',headers:auth,body:JSON.stringify(input),signal:AbortSignal.timeout(90000)});return {http:r.status,...await r.json()};}
          await new Promise(r=>setTimeout(r,12000));
          const matrix=[];let qualityAudio,expected;
          for(let n=1;n<=20;n++){
           const size=n<=10?'350':'600',pcm=readFileSync('/tmp/stress/'+size+'.pcm'),at=Date.now();
           const r=await fetch(origin+'/api/admin/voice/encode-audit?audit_id=stress-'+n,{method:'POST',headers:{authorization:auth.authorization,'content-type':'application/octet-stream','x-voice-sample-rate':'24000'},body:pcm,signal:AbortSignal.timeout(120000)});
           const bytes=Buffer.from(await r.arrayBuffer()),path='/tmp/stress/result-'+n+'.mp3';
           writeFileSync(path,bytes);
           const decoded=spawnSync('ffmpeg',['-nostdin','-v','error','-y','-i',path,'-f','s16le','-ar','8000','/tmp/stress/decoded-'+n+'.pcm']);
           const valid=r.ok&&bytes.length>4&&bytes[0]===255&&decoded.status===0;
           const result={index:n,chars:readFileSync('/tmp/stress/'+size+'.txt','utf8').length,source_seconds:pcm.length/48000,http:r.status,valid_mp3:valid,time_ms:Date.now()-at,provider:r.headers.get('x-voice-provider'),fallback_used:r.headers.get('x-voice-fallback-used')==='true',chunks:JSON.parse(r.headers.get('x-voice-chunks')||'[]')};
           if(!r.ok)result.error=bytes.toString('utf8').slice(0,200);
           matrix.push(result);console.log(JSON.stringify({execution:result}));writeFileSync('/tmp/stress/matrix.json',JSON.stringify(matrix,null,2));
           if(valid&&!qualityAudio&&result.provider==='cloudflare-chunks'){qualityAudio=bytes.toString('base64');expected=readFileSync('/tmp/stress/'+size+'.txt','utf8');}
           await new Promise(r=>setTimeout(r,1000));
          }
          const pass=matrix.every(x=>x.valid_mp3);
          console.log(JSON.stringify({stress_pass:pass,passed:matrix.filter(x=>x.valid_mp3).length,average_ms:matrix.reduce((n,x)=>n+x.time_ms,0)/20,worst_ms:Math.max(...matrix.map(x=>x.time_ms))}));
          if(qualityAudio){const quality=await op({operation:'audit-transcribe',audio_base64:qualityAudio});writeFileSync('/tmp/stress/quality.json',JSON.stringify({expected,...quality},null,2));console.log(JSON.stringify({concatenated_quality:{expected,...quality}}));}
          if(!pass)throw Error('TWENTY_OF_TWENTY_REQUIRED');
          // Verify the concatenation algorithm with an actual Gemini speech source,
          // independently of whether the CPU stress required the automatic reserve.
          const reference=readFileSync('/tmp/stress/350.txt','utf8');
          const generated=await op({operation:'audit-source',text:reference});
          const source=generated.ok?Buffer.from(generated.pcm_base64,'base64'):readFileSync('/tmp/stress/350.pcm');
          const sourceRate=generated.ok?generated.sample_rate:24000;
          const {encodePcmInChunks,handleVoiceChunk}=await import(process.cwd()+'/worker/voice-chunks.mjs');
          const testEnv={ELITE_INTERNAL_TOKEN:'cloud-audit-synthetic-auth-material-32chars'};
          const joined=await encodePcmInChunks(new Uint8Array(source),sourceRate,testEnv,req=>handleVoiceChunk(req,testEnv));
          writeFileSync('/tmp/stress/concatenated-quality.mp3',joined.bytes);
          writeFileSync('/tmp/stress/quality-source.pcm',source);
          spawnSync('ffmpeg',['-nostdin','-v','error','-y','-f','s16le','-ar',String(sourceRate),'-ac','1','-i','/tmp/stress/quality-source.pcm','/tmp/stress/quality-source.wav']);
          const original=await op({operation:'audit-transcribe',audio_base64:readFileSync('/tmp/stress/quality-source.wav').toString('base64')});
          const concatenated=await op({operation:'audit-transcribe',audio_base64:Buffer.from(joined.bytes).toString('base64')});
          const normalize=s=>String(s||'').normalize('NFKD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\\s+/g,' ').trim();
          const qualityProof={source:generated.ok?'gemini':'espeak',expected:reference,original_transcript:original.transcript,concatenated_transcript:concatenated.transcript,identical_to_original:normalize(original.transcript)===normalize(concatenated.transcript),identical_to_written:normalize(reference)===normalize(concatenated.transcript),chunks:joined.chunks};
          writeFileSync('/tmp/stress/concatenation-quality.json',JSON.stringify(qualityProof,null,2));console.log(JSON.stringify({concatenation_quality:qualityProof}));
          if(!qualityProof.identical_to_original)throw Error('CONCATENATED_TRANSCRIPT_CHANGED');

          const opus=spawnSync('ffmpeg',['-nostdin','-v','error','-y','-i','/tmp/stress/350.wav','-ac','1','-ar','48000','-c:a','libopus','-b:a','24k','/tmp/stress/final.ogg']);
          if(opus.status!==0)throw Error('final_ogg_failed');
          const ack=await op({operation:'audio',audio_base64:readFileSync('/tmp/stress/final.ogg').toString('base64')});
          if(ack.http!==200)throw Error('final_fixture_http_'+ack.http);
          const result=await fetch(origin+'/api/webhooks/meta',{method:'POST',headers:{'content-type':'application/json','x-hub-signature-256':ack.signature},body:ack.signed_body,signal:AbortSignal.timeout(120000)});
          delete ack.signature;delete ack.signed_body;
          let status;
          for(let n=0;n<30;n++){status=await fetch(origin+'/api/support/instant-status').then(r=>r.json());if(status.last?.inbound_message_id===ack.inbound_message_id&&(status.last.voice_sent||status.last.voice_error))break;await new Promise(r=>setTimeout(r,2000));}
          const final={ack,webhook_http:result.status,status};writeFileSync('/tmp/stress/final-delivery.json',JSON.stringify(final,null,2));console.log(JSON.stringify({final_delivery:final}));
          if(!status.last?.voice_sent)throw Error('FINAL_VOICE_SENT_REQUIRED');
          const observation=await op({operation:'audit-observe'});const sent=observation.proof_observations?.find(x=>x.inbound_message_id===ack.inbound_message_id);
          if(sent?.voice_media_id){const media=await op({operation:'audit-media',media_id:sent.voice_media_id});if(media.audio_base64){const quality=await op({operation:'audit-transcribe',audio_base64:media.audio_base64});console.log(JSON.stringify({final_voice_quality:{expected:sent.speech_text,...quality}}));writeFileSync('/tmp/stress/final-voice-quality.json',JSON.stringify({expected:sent.speech_text,...quality},null,2));}}
          await new Promise(r=>setTimeout(r,10000));
          JS
      - name: Extract per-block CPU and webhook tail
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,json,urllib.parse,csv
          raw=pathlib.Path('/tmp/stress-tail.json').read_text() if pathlib.Path('/tmp/stress-tail.json').exists() else ''
          decoder=json.JSONDecoder();pos=0;events=[]
          while pos<len(raw):
              start=raw.find('{',pos)
              if start<0:break
              try:e,end=decoder.raw_decode(raw[start:]);pos=start+end
              except ValueError:pos=start+1;continue
              req=(e.get('event') or {}).get('request') or {};u=urllib.parse.urlparse(req.get('url',''))
              if u.path not in ['/api/internal/voice/encode-chunk','/api/webhooks/meta','/api/admin/voice/encode-audit']:continue
              q=urllib.parse.parse_qs(u.query)
              events.append({'path':u.path,'audit_id':q.get('audit_id',[None])[0],'chunk':q.get('chunk',[None])[0],'attempt':q.get('attempt',[None])[0],'cpuTime':e.get('cpuTime'),'wallTime':e.get('wallTime'),'outcome':e.get('outcome'),'exceptions':[x.get('name') for x in e.get('exceptions',[])]})
          pathlib.Path('/tmp/stress/tail.json').write_text(json.dumps(events,indent=2));print(json.dumps(events))
          matrix_path=pathlib.Path('/tmp/stress/matrix.json')
          if matrix_path.exists():
              matrix=json.loads(matrix_path.read_text())
              for item in matrix:item['cpu_per_block']=[e for e in events if e['audit_id']=='stress-'+str(item['index']) and e['path']=='/api/internal/voice/encode-chunk']
              matrix_path.write_text(json.dumps(matrix,indent=2))
              with open('/tmp/stress/matrix.csv','w') as f:
                  writer=csv.writer(f);writer.writerow(['index','chars','http','valid_mp3','time_ms','provider','fallback_used','cpu_per_block'])
                  for x in matrix:writer.writerow([x.get(k) for k in ['index','chars','http','valid_mp3','time_ms','provider','fallback_used']]+[json.dumps(x['cpu_per_block'])])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-chunk-twenty-proof
          path: /tmp/stress/
          retention-days: 7
