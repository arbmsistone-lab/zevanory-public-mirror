name: credential-separation-behaviour

# F2 item 9 (roteiro 3.1 seção 7): o Worker REAL escolhe a credencial certa por rota (P1-P7), lógica do readback e da
# remoção dirigida (N1-N7) com os controles do auditor (N8-N15: Sol 187 C1-C5, Sol 189 A1-A3, Sol 191 S0->S1->S2,
# Sol 194 digest lógico + prova de versão + validador; N16-N18 diagnóstico, falha fechada e D0 público x valores privados), coleta real em bash com curl/npx falsos
# (W1-W8, run 40142599036 sem log), gate (G1-G11) e mutantes causais pelo classificador compartilhado (113, todos KILLED).
# Só pull_request: nunca dispara no merge, nenhum segredo, sem rede além do checkout e da instalação do PyYAML.
on:
  pull_request:
    paths:
      - ".github/workflows/credential-separation-behaviour.yml"
      - "worker/**"
      - "certification-worker.mjs"
      - "data/politica-unica.json"
      - "admin.css"
      - "scripts/ci/credential_separation_gate.py"
      - "scripts/ci/production-secret-names.mjs"
      - "scripts/ci/production-worker-state.sh"
      - ".github/workflows/production-test-secret-cleanup.yml"
      - ".github/workflows/production-test-secret-readback.yml"
      - "docs/ops/zevanory-publisher-matrix.json"
      - "ops/publishers.json"
      - "docs/ops/zevanory-publisher-matrix.md"
      - "scripts/ci/mutants_credential_separation.py"
      - "scripts/ci/mutants_credential_separation_allow.json"
      - "scripts/ci/mutant_classifier.py"
      - "tests/production-payment-credential-isolation.test.mjs"
      - "tests/production-secret-names.test.mjs"
      - "tests/ci/credential-separation-gate.test.mjs"
      - "tests/ci/production-worker-state.test.mjs"
      - "tests/helpers/**"
      - "tests/t4_sim/**"
      - "ops/r9-debt.json"

permissions:
  contents: read

jobs:
  behaviour:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: "22"
      - name: PyYAML (o gate lê YAML como dado)
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --user --break-system-packages "pyyaml==6.0.2"
      - name: Testes (contagem exata 44, zero pulados)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/production-payment-credential-isolation.test.mjs tests/production-secret-names.test.mjs tests/ci/credential-separation-gate.test.mjs tests/ci/production-worker-state.test.mjs | tee /tmp/t.txt
          for l in "# tests 44" "# pass 44" "# fail 0" "# skipped 0" "# todo 0" "# cancelled 0"; do grep -qx "$l" /tmp/t.txt || { echo "::error::esperado '$l'"; exit 1; }; done
      - name: Mutantes causais (todos precisam morrer)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/mutants_credential_separation.py < /dev/null | tee /tmp/mut.txt
          echo "::notice title=CREDENTIAL_SEPARATION_MUTANTS::$(grep -E '^MUTANTS ' /tmp/mut.txt)"
          grep -qx "MUTANTS total=113 killed=113 survived=0 inconclusive=0" /tmp/mut.txt || { echo "::error::mutante sobreviveu ou contagem mudou"; exit 1; }
      - name: Sem bytecode rastreado
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files '*.pyc' '**/__pycache__/**')"
