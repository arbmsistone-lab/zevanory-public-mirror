name: Ordem 7 Telegram evidence (GET-only)
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - ".github/workflows/order7-telegram-readonly-proof.yml"
      - "worker/multichannel-autonomy.mjs"
      - "tests/multichannel-autonomy.test.mjs"
permissions:
  contents: read
jobs:
  published-evidence-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce daily editorial, Telegram idempotency and safety contract (offline)
        run: |
          node --check worker/multichannel-autonomy.mjs
          node --test tests/multichannel-autonomy.test.mjs
      - name: Probe canonical public evidence (GET only)
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/order7-evidence.json -w '%{http_code}' https://zevanory.api.br/api/autonomy/evidence || true)
          echo "ORD7_PUBLIC_EVIDENCE_HTTP=$code"
          if [ "$code" != "200" ] || ! jq -e . /tmp/order7-evidence.json >/dev/null 2>&1; then
            echo "ORD7_TELEGRAM_EVIDENCE=NOT_PROVEN"
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const obj=JSON.parse(fs.readFileSync('/tmp/order7-evidence.json','utf8'));
          const rows=Array.isArray(obj.evidence)?obj.evidence:[];
          const verified=rows.filter(item=>{
            const id=String(item?.provider_post_id||'');
            const url=String(item?.url||'');
            const date=Date.parse(String(item?.publishedAt||item?.published_at||''));
            return item?.channel==='telegram'&&/^\d{1,20}$/.test(id)&&
              /^https:\/\/t\.me\/[A-Za-z0-9_]+\/\d{1,20}$/.test(url)&&
              Number.isFinite(date)&&date>=Date.parse('2026-10-09T00:00:00Z');
          });
          // Never log credential values or customer data.
          for(const row of verified){
            console.log('ORD7_TELEGRAM_PROOF',JSON.stringify({
              provider_post_id:row.provider_post_id,url:row.url,published_at:row.publishedAt||row.published_at
            }));
          }
          if(!verified.length)console.log('ORD7_TELEGRAM_EVIDENCE=NOT_PROVEN');
          const channel=Array.isArray(obj.channels)?obj.channels.find(c=>c?.id==='telegram'):null;
          const alerts=Array.isArray(obj.alerts)?obj.alerts.filter(a=>a?.channel==='telegram').map(a=>({type:String(a.type||''),reason:String(a.reason||'')})).slice(0,3):[];
          console.log('ORD30_TELEGRAM_DIAGNOSTIC',JSON.stringify({configured:channel?.configured===true,mode:channel?.mode||null,evidenceRows:rows.length,alerts}));

          NODE

      - name: GET-only founder-independent daily blog and isolated financial status
        shell: bash
        run: |
          set -euo pipefail
          for day in 2026-10-09 2026-10-10; do
            for slug in ia-pratica-pequenos-negocios automacao-atendimento-clareza conteudo-organico-com-evidencia vendas-lojas-fortaleza caixa-comercio-juazeiro-do-norte atendimento-servicos-varzea-alegre; do
              path="/blog/${slug}-${day}"
              code="$(curl -LsS --max-time 12 -o /dev/null -w '%{http_code}' "https://zevanory.api.br${path}" || true)"
              if [ "$code" = "200" ]; then echo "ORD30_BLOG_HTTP200=${path}"; fi
            done
          done
          code="$(curl -sS --max-time 16 -o /tmp/order30-status.json -w '%{http_code}' https://zevanory.api.br/api/status || true)"
          echo "ORD30_STATUS_HTTP=$code"
          if [ "$code" = "200" ]; then
            jq -c '{gate,financial_proof:{last_isolated_run:.financial_proof.last_isolated_run}}' /tmp/order30-status.json || true
          fi
