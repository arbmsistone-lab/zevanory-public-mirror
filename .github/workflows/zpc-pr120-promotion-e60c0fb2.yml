name: ZPC PR120 owner promotion

on:
  push:
    branches:
      - ops/zpc-pr120-promotion-e60c0fb2

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      ZPC_SHA: e60c0fb2b7c278823090b6fbee9db60df2423127
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize and verify Cloudflare authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          clean="$(RAW_TOKEN="$CLOUDFLARE_API_TOKEN" python3 - <<'PY'
          import os,re
          raw=os.environ["RAW_TOKEN"].replace("\r","").replace("\n","").strip()
          parts=[p for p in re.findall(r"[A-Za-z0-9._~+/-]{20,}",raw) if p.lower() not in {"authorization","bearer"}]
          if not parts:
              raise SystemExit("no_token_segment")
          print(max(parts,key=len))
          PY
          )"
          test -n "$clean"
          echo "::add-mask::$clean"
          code="$(curl -sS -o /tmp/cf-account.json -w '%{http_code}' -H "Authorization: Bearer $clean" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" || true)"
          test "$code" = "200"
          CF_FILE=/tmp/cf-account.json python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ["CF_FILE"]))
          assert d.get("success") is True, d.get("errors")
          print("CLOUDFLARE_CANONICAL_AUTHORITY=PASS")
          PY
          {
            echo 'CLOUDFLARE_API_TOKEN<<__CF__'
            printf '%s\n' "$clean"
            echo '__CF__'
          } >> "$GITHUB_ENV"

      - name: Build exact Product Control release
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/arbmsistone-lab/zevanory-product-control-edge.git /tmp/zpc
          cd /tmp/zpc
          git checkout --detach "$ZPC_SHA"
          test "$(git rev-parse HEAD)" = "$ZPC_SHA"
          npm install --no-audit --no-fund
          npm run build
          cat > cf-worker/wrangler.pr120.toml <<'EOF'
          name = "zevanory-product-control-portable"
          main = "worker.ts"
          compatibility_date = "2026-09-19"
          routes = [
            { pattern = "controle.zevanory.api.br", custom_domain = true }
          ]
          [assets]
          directory = "../dist"
          binding = "ASSETS"
          not_found_handling = "single-page-application"
          run_worker_first = true
          [vars]
          RENDER_BACKEND_URL = "https://zevanory-product-control-edge.onrender.com"
          BACKEND_INSTANCE_ID = "cloudflare"
          EOF

      - name: Deploy exact Worker
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/zpc
          npx --yes wrangler@4.135.0 deploy --strict --keep-vars --config cf-worker/wrangler.pr120.toml --var WORKER_COMMIT:"$ZPC_SHA" --message="owner-pr120-$ZPC_SHA"

      - name: Verify canonical version and safe smoke
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if curl -fsS -H 'Cache-Control: no-cache' https://controle.zevanory.api.br/version.json -o /tmp/version.json; then
              if jq -e --arg sha "$ZPC_SHA" '.sha == $sha and .runtime == "cloudflare-worker"' /tmp/version.json >/dev/null; then
                break
              fi
            fi
            sleep 5
          done
          jq -e --arg sha "$ZPC_SHA" '.sha == $sha and .runtime == "cloudflare-worker"' /tmp/version.json >/dev/null
          curl -fsS https://controle.zevanory.api.br/runtime-proof -o /tmp/runtime-proof.json
          jq -e --arg sha "$ZPC_SHA" '.ok == true and .workerCommit == $sha' /tmp/runtime-proof.json >/dev/null
          curl -fsS https://controle.zevanory.api.br/api/_healthcheck -o /tmp/health.json
          jq -e '.ok == true' /tmp/health.json >/dev/null
          echo "CLOUDFLARE_OWNER_PROMOTION=PASS"
          echo "WORKER_COMMIT=$ZPC_SHA"

# retry after canonical CLOUDFLARE_API_TOKEN refresh 2026-10-02
