name: funnel-v2
# Funil v2 do painel (AVAL Sol 23/10): vendas checkout próprio + Hotmart, lista de espera separada,
# intenção real, cinco conversões e estado Hotmart derivado. PostgreSQL EFÊMERO com o esquema de
# db/migrations e dados sintéticos; sem segredos, sem rede externa, sem deploy. Contagens exatas,
# zero pulados e mutantes causais (só asserção mata).
on:
  pull_request:
    branches: [gh-pages]
    paths:
      - "worker/funnel.mjs"
      - "worker/sales-public-worker.mjs"
      - "worker/lead-magnet.mjs"
      - "scripts/audit/funnel-counting.mjs"
      - "scripts/audit/command-center-snapshot.mjs"
      - "scripts/audit/autonomy-inventory.mjs"
      - "data/process-inventory.json"
      - "db/migrations/**"
      - "sales-public/material-gratuito.html"
      - "tests/funnel-counting.test.mjs"
      - "tests/integration/funnel-own-sales-postgres.test.mjs"
      - "scripts/ci/mutants_funnel_v2.py"
      - ".github/workflows/funnel-v2.yml"
permissions:
  contents: read
concurrency:
  group: funnel-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  funil:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      T4_PG_HOST: localhost
      T4_PG_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regras de contagem (unitário, 21 testes)
        run: |
          set -eo pipefail
          node --version
          node --test --test-reporter=tap tests/funnel-counting.test.mjs | tee u.txt
          grep -qx "# tests 21" u.txt && grep -qx "# pass 21" u.txt && grep -qx "# skipped 0" u.txt && grep -qx "# fail 0" u.txt
      - name: PostgreSQL real com o esquema de produção (4 testes)
        run: |
          set -eo pipefail
          node --test --test-reporter=tap tests/integration/funnel-own-sales-postgres.test.mjs | tee p.txt
          grep -qx "# tests 4" p.txt && grep -qx "# pass 4" p.txt && grep -qx "# skipped 0" p.txt && grep -qx "# fail 0" p.txt
      - name: Mutantes causais (40/40)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -eo pipefail
          python3 scripts/ci/mutants_funnel_v2.py | tee m.txt
          grep -qx "MUTANTS_FUNNEL_V2 killed=40/40" m.txt
          echo "::notice title=FUNNEL_V2::$(grep -E '^# (tests|pass|fail|skipped) ' u.txt p.txt | paste -sd' ' -) $(tail -1 m.txt)"

  # Portabilidade (AVAL Sol): Node 24 (reporter padrão "spec") em Linux e Windows. Sem PostgreSQL aqui, só
  # o unitário e os mutantes unitários; o runner força TAP e aceita os dois formatos de resumo.
  funil-node24:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unitário (21 testes, Node 24)
        run: |
          set -eo pipefail
          node --version | grep -q '^v24\.'
          node --test --test-reporter=tap tests/funnel-counting.test.mjs | tee u.txt
          grep -qx "# tests 21" u.txt && grep -qx "# pass 21" u.txt && grep -qx "# skipped 0" u.txt && grep -qx "# fail 0" u.txt
      - name: Mutantes unitários (33/33, Node 24)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          FUNNEL_MUTANTS_UNIT_ONLY: "1"
          PYTHONIOENCODING: utf-8
        run: |
          set -eo pipefail
          python scripts/ci/mutants_funnel_v2.py | tee m.txt
          grep -q "^NODE_VERSION=v24\." m.txt
          grep -qx "MUTANTS_FUNNEL_V2_UNIT killed=33/33" m.txt
