name: Central production asset integrity audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  central-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect public central HTML JS CSS and release provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re,urllib.request,sys,pathlib
          root='https://zevanory.api.br'
          paths=['/central','/control-plane-vnext.js','/privacidade']
          output=[]
          for path in paths:
            try:
              req=urllib.request.Request(root+path,headers={'User-Agent':'ZEVANORY-integrity-audit/1.0'})
              with urllib.request.urlopen(req,timeout=25) as res: data=res.read(); status=res.status; mime=res.headers.get('content-type','')
              txt=data.decode('utf-8',errors='strict')
              markers={k:len(re.findall(re.escape(k),txt)) for k in ['Ã©','Ã§','â€','Ã£','Ãª']}
              output.append({'path':path,'http':status,'sha256':hashlib.sha256(data).hexdigest(),'content_type':mime,'mojibake':markers})
            except Exception as e:
              output.append({'path':path,'error':type(e).__name__})
          # Canonical source served by the Worker (worker/control-plane-vnext-source.mjs, CONTROL_PLANE_VNEXT_JS).
          import subprocess
          canon=subprocess.check_output(['node','-e','import("./worker/control-plane-vnext-source.mjs").then(m=>process.stdout.write(m.CONTROL_PLANE_VNEXT_JS))'])
          output.append({'path':'git:worker/control-plane-vnext-source.mjs','git_sha256':hashlib.sha256(canon).hexdigest()})
          privacy=next((x for x in output if x.get('path')=='/privacidade'),{})
          print(json.dumps({'production':output},ensure_ascii=False,indent=2))
          expected=hashlib.sha256(canon).hexdigest()
          for x in output:
            print('::notice title=CENTRAL_INTEGRITY::'+json.dumps(x,ensure_ascii=False)[:900])
          live=next((x for x in output if x.get('path')=='/control-plane-vnext.js'),{})
          parity=live.get('sha256')==expected
          print('::notice title=CENTRAL_PROVENANCE::live_js_equals_git_canonical='+str(parity).lower()+' quorum_trust_chain='+str(b'QUORUM' in canon).lower())
          charset_ok=all('charset=utf-8' in x.get('content_type','').lower() for x in output if x.get('path') in ('/central','/control-plane-vnext.js'))
          if not parity or not charset_ok:sys.exit('CENTRAL_PROVENANCE_OR_CHARSET_FAILED')
          bad=any(x.get('error') or x.get('http')!=200 or sum(x.get('mojibake',{}).values()) for x in output if x.get('path','').startswith('/'))
          if bad:sys.exit('CENTRAL_INTEGRITY_PROOF_FAILED')
          PY
