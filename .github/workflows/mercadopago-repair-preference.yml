name: Mercado Pago - reparar preferência manual

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/mercadopago-repair-preference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-preference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MP_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_TEST_ACCESS_TOKEN }}
      PREF_ID: 3670768257-16b44054-1bbb-4bed-972e-c570b45505d2
    steps:
      - name: Inspect and repair same Checkout Pro preference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error

          token=os.environ["MP_ACCESS_TOKEN"].strip()
          pref_id=os.environ["PREF_ID"].strip()
          api="https://api.mercadopago.com/checkout/preferences/"+pref_id
          assert token and pref_id

          def call(method, body=None):
              headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/json",
                  "User-Agent":"ZEVANORY-MP-Preference-Repair/1.0",
              }
              data=None
              if body is not None:
                  headers["Content-Type"]="application/json"
                  data=json.dumps(body).encode()
              req=urllib.request.Request(api,method=method,headers=headers,data=data)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode()
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8","replace")
                  raise RuntimeError(f"{method} {e.code}: {raw[:2000]}")

          _, before = call("GET")
          items = before.get("items") or []
          assert items, before
          for item in items:
              assert str(item.get("currency_id") or "BRL").upper()=="BRL", item
              assert float(item.get("unit_price") or 0)>0, item

          safe_back={
              "success":"https://vendas.zevanory.api.br/solucoes?checkout=success",
              "failure":"https://vendas.zevanory.api.br/solucoes?checkout=failure",
              "pending":"https://vendas.zevanory.api.br/solucoes?checkout=pending",
          }
          patch={
              "items":[{
                  "id":"ZEV-IA-NA-PRATICA",
                  "title":"ZEVANORY IA na Prática",
                  "quantity":1,
                  "currency_id":"BRL",
                  "unit_price":197.0
              }],
              "back_urls": safe_back,
              "auto_return":"approved",
              "notification_url":"https://zevanory.api.br/api/webhooks?provider=mercadopago_test",
              "payer":{"email":"test@testuser.com"},
          }
          _, after = call("PUT", patch)

          items2=after.get("items") or []
          assert len(items2)==1 and items2[0].get("title")=="ZEVANORY IA na Prática", after
          assert all(float(x.get("unit_price") or 0)>0 for x in items2), after
          assert all(str(x.get("currency_id") or "").upper()=="BRL" for x in items2), after
          assert after.get("back_urls")==safe_back, after.get("back_urls")
          assert after.get("auto_return")=="approved", after.get("auto_return")
          assert str(after.get("notification_url") or "").startswith("https://"), after.get("notification_url")
          assert (after.get("payer") or {}).get("email")=="test@testuser.com", after.get("payer")
          init_point=str(after.get("init_point") or "")
          assert init_point.startswith("https://www.mercadopago.com"), init_point

          def summary(p):
              return {
                  "id":p.get("id"),
                  "init_point":p.get("init_point"),
                  "sandbox_init_point":p.get("sandbox_init_point"),
                  "back_urls":p.get("back_urls"),
                  "auto_return":p.get("auto_return"),
                  "notification_url":p.get("notification_url"),
                  "payer_email":(p.get("payer") or {}).get("email"),
                  "items":[{
                      "id":x.get("id"),
                      "title":x.get("title"),
                      "currency_id":x.get("currency_id"),
                      "quantity":x.get("quantity"),
                      "unit_price":x.get("unit_price")
                  } for x in (p.get("items") or [])]
              }

          report={"preference_id":pref_id,"before":summary(before),"after":summary(after)}
          pathlib.Path("evidence").mkdir(exist_ok=True)
          pathlib.Path("evidence/mp-preference-repair.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("INIT_POINT="+init_point)
          print("PREFERENCE_VALIDATION=PASS")
          print("BACK_URLS=HTTPS_PASS")
          print("AUTO_RETURN=approved")
          print("NOTIFICATION_URL=HTTPS_PASS")
          print("PAYER_EMAIL=TESTUSER_PASS")
          for x in items2:
              print("ITEM="+str(x.get("title"))+"|"+str(x.get("currency_id"))+"|"+str(x.get("unit_price")))

      - name: Upload repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: mp-preference-repair
          path: evidence/mp-preference-repair.json
          retention-days: 7
