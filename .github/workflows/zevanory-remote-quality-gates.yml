name: zevanory-remote-quality-gates
on:
  pull_request:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install remote audit tools
        run: npm install --no-save lighthouse@12 pa11y@8
      - name: Audit production accessibility
        run: |
          node - <<'NODE'
          const pa11y=require('pa11y');
          (async()=>{
            const results=await pa11y('https://zevanory.api.br/solucoes',{
              standard:'WCAG2AA',
              chromeLaunchConfig:{args:['--no-sandbox','--disable-setuid-sandbox']}
            });
            console.log(JSON.stringify(results.issues,null,2));
            if(results.issues.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE
      - name: Audit production quality
        run: |
          npx lighthouse https://zevanory.api.br/solucoes --chrome-flags="--headless --no-sandbox --disable-setuid-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=lighthouse.json --quiet || true
          node - <<'NODE'
          const r=require('./lighthouse.json'), c=r.categories;
          const s=Object.fromEntries(Object.entries(c).map(([k,v])=>[k,Math.round(v.score*100)]));
          console.log(JSON.stringify(s));
          const tolerated=new Set(['errors-in-console','inspector-issues']);
          const bad=Object.values(r.audits).filter(a=>a.score!==null&&a.score<1&&a.scoreDisplayMode!=='notApplicable'&&!tolerated.has(a.id));
          const consoleAudit=r.audits['errors-in-console'];
          const inspector=r.audits['inspector-issues'];
          const blob=JSON.stringify([consoleAudit?.details,inspector?.details]);
          const cfOnly=blob.includes('static.cloudflareinsights.com') && !/(stripe|mercadopago|eval\(|mixed-content)/i.test(blob);
          if(s.performance<90||s.accessibility<95||s.seo<95) process.exit(1);
          if(s['best-practices']<95 && (!cfOnly || bad.length)) {
            console.error('Unwaived best-practices defects:',bad.map(x=>x.id));
            process.exit(1);
          }
          if(s['best-practices']<95) console.log('PASS_WITH_PROVIDER_EXCEPTION: Cloudflare Insights blocked by strict CSP; application defects=0; CSP remains strict.');
          NODE
      - name: Verify sales remain fail-closed
        run: |
          python3 - <<'PY'
          import urllib.request
          body=urllib.request.urlopen('https://zevanory.api.br/solucoes',timeout=20).read().decode('utf-8','replace').lower()
          forbidden=['mercadopago.com/checkout','checkout.stripe.com','buy.stripe.com']
          hit=[x for x in forbidden if x in body]
          if hit: raise SystemExit('commercial checkout exposed: '+','.join(hit))
          print('PASS: no direct external checkout exposed on audited public catalog')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zevanory-remote-quality-evidence
          path: lighthouse.json
          retention-days: 30
