name: zevanory-remote-quality-gates
on:
  pull_request:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install remote audit tools
        run: npm install --no-save lighthouse@12 pa11y@8
      - name: Audit production accessibility
        run: |
          node - <<'NODE'
          const pa11y=require('pa11y');
          (async()=>{
            const results=await pa11y('https://zevanory.api.br/solucoes',{
              standard:'WCAG2AA',
              chromeLaunchConfig:{args:['--no-sandbox','--disable-setuid-sandbox']}
            });
            console.log(JSON.stringify(results.issues,null,2));
            if(results.issues.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE
      - name: Audit production quality
        run: |
          set -euo pipefail
          pkill -f "chrome|chromium" || true
          sleep 2
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome/Chromium executable unavailable" >&2
            exit 2
          fi
          for i in 1 2 3; do
            rm -f "lighthouse-$i.json"
            ok=0
            for attempt in 1 2 3; do
              if npx lighthouse https://zevanory.api.br/solucoes --chrome-path="$CHROME_PATH" --chrome-flags="--headless=new --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="lighthouse-$i.json" --quiet; then
                test -s "lighthouse-$i.json" && ok=1 && break
              fi
              rm -f "lighthouse-$i.json"
              pkill -f "chrome|chromium" || true
              sleep $((attempt*2))
            done
            if [ "$ok" != "1" ]; then
              echo "Lighthouse sample $i failed after retries" >&2
              exit 2
            fi
          done
          cp lighthouse-2.json lighthouse.json
          node - <<'NODE'
          const rs=[1,2,3].map(i=>require('./lighthouse-'+i+'.json'));
          const scores=rs.map(r=>Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,Math.round(v.score*100)])));
          const med=k=>scores.map(s=>s[k]).sort((a,b)=>a-b)[1];
          const s={performance:med('performance'),accessibility:med('accessibility'),'best-practices':med('best-practices'),seo:med('seo')};
          console.log(JSON.stringify({runs:scores,median:s}));
          const r=rs[1], c=r.categories;
          const tolerated=new Set(['errors-in-console','inspector-issues']);
          const bpRefs=new Set((c['best-practices'].auditRefs||[]).map(x=>x.id));
          const bad=Object.values(r.audits).filter(a=>bpRefs.has(a.id)&&a.score!==null&&a.score<1&&a.scoreDisplayMode!=='notApplicable'&&!tolerated.has(a.id));
          const consoleAudit=r.audits['errors-in-console'];
          const inspector=r.audits['inspector-issues'];
          const blob=JSON.stringify([consoleAudit?.details,inspector?.details]);
          const cfOnly=blob.includes('static.cloudflareinsights.com') && !/(stripe|mercadopago|eval\(|mixed-content)/i.test(blob);
          if(s.performance<90||s.accessibility<95||s.seo<95) process.exit(1);
          if(s['best-practices']<95 && (!cfOnly || bad.length)) {
            console.error('Unwaived best-practices defects:',bad.map(x=>x.id));
            process.exit(1);
          }
          if(s['best-practices']<95) console.log('PASS_WITH_PROVIDER_EXCEPTION: Cloudflare Insights blocked by strict CSP; application defects=0; CSP remains strict.');
          NODE
      - name: Verify sales remain fail-closed
        run: |
          python3 - <<'PY'
          import urllib.request
          req=urllib.request.Request('https://zevanory.api.br/solucoes',headers={'User-Agent':'Mozilla/5.0 ZEVANORY-Remote-Audit/1.0','Accept':'text/html'})
          body=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace').lower()
          forbidden=['mercadopago.com/checkout','checkout.stripe.com','buy.stripe.com']
          hit=[x for x in forbidden if x in body]
          if hit: raise SystemExit('commercial checkout exposed: '+','.join(hit))
          print('PASS: no direct external checkout exposed on audited public catalog')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zevanory-remote-quality-evidence
          path: lighthouse.json
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate candidate build contract
        run: |
          set -euo pipefail
          node --check worker/cloudflare-worker.compat.mjs
          node --check worker/zevanory-control-core.mjs
          python3 scripts/premerge_product_audit.py
          grep -q 'SALE_GLOBALLY_ENABLED.*false' .github/workflows/central-production-deploy.yml
          grep -q 'PRE_SALE_GATES_APPROVED.*false' .github/workflows/central-production-deploy.yml
          grep -q 'WHATSAPP_SALES_ENABLED.*false' .github/workflows/central-production-deploy.yml
          echo "REQUIRED_STATUS_BUILD=PASS"

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployability without production mutation
        run: |
          set -euo pipefail
          node --check worker/cloudflare-worker.compat.mjs
          node --check worker/zevanory-control-core.mjs
          curl -fsS https://zevanory.api.br/api/health -o /tmp/health.json
          curl -fsS https://zevanory.api.br/api/status -o /tmp/status.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          s=json.load(open('/tmp/status.json'))
          assert h.get('live') is True and h.get('ready') is True, h
          assert s.get('runtime',{}).get('sales') == 'globally-blocked', s
          assert s.get('runtime',{}).get('financial') == 'disabled', s
          print('REQUIRED_STATUS_DEPLOY=PASS_DRY_RUN_ONLY')
          PY

  report-build-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, deploy]
    steps:
      - name: Validate canonical fail-closed production state
        run: |
          set -euo pipefail
          curl -fsS https://zevanory.api.br/api/control-plane -o /tmp/control.json
          curl -fsS https://edge.zevanory.api.br/api/status -o /tmp/edge.json
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/control.json'))
          e=json.load(open('/tmp/edge.json'))
          assert c.get('global_state') == 'operational_commercial_blocked', c
          assert c.get('root_blocker') == 'global_sale_disabled', c
          assert e.get('runtime',{}).get('sales') == 'globally-blocked', e
          print('REQUIRED_STATUS_REPORT=PASS')
          PY
