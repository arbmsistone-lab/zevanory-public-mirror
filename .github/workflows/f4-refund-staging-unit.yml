name: ZEVANORY F4 isolated unit regression (staging only)
on:
  push:
    branches:
      - fix/f4-refund-hardening-orq02-staged-20261009
    paths:
      - "worker/refund-flow.mjs"
      - "worker/cloudflare-worker.compat.mjs"
      - "tests/refund-provider-ambiguity.test.mjs"
      - ".github/workflows/f4-refund-staging-unit.yml"
permissions:
  contents: read
concurrency:
  group: f4-refund-isolated-staging
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check worker/refund-flow.mjs
          node --check worker/cloudflare-worker.compat.mjs
          node --check tests/refund-provider-ambiguity.test.mjs
      - name: Isolated provider-mocked refund tests (NO network, NO secrets)
        run: node --test tests/refund-provider-ambiguity.test.mjs
