name: ZEA-10 autonomy green

on:
  pull_request:
    paths:
      - "zea10-autonomy/**"
      - "worker/**"
      - "scripts/zea10_autonomy_gate.py"
      - ".github/workflows/zea10-autonomy-green.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autonomy-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ZEA-10 autonomy gate
        run: python scripts/zea10_autonomy_gate.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: zea10-autonomy-evidence
          path: evidence/zea10-autonomy-current.json
          if-no-files-found: error
