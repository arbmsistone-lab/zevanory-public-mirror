name: ZEA-10 autonomy green

on:
  pull_request:
    paths:
      - "zea10-autonomy/**"
      - "worker/**"
      - "scripts/zea10_autonomy_gate.py"
      - ".github/workflows/zea10-autonomy-green.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autonomy-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Run ZEA-10 autonomy gate
        run: python scripts/zea10_autonomy_gate.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zea10-autonomy-evidence
          path: evidence/zea10-autonomy-current.json
          if-no-files-found: error
