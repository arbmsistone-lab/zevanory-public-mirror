name: WhatsApp live proof (read only)
on:
  pull_request:
    branches: [gh-pages]
    paths: ['.github/workflows/whatsapp-live-proof.yml']
permissions:
  contents: read
concurrency:
  group: whatsapp-meta-delivery-proof
  cancel-in-progress: false
jobs:
  observe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '1b26415802588185a86c1d4d3ebf5bdb' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read baseline
        run: |
          mkdir -p /tmp/proof
          curl -fsS --max-time 20 https://zevanory.api.br/api/support/instant-status > /tmp/proof/baseline.json
          cat /tmp/proof/baseline.json
      - name: Inspect deployed Worker and canonical routes
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          root='https://api.cloudflare.com/client/v4'
          def get(path):
              req=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: return json.load(r)
              except Exception: return {'success':False}
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          settings=get('/accounts/'+account+'/workers/scripts/zevanory/settings')
          bindings=(settings.get('result') or {}).get('bindings',[])
          summary={'settings_read_ok':settings.get('success'),'binding_names':[b.get('name') for b in bindings],'release_sha':next((b.get('text') for b in bindings if b.get('name')=='ZEVANORY_RELEASE_SHA'),None)}
          deployments=get('/accounts/'+account+'/workers/scripts/zevanory/deployments')
          summary['deployments']=(deployments.get('result') or {}).get('deployments',[])[:2]
          zones=get('/zones?name=zevanory.api.br')
          summary['zones_read_ok']=zones.get('success')
          summary['routes']=[]
          for zone in zones.get('result') or []:
              routes=get('/zones/'+zone['id']+'/workers/routes')
              summary['routes'] += [{'pattern':r.get('pattern'),'script':r.get('script')} for r in routes.get('result') or []]
          open('/tmp/proof/routes.json','w').write(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Check and repair Meta subscriptions then send authorized internal text
        env:
          ELITE_INTERNAL_TOKEN: ${{ secrets.ELITE_INTERNAL_TOKEN }}
          OPERATOR_TOKEN: ${{ secrets.OPERATOR_TOKEN }}
          ZEVANORY_ADMIN_PASSWORD: ${{ secrets.ZEVANORY_ADMIN_PASSWORD }}
        run: |
          node --input-type=module <<'JS'
          import {createHash,createDecipheriv,createHmac,randomUUID} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          async function cf(path){const r=await fetch(root+path,{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('cloudflare_http_'+r.status);return r.json();}
          const settings=await cf('/workers/scripts/zevanory/settings');
          const bindings=settings.result.bindings||[];
          const ns=bindings.find(x=>x.name==='ZEVANORY_PRIVATE_ARTIFACTS')?.namespace_id;
          if(!ns)throw Error('onboarding_namespace_absent');
          const encryptedResponse=await fetch(root+'/storage/kv/namespaces/'+ns+'/values/whatsapp-onboarding%2Fruntime',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(20000)});
          if(!encryptedResponse.ok)throw Error('onboarding_record_http_'+encryptedResponse.status);
          const sealed=await encryptedResponse.text();
          const [iv,cipher]=sealed.split('.').map(x=>Buffer.from(x,'base64url'));
          const materialNames=['ELITE_INTERNAL_TOKEN','OPERATOR_TOKEN','ZEVANORY_ADMIN_PASSWORD'];
          let record;
          for(const name of materialNames){
            const candidates=[process.env[name],bindings.find(x=>x.name===name)?.text].filter(Boolean);
            for(const material of candidates){
              try{const key=createHash('sha256').update('zevanory:whatsapp:onboarding:v1:'+material).digest();
                const d=createDecipheriv('aes-256-gcm',key,iv);d.setAuthTag(cipher.subarray(-16));
                record=JSON.parse(Buffer.concat([d.update(cipher.subarray(0,-16)),d.final()]).toString());break;}catch{}
            }
            if(record)break;
          }
          if(!record?.app_secret||!record?.access_token)throw Error('onboarding_decryption_authority_absent');
          async function graph(path,token,method='GET',body){
            const r=await fetch('https://graph.facebook.com/'+(record.graph_version||'v26.0')+'/'+path,{method,headers:{authorization:'Bearer '+token,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(20000)});
            const data=await r.json();if(!r.ok)throw Error('meta_http_'+r.status+'_code_'+(data.error?.code||'unknown'));return data;
          }
          const appId='1071149631917061',waba='4019600665012911',phone='1300972319774588';
          const appToken=appId+'|'+record.app_secret;
          let subscriptions=await graph(appId+'/subscriptions',appToken);
          let apps=await graph(waba+'/subscribed_apps',record.access_token);
          function good(){const sub=subscriptions.data?.find(x=>x.object==='whatsapp_business_account');return sub?.callback_url==='https://zevanory.api.br/api/webhooks/meta'&&sub.active===true&&sub.fields?.some(x=>(x.name||x)==='messages')&&apps.data?.some(x=>String(x.whatsapp_business_api_data?.id||x.id)===appId);}
          let repaired=false;
          if(!good()){
            if(!record.verify_token)throw Error('onboarding_verify_token_absent');
            await graph(appId+'/subscriptions',appToken,'POST',{object:'whatsapp_business_account',callback_url:'https://zevanory.api.br/api/webhooks/meta',verify_token:record.verify_token,fields:'messages'});
            await graph(waba+'/subscribed_apps',record.access_token,'POST',{});
            repaired=true;
            subscriptions=await graph(appId+'/subscriptions',appToken);apps=await graph(waba+'/subscribed_apps',record.access_token);
          }
          const subscriptionProof={at:new Date().toISOString(),repaired,valid:good(),subscriptions:subscriptions.data?.map(x=>({object:x.object,callback_url:x.callback_url,active:x.active,fields:x.fields})),subscribed_apps:apps.data?.map(x=>({id:x.whatsapp_business_api_data?.id||x.id,name:x.whatsapp_business_api_data?.name||x.name}))};
          writeFileSync('/tmp/proof/meta-subscriptions.json',JSON.stringify(subscriptionProof,null,2));console.log(JSON.stringify(subscriptionProof));
          if(!good())throw Error('meta_subscription_repair_failed');
          const messageId='internal-text-'+randomUUID();
          const payload={object:'whatsapp_business_account',entry:[{id:waba,changes:[{field:'messages',value:{messaging_product:'whatsapp',metadata:{phone_number_id:phone},contacts:[{wa_id:'558892545413',profile:{name:'Teste interno autorizado'}}],messages:[{from:'558892545413',id:messageId,timestamp:String(Math.floor(Date.now()/1000)),type:'text',text:{body:'teste interno: quanto custa o combo?'}}]}}]}]};
          const body=JSON.stringify(payload),signature='sha256='+createHmac('sha256',record.app_secret).update(body).digest('hex');
          const baseline=await fetch('https://zevanory.api.br/api/support/instant-status').then(x=>x.json());
          const started=new Date().toISOString();
          const response=await fetch('https://zevanory.api.br/api/webhooks/meta',{method:'POST',headers:{'content-type':'application/json','x-hub-signature-256':signature},body,signal:AbortSignal.timeout(90000)});
          console.log(JSON.stringify({test:'authorized_internal_text',http:response.status,body_sha256:createHash('sha256').update(body).digest('hex'),bytes:Buffer.byteLength(body)}));
          let final;
          for(let n=0;n<30;n++){await new Promise(r=>setTimeout(r,2000));final=await fetch('https://zevanory.api.br/api/support/instant-status',{signal:AbortSignal.timeout(15000)}).then(x=>x.json());if(final.last?.at>=started&&(final.last.text_sent||final.last.text_error||final.last.voice_error))break;}
          const proof={test:'authorized_internal_text',inbound_message_id:messageId,request_http:response.status,fresh:final?.last?.at>=started,status:final};
          writeFileSync('/tmp/proof/text-test.json',JSON.stringify(proof,null,2));console.log(JSON.stringify(proof));
          if(!proof.fresh||!final.last?.text_sent)throw Error('production_text_delivery_failed_requires_synchronous_rollback');
          
          JS
      - name: Capture live Worker evidence without sending messages
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npm install --prefix /tmp/proof-tools --no-save wrangler@4.143.0 >/dev/null 2>&1
          echo "TAIL_WINDOW_START=$(date -u +%FT%TZ)"
          set +e
          timeout 60s /tmp/proof-tools/node_modules/.bin/wrangler tail zevanory --format json > /tmp/whatsapp-tail-private.json 2>/tmp/whatsapp-tail-private.err &
          tail_pid=$!
          sleep 5
          curl -fsS --max-time 20 https://zevanory.api.br/api/support/instant-status > /tmp/proof/ingress-control.json
          wait "$tail_pid"
          result=$?
          set -e
          if [ "$result" != 0 ] && [ "$result" != 124 ]; then
            echo "TAIL_CONNECTION_FAILED_EXIT=$result"
            exit 1
          fi
          echo "TAIL_WINDOW_END=$(date -u +%FT%TZ)"
      - name: Sanitize evidence and require a fresh real voice delivery
        if: always()
        run: |
          curl -fsS --max-time 20 https://zevanory.api.br/api/support/instant-status > /tmp/proof/final.json
          python3 - <<'PY'
          import json,re,pathlib
          from urllib.parse import urlsplit
          p=pathlib.Path('/tmp/whatsapp-tail-private.json')
          raw=p.read_text() if p.exists() else ''
          events=[]
          dec=json.JSONDecoder()
          pos=0
          while pos<len(raw):
              start=raw.find('{',pos)
              if start<0: break
              try:
                  event,end=dec.raw_decode(raw[start:])
                  pos=start+end
              except ValueError:
                  pos=start+1
                  continue
              request=(event.get('event') or {}).get('request') or {}
              if not request: continue
              route=urlsplit(str(request.get('url',''))).path
              if not re.fullmatch(r'/[A-Za-z0-9_./-]{0,120}',route): route='redacted'
              logs=[]
              for log in event.get('logs',[]):
                  parts=log.get('message',[])
                  if parts and re.match(r'^whatsapp_[a-z_]+$',str(parts[0])):
                      safe=[str(parts[0])]
                      for item in parts[1:]:
                          if isinstance(item,(int,float,bool)) or re.fullmatch(r'[a-z_]{1,80}',str(item)):
                              safe.append(item)
                      logs.append(safe)
              events.append({'timestamp':event.get('eventTimestamp'),'outcome':event.get('outcome'),'cpuTime':event.get('cpuTime'),'wallTime':event.get('wallTime'),'method':request.get('method'),'path':route,'logs':logs,'exception_names':[e.get('name') for e in event.get('exceptions',[])]})
          pathlib.Path('/tmp/proof/tail-sanitized.json').write_text(json.dumps(events,indent=2))
          baseline=json.loads(pathlib.Path('/tmp/proof/baseline.json').read_text())
          final=json.loads(pathlib.Path('/tmp/proof/final.json').read_text())
          last=final.get('last') or {}
          fresh=bool(last.get('at') and last.get('at')!=(baseline.get('last') or {}).get('at'))
          result={'release_sha':final.get('release_sha'),'new_inbound':fresh,'heard':last.get('heard'),'text_sent':last.get('text_sent'),'voice_sent':last.get('voice_sent'),'stage':last.get('stage'),'tail_events':len(events),'background_200_proven':False,'signed_bytes_identical_proven':False,'result':'PASS_REAL_VOICE' if fresh and last.get('heard') and last.get('text_sent') and last.get('voice_sent') and events else 'FAIL_NO_REAL_VOICE_PROOF'}
          pathlib.Path('/tmp/proof/checkpoint.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          print(json.dumps(final,indent=2))
          print(json.dumps(events,indent=2))
          raise SystemExit(0 if result['result']=='PASS_REAL_VOICE' else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-live-proof
          path: /tmp/proof/
          retention-days: 3
