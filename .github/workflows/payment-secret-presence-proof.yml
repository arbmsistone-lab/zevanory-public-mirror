name: Payment secret presence proof
on:
  push:
    branches: [fix/payment-secret-presence-20260923]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MP_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
      MP_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_APP_SECRET01: ${{ secrets.META_APP_SECRET01 }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
      META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
    steps:
      - name: Report names-only secret presence
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MP_ACCESS_TOKEN:-}" ]; then echo "MERCADOPAGO_ACCESS_TOKEN=PRESENT"; else echo "MERCADOPAGO_ACCESS_TOKEN=MISSING"; fi
          if [ -n "${MP_WEBHOOK_SECRET:-}" ]; then echo "MERCADOPAGO_WEBHOOK_SECRET=PRESENT"; else echo "MERCADOPAGO_WEBHOOK_SECRET=MISSING"; fi
          for name in META_APP_SECRET META_APP_SECRET01 META_ACCESS_TOKEN META_VERIFY_TOKEN META_WEBHOOK_VERIFY_TOKEN WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID; do
            if [ -n "${!name:-}" ]; then echo "$name=PRESENT"; else echo "$name=MISSING"; fi
          done
