name: Cloudflare Token Scope Probe
on:
  pull_request:
    branches: [gh-pages]
    paths: ['.github/workflows/cloudflare-token-scope-probe.yml']
  push:
    branches: [audit/cloudflare-token-scope-20260929]
    paths: ['.github/workflows/cloudflare-token-scope-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PUBLIC_OWNER_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN }}
      EXPECTED_PUBLIC_OWNER: 1b26415802588185a86c1d4d3ebf5bdb
    steps:
      - name: Verify existing deployment authorities read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          owner=os.environ['EXPECTED_PUBLIC_OWNER']
          for name in ['CLOUDFLARE_PUBLIC_OWNER_API_TOKEN','CLOUDFLARE_API_TOKEN']:
              token=os.environ.get(name,'')
              row={'route':name,'credential_present':bool(token),'expected_account':owner,'deployment_performed':False}
              if token:
                  req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+owner,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
                  try:
                      with urllib.request.urlopen(req,timeout=20) as response:
                          data=json.load(response)
                          row.update(http_status=response.status,owner_authorized=data.get('success') is True and data.get('result',{}).get('id')==owner)
                  except urllib.error.HTTPError as error:
                      row.update(http_status=error.code,owner_authorized=False)
                  except Exception as error:
                      row.update(error_type=type(error).__name__,owner_authorized=False)
              else:
                  row['owner_authorized']=False
              print('CANONICAL_DEPLOY_AUTHORITY_READBACK='+json.dumps(row,sort_keys=True))
          PY
