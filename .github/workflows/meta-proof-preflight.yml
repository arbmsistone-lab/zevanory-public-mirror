name: Meta proof preflight (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    if: ${{ github.ref == 'refs/heads/gh-pages' }}
    environment: gh-pages-automacao
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Read permissions and exact public JPEG only, without reservation
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: node scripts/channels/meta-proof-post.mjs --preflight
