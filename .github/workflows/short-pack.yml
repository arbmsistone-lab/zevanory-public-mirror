name: Short pack for native schedulers (TikTok/Kwai)

# Renders the next days of Shorts with voice and captions, kept as a 7-day
# artifact for upload in TikTok Studio / Kwai schedulers (API posting by
# own-account tools is not allowed by TikTok's content sharing guidelines).
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Primeiro dia (YYYY-MM-DD); vazio = amanhã"
        required: false
        default: ""
      days:
        description: "Quantidade de dias (1-14)"
        required: false
        default: "10"
  schedule:
    - cron: "0 9 */10 * *"

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-inter
      - name: Render pack
        run: |
          set -euo pipefail
          args=(--days="${{ inputs.days || '10' }}")
          if [ -n "${{ inputs.start }}" ]; then args+=(--start="${{ inputs.start }}"); fi
          node scripts/channels/short-pack.mjs "${args[@]}"
          ls -la /tmp/short-pack
          rm -f /tmp/short-pack/*.pcm /tmp/short-pack/*.txt.* /tmp/short-pack/*.t*.txt /tmp/short-pack/*.mp3
      - name: Host each video at https://zevanory.api.br/media/short/<day>.mp4 (30 days)
        run: |
          set -euo pipefail
          for f in /tmp/short-pack/*.mp4; do
            d=$(basename "$f" .mp4)
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/octet-stream" --data-binary @"$f" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE_ID/values/zpc%3Amedia%3Ashort%3A$d?expiration_ttl=2592000")
            test "$code" = "200"
          done
          sleep 20
          for f in /tmp/short-pack/*.mp4; do d=$(basename "$f" .mp4); echo "$d $(curl -sS -o /dev/null -w '%{http_code}' -A 'ZEVANORY-Monitor/1.0' https://zevanory.api.br/media/short/$d.mp4)"; done
      - uses: actions/upload-artifact@v4
        with:
          name: zevanory-short-pack
          path: |
            /tmp/short-pack/*.mp4
            /tmp/short-pack/legendas.txt
          retention-days: 7
