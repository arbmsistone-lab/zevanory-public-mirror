name: Short pack for native schedulers (TikTok/Kwai)

# P05: every video must PASS zevanory-av-gate (single brand voice, fail-closed); rejected videos are not hosted.
# Renders the next days of Shorts with voice and captions, kept as a 7-day
# artifact for upload in TikTok Studio / Kwai schedulers (API posting by
# own-account tools is not allowed by TikTok's content sharing guidelines).
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Primeiro dia (YYYY-MM-DD); vazio = amanhã"
        required: false
        default: ""
      days:
        description: "Quantidade de dias (1-14)"
        required: false
        default: "10"
  schedule:
    - cron: "0 9 1,11,21 * *"
    # Backstop 1h30 later; skipped when the pack for tomorrow is already hosted.
    - cron: "30 10 1,11,21 * *"

permissions:
  contents: read

jobs:
  pack:
    environment: gh-pages-automacao  # B01 M1: segredos só no Environment (gh-pages)
    if: ${{ github.ref == 'refs/heads/gh-pages' }}  # B01 patch 05b
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_OWNER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1b26415802588185a86c1d4d3ebf5bdb
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS }}
      OWNER_ALERT_EMAIL: ${{ secrets.OWNER_ALERT_EMAIL }}
      KV_NAMESPACE_ID: 728a45738e4047f29bcb89934fd533c1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Skip if this pack is already hosted (scheduled backstop)
        id: already
        if: github.event_name == 'schedule'
        run: |
          d=$(TZ=America/Sao_Paulo date -d tomorrow +%F)
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A 'ZEVANORY-Monitor/1.0' "https://zevanory.api.br/media/short/$d.mp4" || true)
          echo "first=$d http=$code"
          if [ "$code" = "200" ]; then echo "done=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install media tools
        if: steps.already.outputs.done != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-inter
      - uses: actions/setup-python@v5
        if: steps.already.outputs.done != 'true'
        with:
          python-version: "3.12"
      - name: zevanory-av-gate (pinned deps + pinned models)
        if: steps.already.outputs.done != 'true'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet -r scripts/av_gate/requirements.txt
          echo "AV_GATE_MODELS=$RUNNER_TEMP/av-models" >> "$GITHUB_ENV"
          AV_GATE_MODELS="$RUNNER_TEMP/av-models" bash scripts/av_gate/fetch_models.sh
      - name: Render pack (each video must PASS zevanory-av-gate; rejected ones are left out)
        if: steps.already.outputs.done != 'true'
        env:
          AV_GATE_BRAND_REFERENCE: ${{ github.workspace }}/assets/brand/voice/brand-reference.wav
        run: |
          set -euo pipefail
          args=(--days="${{ inputs.days || '10' }}")
          if [ -n "${{ inputs.start }}" ]; then args+=(--start="${{ inputs.start }}"); fi
          node scripts/channels/short-pack.mjs "${args[@]}"
          ls -la /tmp/short-pack
          rm -rf /tmp/short-pack/*.av /tmp/short-pack/*.t*.txt
      - name: Host each video at https://zevanory.api.br/media/short/<day>.mp4 (30 days)
        if: steps.already.outputs.done != 'true'
        run: |
          set -euo pipefail
          for f in /tmp/short-pack/*.mp4; do
            d=$(basename "$f" .mp4)
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/octet-stream" --data-binary @"$f" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE_ID/values/zpc%3Amedia%3Ashort%3A$d?expiration_ttl=2592000")
            test "$code" = "200"
          done
          sleep 20
          for f in /tmp/short-pack/*.mp4; do d=$(basename "$f" .mp4); echo "$d $(curl -sS -o /dev/null -w '%{http_code}' -A 'ZEVANORY-Monitor/1.0' https://zevanory.api.br/media/short/$d.mp4)"; done
      - name: E-mail the ready executor command to the owner
        if: steps.already.outputs.done != 'true'
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${OWNER_ALERT_EMAIL:-}" ]; then echo "::warning title=SHORT_PACK_EMAIL::owner e-mail not configured"; exit 0; fi
          python3 - <<'PY'
          import json, os, urllib.request
          cmd = open("/tmp/short-pack/comando-executor.txt", encoding="utf-8").read()
          first = cmd.split("de ", 1)[1].split(",")[0] if "de " in cmd else ""
          body = {"from": os.environ.get("RESEND_FROM_ADDRESS") or "ZEVANORY <acesso@zevanory.api.br>",
                  "to": [os.environ["OWNER_ALERT_EMAIL"]],
                  "subject": "ZEVANORY — vídeos do TikTok prontos: copie o comando para o executor",
                  "text": "Os vídeos dos próximos dias já estão prontos e hospedados. Copie TODO o texto abaixo e cole no executor (Claude computer/Codex).\n\n" + cmd}
          req = urllib.request.Request("https://api.resend.com/emails", data=json.dumps(body).encode(), headers={"authorization": "Bearer " + os.environ["RESEND_API_KEY"], "content-type": "application/json"})
          with urllib.request.urlopen(req, timeout=20) as r:
              print("::notice title=SHORT_PACK_EMAIL::sent", r.status)
          PY
      - uses: actions/upload-artifact@v4
        if: steps.already.outputs.done != 'true'
        with:
          name: zevanory-short-pack
          path: |
            /tmp/short-pack/*.mp4
            /tmp/short-pack/legendas.txt
            /tmp/short-pack/comando-executor.txt
          retention-days: 7
