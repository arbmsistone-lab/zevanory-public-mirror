[[redirects]]
  from = "/api/robot-control"
  to = "https://zevanory.zevanory.workers.dev/api/robot-control"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://zevanory.zevanory.workers.dev/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/solucoes"
