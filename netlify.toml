[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Vercel-independent standby: every API route uses the certified Cloudflare runtime.
# Financial/provider actions remain fail-closed inside the runtime when provider credentials are unavailable.
[[redirects]]
  from = "/private/artifacts/*"
  to = "https://zevanory.zevanory.workers.dev/private/artifacts/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/checkout"
  to = "https://zevanory.zevanory.workers.dev/api/checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/checkout/*"
  to = "https://zevanory.zevanory.workers.dev/api/checkout/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/webhooks"
  to = "https://zevanory.zevanory.workers.dev/api/webhooks"
  status = 200
  force = true

[[redirects]]
  from = "/api/webhooks/*"
  to = "https://zevanory.zevanory.workers.dev/api/webhooks/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/oauth/*"
  to = "https://zevanory.zevanory.workers.dev/api/oauth/:splat"
  status = 200
  force = true

[[redirects]]
