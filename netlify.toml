[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Failover split: latest read/core runtime on Cloudflare; secret-backed writes stay on the stable production origin.
[[redirects]]
  from = "/private/artifacts/*"
  to = "https://zevanory.girolocal-rb.workers.dev/private/artifacts/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/checkout"
  to = "https://zevanory.api.br/api/checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/checkout/*"
  to = "https://zevanory.api.br/api/checkout/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/webhooks"
  to = "https://zevanory.api.br/api/webhooks"
  status = 200
  force = true

[[redirects]]
  from = "/api/webhooks/*"
  to = "https://zevanory.api.br/api/webhooks/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/oauth/*"
  to = "https://zevanory.api.br/api/oauth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/agent/run"
  to = "https://zevanory.api.br/api/agent/run"
  status = 200
  force = true

[[redirects]]
  from = "/api/events/operator"
  to = "https://zevanory.api.br/api/events/operator"
  status = 200
  force = true

[[redirects]]
  from = "/api/robot-control"
  to = "https://zevanory.api.br/api/robot-control"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://zevanory.girolocal-rb.workers.dev/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/piloto"
  to = "/piloto.html"
  status = 200

[[redirects]]
  from = "/arbm-sist"
  to = "/arbm-sist.html"
  status = 200

[[redirects]]
  from = "/termos"
  to = "/termos.html"
  status = 200

[[redirects]]
  from = "/privacidade"
  to = "/privacidade.html"
  status = 200

[[redirects]]
  from = "/exclusao-dados"
  to = "/exclusao-dados.html"
  status = 200
[[redirects]]
  from = "/reembolso"
  to = "/reembolso.html"
  status = 200

[[redirects]]
  from = "/afiliados"
  to = "/afiliados.html"
  status = 200

[[redirects]]
  from = "/arbm-sist/privacidade"
  to = "/arbm-sist-privacidade.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"